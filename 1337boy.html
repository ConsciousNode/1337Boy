  document.body.appendChild(app);

  const canvas = document.getElementById('b1337-canvas');
  const ctx2d  = canvas.getContext('2d');
  const imgData = ctx2d.createImageData(240, 160);

  const dropzone = document.getElementById('ui-dropzone');
  const cartBadge = document.getElementById('ui-cart-badge');
  const crcBadge  = document.getElementById('ui-crc-badge');
  const saveBadge = document.getElementById('ui-save-badge');
  const linkBadge = document.getElementById('ui-link-badge');
  const fpsCounter= document.getElementById('ui-fps-counter');
  const powerDot  = document.getElementById('ui-power-dot');
  const statusTxt = document.getElementById('ui-status-txt');
  const mainGrid  = document.getElementById('ui-main-grid');
  const screenWrap= document.getElementById('ui-screen-wrap');
  const lcdGridEl = document.getElementById('ui-lcd-grid');
  const dbgPanel  = document.getElementById('ui-debugger');
  const dbgRegs   = document.getElementById('ui-dbg-regs');
  const dbgDisasm = document.getElementById('ui-dbg-disasm');
  const toastEl   = document.getElementById('ui-toast');

  let toastTimer = null;
  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.remove('hidden');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.add('hidden'), 3200);
  }

  function blitFramebuffer() {
    imgData.data.set(gba.fb);
    ctx2d.putImageData(imgData, 0, 0);
  }

  function updateHeaderBadges() {
    const crcHex = (gba.romCrc32 >>> 0).toString(16).toUpperCase().padStart(8, '0');
    cartBadge.textContent = gba.romTitle + ' [' + gba.romCode + ']';
    crcBadge.textContent  = 'CRC32: ' + crcHex;
    saveBadge.textContent = 'SAVE: ' + gba.saveType;
    document.getElementById('about-rom-title').textContent = gba.romTitle + ' (' + gba.romCode + ' / ' + gba.romMaker + ')';
    document.getElementById('about-rom-crc').textContent   = '0x' + crcHex;
    document.getElementById('about-rom-size').textContent  = (gba.rawRomBytes ? gba.rawRomBytes.length : 0) + ' bytes';
    document.getElementById('about-rom-save').textContent  = gba.saveType + ' (Detected: ' + gba.detectedSaveType + ')';
    document.getElementById('about-rom-chk').textContent   = '0x' + gba.headerChecksum.toString(16).toUpperCase().padStart(2, '0') + (gba.headerValid ? ' (VALID)' : ' (UNVERIFIED)');

    const tbl = document.getElementById('ui-header-table');
    tbl.innerHTML = `
      <tr><th>Game Title</th><td>${gba.romTitle}</td></tr>
      <tr><th>Game Code</th><td>${gba.romCode}</td></tr>
      <tr><th>Maker Code</th><td>${gba.romMaker}</td></tr>
      <tr><th>ROM Size</th><td>${gba.rawRomBytes ? gba.rawRomBytes.length : 0} bytes</td></tr>
      <tr><th>ROM CRC32</th><td>0x${crcHex}</td></tr>
      <tr><th>Save Memory</th><td><b>${gba.saveType}</b> (ROM Scan: ${gba.detectedSaveType})</td></tr>
      <tr><th>Header Checksum (0xBD)</th><td>0x${gba.headerChecksum.toString(16).toUpperCase().padStart(2, '0')} &mdash; <b style="color:${gba.headerValid ? 'var(--lime)' : 'var(--gold)'}">${gba.headerValid ? 'VALID' : 'CUSTOM / MICRO-ROM'}</b></td></tr>
    `;
  }

  function updateDebuggerView() {
    if (!debugOpen) return;
    const hex = (n) => (n >>> 0).toString(16).toUpperCase().padStart(8, '0');
    let regHtml = '';
    const names = ['R0','R1','R2','R3','R4','R5','R6','R7','R8','R9','R10','R11','R12','SP','LR','PC'];
    for (let i = 0; i < 16; i++) {
      regHtml += `<div class="b1337-reg-item"><span class="b1337-reg-name">${names[i]}</span><span class="b1337-reg-val">${hex(gba.r[i])}</span></div>`;
    }
    const c = gba.cpsr;
    const flg = ((c & FLAG_N) ? 'N' : '-') + ((c & FLAG_Z) ? 'Z' : '-') + ((c & FLAG_C) ? 'C' : '-') + ((c & FLAG_V) ? 'V' : '-') + '/' + ((c & FLAG_I) ? 'I' : '-') + ((c & FLAG_T) ? 'T' : 'A');
    regHtml += `<div class="b1337-reg-item"><span class="b1337-reg-name">CPSR</span><span class="b1337-reg-val">${hex(c)}</span></div>`;
    regHtml += `<div class="b1337-reg-item"><span class="b1337-reg-name">FLAGS</span><span class="b1337-reg-val">${flg} (V:${gba.vcount})</span></div>`;
    dbgRegs.innerHTML = regHtml;

    const isThumb = (c & FLAG_T) !== 0;
    const step = isThumb ? 2 : 4;
    const curPc = gba.r[15] >>> 0;
    let lines = '';
    for (let d = -3; d <= 6; d++) {
      const addr = (curPc + d * step) >>> 0;
      const line = gba.disassembleAt(addr, isThumb);
      if (d === 0) lines += `<span class="b1337-disasm-cur">&gt; ${line}</span>`;
      else lines += `  ${line}\n`;
    }
    dbgDisasm.innerHTML = lines;
  }

  async function refreshRecentRomsBar() {
    const bar = document.getElementById('ui-recent-roms');
    if (!bar) return;
    const list = await B1337LibraryDB.listRoms();
    if (!list || list.length === 0) {
      bar.innerHTML = '';
      return;
    }
    bar.innerHTML = '<div style="width:100%;font-size:0.68rem;color:var(--muted);">RECENT CARTRIDGES (OFFLINE LIBRARY):</div>';
    list.forEach((item) => {
      const btn = document.createElement('button');
      btn.className = 'b1337-btn';
      btn.style.fontSize = '0.68rem';
      btn.textContent = item.title + ' [' + (item.crc32 >>> 0).toString(16).toUpperCase().padStart(8, '0') + ']';
      btn.addEventListener('click', () => {
        bootCartridgeBytes(new Uint8Array(item.bytes));
        showToast('Booted ' + item.title + ' from Library');
      });
      bar.appendChild(btn);
    });
  }
  refreshRecentRomsBar();

  function bootCartridgeBytes(u8, skipLibrarySave) {
    gba.loadRom(u8);
    hasCartridge = true;
    running = true;
    paused  = false;
    rewindRing.length = 0;
    dropzone.classList.add('hidden');
    statusTxt.textContent = 'RUNNING';
    updateHeaderBadges();
    gba.runFrame();
    blitFramebuffer();
    updateDebuggerView();
    if (!skipLibrarySave && gba.rawRomBytes && gba.rawRomBytes.length > 0) {
      B1337LibraryDB.saveRom(gba.romCrc32, gba.romTitle, gba.romCode, gba.rawRomBytes).then(refreshRecentRomsBar);
    }
  }

  function triggerDownload(filename, bytes, mime) {
    const blob = new Blob([bytes], { type: mime || 'application/octet-stream' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }

  function exportPolyglotPair() {
    if (!hasCartridge || !gba.rawRomBytes || gba.rawRomBytes.length === 0) {
      bootCartridgeBytes(base64ToUint8(DEMO_BOOT_ROM_B64), true);
    }
    try {
      const polyBytes = buildPolyglotCartridge(gba.rawRomBytes);
      const slug = (gba.romTitle || 'game').toLowerCase().replace(/[^a-z0-9]+/g, '') || 'game';
      triggerDownload(slug + '.1337.gba', polyBytes, 'application/octet-stream');
      setTimeout(() => {
        triggerDownload(slug + '.1337.html', polyBytes, 'text/html');
      }, 250);
      showToast('1337IFIED! Downloaded ' + slug + '.1337.gba & .1337.html (' + polyBytes.length + ' bytes, byte-identical)');
    } catch (err) {
      showToast('1337IFY Error: ' + err.message);
    }
  }

  // Save-State Slot Management (4 Slots with 60x40 Thumbnails)
  function captureThumbnailDataUrl() {
    try {
      const tc = document.createElement('canvas');
      tc.width = 60; tc.height = 40;
      const tctx = tc.getContext('2d');
      tctx.drawImage(canvas, 0, 0, 60, 40);
      return tc.toDataURL('image/png');
    } catch (e) {
      return '';
    }
  }

  function saveToSlot(slotIdx) {
    if (!hasCartridge) return;
    const stateJson = gba.serializeState();
    const thumb = captureThumbnailDataUrl();
    const entry = {
      stateJson,
      thumb,
      time: new Date().toLocaleTimeString(),
      romCrc32: gba.romCrc32
    };
    stateSlots[slotIdx] = entry;
    try {
      localStorage.setItem('1337boy_slot_' + gba.romCrc32.toString(16) + '_' + slotIdx, JSON.stringify(entry));
    } catch (e) {}
    renderSlotGrid();
    showToast('Saved State to Slot ' + (slotIdx + 1));
  }

  function loadFromSlot(slotIdx) {
    if (!hasCartridge) return;
    let entry = stateSlots[slotIdx];
    if (!entry) {
      try {
        const raw = localStorage.getItem('1337boy_slot_' + gba.romCrc32.toString(16) + '_' + slotIdx);
        if (raw) entry = JSON.parse(raw);
      } catch (e) {}
    }
    if (!entry || !entry.stateJson) {
      showToast('Slot ' + (slotIdx + 1) + ' is empty');
      return;
    }
    gba.deserializeState(entry.stateJson);
    blitFramebuffer();
    updateHeaderBadges();
    updateDebuggerView();
    showToast('Loaded State from Slot ' + (slotIdx + 1));
  }

  function renderSlotGrid() {
    const grid = document.getElementById('ui-slot-grid');
    if (!grid) return;
    grid.innerHTML = '';
    for (let i = 0; i < 4; i++) {
      let entry = stateSlots[i];
      if (!entry && hasCartridge) {
        try {
          const raw = localStorage.getItem('1337boy_slot_' + gba.romCrc32.toString(16) + '_' + i);
          if (raw) entry = JSON.parse(raw);
        } catch (e) {}
      }
      const card = document.createElement('div');
      card.className = 'b1337-slot-card';
      const imgHtml = (entry && entry.thumb)
        ? `<img class="b1337-slot-thumb" src="${entry.thumb}" alt="Slot ${i + 1}">`
        : `<div class="b1337-slot-thumb" style="display:flex;align-items:center;justify-content:center;font-size:0.65rem;color:var(--muted);">EMPTY</div>`;
      card.innerHTML = `
        ${imgHtml}
        <div style="display:flex;flex-direction:column;gap:5px;flex:1;">
          <div style="font-weight:900;color:var(--cyan);">SLOT ${i + 1} <span style="color:var(--muted);font-weight:400;font-size:0.68rem;">(F${i + 1})</span></div>
          <div style="font-size:0.68rem;color:var(--gold);">${entry ? ('Saved ' + entry.time) : 'No state saved'}</div>
          <div style="display:flex;gap:6px;">
            <button class="b1337-btn lime" data-slot-save="${i}">SAVE</button>
            <button class="b1337-btn primary" data-slot-load="${i}">LOAD</button>
          </div>
        </div>
      `;
      grid.appendChild(card);
    }
    grid.querySelectorAll('[data-slot-save]').forEach((b) => {
      b.addEventListener('click', () => saveToSlot(parseInt(b.getAttribute('data-slot-save'), 10)));
    });
    grid.querySelectorAll('[data-slot-load]').forEach((b) => {
      b.addEventListener('click', () => loadFromSlot(parseInt(b.getAttribute('data-slot-load'), 10)));
    });
  }

  // Keyboard & Gamepad Input Handling with Custom Remapping
  let keyboardMask = 0;
  let touchMask    = 0;
  let gamepadMask  = 0;
  let listeningGbaBit = null;

  const DEFAULT_KEY_BINDINGS = {
    0: 'KeyX',       // A
    1: 'KeyZ',       // B
    2: 'Backspace',  // SELECT
    3: 'Enter',      // START
    4: 'ArrowRight', // RIGHT
    5: 'ArrowLeft',  // LEFT
    6: 'ArrowUp',    // UP
    7: 'ArrowDown',  // DOWN
    8: 'KeyS',       // R
    9: 'KeyA'        // L
  };
  let keyBindings = Object.assign({}, DEFAULT_KEY_BINDINGS);
  try {
    const savedMap = localStorage.getItem('1337boy_keymap_v1');
    if (savedMap) Object.assign(keyBindings, JSON.parse(savedMap));
  } catch (e) {}

  function rebuildReverseKeyMap() {
    const rev = { 'ShiftLeft': 2, 'ShiftRight': 2 };
    for (let bit = 0; bit < 10; bit++) {
      if (keyBindings[bit]) rev[keyBindings[bit]] = bit;
    }
    return rev;
  }
  let keyMap = rebuildReverseKeyMap();

  function renderRemapTable() {
    const tbl = document.getElementById('ui-remap-table');
    if (!tbl) return;
    const labels = ['A Button', 'B Button', 'SELECT', 'START', 'D-Pad RIGHT', 'D-Pad LEFT', 'D-Pad UP', 'D-Pad DOWN', 'R Shoulder', 'L Shoulder'];
    tbl.innerHTML = '';
    for (let bit = 0; bit < 10; bit++) {
      const tr = document.createElement('tr');
      const isWait = (listeningGbaBit === bit);
      tr.innerHTML = `
        <th>${labels[bit]}</th>
        <td><code style="color:var(--lime);font-weight:700;">${keyBindings[bit] || 'Unbound'}</code></td>
        <td><button class="b1337-btn ${isWait ? 'gold' : ''}" data-remap-bit="${bit}">${isWait ? 'PRESS ANY KEY...' : 'REBIND'}</button></td>
      `;
      tbl.appendChild(tr);
    }
    tbl.querySelectorAll('[data-remap-bit]').forEach((b) => {
      b.addEventListener('click', () => {
        listeningGbaBit = parseInt(b.getAttribute('data-remap-bit'), 10);
        renderRemapTable();
      });
    });
  }

  function pollPhysicalGamepads() {
    if (typeof navigator === 'undefined' || !navigator.getGamepads) return 0;
    try {
      const pads = navigator.getGamepads();
      let mask = 0;
      for (let i = 0; i < pads.length; i++) {
        const p = pads[i];
        if (!p || !p.connected) continue;
        const b = p.buttons;
        if (b[1] && b[1].pressed) mask |= (1 << 0); // East / B -> GBA A
        if (b[0] && b[0].pressed) mask |= (1 << 1); // South / A -> GBA B
        if (b[8] && b[8].pressed) mask |= (1 << 2); // Select
        if (b[9] && b[9].pressed) mask |= (1 << 3); // Start
        if (b[15] && b[15].pressed) mask |= (1 << 4); // Right
        if (b[14] && b[14].pressed) mask |= (1 << 5); // Left
        if (b[12] && b[12].pressed) mask |= (1 << 6); // Up
        if (b[13] && b[13].pressed) mask |= (1 << 7); // Down
        if (b[5] && b[5].pressed) mask |= (1 << 8); // R1 -> GBA R
        if (b[4] && b[4].pressed) mask |= (1 << 9); // L1 -> GBA L
        if (p.axes && p.axes.length >= 2) {
          if (p.axes[0] > 0.45)  mask |= (1 << 4);
          if (p.axes[0] < -0.45) mask |= (1 << 5);
          if (p.axes[1] < -0.45) mask |= (1 << 6);
          if (p.axes[1] > 0.45)  mask |= (1 << 7);
        }
      }
      return mask;
    } catch (e) {
      return 0;
    }
  }

  function syncCombinedKeys() {
    gba.setKeys((keyboardMask | touchMask | gamepadMask) & 0x03FF);
  }

  // Animation & Frame Pacing Loop (Steady 60fps + Speed Multiplier + Rewind + AudioWorklet pump)
  let lastFpsTime = performance.now();
  let framesInSec = 0;
  let autosaveCounter = 0;
  // 1.1.1 (Kehai, carried over from 1.0.2): pace by elapsed time, not by display refreshes.
  // The GBA draws a frame every 280896 cycles at 16.78 MHz (about 59.73 Hz); a 90/120/144 Hz
  // phone screen used to run games that much faster. Accumulate real time x speed and run
  // however many GBA frames are due (0, 1 or more) on each refresh.
  const GBA_FRAME_MS = 280896 * 1000 / 16777216;
  let pacingLast = -1, pacingAcc = 0;

  function rafLoop(now) {
    requestAnimationFrame(rafLoop);
    if (gba.linkPeerConnected) {
      linkBadge.textContent = 'LINK: PEER CONNECTED';
      linkBadge.className = 'b1337-badge lime';
    }

    const gp = pollPhysicalGamepads();
    if (gp !== gamepadMask) {
      gamepadMask = gp;
      syncCombinedKeys();
    }

    if (!realtimeEnabled || !running || paused || !hasCartridge) { pacingLast = -1; return; }

    if (rewinding) {
      pacingLast = -1;
      if (rewindRing.length > 0) {
        const snap = rewindRing.pop();
        gba.deserializeState(snap);
        blitFramebuffer();
        if (debugOpen) updateDebuggerView();
        statusTxt.textContent = 'REWIND (' + rewindRing.length + ')';
      } else {
        statusTxt.textContent = 'REWIND START';
      }
      return;
    }

    const effSpeed = fastForwardTab ? 4.0 : speedMult;
    if (pacingLast < 0) pacingLast = now;
    let dt = now - pacingLast;
    pacingLast = now;
    if (dt > 100) dt = 100;                       // tab was hidden or the page stalled: don't sprint to catch up
    pacingAcc += dt * effSpeed;
    const maxFrames = Math.ceil(effSpeed * 6) + 2; // a slow device drops time instead of spiralling
    let count = 0;
    while (pacingAcc >= GBA_FRAME_MS && count < maxFrames) {
      gba.runFrame();
      framesInSec++;
      rewindFrameTick++;
      if (rewindFrameTick >= 15) {
        rewindFrameTick = 0;
        if (rewindRing.length >= REWIND_MAX) rewindRing.shift();
        rewindRing.push(gba.serializeState());
      }
      pacingAcc -= GBA_FRAME_MS;
      count++;
    }
    if (count >= maxFrames) pacingAcc = 0;
    if (count === 0) return;
    audio.pumpWorkletSamples();
    blitFramebuffer();
    if (debugOpen) updateDebuggerView();

    autosaveCounter += count;
    if (autosaveCounter >= 120) {
      autosaveCounter = 0;
      gba.saveAutosave();
      if (saveBadge.textContent !== 'SAVE: ' + gba.saveType) {
        saveBadge.textContent = 'SAVE: ' + gba.saveType;
      }
    }

    const elapsed = now - lastFpsTime;
    if (elapsed >= 500) {
      const fps = (framesInSec * 1000) / elapsed;
      fpsCounter.textContent = fps.toFixed(1) + ' FPS';
      framesInSec = 0;
      lastFpsTime = now;
    }
  }
  requestAnimationFrame(rafLoop);

  window.addEventListener('keydown', (ev) => {
    if (ev.target && (ev.target.tagName === 'INPUT' || ev.target.tagName === 'SELECT')) return;
    audio.startOnGesture();

    if (listeningGbaBit !== null) {
      ev.preventDefault();
      keyBindings[listeningGbaBit] = ev.code;
      keyMap = rebuildReverseKeyMap();
      try {
        localStorage.setItem('1337boy_keymap_v1', JSON.stringify(keyBindings));
      } catch (e) {}
      listeningGbaBit = null;
      renderRemapTable();
      showToast('Bound ' + ev.code);
      return;
    }

    if (ev.code === 'F1' || ev.code === 'F2' || ev.code === 'F3' || ev.code === 'F4') {
      ev.preventDefault();
      const slot = parseInt(ev.code.slice(1), 10) - 1;
      if (ev.shiftKey) saveToSlot(slot);
      else loadFromSlot(slot);
      return;
    }
    if (ev.code === 'Backquote') {
      ev.preventDefault();
      debugOpen = !debugOpen;
      dbgPanel.classList.toggle('hidden', !debugOpen);
      mainGrid.classList.toggle('with-dbg', debugOpen);
      updateDebuggerView();
      return;
    }
    if (ev.code === 'KeyR') {
      ev.preventDefault();
      rewinding = true;
      return;
    }
    if (ev.code === 'KeyN') {
      ev.preventDefault();
      stepSingleFrame();
      return;
    }
    if (ev.code === 'Tab') {
      ev.preventDefault();
      fastForwardTab = true;
      powerDot.classList.add('fast');
      statusTxt.textContent = 'TURBO 4X';
      return;
    }
    if (ev.code in keyMap) {
      ev.preventDefault();
      const bit = keyMap[ev.code];
      keyboardMask |= (1 << bit);
      syncCombinedKeys();
      const btn = document.querySelector(`[data-gba-key="${bit}"]`);
      if (btn) btn.classList.add('pressed');
    }
  });

  window.addEventListener('keyup', (ev) => {
    if (ev.code === 'KeyR') {
      ev.preventDefault();
      rewinding = false;
      statusTxt.textContent = paused ? 'PAUSED' : 'RUNNING';
      return;
    }
    if (ev.code === 'Tab') {
      ev.preventDefault();
      fastForwardTab = false;
      powerDot.classList.remove('fast');
      statusTxt.textContent = paused ? 'PAUSED' : 'RUNNING';
      return;
    }
    if (ev.code in keyMap) {
      ev.preventDefault();
      const bit = keyMap[ev.code];
      keyboardMask &= ~(1 << bit);
      syncCombinedKeys();
      const btn = document.querySelector(`[data-gba-key="${bit}"]`);
      if (btn) btn.classList.remove('pressed');
    }
  });

  // Multi-touch & pointer overlay support
  const padButtons = document.querySelectorAll('[data-gba-key]');
  padButtons.forEach((btn) => {
    const bit = parseInt(btn.getAttribute('data-gba-key'), 10);
    const press = (ev) => {
      ev.preventDefault();
      audio.startOnGesture();
      document.body.classList.add('playing-touch');
      touchMask |= (1 << bit);
      syncCombinedKeys();
      btn.classList.add('pressed');
    };
    const release = (ev) => {
      ev.preventDefault();
      touchMask &= ~(1 << bit);
      syncCombinedKeys();
      btn.classList.remove('pressed');
    };
    btn.addEventListener('pointerdown', press);
    btn.addEventListener('pointerup', release);
    btn.addEventListener('pointerleave', release);
    btn.addEventListener('pointercancel', release);
  });

  // Rewind button (Toolbar + Touch Deck)
  for (const rwId of ['btn-rewind', 'btn-touch-rewind']) {
    const rwBtn = document.getElementById(rwId);
    if (rwBtn) {
      const startRw = (ev) => { ev.preventDefault(); rewinding = true; };
      const stopRw  = (ev) => { ev.preventDefault(); rewinding = false; statusTxt.textContent = paused ? 'PAUSED' : 'RUNNING'; };
      rwBtn.addEventListener('pointerdown', startRw);
      rwBtn.addEventListener('pointerup', stopRw);
      rwBtn.addEventListener('pointerleave', stopRw);
    }
  }

  function stepSingleFrame() {
    if (!hasCartridge) return;
    paused = true;
    statusTxt.textContent = 'FRAME STEP';
    gba.runFrame();
    blitFramebuffer();
    updateDebuggerView();
  }
  document.getElementById('btn-step-frame').addEventListener('click', stepSingleFrame);

  // Speed selector
  document.getElementById('sel-speed').addEventListener('change', (ev) => {
    speedMult = parseFloat(ev.target.value) || 1.0;
    powerDot.classList.toggle('fast', speedMult > 1.0);
    statusTxt.textContent = (speedMult === 1.0) ? 'RUNNING' : ('SPEED ' + speedMult + 'X');
  });

  // Display Options: Integer Scale, LCD Grid, GBA Color Correction, Fullscreen, Screenshot
  document.getElementById('btn-intscale').addEventListener('click', (ev) => {
    intScale = !intScale;
    screenWrap.classList.toggle('int-scale', intScale);
    ev.target.classList.toggle('active-toggle', intScale);
  });
  document.getElementById('btn-lcdgrid').addEventListener('click', (ev) => {
    lcdGrid = !lcdGrid;
    lcdGridEl.classList.toggle('hidden', !lcdGrid);
    ev.target.classList.toggle('active-toggle', lcdGrid);
  });
  document.getElementById('btn-colorcorr').addEventListener('click', (ev) => {
    gba.colorCorrection = !gba.colorCorrection;
    ev.target.classList.toggle('active-toggle', gba.colorCorrection);
    if (hasCartridge) {
      for (let y = 0; y < 160; y++) gba.renderScanline(y);
      blitFramebuffer();
    }
  });
  document.getElementById('btn-fullscreen').addEventListener('click', () => {
    const shell = document.getElementById('ui-console-shell');
    if (!document.fullscreenElement) {
      if (shell.requestFullscreen) shell.requestFullscreen().catch(() => {});
    } else {
      if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
    }
  });
  document.getElementById('btn-snap').addEventListener('click', () => {
    canvas.toBlob((blob) => {
      if (!blob) return;
      const slug = (gba.romTitle || '1337boy').toLowerCase().replace(/[^a-z0-9]+/g, '') || '1337boy';
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = slug + '_snap.png';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      showToast('Saved 240x160 PNG Screenshot');
    }, 'image/png');
  });

  // Drag-and-Drop ROM loading
  window.addEventListener('dragover', (ev) => {
    ev.preventDefault();
    dropzone.classList.add('dragover');
  });
  window.addEventListener('dragleave', (ev) => {
    ev.preventDefault();
    dropzone.classList.remove('dragover');
  });
  window.addEventListener('drop', (ev) => {
    ev.preventDefault();
    dropzone.classList.remove('dragover');
    const file = ev.dataTransfer && ev.dataTransfer.files && ev.dataTransfer.files[0];
    if (file) {
      file.arrayBuffer().then((buf) => {
        bootCartridgeBytes(new Uint8Array(buf));
        showToast('Loaded ' + file.name + ' (' + gba.romTitle + ')');
      });
    }
  });

  // Toolbar Button Wire-ups
  const romInput = document.getElementById('file-rom-input');
  const savInput = document.getElementById('file-sav-input');
  const stateInput = document.getElementById('file-state-input');

  document.getElementById('btn-insert-rom').addEventListener('click', () => romInput.click());
  document.getElementById('btn-drop-browse').addEventListener('click', () => romInput.click());
  romInput.addEventListener('change', (ev) => {
    const file = ev.target.files && ev.target.files[0];
    if (file) {
      file.arrayBuffer().then((buf) => {
        bootCartridgeBytes(new Uint8Array(buf));
        showToast('Loaded ' + file.name);
      });
    }
  });

  const bootDemoHandler = () => {
    audio.startOnGesture();
    bootCartridgeBytes(base64ToUint8(DEMO_BOOT_ROM_B64), true);
    showToast('Booted hand-assembled 1337 BOOT Quine Cartridge!');
  };
  document.getElementById('btn-boot-demo').addEventListener('click', bootDemoHandler);
  document.getElementById('btn-drop-demo').addEventListener('click', bootDemoHandler);

  document.getElementById('btn-1337ify').addEventListener('click', exportPolyglotPair);
  document.getElementById('btn-modal-dl-gba').addEventListener('click', () => {
    const polyBytes = buildPolyglotCartridge(gba.rawRomBytes);
    const slug = (gba.romTitle || 'game').toLowerCase().replace(/[^a-z0-9]+/g, '') || 'game';
    triggerDownload(slug + '.1337.gba', polyBytes, 'application/octet-stream');
  });
  document.getElementById('btn-modal-dl-html').addEventListener('click', () => {
    const polyBytes = buildPolyglotCartridge(gba.rawRomBytes);
    const slug = (gba.romTitle || 'game').toLowerCase().replace(/[^a-z0-9]+/g, '') || 'game';
    triggerDownload(slug + '.1337.html', polyBytes, 'text/html');
  });

  // Save Type Override Selector
  document.getElementById('sel-savetype').addEventListener('change', (ev) => {
    const nextType = gba.setSaveType(ev.target.value);
    updateHeaderBadges();
    showToast('Save Memory Type set to ' + nextType);
  });

  // Self-Test Trigger Button
  const triggerSelfTestModal = async () => {
    const modal = document.getElementById('modal-selftest');
    const summaryEl = document.getElementById('ui-selftest-summary');
    const listEl = document.getElementById('ui-selftest-list');
    modal.classList.remove('hidden');
    summaryEl.textContent = 'Executing 390+ hardware verification tests...';
    listEl.innerHTML = '';

    const res = await window.B1337.selftest();
    summaryEl.style.color = (res.failed === 0) ? 'var(--lime)' : 'var(--red)';
    summaryEl.textContent = `PASSED: ${res.passed} / ${res.passed + res.failed} | FAILED: ${res.failed}`;
    listEl.innerHTML = res.results.map((r) =>
      `<div class="b1337-test-row ${r.pass ? 'pass' : 'fail'}"><span>${r.pass ? '[PASS]' : '[FAIL]'} ${r.name}</span><span>${r.detail}</span></div>`
    ).join('');
  };
  document.getElementById('btn-selftest').addEventListener('click', triggerSelfTestModal);
  document.getElementById('btn-drop-selftest').addEventListener('click', triggerSelfTestModal);
  document.getElementById('btn-close-selftest').addEventListener('click', () => {
    document.getElementById('modal-selftest').classList.add('hidden');
  });

  // Pause / Info Modal
  document.getElementById('btn-pause').addEventListener('click', () => {
    paused = true;
    statusTxt.textContent = 'PAUSED';
    updateHeaderBadges();
    document.getElementById('modal-pause').classList.remove('hidden');
  });
  document.getElementById('btn-close-pause').addEventListener('click', () => {
    paused = false;
    statusTxt.textContent = running ? 'RUNNING' : 'READY';
    document.getElementById('modal-pause').classList.add('hidden');
  });
  document.getElementById('btn-modal-reset').addEventListener('click', () => {
    gba.reset();
    paused = false;
    document.getElementById('modal-pause').classList.add('hidden');
    showToast('Console Cold Reset');
  });

  // Save-State Slots Modal
  document.getElementById('btn-slots').addEventListener('click', () => {
    renderSlotGrid();
    document.getElementById('modal-slots').classList.remove('hidden');
  });
  document.getElementById('btn-close-slots').addEventListener('click', () => {
    document.getElementById('modal-slots').classList.add('hidden');
  });

  // Remap Controls Modal
  document.getElementById('btn-remap').addEventListener('click', () => {
    listeningGbaBit = null;
    renderRemapTable();
    document.getElementById('modal-remap').classList.remove('hidden');
  });
  document.getElementById('btn-close-remap').addEventListener('click', () => {
    listeningGbaBit = null;
    document.getElementById('modal-remap').classList.add('hidden');
  });
  document.getElementById('btn-reset-remap').addEventListener('click', () => {
    keyBindings = Object.assign({}, DEFAULT_KEY_BINDINGS);
    keyMap = rebuildReverseKeyMap();
    try { localStorage.removeItem('1337boy_keymap_v1'); } catch (e) {}
    listeningGbaBit = null;
    renderRemapTable();
    showToast('Restored default key bindings');
  });

  // Cheats Modal
  function renderCheatList() {
    const listEl = document.getElementById('ui-cheat-list');
    if (gba.cheats.length === 0) {
      listEl.innerHTML = 'No active cheats.';
      return;
    }
    listEl.innerHTML = gba.cheats.map((c, idx) =>
      `<div class="b1337-test-row pass"><span><b>${c.code}</b> &mdash; ${c.desc}</span><button class="b1337-btn" data-del-cheat="${idx}" style="padding:2px 6px;font-size:0.65rem;">REMOVE</button></div>`
    ).join('');
    listEl.querySelectorAll('[data-del-cheat]').forEach((b) => {
      b.addEventListener('click', () => {
        gba.cheats.splice(parseInt(b.getAttribute('data-del-cheat'), 10), 1);

  }
  document.getElementById('btn-cheats').addEventListener('click', () => {
    renderCheatList();
    document.getElementById('modal-cheats').classList.remove('hidden');

  document.getElementById('btn-close-cheats').addEventListener('click', () => {

  });
  document.getElementById('btn-add-cheat').addEventListener('click', () => {

  // Debugger Panel & Controls

    mainGrid.classList.toggle('with-dbg', debugOpen);
    updateDebuggerView();
  });
  document.getElementById('btn-dbg-step').addEventListener('click', () => {

    statusTxt.textContent = 'STEPPING';

  document.getElementById('btn-dbg-vblank').addEventListener('click', () => {

  document.getElementById('btn-loadstate').addEventListener('click', () => stateInput.click());

  // Save & Load Battery Backup (.sav: 32KB SRAM, 64KB/128KB Flash, or 512B/8KB EEPROM)
  document.getElementById('btn-savesav').addEventListener('click', () => {
    const slug = (gba.romTitle || 'save').toLowerCase().replace(/[^a-z0-9]+/g, '') || 'save';
    const saveBytes = gba.exportSaveBytes();
    triggerDownload(slug + '.sav', saveBytes, 'application/octet-stream');
    showToast('Downloaded ' + saveBytes.length + ' B (' + gba.saveType + ') to ' + slug + '.sav');
  });
  document.getElementById('btn-loadsav').addEventListener('click', () => savInput.click());
  savInput.addEventListener('change', (ev) => {
    const file = ev.target.files && ev.target.files[0];
    if (file) {
      file.arrayBuffer().then((buf) => {
        const u8 = new Uint8Array(buf);
        gba.importSaveBytes(u8);
        updateHeaderBadges();
        showToast('Loaded ' + u8.length + ' B into ' + gba.saveType);
      });
    }
  });

  // FPS & Audio Toggles & About Modal
  document.getElementById('btn-fps').addEventListener('click', (ev) => {
    showFps = !showFps;
    fpsCounter.style.display = showFps ? 'inline-block' : 'none';
    ev.target.textContent = 'FPS: ' + (showFps ? 'ON' : 'OFF');
  });
  document.getElementById('btn-mute').addEventListener('click', (ev) => {
    audio.startOnGesture();
    const m = audio.toggleMute();
    ev.target.textContent = 'AUDIO: ' + (m ? 'MUTE' : 'ON');
  });
  document.getElementById('btn-about').addEventListener('click', () => {
    updateHeaderBadges();
    document.getElementById('modal-about').classList.remove('hidden');
  });
  document.getElementById('btn-close-about').addEventListener('click', () => {
    document.getElementById('modal-about').classList.add('hidden');
  });

  // Expose Required Window Automation Hooks for the Tester!
  window.B1337 = {
    gba,
    setRealtime(enabled) {
      realtimeEnabled = !!enabled;
      return realtimeEnabled;
    },
    setSpeed(mult) {
      speedMult = Number(mult) || 1.0;
      return speedMult;
    },
    loadRom(u8) {
      bootCartridgeBytes(u8 instanceof Uint8Array ? u8 : new Uint8Array(u8), true);
      return gba.romCrc32 >>> 0;
    },
    runFrames(n) {
      const count = n | 0;
      for (let i = 0; i < count; i++) {
        gba.runFrame();
      }
      blitFramebuffer();
      updateDebuggerView();
      return gba.fb;
    },
    setKeys(mask) {
      keyboardMask = mask & 0x03FF;
      syncCombinedKeys();
    },
    frameBuffer() {
      return new Uint8ClampedArray(gba.fb);
    },
    crc32() {
      return gba.romCrc32 >>> 0;
    },
    saveType() {
      return gba.saveType;
    },
    setSaveType(type) {
      const res = gba.setSaveType(type);
      updateHeaderBadges();
      return res;
    },
    sram() {
      return gba.exportSaveBytes();
    },
    buildPolyglot(u8) {
      return buildPolyglotCartridge(u8);
    },
    selftest() {
      return runB1337SelfTest(buildPolyglotCartridge);
    }
  };

  // Auto-boot if this HTML file carries an embedded base64 cartridge!
  if (embeddedRomB64 && embeddedRomB64.length > 0) {
    const romBytes = base64ToUint8(embeddedRomB64);
    if (romBytes.length > 0) {
      bootCartridgeBytes(romBytes, true);
    }
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initB1337App);
} else {
  initB1337App();
}
</script>
</body>
</html>
