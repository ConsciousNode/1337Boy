        const outBuf = new Uint8Array(decompLen);
        let outPos = 0;
        let curUnit = 0;
        let unitsInByte = 0;
        let nodeAddr = treeBase;

        while (outPos < decompLen) {
          const word = this.read32Aligned(dataPtr);
          dataPtr = (dataPtr + 4) >>> 0;
          for (let b = 31; b >= 0 && outPos < decompLen; b--) {
            const bit = (word >>> b) & 1;
            const node = this.read8(nodeAddr);
            const nextOff = ((node & 0x3F) + 1) << 1;
            const isLeaf = bit ? (node & 0x40) : (node & 0x80);
            nodeAddr = ((nodeAddr & ~1) + nextOff + bit) >>> 0;
            if (isLeaf) {
              const val = this.read8(nodeAddr);
              if (bitSize === 8) {
                outBuf[outPos++] = val;
              } else {
                curUnit |= (val & 0x0F) << (unitsInByte * 4);
                unitsInByte++;
                if (unitsInByte === 2) {
                  outBuf[outPos++] = curUnit;
                  curUnit = 0;
                  unitsInByte = 0;
                }
              }
              nodeAddr = treeBase;
            }
          }
        }
        this.flushDecompBuffer(dst, outBuf, true);
        break;
      }

      case 0x14: // RLUnCompWram
      case 0x15: { // RLUnCompVram
        const is16 = ((comment & 0xFF) === 0x15);
        let src = (this.r[0] & ~3) >>> 0;
        const dst = this.r[1] >>> 0;
        const header = this.read32Aligned(src);
        src = (src + 4) >>> 0;
        const decompLen = header >>> 8;
        const outBuf = new Uint8Array(decompLen);
        let outPos = 0;

        while (outPos < decompLen) {
          const flag = this.read8(src++);
          if (flag & 0x80) {
            const len = (flag & 0x7F) + 3;
            const b = this.read8(src++);
            for (let k = 0; k < len && outPos < decompLen; k++) {
              outBuf[outPos++] = b;
            }
          } else {
            const len = (flag & 0x7F) + 1;
            for (let k = 0; k < len && outPos < decompLen; k++) {
              outBuf[outPos++] = this.read8(src++);
            }
          }
        }
        this.flushDecompBuffer(dst, outBuf, is16);
        break;
      }

      case 0x16: // Diff8bitUnFilterWram
      case 0x17: { // Diff8bitUnFilterVram
        const is16 = ((comment & 0xFF) === 0x17);
        let src = (this.r[0] & ~3) >>> 0;
        const dst = this.r[1] >>> 0;
        const header = this.read32Aligned(src);
        src = (src + 4) >>> 0;
        const len = header >>> 8;
        const outBuf = new Uint8Array(len);
        let acc = 0;
        for (let i = 0; i < len; i++) {
          acc = (acc + this.read8(src++)) & 0xFF;
          outBuf[i] = acc;
        }
        this.flushDecompBuffer(dst, outBuf, is16);
        break;
      }

      case 0x18: { // Diff16bitUnFilter
        let src = (this.r[0] & ~3) >>> 0;
        let dst = (this.r[1] & ~1) >>> 0;
        const header = this.read32Aligned(src);
        src = (src + 4) >>> 0;
        const len = header >>> 8;
        let acc = 0;
        for (let i = 0; i < len; i += 2) {
          acc = (acc + this.read16(src)) & 0xFFFF;
          this.write16(dst, acc);
          src = (src + 2) >>> 0;
          dst = (dst + 2) >>> 0;
        }
        break;
      }
    }
  }

  flushDecompBuffer(dst, outBuf, is16) {
    if (is16) {
      let p = dst & ~1;
      for (let i = 0; i < outBuf.length; i += 2) {
        const lo = outBuf[i];
        const hi = (i + 1 < outBuf.length) ? outBuf[i + 1] : 0;
        this.write16(p, lo | (hi << 8));
        p = (p + 2) >>> 0;
      }
    } else {
      for (let i = 0; i < outBuf.length; i++) {
        this.write8((dst + i) >>> 0, outBuf[i]);
      }
    }
  }

  // ==========================================================================
  // ARM7TDMI CPU Execution Core (Full ARM + Thumb + 2-Stage Pipeline + Waitstates)
  // ==========================================================================

  checkCond(cond) {
    const f = this.cpsr >>> 28;
    switch (cond) {
      case 0x0: return (f & 4) !== 0;                              // EQ: Z=1
      case 0x1: return (f & 4) === 0;                              // NE: Z=0
      case 0x2: return (f & 2) !== 0;                              // CS/HS: C=1
      case 0x3: return (f & 2) === 0;                              // CC/LO: C=0
      case 0x4: return (f & 8) !== 0;                              // MI: N=1
      case 0x5: return (f & 8) === 0;                              // PL: N=0
      case 0x6: return (f & 1) !== 0;                              // VS: V=1
      case 0x7: return (f & 1) === 0;                              // VC: V=0
      case 0x8: return (f & 6) === 2;                              // HI: C=1 & Z=0
      case 0x9: return (f & 2) === 0 || (f & 4) !== 0;             // LS: C=0 | Z=1
      case 0xA: return ((f >>> 3) & 1) === (f & 1);                // GE: N == V
      case 0xB: return ((f >>> 3) & 1) !== (f & 1);                // LT: N != V
      case 0xC: return (f & 4) === 0 && ((f >>> 3) & 1) === (f & 1);// GT: Z=0 & N==V
      case 0xD: return (f & 4) !== 0 || ((f >>> 3) & 1) !== (f & 1);// LE: Z=1 | N!=V
      case 0xE: return true;                                       // AL
      default:  return false;                                      // NV
    }
  }

  getReg(reg, pcOffset) {
    return (reg === 15) ? ((this.r[15] + pcOffset) | 0) : this.r[reg];
  }

  setNZ(val) {
    val |= 0;
    let c = this.cpsr & ~(FLAG_N | FLAG_Z);
    if (val < 0) c |= FLAG_N;
    else if (val === 0) c |= FLAG_Z;
    this.cpsr = c;
  }

  setNZC(val, carry) {
    val |= 0;
    let c = this.cpsr & ~(FLAG_N | FLAG_Z | FLAG_C);
    if (val < 0) c |= FLAG_N;
    else if (val === 0) c |= FLAG_Z;
    if (carry) c |= FLAG_C;
    this.cpsr = c;
  }

  addFlags(a, b, res) {
    a |= 0; b |= 0; res |= 0;
    let c = this.cpsr & ~(FLAG_N | FLAG_Z | FLAG_C | FLAG_V);
    if (res < 0) c |= FLAG_N;
    else if (res === 0) c |= FLAG_Z;
    if ((res >>> 0) < (a >>> 0)) c |= FLAG_C;
    if (((~(a ^ b)) & (a ^ res)) < 0) c |= FLAG_V;
    this.cpsr = c;
  }

  adcFlags(a, b, carryIn, res) {
    a |= 0; b |= 0; res |= 0;
    let c = this.cpsr & ~(FLAG_N | FLAG_Z | FLAG_C | FLAG_V);
    if (res < 0) c |= FLAG_N;
    else if (res === 0) c |= FLAG_Z;
    const ua = a >>> 0;
    const ures = res >>> 0;
    if (carryIn ? (ures <= ua) : (ures < ua)) c |= FLAG_C;
    if (((~(a ^ b)) & (a ^ res)) < 0) c |= FLAG_V;
    this.cpsr = c;
  }

  subFlags(a, b, res) {
    a |= 0; b |= 0; res |= 0;
    let c = this.cpsr & ~(FLAG_N | FLAG_Z | FLAG_C | FLAG_V);
    if (res < 0) c |= FLAG_N;
    else if (res === 0) c |= FLAG_Z;
    if ((a >>> 0) >= (b >>> 0)) c |= FLAG_C;
    if (((a ^ b) & (a ^ res)) < 0) c |= FLAG_V;
    this.cpsr = c;
  }

  sbcFlags(a, b, carryIn, res) {
    a |= 0; b |= 0; res |= 0;
    let c = this.cpsr & ~(FLAG_N | FLAG_Z | FLAG_C | FLAG_V);
    if (res < 0) c |= FLAG_N;
    else if (res === 0) c |= FLAG_Z;
    const ua = a >>> 0;
    const ub = b >>> 0;
    if (carryIn ? (ua >= ub) : (ua > ub)) c |= FLAG_C;
    if (((a ^ b) & (a ^ res)) < 0) c |= FLAG_V;
    this.cpsr = c;
  }

  // Barrel Shifter (Immediate shift amount 0..31)
  shiftImm(val, type, imm5, carryIn) {
    val |= 0;
    switch (type) {
      case 0: // LSL
        if (imm5 === 0) {
          this.shifterCarry = carryIn;
          return val;
        }
        this.shifterCarry = (val >>> (32 - imm5)) & 1;
        return (val << imm5) | 0;
      case 1: // LSR
        if (imm5 === 0) {
          this.shifterCarry = (val >>> 31) & 1;
          return 0;
        }
        this.shifterCarry = (val >>> (imm5 - 1)) & 1;
        return (val >>> imm5) | 0;
      case 2: // ASR
        if (imm5 === 0) {
          this.shifterCarry = (val >>> 31) & 1;
          return (val >> 31) | 0;
        }
        this.shifterCarry = (val >>> (imm5 - 1)) & 1;
        return (val >> imm5) | 0;
      case 3: // ROR / RRX
        if (imm5 === 0) {
          this.shifterCarry = val & 1;
          return ((carryIn << 31) | (val >>> 1)) | 0;
        }
        this.shifterCarry = (val >>> (imm5 - 1)) & 1;
        return ((val >>> imm5) | (val << (32 - imm5))) | 0;
    }
    return val;
  }

  // Barrel Shifter (Register shift amount in bottom byte of Rs)
  shiftReg(val, type, amount, carryIn) {
    val |= 0;
    amount &= 0xFF;
    if (amount === 0) {
      this.shifterCarry = carryIn;
      return val;
    }
    switch (type) {
      case 0: // LSL
        if (amount < 32) {
          this.shifterCarry = (val >>> (32 - amount)) & 1;
          return (val << amount) | 0;
        } else if (amount === 32) {
          this.shifterCarry = val & 1;
          return 0;
        } else {
          this.shifterCarry = 0;
          return 0;
        }
      case 1: // LSR
        if (amount < 32) {
          this.shifterCarry = (val >>> (amount - 1)) & 1;
          return (val >>> amount) | 0;
        } else if (amount === 32) {
          this.shifterCarry = (val >>> 31) & 1;
          return 0;
        } else {
          this.shifterCarry = 0;
          return 0;
        }
      case 2: // ASR
        if (amount < 32) {
          this.shifterCarry = (val >>> (amount - 1)) & 1;
          return (val >> amount) | 0;
        } else {
          this.shifterCarry = (val >>> 31) & 1;
          return (val >> 31) | 0;
        }
      case 3: { // ROR
        const rot = amount & 31;
        if (rot === 0) {
          this.shifterCarry = (val >>> 31) & 1;
          return val;
        }
        this.shifterCarry = (val >>> (rot - 1)) & 1;
        return ((val >>> rot) | (val << (32 - rot))) | 0;
      }
    }
    return val;
  }

  // Compute instruction fetch + data + internal cycles with WAITCNT and Game Pak Prefetch Buffer.
  // 1.1.1 (Kehai): cycle model aligned with mGBA 0.10.2, the reference the timing probes are checked
  // against (tests/timing/). Two rules from it:
  //  * a data access takes the bus off the cartridge, so the next opcode fetch from ROM is
  //    non-sequential: charge N-S after any instruction that touched memory (and after multiplies);
  //  * with the prefetch buffer on, a data access to a non-cartridge region from ROM code lets the
  //    buffer fetch the next halfwords meanwhile; those sequential fetches are credited back here
  //    (mGBA's GBAMemoryStall heuristic, including its overlap guard via lastPrefetchedPc).
  finishCycles(pcRegion, isThumb, baseInternal, branched, nextFetchN) {
    const inRom = (pcRegion >= 8 && pcRegion <= 13);
    const fetchCost = isThumb ? this.ws16S[pcRegion] : this.ws32S[pcRegion];
    const extraInternal = (baseInternal > 1) ? (baseInternal - 1) : 0;
    const hadData = this.memCycles > 0;
    let body = this.memCycles + extraInternal;

    if (inRom && (hadData || nextFetchN)) {
      if (this.prefetchEnabled && (hadData ? this.dataRegion < 8 : true)) {
        const s = this.ws16S[pcRegion] - 1;               // sequential wait count
        const pc = this.curPc >>> 0;
        let maxLoads = 8, previousLoads = 0;
        const dist = (this.lastPrefetchedPc - pc) >>> 0;
        if (dist < 16) { previousLoads = dist >>> 1; maxLoads -= previousLoads; }
        let stall = s + 1, loads = 1;
        while (stall < body && loads < maxLoads) { stall += s; loads++; }
        this.lastPrefetchedPc = (pc + 2 * (loads + previousLoads - 1)) >>> 0;
        let wait = stall > body ? stall : body;
        wait -= (this.ws16N[pcRegion] - this.ws16S[pcRegion]) + 1;
        wait -= stall - 1;
        body = wait;
      }
      body += isThumb ? (this.ws16N[pcRegion] - this.ws16S[pcRegion])
                      : (this.ws32N[pcRegion] - this.ws32S[pcRegion]);
    }

    let branchPenalty = 0;
    if (branched) {
      this.lastPrefetchedPc = 0;   // pipeline flush (mGBA: GBASetActiveRegion)
      const dstReg = (this.r[15] >>> 24) & 0xF;
      const dstThumb = (this.cpsr & FLAG_T) !== 0;
      branchPenalty = dstThumb
        ? (this.ws16N[dstReg] + this.ws16S[dstReg])
        : (this.ws32N[dstReg] + this.ws32S[dstReg]);
    }

    return fetchCost + body + branchPenalty;
  }

  stepInstruction() {
    if ((this.io16[0x208 >> 1] & 1) && !(this.cpsr & FLAG_I)) {
      if (this.io16[0x200 >> 1] & this.io16[0x202 >> 1]) {
        this.halted = false;
        this.triggerIrqException();
      }
    }

    if (this.halted) {
      return 4;
    }

    if (this.cpsr & FLAG_T) {
      return this.stepThumb();
    } else {
      return this.stepArm();
    }
  }

  stepArm() {
    this.memCycles = 0;
    const pc = this.r[15] >>> 0;
    this.curPc = pc;
    const pcRegion = (pc >>> 24) & 0xF;

    // 2-Stage Prefetch Pipeline: if flushed, fill pipe0 (at pc) and pipe1 (at pc+4)
    if (this.pipePc !== pc) {
      this.pipe0 = this.fetchArmOpcode(pc);
      this.pipe1 = this.fetchArmOpcode((pc + 4) >>> 0);
    }
    const instr = this.pipe0;
    const nextPc = (pc + 4) >>> 0;
    const fetched = this.fetchArmOpcode((pc + 8) >>> 0);
    this.pipe0 = this.pipe1;
    this.pipe1 = fetched;
    this.pipePc = nextPc;
    this.lastFetchedOpcode = fetched;
    this.r[15] = nextPc | 0; // Advance PC by +4 before decode; reading R15 adds +4 (total pc+8)

    const cond = instr >>> 28;
    if (cond !== 0xE && !this.checkCond(cond)) {
      return this.finishCycles(pcRegion, false, 1, false);
    }

    const top3 = (instr >>> 25) & 7;
    let baseCycles = 1;

    if (top3 === 0) {
      const bit4 = (instr >>> 4) & 1;
      const bit7 = (instr >>> 7) & 1;

      if ((instr & 0x0FFFFFF0) === 0x012FFF10) {
        // BX Rm
        const rmVal = this.getReg(instr & 0xF, 4);
        if (rmVal & 1) {
          this.cpsr |= FLAG_T;
          this.r[15] = (rmVal & ~1) | 0;
        } else {
          this.cpsr &= ~FLAG_T;
          this.r[15] = (rmVal & ~3) | 0;
        }
        this.pipePc = -1;
        return this.finishCycles(pcRegion, false, 1, true);
      }

      if (bit4 === 1 && bit7 === 1) {
        const sh = (instr >>> 5) & 3;
        if (sh === 0) {
          if (((instr >>> 24) & 1) === 1) {
            // SWP / SWPB
            const isByte = (instr & (1 << 22)) !== 0;
            const rn = (instr >>> 16) & 0xF;
            const rd = (instr >>> 12) & 0xF;
            const rm = instr & 0xF;
            const addr = this.getReg(rn, 4) >>> 0;
            const rmVal = this.getReg(rm, 4);
            if (isByte) {
              const tmp = this.read8(addr);
              this.write8(addr, rmVal & 0xFF);
              this.r[rd] = tmp;
            } else {
              const tmp = this.read32(addr);
              this.write32(addr, rmVal);
              this.r[rd] = tmp | 0;
            }
            if (rd === 15) this.pipePc = -1;
            return this.finishCycles(pcRegion, false, 2, this.pipePc === -1);
          } else if (((instr >>> 23) & 1) === 1) {
            // Multiply Long: UMULL, UMLAL, SMULL, SMLAL
            const isSigned = (instr & (1 << 22)) !== 0;
            const accum    = (instr & (1 << 21)) !== 0;
            const setFlags = (instr & (1 << 20)) !== 0;
            const rdHi = (instr >>> 16) & 0xF;
            const rdLo = (instr >>> 12) & 0xF;
            const rs   = (instr >>> 8) & 0xF;
            const rm   = instr & 0xF;

            const vm = this.getReg(rm, 4);
            const vs = this.getReg(rs, 4);
            let resBig = isSigned
              ? (BigInt(vm | 0) * BigInt(vs | 0))
              : (BigInt(vm >>> 0) * BigInt(vs >>> 0));

            if (accum) {
              const curHi = BigInt(this.r[rdHi] >>> 0);
              const curLo = BigInt(this.r[rdLo] >>> 0);
              const cur64 = (curHi << 32n) | curLo;
              resBig = (resBig + cur64) & 0xFFFFFFFFFFFFFFFFn;
            } else {
              resBig &= 0xFFFFFFFFFFFFFFFFn;
            }

            const lo = Number(resBig & 0xFFFFFFFFn) | 0;
            const hi = Number((resBig >> 32n) & 0xFFFFFFFFn) | 0;
            this.r[rdLo] = lo;
            this.r[rdHi] = hi;

            if (setFlags) {
              let c = this.cpsr & ~(FLAG_N | FLAG_Z);
              if (hi < 0) c |= FLAG_N;
              else if (hi === 0 && lo === 0) c |= FLAG_Z;
              this.cpsr = c;
            }
            // ARM7TDMI: 1S + (m+1)I (+1I if accumulate); m = Booth steps from the multiplier (Rs).
            // Signed: leading bytes all-0 or all-1 terminate early; unsigned: only all-0.
            const ls = isSigned ? ((vs < 0) ? ~vs : vs) : (vs >>> 0);
            const mL = (ls & 0xFFFFFF00) === 0 ? 1 : ((ls & 0xFFFF0000) === 0 ? 2 : ((ls & 0xFF000000) === 0 ? 3 : 4));
            return this.finishCycles(pcRegion, false, 2 + mL + (accum ? 1 : 0), false, true);
          } else {
            // MUL / MLA
            const accum    = (instr & (1 << 21)) !== 0;
            const setFlags = (instr & (1 << 20)) !== 0;
            const rd = (instr >>> 16) & 0xF;
            const rn = (instr >>> 12) & 0xF;
            const rs = (instr >>> 8) & 0xF;
            const rm = instr & 0xF;
            const vs = this.getReg(rs, 4);
            let res = Math.imul(this.getReg(rm, 4), vs);
            if (accum) res = (res + this.getReg(rn, 4)) | 0;
            this.r[rd] = res;
            if (setFlags) this.setNZ(res);
            // ARM7TDMIbooth multiplier internal cycles (1..4 + 1 if MLA)
            const s = (vs < 0) ? ~vs : vs;
            const mCycles = (s & 0xFFFFFF00) === 0 ? 1 : ((s & 0xFFFF0000) === 0 ? 2 : ((s & 0xFF000000) === 0 ? 3 : 4));
            return this.finishCycles(pcRegion, false, 1 + mCycles + (accum ? 1 : 0), false, true);
          }
        } else {
          // Halfword and Signed Data Transfer (STRH, LDRH, LDRSB, LDRSH)
          const p = (instr >>> 24) & 1;
          const u = (instr >>> 23) & 1;
          const i = (instr >>> 22) & 1;
          const w = (instr >>> 21) & 1;
          const l = (instr >>> 20) & 1;
          const rn = (instr >>> 16) & 0xF;
          const rd = (instr >>> 12) & 0xF;

          const base = this.getReg(rn, 4) >>> 0;
          const off = i ? (((instr >>> 4) & 0xF0) | (instr & 0xF)) : (this.getReg(instr & 0xF, 4) >>> 0);
          const modAddr = u ? ((base + off) >>> 0) : ((base - off) >>> 0);
          const addr = p ? modAddr : base;

          if (l) {
            let val = 0;
            if (sh === 1) val = this.read16Rotated(addr);
            else if (sh === 2) val = (this.read8(addr) << 24) >> 24;
            else val = this.readSigned16(addr);
            if (!p || w) {
              if (rn !== rd) this.r[rn] = modAddr | 0;
            }
            this.r[rd] = val | 0;
            if (rd === 15) {
              this.r[15] &= ~3;
              this.pipePc = -1;
            }
            return this.finishCycles(pcRegion, false, 2, this.pipePc === -1);
          } else {
            const storeVal = this.getReg(rd, 8) & 0xFFFF;
            this.write16(addr, storeVal);
            if (!p || w) {
              this.r[rn] = modAddr | 0;
            }
            return this.finishCycles(pcRegion, false, 1, false);
          }
        }
      }

      if ((instr & 0x01900000) === 0x01000000) {
        const isMsr = (instr & (1 << 21)) !== 0;
        const useSpsr = (instr & (1 << 22)) !== 0;
        if (!isMsr) {
          const rd = (instr >>> 12) & 0xF;
          this.r[rd] = useSpsr ? this.getSpsr() : this.cpsr;
        } else {
          const rmVal = this.getReg(instr & 0xF, 4);
          this.execMsr(instr, rmVal, useSpsr);
        }
        return this.finishCycles(pcRegion, false, 1, this.pipePc === -1);
      }

      baseCycles = this.execDataProc(instr, false);
      return this.finishCycles(pcRegion, false, baseCycles, this.pipePc === -1);
    }

    if (top3 === 1) {
      if ((instr & 0x01900000) === 0x01000000) {
        const useSpsr = (instr & (1 << 22)) !== 0;
        const imm8 = instr & 0xFF;
        const rot = ((instr >>> 8) & 0xF) << 1;
        const val = rot ? ((imm8 >>> rot) | (imm8 << (32 - rot))) : imm8;
        this.execMsr(instr, val, useSpsr);
        return this.finishCycles(pcRegion, false, 1, this.pipePc === -1);
      }
      baseCycles = this.execDataProc(instr, true);
      return this.finishCycles(pcRegion, false, baseCycles, this.pipePc === -1);
    }

    if (top3 === 2 || top3 === 3) {
      const isRegOff = (top3 === 3);
      if (isRegOff && (instr & 0x10)) {
        return this.finishCycles(pcRegion, false, 1, false);
      }
      const p = (instr >>> 24) & 1;
      const u = (instr >>> 23) & 1;
      const b = (instr >>> 22) & 1;
      const w = (instr >>> 21) & 1;
      const l = (instr >>> 20) & 1;
      const rn = (instr >>> 16) & 0xF;
      const rd = (instr >>> 12) & 0xF;

      const base = this.getReg(rn, 4) >>> 0;
      let off = 0;
      if (!isRegOff) {
        off = instr & 0xFFF;
      } else {
        const rm = instr & 0xF;
        const shiftType = (instr >>> 5) & 3;
        const shiftImm5 = (instr >>> 7) & 0x1F;
        const carryIn = (this.cpsr & FLAG_C) ? 1 : 0;
        off = this.shiftImm(this.getReg(rm, 4), shiftType, shiftImm5, carryIn) >>> 0;
      }

      const modAddr = u ? ((base + off) >>> 0) : ((base - off) >>> 0);
      const addr = p ? modAddr : base;

      if (l) {
        const val = b ? this.read8(addr) : this.read32(addr);
        if (!p || w) {
          if (rn !== rd) this.r[rn] = modAddr | 0;
        }
        this.r[rd] = val | 0;
        if (rd === 15) {
          this.r[15] &= ~3;
          this.pipePc = -1;
        }
        return this.finishCycles(pcRegion, false, 2, this.pipePc === -1);
      } else {
        const storeVal = this.getReg(rd, 8);
        if (b) {
          this.write8(addr, storeVal & 0xFF);
        } else {
          this.write32(addr, storeVal);
        }
        if (!p || w) {
          this.r[rn] = modAddr | 0;
        }
        return this.finishCycles(pcRegion, false, 1, false);
      }
    }

    if (top3 === 4) {
      baseCycles = this.execBlockTransfer(instr);
      return this.finishCycles(pcRegion, false, baseCycles, this.pipePc === -1);
    }

    if (top3 === 5) {
      const link = (instr >>> 24) & 1;
      const offset = ((instr << 8) >> 6);
      if (link) {
        this.r[14] = this.r[15] | 0;
      }
      this.r[15] = ((pc + 8 + offset) & ~3) | 0;
      this.pipePc = -1;
      return this.finishCycles(pcRegion, false, 1, true);
    }

    if (top3 === 7 && (instr & (1 << 24))) {
      const comment = (instr >>> 16) & 0xFF;
      this.handleSwi(comment);
      return this.finishCycles(pcRegion, false, 3, this.pipePc === -1);
    }

    return this.finishCycles(pcRegion, false, 1, false);
  }

  execMsr(instr, val, useSpsr) {
    let mask = 0;
    if (instr & (1 << 19)) mask |= 0xFF000000;
    if (instr & (1 << 18)) mask |= 0x00FF0000;
    if (instr & (1 << 17)) mask |= 0x0000FF00;
    if (instr & (1 << 16)) {
      if (useSpsr || (this.cpsr & 0x1F) !== MODE_USR) {
        mask |= 0x000000FF;
      }
    }
    if (useSpsr) {
      this.setSpsr((this.getSpsr() & ~mask) | (val & mask));
    } else {
      const oldT = this.cpsr & FLAG_T;
      const nextCpsr = (this.cpsr & ~mask) | (val & mask);
      if ((mask & 0x1F) && ((nextCpsr & 0x1F) !== (this.cpsr & 0x1F))) {
        this.switchMode(nextCpsr & 0x1F);
      }
      this.cpsr = nextCpsr;
      if ((nextCpsr & FLAG_T) !== oldT) this.pipePc = -1;
      this.checkIrq();
    }
  }

  execDataProc(instr, isImm) {
    const op = (instr >>> 21) & 0xF;
    const s  = (instr >>> 20) & 1;
    const rn = (instr >>> 16) & 0xF;
    const rd = (instr >>> 12) & 0xF;
    const carryIn = (this.cpsr & FLAG_C) ? 1 : 0;

    let pcOffset = 4;
    let op2 = 0;
    let baseCycles = 1;

    if (isImm) {
      const imm8 = instr & 0xFF;
      const rot  = ((instr >>> 8) & 0xF) << 1;
      if (rot === 0) {
        op2 = imm8;
        this.shifterCarry = carryIn;
      } else {
        op2 = ((imm8 >>> rot) | (imm8 << (32 - rot))) | 0;
        this.shifterCarry = (op2 >>> 31) & 1;
      }
    } else {
      const rm = instr & 0xF;
      const shiftType = (instr >>> 5) & 3;
      const isRegShift = (instr & 0x10) !== 0;
      if (isRegShift) {
        pcOffset = 8;
        baseCycles = 2; // Register-specified shift adds 1I cycle
        const rs = (instr >>> 8) & 0xF;
        const shiftAmt = this.getReg(rs, 4) & 0xFF;
        const rmVal = this.getReg(rm, 8);
        op2 = this.shiftReg(rmVal, shiftType, shiftAmt, carryIn);
      } else {
        const imm5 = (instr >>> 7) & 0x1F;
        const rmVal = this.getReg(rm, 4);
        op2 = this.shiftImm(rmVal, shiftType, imm5, carryIn);
      }
    }

    const op1 = this.getReg(rn, pcOffset);
    let res = 0;
    let writeRd = true;

    switch (op) {
      case 0x0:
        res = op1 & op2;
        if (s && rd !== 15) this.setNZC(res, this.shifterCarry);
        break;
      case 0x1:
        res = op1 ^ op2;
        if (s && rd !== 15) this.setNZC(res, this.shifterCarry);
        break;
      case 0x2:
        res = (op1 - op2) | 0;
        if (s && rd !== 15) this.subFlags(op1, op2, res);
        break;
      case 0x3:
        res = (op2 - op1) | 0;
        if (s && rd !== 15) this.subFlags(op2, op1, res);
        break;
      case 0x4:
        res = (op1 + op2) | 0;
        if (s && rd !== 15) this.addFlags(op1, op2, res);
        break;
      case 0x5:
        res = (op1 + op2 + carryIn) | 0;
        if (s && rd !== 15) this.adcFlags(op1, op2, carryIn, res);
        break;
      case 0x6:
        res = (op1 - op2 - (1 - carryIn)) | 0;
        if (s && rd !== 15) this.sbcFlags(op1, op2, carryIn, res);
        break;
      case 0x7:
        res = (op2 - op1 - (1 - carryIn)) | 0;
        if (s && rd !== 15) this.sbcFlags(op2, op1, carryIn, res);
        break;
      case 0x8:
        res = op1 & op2;
        writeRd = false;
        this.setNZC(res, this.shifterCarry);
        break;
      case 0x9:
        res = op1 ^ op2;
        writeRd = false;
        this.setNZC(res, this.shifterCarry);
        break;
      case 0xA:
        res = (op1 - op2) | 0;
        writeRd = false;
        this.subFlags(op1, op2, res);
        break;
      case 0xB:
        res = (op1 + op2) | 0;
        writeRd = false;
        this.addFlags(op1, op2, res);
        break;
      case 0xC:
        res = op1 | op2;
        if (s && rd !== 15) this.setNZC(res, this.shifterCarry);
        break;
      case 0xD:
        res = op2;
        if (s && rd !== 15) this.setNZC(res, this.shifterCarry);
        break;
      case 0xE:
        res = op1 & ~op2;
        if (s && rd !== 15) this.setNZC(res, this.shifterCarry);
        break;
      case 0xF:
        res = ~op2;
        if (s && rd !== 15) this.setNZC(res, this.shifterCarry);
        break;
    }

    if (s && rd === 15) {
      const spsr = this.getSpsr();
      this.switchMode(spsr & 0x1F);
      this.cpsr = spsr;
      this.pipePc = -1;
      this.checkIrq();
      // Check if we just returned from BIOS IRQ stub at 0x013C (SUBS PC, LR, #4)
      if (this.inIntrWaitMask !== 0) {
        const biosFlags = this.iwram16[0x7FF8 >> 1];
        if (biosFlags & this.inIntrWaitMask) {
          this.iwram16[0x7FF8 >> 1] = biosFlags & ~this.inIntrWaitMask;
          this.inIntrWaitMask = 0;
          this.biosLastFetch = 0xE129F000;
        }
      }
    }

    if (writeRd) {
      this.r[rd] = res | 0;
      if (rd === 15) {
        if (this.cpsr & FLAG_T) {
          this.r[15] &= ~1;
        } else {
          this.r[15] &= ~3;
        }
        this.pipePc = -1;
      }
    }
    return baseCycles;
  }

  execBlockTransfer(instr) {
    const p = (instr >>> 24) & 1;
    const u = (instr >>> 23) & 1;
    const s = (instr >>> 22) & 1;
    const w = (instr >>> 21) & 1;
    const l = (instr >>> 20) & 1;
    const rn = (instr >>> 16) & 0xF;
    let rlist = instr & 0xFFFF;

    const origBase = this.getReg(rn, 4) >>> 0;

    if (rlist === 0) {
      let addr = origBase;
      if (u) {
        if (p) addr = (addr + 4) >>> 0;
      } else {
        addr = (addr - 0x40) >>> 0;
        if (!p) addr = (addr + 4) >>> 0;
      }
      if (w) {
        this.r[rn] = (u ? (origBase + 0x40) : (origBase - 0x40)) | 0;
      }
      if (l) {
        this.r[15] = (this.read32Aligned(addr) & ~3) | 0;
        this.pipePc = -1;
        return 2;
      } else {
        this.write32(addr, (this.r[15] + 8) | 0);
        return 1;
      }
    }

    let count = 0;
    for (let i = 0; i < 16; i++) {
      if (rlist & (1 << i)) count++;
    }

    const totalBytes = count << 2;
    const newBase = u ? ((origBase + totalBytes) >>> 0) : ((origBase - totalBytes) >>> 0);
    let addr = u
      ? (p ? ((origBase + 4) >>> 0) : origBase)
      : (p ? newBase : ((newBase + 4) >>> 0));

    const r15InList = (rlist & 0x8000) !== 0;
    const userBankTransfer = s && (!l || !r15InList);
    const baseReg = (addr >>> 24) & 0xF;

    if (l) {
      if (w && !(rlist & (1 << rn))) {
        this.r[rn] = newBase | 0;
      }
      for (let i = 0; i < 16; i++) {
        if (rlist & (1 << i)) {
          const val = this.read32Aligned(addr);
          addr = (addr + 4) >>> 0;
          if (userBankTransfer) {
            this.writeUsrReg(i, val | 0);
          } else {
            this.r[i] = val | 0;
          }
        }
      }
      if (count > 1 && baseReg < 16) {
        this.memCycles -= (count - 1) * (this.ws32N[baseReg] - this.ws32S[baseReg]);
      }
      if (r15InList) {
        if (s) {
          const spsr = this.getSpsr();
          this.switchMode(spsr & 0x1F);
          this.cpsr = spsr;
          this.checkIrq();
        }
        if (this.cpsr & FLAG_T) {
          this.r[15] &= ~1;
        } else {
          this.r[15] &= ~3;
        }
        this.pipePc = -1;
      }
      return 2;
    } else {
      const lowestBit = rlist & -rlist;
      const rnIsFirst = (lowestBit === (1 << rn));

      for (let i = 0; i < 16; i++) {
        if (rlist & (1 << i)) {
          let val = 0;
          if (i === 15) {
            val = (this.r[15] + 8) | 0;
          } else if (i === rn && w && !rnIsFirst) {
            val = newBase | 0;
          } else if (userBankTransfer) {
            val = this.readUsrReg(i);
          } else {
            val = this.r[i];
          }
          this.write32(addr, val);
          addr = (addr + 4) >>> 0;
        }
      }
      if (count > 1 && baseReg < 16) {
        this.memCycles -= (count - 1) * (this.ws32N[baseReg] - this.ws32S[baseReg]);
      }
      if (w) {
        this.r[rn] = newBase | 0;
      }
      return 1;
    }
  }

  // ==========================================================================
  // ARM7TDMI Thumb Instruction Set (All 19 Thumb Formats + 2-Stage Pipeline)
  // ==========================================================================

  stepThumb() {
    this.memCycles = 0;
    const pc = this.r[15] >>> 0;
    this.curPc = pc;
    const pcRegion = (pc >>> 24) & 0xF;

    // 2-Stage Prefetch Pipeline: if flushed, fill pipe0 (at pc) and pipe1 (at pc+2)
    if (this.pipePc !== pc) {
      this.pipe0 = this.fetchThumbOpcode(pc);
      this.pipe1 = this.fetchThumbOpcode((pc + 2) >>> 0);
    }
    const instr = this.pipe0;
    const nextPc = (pc + 2) >>> 0;
    const fetched = this.fetchThumbOpcode((pc + 4) >>> 0);
    this.pipe0 = this.pipe1;
    this.pipe1 = fetched;
    this.pipePc = nextPc;
    this.lastFetchedOpcode = (fetched | (fetched << 16)) >>> 0;
    this.r[15] = nextPc | 0; // Advance PC by +2 before decode; reading R15 adds +2 (total pc+4)

    const top3 = (instr >>> 13) & 7;

    if (top3 === 0) {
      const sub = (instr >>> 11) & 3;
      if (sub !== 3) {
        // Format 1: Move shifted register (LSL, LSR, ASR)
        const imm5 = (instr >>> 6) & 0x1F;
        const rs   = (instr >>> 3) & 7;
        const rd   = instr & 7;
        const carryIn = (this.cpsr & FLAG_C) ? 1 : 0;
        const res = this.shiftImm(this.r[rs], sub, imm5, carryIn);
        this.r[rd] = res;
        this.setNZC(res, this.shifterCarry);
        return this.finishCycles(pcRegion, true, 1, false);
      } else {
        // Format 2: Add / Subtract
        const isImm = (instr & 0x0400) !== 0;
        const isSub = (instr & 0x0200) !== 0;
        const rnImm = (instr >>> 6) & 7;
        const rs    = (instr >>> 3) & 7;
        const rd    = instr & 7;
        const op1   = this.r[rs];
        const op2   = isImm ? rnImm : this.r[rnImm];
        if (isSub) {
          const res = (op1 - op2) | 0;
          this.r[rd] = res;
          this.subFlags(op1, op2, res);
        } else {
          const res = (op1 + op2) | 0;
          this.r[rd] = res;
          this.addFlags(op1, op2, res);
        }
        return this.finishCycles(pcRegion, true, 1, false);
      }
    }

    if (top3 === 1) {
      // Format 3: Move / Compare / Add / Subtract 8-bit Immediate
      const op   = (instr >>> 11) & 3;
      const rd   = (instr >>> 8) & 7;
      const imm8 = instr & 0xFF;
      const cur  = this.r[rd];
      if (op === 0) {
        this.r[rd] = imm8;
        this.setNZ(imm8);
      } else if (op === 1) {
        const res = (cur - imm8) | 0;
        this.subFlags(cur, imm8, res);
      } else if (op === 2) {
        const res = (cur + imm8) | 0;
        this.r[rd] = res;
        this.addFlags(cur, imm8, res);
      } else {
        const res = (cur - imm8) | 0;
        this.r[rd] = res;
        this.subFlags(cur, imm8, res);
      }
      return this.finishCycles(pcRegion, true, 1, false);
    }

    if (top3 === 2) {
      const subTop = (instr >>> 10) & 7;
      if (subTop === 0) {
        // Format 4: ALU Operations
        const op = (instr >>> 6) & 0xF;
        const rs = (instr >>> 3) & 7;
        const rd = instr & 7;
        const a  = this.r[rd];
        const b  = this.r[rs];
        const carryIn = (this.cpsr & FLAG_C) ? 1 : 0;
        let res = 0;
        let intCyc = 1;
        switch (op) {
          case 0x0: res = a & b; this.r[rd] = res; this.setNZ(res); break;
          case 0x1: res = a ^ b; this.r[rd] = res; this.setNZ(res); break;
          case 0x2: res = this.shiftReg(a, 0, b & 0xFF, carryIn); this.r[rd] = res; this.setNZC(res, this.shifterCarry); intCyc = 2; break;
          case 0x3: res = this.shiftReg(a, 1, b & 0xFF, carryIn); this.r[rd] = res; this.setNZC(res, this.shifterCarry); intCyc = 2; break;
          case 0x4: res = this.shiftReg(a, 2, b & 0xFF, carryIn); this.r[rd] = res; this.setNZC(res, this.shifterCarry); intCyc = 2; break;
          case 0x5: res = (a + b + carryIn) | 0; this.r[rd] = res; this.adcFlags(a, b, carryIn, res); break;
          case 0x6: res = (a - b - (1 - carryIn)) | 0; this.r[rd] = res; this.sbcFlags(a, b, carryIn, res); break;
          case 0x7: res = this.shiftReg(a, 3, b & 0xFF, carryIn); this.r[rd] = res; this.setNZC(res, this.shifterCarry); intCyc = 2; break;
          case 0x8: res = a & b; this.setNZ(res); break;
          case 0x9: res = (0 - b) | 0; this.r[rd] = res; this.subFlags(0, b, res); break;
          case 0xA: res = (a - b) | 0; this.subFlags(a, b, res); break;
          case 0xB: res = (a + b) | 0; this.addFlags(a, b, res); break;
          case 0xC: res = a | b; this.r[rd] = res; this.setNZ(res); break;
          case 0xD: { res = Math.imul(a, b); this.r[rd] = res; this.setNZ(res); const ms = (a < 0) ? ~a : a; intCyc = 1 + ((ms & 0xFFFFFF00) === 0 ? 1 : ((ms & 0xFFFF0000) === 0 ? 2 : ((ms & 0xFF000000) === 0 ? 3 : 4))); break; }
          case 0xE: res = a & ~b; this.r[rd] = res; this.setNZ(res); break;
          case 0xF: res = ~b; this.r[rd] = res; this.setNZ(res); break;
        }
        return this.finishCycles(pcRegion, true, intCyc, false, op === 0xD);
      }

      if (subTop === 1) {
        // Format 5: Hi register operations / Branch exchange (ADD, CMP, MOV, BX)
        const op = (instr >>> 8) & 3;
        const h1 = (instr >>> 7) & 1;
        const h2 = (instr >>> 6) & 1;
        const rs = ((instr >>> 3) & 7) | (h2 << 3);
        const rd = (instr & 7) | (h1 << 3);
        const vs = (rs === 15) ? ((this.r[15] + 2) | 0) : this.r[rs];
        const vd = (rd === 15) ? ((this.r[15] + 2) | 0) : this.r[rd];

        if (op === 0) {
          this.r[rd] = (vd + vs) | 0;
          if (rd === 15) {
            this.r[15] &= ~1;
            this.pipePc = -1;
          }
        } else if (op === 1) {
          const res = (vd - vs) | 0;
          this.subFlags(vd, vs, res);
        } else if (op === 2) {
          this.r[rd] = vs;
          if (rd === 15) {
            this.r[15] &= ~1;
            this.pipePc = -1;
          }
        } else {
          if (vs & 1) {
            this.cpsr |= FLAG_T;
            this.r[15] = (vs & ~1) | 0;
          } else {
            this.cpsr &= ~FLAG_T;
            this.r[15] = (vs & ~3) | 0;
          }
          this.pipePc = -1;
        }
        return this.finishCycles(pcRegion, true, 1, this.pipePc === -1);
      }

      if (subTop === 2 || subTop === 3) {
        // Format 6: PC-relative load: LDR Rd, [PC, #imm8*4]
        const rd   = (instr >>> 8) & 7;
        const imm8 = (instr & 0xFF) << 2;
        const addr = (((pc + 4) & ~3) + imm8) >>> 0;
        this.r[rd] = this.read32(addr) | 0;
        return this.finishCycles(pcRegion, true, 2, false);
      }

      // Format 7 & 8: Load / Store with register offset
      const ro = (instr >>> 6) & 7;
      const rb = (instr >>> 3) & 7;
      const rd = instr & 7;
      const addr = (this.r[rb] + this.r[ro]) >>> 0;

      if ((instr & 0x0200) === 0) {
        const op = (instr >>> 10) & 3;
        if (op === 0) {
          this.write32(addr, this.r[rd]);
          return this.finishCycles(pcRegion, true, 1, false);
        } else if (op === 1) {
          this.write8(addr, this.r[rd] & 0xFF);
          return this.finishCycles(pcRegion, true, 1, false);
        } else if (op === 2) {
          this.r[rd] = this.read32(addr) | 0;
          return this.finishCycles(pcRegion, true, 2, false);
        } else {
          this.r[rd] = this.read8(addr);
          return this.finishCycles(pcRegion, true, 2, false);
        }
      } else {
        const op = (instr >>> 10) & 3;
        if (op === 0) {
          this.write16(addr, this.r[rd] & 0xFFFF);
          return this.finishCycles(pcRegion, true, 1, false);
        } else if (op === 1) {
          this.r[rd] = (this.read8(addr) << 24) >> 24;
          return this.finishCycles(pcRegion, true, 2, false);
        } else if (op === 2) {
          this.r[rd] = this.read16Rotated(addr) | 0;
          return this.finishCycles(pcRegion, true, 2, false);
        } else {
          this.r[rd] = this.readSigned16(addr);
          return this.finishCycles(pcRegion, true, 2, false);
        }
      }
    }

    if (top3 === 3) {
      // Format 9: Load / Store with immediate offset (word / byte)
      const op   = (instr >>> 11) & 3;
      const imm5 = (instr >>> 6) & 0x1F;
      const rb   = (instr >>> 3) & 7;
      const rd   = instr & 7;
      if (op === 0) {
        this.write32((this.r[rb] + (imm5 << 2)) >>> 0, this.r[rd]);
        return this.finishCycles(pcRegion, true, 1, false);
      } else if (op === 1) {
        this.r[rd] = this.read32((this.r[rb] + (imm5 << 2)) >>> 0) | 0;
        return this.finishCycles(pcRegion, true, 2, false);
      } else if (op === 2) {
        this.write8((this.r[rb] + imm5) >>> 0, this.r[rd] & 0xFF);
        return this.finishCycles(pcRegion, true, 1, false);
      } else {
        this.r[rd] = this.read8((this.r[rb] + imm5) >>> 0);
        return this.finishCycles(pcRegion, true, 2, false);
      }
    }

    if (top3 === 4) {
      if ((instr & 0x1000) === 0) {
        // Format 10: Load / Store halfword [Rb, #imm5*2]
        const isLoad = (instr & 0x0800) !== 0;
        const off    = ((instr >>> 6) & 0x1F) << 1;
        const rb     = (instr >>> 3) & 7;
        const rd     = instr & 7;
        const addr   = (this.r[rb] + off) >>> 0;
        if (isLoad) {
          this.r[rd] = this.read16Rotated(addr) | 0;
          return this.finishCycles(pcRegion, true, 2, false);
        } else {
          this.write16(addr, this.r[rd] & 0xFFFF);
          return this.finishCycles(pcRegion, true, 1, false);
        }
      } else {
        // Format 11: SP-relative Load / Store [SP, #imm8*4]
        const isLoad = (instr & 0x0800) !== 0;
        const rd     = (instr >>> 8) & 7;
        const off    = (instr & 0xFF) << 2;
        const addr   = (this.r[13] + off) >>> 0;
        if (isLoad) {
          this.r[rd] = this.read32(addr) | 0;
          return this.finishCycles(pcRegion, true, 2, false);
        } else {
          this.write32(addr, this.r[rd]);
          return this.finishCycles(pcRegion, true, 1, false);
        }
      }
    }

    if (top3 === 5) {
      if ((instr & 0x1000) === 0) {
        // Format 12: Load address (ADD Rd, PC/SP, #imm8*4)
        const useSp = (instr & 0x0800) !== 0;
        const rd    = (instr >>> 8) & 7;
        const off   = (instr & 0xFF) << 2;
        const base  = useSp ? (this.r[13] >>> 0) : (((pc + 4) & ~3) >>> 0);
        this.r[rd]  = (base + off) | 0;
        return this.finishCycles(pcRegion, true, 1, false);
      } else {
        const sub = (instr >>> 8) & 0xF;
        if (sub === 0) {
          // Format 13: Add offset to Stack Pointer (ADD SP, #+-imm7*4)
          const isNeg = (instr & 0x80) !== 0;
          const off   = (instr & 0x7F) << 2;
          this.r[13]  = (isNeg ? (this.r[13] - off) : (this.r[13] + off)) | 0;
          return this.finishCycles(pcRegion, true, 1, false);
        } else {
          // Format 14: Push / Pop registers
          const isPop = (instr & 0x0800) !== 0;
          const pclr  = (instr & 0x0100) !== 0;
          const rlist = instr & 0xFF;

          // Edge case: empty rlist and pclr=0 in Thumb PUSH/POP:
          // On ARM7TDMI, stores R15 (pc + 6) at SP - 0x40 (or loads R15 from SP) and adjusts SP by 0x40!
          if (rlist === 0 && !pclr) {
            if (isPop) {
              this.r[15] = (this.read32Aligned(this.r[13] >>> 0) & ~1) | 0;
              this.r[13] = (this.r[13] + 0x40) | 0;
              this.pipePc = -1;
            } else {
              this.r[13] = (this.r[13] - 0x40) | 0;
              this.write32(this.r[13] >>> 0, (pc + 6) | 0);
            }
            return this.finishCycles(pcRegion, true, isPop ? 2 : 1, this.pipePc === -1);
          }

          let sp = this.r[13] >>> 0;
          const spReg = (sp >>> 24) & 0xF;
          if (isPop) {
            let count = pclr ? 1 : 0;
            for (let i = 0; i < 8; i++) {
              if (rlist & (1 << i)) {
                this.r[i] = this.read32Aligned(sp) | 0;
                sp = (sp + 4) >>> 0;
                count++;
              }
            }
            if (pclr) {
              this.r[15] = (this.read32Aligned(sp) & ~1) | 0;
              sp = (sp + 4) >>> 0;
              this.pipePc = -1;
            }
            if (count > 1 && spReg < 16) {
              this.memCycles -= (count - 1) * (this.ws32N[spReg] - this.ws32S[spReg]);
            }
            this.r[13] = sp | 0;
            return this.finishCycles(pcRegion, true, 2, this.pipePc === -1);
          } else {
            let count = pclr ? 1 : 0;
            for (let i = 0; i < 8; i++) if (rlist & (1 << i)) count++;
            sp = (sp - (count << 2)) >>> 0;
            this.r[13] = sp | 0;
            for (let i = 0; i < 8; i++) {
              if (rlist & (1 << i)) {
                this.write32(sp, this.r[i]);
                sp = (sp + 4) >>> 0;
              }
            }
            if (pclr) {
              this.write32(sp, this.r[14]);
            }
            if (count > 1 && spReg < 16) {
              this.memCycles -= (count - 1) * (this.ws32N[spReg] - this.ws32S[spReg]);
            }
            return this.finishCycles(pcRegion, true, 1, false);
          }
        }
      }
    }

    if (top3 === 6) {
      if ((instr & 0x1000) === 0) {
        // Format 15: Multiple Load / Store (LDMIA / STMIA Rb!, {Rlist})
        const isLoad = (instr & 0x0800) !== 0;
        const rb     = (instr >>> 8) & 7;
        const rlist  = instr & 0xFF;
        let addr     = this.r[rb] >>> 0;

        if (rlist === 0) {
          // Tier 1.1 Fix (thumb test 229): Empty rlist in Thumb LDMIA/STMIA!
          // On ARM7TDMI, STMIA Rb!, {} stores R15 = pc + 6 (the PC seen by the next instruction) and adds 0x40 to Rb!
          if (isLoad) {
            this.r[15] = (this.read32Aligned(addr) & ~1) | 0;
            this.pipePc = -1;
          } else {
            this.write32(addr, (pc + 6) | 0);
          }
          this.r[rb] = (addr + 0x40) | 0;
          return this.finishCycles(pcRegion, true, isLoad ? 2 : 1, this.pipePc === -1);
        }

        let count = 0;
        for (let i = 0; i < 8; i++) if (rlist & (1 << i)) count++;
        const newBase = (addr + (count << 2)) >>> 0;
        const baseReg = (addr >>> 24) & 0xF;

        if (isLoad) {
          if (!(rlist & (1 << rb))) {
            this.r[rb] = newBase | 0;
          }
          for (let i = 0; i < 8; i++) {
            if (rlist & (1 << i)) {
              this.r[i] = this.read32Aligned(addr) | 0;
              addr = (addr + 4) >>> 0;
            }
          }
          if (count > 1 && baseReg < 16) {
            this.memCycles -= (count - 1) * (this.ws32N[baseReg] - this.ws32S[baseReg]);
          }
          return this.finishCycles(pcRegion, true, 2, false);
        } else {
          const lowestBit = rlist & -rlist;
          const rbIsFirst = (lowestBit === (1 << rb));
          for (let i = 0; i < 8; i++) {
            if (rlist & (1 << i)) {
              const val = (i === rb && !rbIsFirst) ? (newBase | 0) : this.r[i];
              this.write32(addr, val);
              addr = (addr + 4) >>> 0;
            }
          }
          if (count > 1 && baseReg < 16) {
            this.memCycles -= (count - 1) * (this.ws32N[baseReg] - this.ws32S[baseReg]);
          }
          this.r[rb] = newBase | 0;
          return this.finishCycles(pcRegion, true, 1, false);
        }
      } else {
        // Format 16: Conditional branch & Format 17: SWI
        const cond = (instr >>> 8) & 0xF;
        if (cond === 0xF) {
          this.handleSwi(instr & 0xFF);
          return this.finishCycles(pcRegion, true, 3, this.pipePc === -1);
        }
        if (cond === 0xE) return this.finishCycles(pcRegion, true, 1, false);
        if (this.checkCond(cond)) {
          const offset = ((instr << 24) >> 23);
          this.r[15] = ((pc + 4 + offset) & ~1) | 0;
          this.pipePc = -1;
          return this.finishCycles(pcRegion, true, 1, true);
        }
        return this.finishCycles(pcRegion, true, 1, false);
      }
    }

    if (top3 === 7) {
      const sub = (instr >>> 11) & 3;
      if (sub === 0) {
        // Format 18: Unconditional branch B label
        const offset = ((instr << 21) >> 20);
        this.r[15] = ((pc + 4 + offset) & ~1) | 0;
        this.pipePc = -1;
        return this.finishCycles(pcRegion, true, 1, true);
      } else if (sub === 2) {
        // Format 19 (first instruction): BL prefix (H=10)
        const offset = ((instr << 21) >> 9);
        this.r[14] = (pc + 4 + offset) | 0;
        return this.finishCycles(pcRegion, true, 1, false);
      } else if (sub === 3) {
        // Format 19 (second instruction): BL suffix (H=11)
        const offset = (instr & 0x7FF) << 1;
        const nextLr = (pc + 2) | 1;
        this.r[15] = ((this.r[14] + offset) & ~1) | 0;
        this.r[14] = nextLr | 0;
        this.pipePc = -1;
        return this.finishCycles(pcRegion, true, 1, true);
      }
    }

    return this.finishCycles(pcRegion, true, 1, false);
  }

  // ==========================================================================
  // PPU Scanline Renderer (Modes 0..5, Affine BGs, Sprites, Windows, Blending)
  // ==========================================================================

  renderScanline(y) {
    const dispcnt = this.io16[0x000 >> 1];
    const rowBase = y * 240;
    const colorLut = this.colorCorrection ? BGR555_CC_LUT : BGR555_RAW_LUT;

    // Forced blank (bit 7): fill scanline with white
    if (dispcnt & 0x0080) {
      const white = colorLut[0x7FFF];
      for (let x = 0; x < 240; x++) {
        this.fb32[rowBase + x] = white;
      }
      return;
    }

    const mode = dispcnt & 7;
    const mosaicReg = this.io16[0x04C >> 1];
    const bgMosH = (mosaicReg & 0xF) + 1;
    const bgMosV = ((mosaicReg >>> 4) & 0xF) + 1;
    const objMosH = ((mosaicReg >>> 8) & 0xF) + 1;
    const objMosV = ((mosaicReg >>> 12) & 0xF) + 1;

    for (let b = 0; b < 4; b++) {
      this.lineBgValid[b].fill(0);
    }
    this.lineObjPrio.fill(4);
    this.lineObjSemi.fill(0);
    this.lineObjWin.fill(0);
    this.lineObjMosaic.fill(0);

    if (dispcnt & 0x1000) {
      this.renderSpritesScanline(y, dispcnt, mode, objMosH, objMosV);
    }

    if (mode === 0) {
      if (dispcnt & 0x0100) this.renderTextBgScanline(0, y, bgMosH, bgMosV);
      if (dispcnt & 0x0200) this.renderTextBgScanline(1, y, bgMosH, bgMosV);
      if (dispcnt & 0x0400) this.renderTextBgScanline(2, y, bgMosH, bgMosV);
      if (dispcnt & 0x0800) this.renderTextBgScanline(3, y, bgMosH, bgMosV);
    } else if (mode === 1) {
      if (dispcnt & 0x0100) this.renderTextBgScanline(0, y, bgMosH, bgMosV);
      if (dispcnt & 0x0200) this.renderTextBgScanline(1, y, bgMosH, bgMosV);
      if (dispcnt & 0x0400) this.renderAffineBgScanline(2, y, bgMosH);
    } else if (mode === 2) {
      if (dispcnt & 0x0400) this.renderAffineBgScanline(2, y, bgMosH);
      if (dispcnt & 0x0800) this.renderAffineBgScanline(3, y, bgMosH);
    } else if (mode === 3) {
      if (dispcnt & 0x0400) this.renderBitmapBgScanline(y, 3, dispcnt, bgMosH);
    } else if (mode === 4) {
      if (dispcnt & 0x0400) this.renderBitmapBgScanline(y, 4, dispcnt, bgMosH);
    } else if (mode === 5) {
      if (dispcnt & 0x0400) this.renderBitmapBgScanline(y, 5, dispcnt, bgMosH);
    }

    const win0On  = (dispcnt & 0x2000) !== 0;
    const win1On  = (dispcnt & 0x4000) !== 0;
    const objWinOn= (dispcnt & 0x8000) !== 0;
    const anyWin  = win0On || win1On || objWinOn;

    const winin  = this.io16[0x048 >> 1];
    const winout = this.io16[0x04A >> 1];

    const win0H = this.io16[0x040 >> 1];
    const win1H = this.io16[0x042 >> 1];
    const win0V = this.io16[0x044 >> 1];
    const win1V = this.io16[0x046 >> 1];

    const w0y1 = win0V >>> 8, w0y2 = win0V & 0xFF;
    const w1y1 = win1V >>> 8, w1y2 = win1V & 0xFF;
    const inWin0Y = win0On && ((w0y1 <= w0y2) ? (y >= w0y1 && y < w0y2) : (y >= w0y1 || y < w0y2));
    const inWin1Y = win1On && ((w1y1 <= w1y2) ? (y >= w1y1 && y < w1y2) : (y >= w1y1 || y < w1y2));
    const w0x1 = win0H >>> 8, w0x2 = win0H & 0xFF;
    const w1x1 = win1H >>> 8, w1x2 = win1H & 0xFF;

    const bldcnt   = this.io16[0x050 >> 1];
    const bldalpha = this.io16[0x052 >> 1];
    const bldy     = this.io16[0x054 >> 1];
    const bldMode  = (bldcnt >>> 6) & 3;
    const eva = Math.min(16, bldalpha & 0x1F);
    const evb = Math.min(16, (bldalpha >>> 8) & 0x1F);
    const evy = Math.min(16, bldy & 0x1F);

    const bgEnMask = (dispcnt >>> 8) & 0xF;
    const bgPrios = [
      this.io16[0x008 >> 1] & 3,
      this.io16[0x00A >> 1] & 3,
      this.io16[0x00C >> 1] & 3,
      this.io16[0x00E >> 1] & 3
    ];

    const backdrop = this.pal16[0];

    for (let x = 0; x < 240; x++) {
      let winMask = 0x3F;
      if (anyWin) {
        const inW0 = inWin0Y && ((w0x1 <= w0x2) ? (x >= w0x1 && x < w0x2) : (x >= w0x1 || x < w0x2));
        const inW1 = inWin1Y && ((w1x1 <= w1x2) ? (x >= w1x1 && x < w1x2) : (x >= w1x1 || x < w1x2));
        if (inW0) {
          winMask = winin & 0x3F;
        } else if (inW1) {
          winMask = (winin >>> 8) & 0x3F;
        } else if (objWinOn && this.lineObjWin[x]) {
          winMask = (winout >>> 8) & 0x3F;
        } else {
          winMask = winout & 0x3F;
        }
      }

      let top1Color = backdrop, top1Layer = 5, top1Prio = 4;
      let top2Color = backdrop, top2Layer = 5, top2Prio = 4;

      const objPrio = this.lineObjPrio[x];
      const objValid = (objPrio < 4) && ((winMask & 0x10) !== 0);

      for (let prio = 0; prio < 4; prio++) {
        if (objValid && objPrio === prio) {
          if (top1Layer === 5) {
            top1Layer = 4; top1Color = this.lineObjColor[x]; top1Prio = prio;
          } else if (top2Layer === 5) {
            top2Layer = 4; top2Color = this.lineObjColor[x]; top2Prio = prio;
          }
        }
        for (let b = 0; b < 4; b++) {
          if ((bgEnMask & (1 << b)) && (winMask & (1 << b)) && bgPrios[b] === prio && this.lineBgValid[b][x]) {
            if (top1Layer === 5) {
              top1Layer = b; top1Color = this.lineBgColor[b][x]; top1Prio = prio;
            } else if (top2Layer === 5) {
              top2Layer = b; top2Color = this.lineBgColor[b][x]; top2Prio = prio;
              break;
            }
          }
        }
        if (top1Layer !== 5 && top2Layer !== 5) break;
      }

      let outColor = top1Color;
      const isSemiObj = (top1Layer === 4) && (this.lineObjSemi[x] !== 0);
      const sfxAllowed = (winMask & 0x20) !== 0;
      const isTarget1 = (bldcnt & (1 << top1Layer)) !== 0;
      const isTarget2 = (bldcnt & (1 << (8 + top2Layer))) !== 0;

      if (isSemiObj && isTarget2) {
        outColor = this.blendColors(top1Color, top2Color, eva, evb);
      } else if (sfxAllowed && isTarget1) {
        if (bldMode === 1 && isTarget2) {
          outColor = this.blendColors(top1Color, top2Color, eva, evb);
        } else if (bldMode === 2) {
          let r = top1Color & 0x1F;
          let g = (top1Color >>> 5) & 0x1F;
          let b = (top1Color >>> 10) & 0x1F;
          r += (((31 - r) * evy) >>> 4);
          g += (((31 - g) * evy) >>> 4);
          b += (((31 - b) * evy) >>> 4);
          outColor = r | (g << 5) | (b << 10);
        } else if (bldMode === 3) {
          let r = top1Color & 0x1F;
          let g = (top1Color >>> 5) & 0x1F;
          let b = (top1Color >>> 10) & 0x1F;
          r -= ((r * evy) >>> 4);
          g -= ((g * evy) >>> 4);
          b -= ((b * evy) >>> 4);
          outColor = r | (g << 5) | (b << 10);
        }
      }

      this.fb32[rowBase + x] = colorLut[outColor & 0x7FFF];
    }

    const pb2 = (this.io16[0x022 >> 1] << 16) >> 16;
    const pd2 = (this.io16[0x026 >> 1] << 16) >> 16;
    const pb3 = (this.io16[0x032 >> 1] << 16) >> 16;
    const pd3 = (this.io16[0x036 >> 1] << 16) >> 16;
    this.bgRefX[0] = (this.bgRefX[0] + pb2) | 0;
    this.bgRefY[0] = (this.bgRefY[0] + pd2) | 0;
    this.bgRefX[1] = (this.bgRefX[1] + pb3) | 0;
    this.bgRefY[1] = (this.bgRefY[1] + pd3) | 0;
  }

  blendColors(c1, c2, eva, evb) {
    const r1 = c1 & 0x1F, g1 = (c1 >>> 5) & 0x1F, b1 = (c1 >>> 10) & 0x1F;
    const r2 = c2 & 0x1F, g2 = (c2 >>> 5) & 0x1F, b2 = (c2 >>> 10) & 0x1F;
    const r = Math.min(31, (r1 * eva + r2 * evb) >>> 4);
    const g = Math.min(31, (g1 * eva + g2 * evb) >>> 4);
    const b = Math.min(31, (b1 * eva + b2 * evb) >>> 4);
    return r | (g << 5) | (b << 10);
  }

  renderTextBgScanline(bgIdx, y, bgMosH, bgMosV) {
    const cnt = this.io16[(0x008 + bgIdx * 2) >> 1];
    const isMos = (cnt & 0x0040) !== 0;
    const srcY = isMos ? (y - (y % bgMosV)) : y;

    const charBase = ((cnt >>> 2) & 3) * 0x4000;
    const is8bpp   = (cnt & 0x0080) !== 0;
    const scrBase  = ((cnt >>> 8) & 0x1F) * 0x800;
    const sizeMode = (cnt >>> 14) & 3;

    const hofs = this.io16[(0x010 + bgIdx * 4) >> 1] & 0x1FF;
    const vofs = this.io16[(0x012 + bgIdx * 4) >> 1] & 0x1FF;

    const widthMask  = (sizeMode & 1) ? 511 : 255;
    const heightMask = (sizeMode & 2) ? 511 : 255;

    const ty = (srcY + vofs) & heightMask;
    const tileY = ty >>> 3;
    const inTileY = ty & 7;

    let screenBlockY = 0;
    if (tileY >= 32) {
      screenBlockY = (sizeMode === 3) ? 2 : 1;
    }

    const dstCol = this.lineBgColor[bgIdx];
    const dstVal = this.lineBgValid[bgIdx];

    for (let x = 0; x < 240; x++) {
      if (isMos && (x % bgMosH) !== 0) {
        dstCol[x] = dstCol[x - 1];
        dstVal[x] = dstVal[x - 1];
        continue;
      }
      const tx = (x + hofs) & widthMask;
      const tileX = tx >>> 3;
      const inTileX = tx & 7;

      const screenBlock = screenBlockY + ((tileX >= 32) ? 1 : 0);
      const mapAddr = (scrBase + screenBlock * 0x800 + ((tileY & 31) * 32 + (tileX & 31)) * 2) & 0xFFFF;
      const entry = this.vram16[mapAddr >>> 1];

      const tileNum = entry & 0x3FF;
      const flipH   = (entry & 0x0400) !== 0;
      const flipV   = (entry & 0x0800) !== 0;
      const palBank = (entry >>> 12) & 0xF;

      const px = flipH ? (7 - inTileX) : inTileX;
      const py = flipV ? (7 - inTileY) : inTileY;

      if (is8bpp) {
        const tileAddr = charBase + tileNum * 64 + py * 8 + px;
        if (tileAddr < 0x10000) {
          const palIdx = this.vram[tileAddr];
          if (palIdx !== 0) {
            dstCol[x] = this.pal16[palIdx];
            dstVal[x] = 1;
          }
        }
      } else {
        const tileAddr = charBase + tileNum * 32 + py * 4 + (px >>> 1);
        if (tileAddr < 0x10000) {
          const byteVal = this.vram[tileAddr];
          const nib = (px & 1) ? (byteVal >>> 4) : (byteVal & 0xF);
          if (nib !== 0) {
            dstCol[x] = this.pal16[(palBank << 4) | nib];
            dstVal[x] = 1;
          }
        }
      }
    }
  }

  renderAffineBgScanline(bgIdx, y, bgMosH) {
    const cnt = this.io16[(0x008 + bgIdx * 2) >> 1];
    const isMos    = (cnt & 0x0040) !== 0;
    const charBase = ((cnt >>> 2) & 3) * 0x4000;
    const scrBase  = ((cnt >>> 8) & 0x1F) * 0x800;
    const wrap     = (cnt & 0x2000) !== 0;
    const sizeMode = (cnt >>> 14) & 3;
    const dimTiles = 16 << sizeMode;
    const dimPx    = dimTiles << 3;
    const dimMask  = dimPx - 1;

    const affIdx = bgIdx - 2;
    const baseIo = 0x020 + affIdx * 0x10;
    const pa = (this.io16[baseIo >> 1] << 16) >> 16;
    const pc = (this.io16[(baseIo + 4) >> 1] << 16) >> 16;

    let curX = this.bgRefX[affIdx];
    let curY = this.bgRefY[affIdx];

    const dstCol = this.lineBgColor[bgIdx];
    const dstVal = this.lineBgValid[bgIdx];

    for (let x = 0; x < 240; x++) {
      if (isMos && (x % bgMosH) !== 0) {
        dstCol[x] = dstCol[x - 1];
        dstVal[x] = dstVal[x - 1];
        curX = (curX + pa) | 0;
        curY = (curY + pc) | 0;
        continue;
      }

      let px = curX >> 8;
      let py = curY >> 8;
      curX = (curX + pa) | 0;
      curY = (curY + pc) | 0;

      if (wrap) {
        px &= dimMask;
        py &= dimMask;
      } else if (px < 0 || px >= dimPx || py < 0 || py >= dimPx) {
        continue;
      }

      const tileX = px >>> 3;
      const tileY = py >>> 3;
      const mapAddr = (scrBase + tileY * dimTiles + tileX) & 0xFFFF;
      const tileNum = this.vram[mapAddr];
      const tileAddr = charBase + tileNum * 64 + ((py & 7) << 3) + (px & 7);
      if (tileAddr < 0x10000) {
        const palIdx = this.vram[tileAddr];
        if (palIdx !== 0) {
          dstCol[x] = this.pal16[palIdx];
          dstVal[x] = 1;
        }
      }
    }
  }

  renderBitmapBgScanline(y, mode, dispcnt, bgMosH) {
    const cnt = this.io16[0x00C >> 1];
    const isMos = (cnt & 0x0040) !== 0;
    const wrap  = (cnt & 0x2000) !== 0;

    const pa = (this.io16[0x020 >> 1] << 16) >> 16;
    const pc = (this.io16[0x024 >> 1] << 16) >> 16;

    let curX = this.bgRefX[0];
    let curY = this.bgRefY[0];

    const pageBase = ((mode === 4 || mode === 5) && (dispcnt & 0x0010)) ? 0xA000 : 0;
    const srcW = (mode === 5) ? 160 : 240;
    const srcH = (mode === 5) ? 128 : 160;

    const dstCol = this.lineBgColor[2];
    const dstVal = this.lineBgValid[2];

    for (let x = 0; x < 240; x++) {
      if (isMos && (x % bgMosH) !== 0) {
        dstCol[x] = dstCol[x - 1];
        dstVal[x] = dstVal[x - 1];
        curX = (curX + pa) | 0;
        curY = (curY + pc) | 0;
        continue;
      }

      let px = curX >> 8;
      let py = curY >> 8;
      curX = (curX + pa) | 0;
      curY = (curY + pc) | 0;

      if (wrap) {
        px = ((px % srcW) + srcW) % srcW;
        py = ((py % srcH) + srcH) % srcH;
      } else if (px < 0 || px >= srcW || py < 0 || py >= srcH) {
        continue;
      }

      if (mode === 3) {
        const addr = (py * 240 + px) << 1;
        dstCol[x] = this.vram16[addr >>> 1];
        dstVal[x] = 1;
      } else if (mode === 4) {
        const addr = pageBase + py * 240 + px;
        const palIdx = this.vram[addr];
        if (palIdx !== 0) {
          dstCol[x] = this.pal16[palIdx];
          dstVal[x] = 1;
        }
      } else if (mode === 5) {
        const addr = pageBase + ((py * 160 + px) << 1);
        dstCol[x] = this.vram16[addr >>> 1];
        dstVal[x] = 1;
      }
    }
  }

  renderSpritesScanline(y, dispcnt, mode, objMosH, objMosV) {
    const is1D = (dispcnt & 0x0040) !== 0;
    const dims = [
      [[8,8], [16,16], [32,32], [64,64]],
      [[16,8], [32,8], [32,16], [64,32]],
      [[8,16], [8,32], [16,32], [32,64]]
    ];

    for (let i = 0; i < 128; i++) {
      const oamBase = i * 4;
      const attr0 = this.oam16[oamBase];
      const objMode = (attr0 >>> 8) & 3;
      if (objMode === 2) continue;

      const shape = (attr0 >>> 14) & 3;
      if (shape === 3) continue;

      const attr1 = this.oam16[oamBase + 1];
      const attr2 = this.oam16[oamBase + 2];

      const size = (attr1 >>> 14) & 3;
      const w = dims[shape][size][0];
      const h = dims[shape][size][1];

      const isAffine = (objMode === 1 || objMode === 3);
      const boxW = (objMode === 3) ? (w << 1) : w;
      const boxH = (objMode === 3) ? (h << 1) : h;

      let sprY = attr0 & 0xFF;
      if (sprY >= 160 && (sprY + boxH) > 256) sprY -= 256;

      const isMos = (attr0 & 0x1000) !== 0;
      const effY  = isMos ? (y - (y % objMosV)) : y;
      const localY = effY - sprY;
      if (localY < 0 || localY >= boxH) continue;

      let sprX = attr1 & 0x1FF;
      if (sprX >= 240) sprX -= 512;

      const is8bpp  = (attr0 & 0x2000) !== 0;
      const gfxMode = (attr0 >>> 10) & 3;
      const tileBase= attr2 & 0x3FF;
      const prio    = (attr2 >>> 10) & 3;
      const palBank = (attr2 >>> 12) & 0xF;

      if (mode >= 3 && tileBase < 512) continue;

      let pa = 256, pb = 0, pc = 0, pd = 256;
      if (isAffine) {
        const affIdx = (attr1 >>> 9) & 0x1F;
        const pBase  = affIdx * 16;
        pa = (this.oam16[pBase + 3] << 16) >> 16;
        pb = (this.oam16[pBase + 7] << 16) >> 16;
        pc = (this.oam16[pBase + 11] << 16) >> 16;
        pd = (this.oam16[pBase + 15] << 16) >> 16;
      }

      const halfW = boxW >> 1;
      const halfH = boxH >> 1;
      const dy = localY - halfH;

      for (let lx = 0; lx < boxW; lx++) {
        const screenX = sprX + lx;
        if (screenX < 0 || screenX >= 240) continue;

        let texX = 0, texY = 0;
        if (isAffine) {
          const dx = lx - halfW;
          texX = ((pa * dx + pb * dy) >> 8) + (w >> 1);
          texY = ((pc * dx + pd * dy) >> 8) + (h >> 1);
          if (texX < 0 || texX >= w || texY < 0 || texY >= h) continue;
        } else {
          const flipH = (attr1 & 0x1000) !== 0;
          const flipV = (attr1 & 0x2000) !== 0;
          texX = flipH ? (w - 1 - lx) : lx;
          texY = flipV ? (h - 1 - localY) : localY;
        }

        const tileX = texX >>> 3;
        const tileY = texY >>> 3;
        const inX   = texX & 7;
        const inY   = texY & 7;

        let tileNum = 0;
        if (is1D) {
          const tilesPerRow = w >>> 3;
          const offsetTiles = tileY * tilesPerRow + tileX;
          tileNum = tileBase + (is8bpp ? (offsetTiles << 1) : offsetTiles);
        } else {
          tileNum = (tileBase + tileY * 32 + (is8bpp ? (tileX << 1) : tileX)) & 0x3FF;
        }

        if (mode >= 3 && tileNum < 512) continue;

        let palIdx = 0;
        if (is8bpp) {
          const addr = 0x10000 + ((tileNum & 0x3FE) * 32) + inY * 8 + inX;
          if (addr < 0x18000) palIdx = this.vram[addr];
        } else {
          const addr = 0x10000 + (tileNum * 32) + inY * 4 + (inX >>> 1);
          if (addr < 0x18000) {
            const b = this.vram[addr];
            const nib = (inX & 1) ? (b >>> 4) : (b & 0xF);
            if (nib !== 0) palIdx = (palBank << 4) | nib;
          }
        }

        if (palIdx !== 0) {
          if (gfxMode === 2) {
            this.lineObjWin[screenX] = 1;
          } else if (prio < this.lineObjPrio[screenX]) {
            this.lineObjColor[screenX] = this.pal16[0x100 + palIdx];
            this.lineObjPrio[screenX]  = prio;
            this.lineObjSemi[screenX]  = (gfxMode === 1) ? 1 : 0;
          }
        }
      }
    }
  }

  // ==========================================================================
  // Frame & Scanline Scheduler + Sound Mixer (PSG 1-4 + Wave RAM + FIFO A/B)
  // ==========================================================================

  runFrame() {
    if (this.cheats.length > 0) {
      this.applyCheats();
    }
    for (let line = 0; line < 228; line++) {
      this.vcount = line;
      this.io16[0x006 >> 1] = line;

      let dispstat = this.io16[0x004 >> 1];
      const lyc = (dispstat >>> 8) & 0xFF;
      if (line === lyc) {
        dispstat |= 0x0004;
        if (dispstat & 0x0020) this.requestIrq(IRQ_VCOUNT);
      } else {
        dispstat &= ~0x0004;
      }

      if (line === 160) {
        dispstat |= 0x0001;
        this.io16[0x004 >> 1] = dispstat;
        if (dispstat & 0x0008) this.requestIrq(IRQ_VBLANK);
        this.iwram16[0x7FF8 >> 1] |= IRQ_VBLANK;
        this.triggerDmaTiming(1);
        this.bgRefX[0] = (this.io32[0x028 >> 2] << 4) >> 4;
        this.bgRefY[0] = (this.io32[0x02C >> 2] << 4) >> 4;
        this.bgRefX[1] = (this.io32[0x038 >> 2] << 4) >> 4;
        this.bgRefY[1] = (this.io32[0x03C >> 2] << 4) >> 4;
      } else if (line === 227) {
        dispstat &= ~0x0001;
      }
      this.io16[0x004 >> 1] = dispstat & ~0x0002;

      this.runCycles(960);

      if (line < 160) {
        this.renderScanline(line);
      }

      dispstat = this.io16[0x004 >> 1] | 0x0002;
      this.io16[0x004 >> 1] = dispstat;
      if (dispstat & 0x0010) this.requestIrq(IRQ_HBLANK);
      if (line < 160) {
        this.triggerDmaTiming(2);
      }

      this.runCycles(272);
      this.sampleAudioScanline();
    }
  }

  runCycles(targetCycles) {
    let rem = targetCycles;
    while (rem > 0) {
      if (this.dmaCyclesStall > 0) {
        const stall = (this.dmaCyclesStall < rem) ? this.dmaCyclesStall : rem;
        this.dmaCyclesStall -= stall;
        this.stepTimers(stall);
        this.cycles += stall;
        rem -= stall;
        if (rem <= 0) break;
      }
      if (this.halted) {
        this.stepTimers(rem);
        this.cycles += rem;
        break;
      }
      const c = this.stepInstruction();
      this.stepTimers(c);
      this.cycles += c;
      rem -= c;
    }
  }

  // Step 512 Hz PSG Frame Sequencer (Length @ 256Hz, Sweep @ 128Hz, Envelope @ 64Hz)
  stepPsgFrameSequencer() {
    this.psgFrameSeqSub += 1232;
    if (this.psgFrameSeqSub < 32768) return;
    this.psgFrameSeqSub -= 32768;

    const step = this.psgFrameSeqStep & 7;
    this.psgFrameSeqStep = (step + 1) & 7;

    // 256 Hz: Length counters (steps 0, 2, 4, 6)
    if ((step & 1) === 0) {
      const lenRegs = [0x064, 0x06C, 0x074, 0x07C];
      for (let c = 0; c < 4; c++) {
        if (this.psgEnabled[c] && (this.io16[lenRegs[c] >> 1] & 0x4000)) {
          if (this.psgLen[c] > 0) {
            this.psgLen[c]--;
            if (this.psgLen[c] === 0) {
              this.psgEnabled[c] = 0;
            }
          }
        }
      }
    }

    // 128 Hz: Channel 1 Frequency Sweep (steps 2, 6)
    if (step === 2 || step === 6) {
      if (this.psgEnabled[0]) {
        const cntL = this.io16[0x060 >> 1];
        const sweepTime = (cntL >>> 4) & 7;
        const shift = cntL & 7;
        if (sweepTime > 0 && shift > 0) {
          this.psgSweepTimer--;
          if (this.psgSweepTimer <= 0) {
            this.psgSweepTimer = sweepTime;
            const delta = this.psgFreq[0] >>> shift;
            const nextFreq = (cntL & 0x0008) ? (this.psgFreq[0] - delta) : (this.psgFreq[0] + delta);
            if (nextFreq > 2047) {
              this.psgEnabled[0] = 0;
            } else if (nextFreq >= 0) {
              this.psgFreq[0] = nextFreq;
              this.io16[0x064 >> 1] = (this.io16[0x064 >> 1] & ~0x7FF) | (nextFreq & 0x7FF);
            }
          }
        }
      }
    }

    // 64 Hz: Volume Envelopes on Channels 1, 2, 4 (step 7)
    if (step === 7) {
      const envRegs = [0x062, 0x068, 0, 0x078];
      for (const c of [0, 1, 3]) {
        if (!this.psgEnabled[c]) continue;
        const reg = this.io16[envRegs[c] >> 1];
        const period = (reg >>> 8) & 7;
        if (period > 0) {
          this.psgEnvTimer[c]--;
          if (this.psgEnvTimer[c] <= 0) {
            this.psgEnvTimer[c] = period;
            const dirUp = (reg & 0x0800) !== 0;
            if (dirUp && this.psgVol[c] < 15) this.psgVol[c]++;
            else if (!dirUp && this.psgVol[c] > 0) this.psgVol[c]--;
          }
        }
      }
    }
  }

  sampleAudioScanline() {
    const sndCntX = this.io16[0x084 >> 1];
    if (!(sndCntX & 0x0080)) {
      this.pushAudioSample(0, 0);
      this.pushAudioSample(0, 0);
      return;
    }

    this.stepPsgFrameSequencer();

    const sndCntL = this.io16[0x080 >> 1];
    const sndCntH = this.io16[0x082 >> 1];

    // Direct Sound FIFO A & B
    const volA = (sndCntH & 0x0004) ? 1.0 : 0.5;
    const volB = (sndCntH & 0x0008) ? 1.0 : 0.5;
    const sampA = (this.fifoALatch / 128.0) * volA;
    const sampB = (this.fifoBLatch / 128.0) * volB;

    const duties = [0.125, 0.25, 0.5, 0.75];
    let psgL = 0, psgR = 0;

    // Channel 1 (Square 1 + Sweep + Envelope)
    const ch1Freq = (this.psgFreq[0] || (this.io16[0x064 >> 1] & 0x7FF));
    const ch1Vol  = this.psgEnabled[0] ? this.psgVol[0] : ((this.io16[0x062 >> 1] >>> 12) & 0xF);
    if (ch1Vol > 0 && ch1Freq < 2046) {
      const duty = duties[(this.io16[0x062 >> 1] >>> 6) & 3];
      const hz = 131072 / (2048 - ch1Freq);
      this.psgPhase[0] = (this.psgPhase[0] + hz / 13620) % 1.0;
      const s = (this.psgPhase[0] < duty ? 1 : -1) * (ch1Vol / 15) * 0.15;
      if (sndCntL & 0x1000) psgL += s;
      if (sndCntL & 0x0100) psgR += s;
    }

    // Channel 2 (Square 2 + Envelope)
    const ch2Freq = this.io16[0x06C >> 1] & 0x7FF;
    const ch2Vol  = this.psgEnabled[1] ? this.psgVol[1] : ((this.io16[0x068 >> 1] >>> 12) & 0xF);
    if (ch2Vol > 0 && ch2Freq < 2046) {
      const duty = duties[(this.io16[0x068 >> 1] >>> 6) & 3];
      const hz = 131072 / (2048 - ch2Freq);
      this.psgPhase[1] = (this.psgPhase[1] + hz / 13620) % 1.0;
      const s = (this.psgPhase[1] < duty ? 1 : -1) * (ch2Vol / 15) * 0.15;
      if (sndCntL & 0x2000) psgL += s;
      if (sndCntL & 0x0200) psgR += s;
    }

    // Channel 3 (Wave RAM: 2 banks of 32 4-bit nibbles, 32 or 64 sample mode)
    const ch3CntL = this.io16[0x070 >> 1];
    if ((ch3CntL & 0x0080) && this.psgEnabled[2]) {
      const ch3CntH = this.io16[0x072 >> 1];
      const ch3Freq = this.io16[0x074 >> 1] & 0x7FF;
      const volCode = (ch3CntH >>> 13) & 3;
      const force75 = (ch3CntH & 0x8000) !== 0;
      const volMul  = force75 ? 0.75 : ([0.0, 1.0, 0.5, 0.25][volCode]);
      if (volMul > 0 && ch3Freq < 2046) {
        const is64 = (ch3CntL & 0x0020) !== 0;
        const bank = (ch3CntL >>> 6) & 1;
        const numSamples = is64 ? 64 : 32;
        const sampleRate = 2097152 / (2048 - ch3Freq);
        this.psgPhase[2] = (this.psgPhase[2] + sampleRate / 13620) % numSamples;
        const sampIdx = this.psgPhase[2] | 0;
        const byteIdx = is64 ? (sampIdx >>> 1) : ((bank << 4) | (sampIdx >>> 1));
        const byteVal = this.waveRam[byteIdx & 31];
        const nib = (sampIdx & 1) ? (byteVal & 0xF) : (byteVal >>> 4);
        const s = ((nib - 7.5) / 7.5) * volMul * 0.18;
        if (sndCntL & 0x4000) psgL += s;
        if (sndCntL & 0x0400) psgR += s;
      }
    }

    // Channel 4 (LFSR Noise: 7-bit or 15-bit)
    const ch4Vol = this.psgEnabled[3] ? this.psgVol[3] : ((this.io16[0x078 >> 1] >>> 12) & 0xF);
    if (ch4Vol > 0 && (this.psgEnabled[3] || (this.io16[0x07C >> 1] & 0x8000))) {
      const is7Bit = (this.io16[0x07C >> 1] & 0x0008) !== 0;
      const bit = (this.psgLfsr ^ (this.psgLfsr >>> 1)) & 1;
      this.psgLfsr = (this.psgLfsr >>> 1) | (bit << (is7Bit ? 6 : 14));
      const s = ((this.psgLfsr & 1) ? 1 : -1) * (ch4Vol / 15) * 0.1;
      if (sndCntL & 0x8000) psgL += s;
      if (sndCntL & 0x0800) psgR += s;
    }

    // PSG master volume & ratio (SOUNDCNT_L bits 0..2 / 4..6 & SOUNDCNT_H bits 0..1)
    const psgRatio = [0.25, 0.5, 1.0, 1.0][sndCntH & 3];
    const masR = (((sndCntL & 7) + 1) / 8.0) * psgRatio;
    const masL = ((((sndCntL >>> 4) & 7) + 1) / 8.0) * psgRatio;
    let outL = psgL * masL;
    let outR = psgR * masR;

    if (sndCntH & 0x0200) outL += sampA * 0.5;
    if (sndCntH & 0x0100) outR += sampA * 0.5;
    if (sndCntH & 0x2000) outL += sampB * 0.5;
    if (sndCntH & 0x1000) outR += sampB * 0.5;

    // SOUNDBIAS (0x04000088) amplitude resolution quantization (9/8/7/6-bit)
    const sndBias = this.io16[0x088 >> 1];
    const resMode = (sndBias >>> 14) & 3;
    const steps = [512, 256, 128, 64][resMode];
    outL = Math.round(Math.max(-1, Math.min(1, outL)) * steps) / steps;
    outR = Math.round(Math.max(-1, Math.min(1, outR)) * steps) / steps;

    this.pushAudioSample(outL, outR);
    this.pushAudioSample(outL, outR);
  }

  pushAudioSample(l, r) {
    const next = (this.audioWritePos + 1) & 8191;
    if (next !== this.audioReadPos) {
      this.audioRingL[this.audioWritePos] = l;
      this.audioRingR[this.audioWritePos] = r;
      this.audioWritePos = next;
    }
  }

  // ==========================================================================
  // Tier 3: Cheat Engine (Raw ADDR:VAL & CodeBreaker 3xxxxxxx/8xxxxxxx)
  // ==========================================================================

  addCheat(codeStr, desc) {
    const clean = String(codeStr || '').trim().toUpperCase();
    if (!clean) return null;
    let addr = 0, val = 0, width = 1;
    if (clean.indexOf(':') !== -1) {
      const parts = clean.split(':');
      addr = parseInt(parts[0], 16) >>> 0;
      val  = parseInt(parts[1], 16) >>> 0;
      width = (parts[1].length > 4) ? 4 : ((parts[1].length > 2) ? 2 : 1);
    } else {
      const parts = clean.split(/\s+/);
      if (parts.length >= 2) {
        const w1 = parseInt(parts[0], 16) >>> 0;
        const w2 = parseInt(parts[1], 16) >>> 0;
        const cmd = (w1 >>> 28) & 0xF;
        addr = w1 & 0x0FFFFFFF;
        val  = w2;
        width = (cmd === 8) ? 2 : ((cmd === 3) ? 1 : 4);
      } else {
        return null;
      }
    }
    const entry = { code: clean, desc: desc || clean, enabled: true, addr, val, width };
    this.cheats.push(entry);
    return entry;
  }

  clearCheats() {
    this.cheats = [];
  }

  applyCheats() {
    const savedMem = this.memCycles;
    for (let i = 0; i < this.cheats.length; i++) {
      const ch = this.cheats[i];
      if (!ch.enabled) continue;
      if (ch.width === 1) this.write8(ch.addr, ch.val & 0xFF);
      else if (ch.width === 2) this.write16(ch.addr, ch.val & 0xFFFF);
      else this.write32(ch.addr, ch.val >>> 0);
    }
    this.memCycles = savedMem;
  }

  // ==========================================================================
  // Save States (.1337state) & ARM/Thumb Disassembler
  // ==========================================================================

  serializeState() {
    return JSON.stringify({
      magic: '1337STATE_V1',
      romCrc32: this.romCrc32,
      r: Array.from(this.r),
      cpsr: this.cpsr,
      bankUsr: Array.from(this.bankUsr),
      bankFiq: Array.from(this.bankFiq),
      bankIrq: Array.from(this.bankIrq),
      bankSvc: Array.from(this.bankSvc),
      bankAbt: Array.from(this.bankAbt),
      bankUnd: Array.from(this.bankUnd),
      spsrIrq: this.spsrIrq,
      spsrSvc: this.spsrSvc,
      spsrFiq: this.spsrFiq,
      spsrAbt: this.spsrAbt,
      spsrUnd: this.spsrUnd,
      halted: this.halted,
      vcount: this.vcount,
      biosLastFetch: this.biosLastFetch,
      inIntrWaitMask: this.inIntrWaitMask,
      saveType: this.saveType,
      flashBank: this.flashBank,
      flashStage: this.flashStage,
      flashCmd: this.flashCmd,
      flashIdMode: this.flashIdMode,
      flashEraseMode: this.flashEraseMode,
      eepromAddrBits: this.eepromAddrBits,
      bgRefX: Array.from(this.bgRefX),
      bgRefY: Array.from(this.bgRefY),
      timerVal: Array.from(this.timerVal),
      timerReload: Array.from(this.timerReload),
      timerCnt: Array.from(this.timerCnt),
      dmaSrc: Array.from(this.dmaSrc),
      dmaDst: Array.from(this.dmaDst),
      dmaCount: Array.from(this.dmaCount),
      dmaCnt: Array.from(this.dmaCnt),
      ewram: uint8ToBase64(this.ewram),
      iwram: uint8ToBase64(this.iwram),
      io: uint8ToBase64(this.io),
      pal: uint8ToBase64(this.pal),
      vram: uint8ToBase64(this.vram),
      oam: uint8ToBase64(this.oam),
      sram: uint8ToBase64(this.sram),
      flash: (this.saveType === 'FLASH64' || this.saveType === 'FLASH128') ? uint8ToBase64(this.flash) : '',
      eeprom: (this.saveType === 'EEPROM' || this.eepromUsed) ? uint8ToBase64(this.eeprom) : ''
    });
  }

  deserializeState(jsonStr) {
    const st = (typeof jsonStr === 'string') ? JSON.parse(jsonStr) : jsonStr;
    if (!st || st.magic !== '1337STATE_V1') throw new Error('Invalid .1337state file');
    this.r.set(st.r);
    this.cpsr = st.cpsr;
    this.pipePc = -1;
    this.bankUsr.set(st.bankUsr);
    this.bankFiq.set(st.bankFiq);
    this.bankIrq.set(st.bankIrq);
    this.bankSvc.set(st.bankSvc);
    this.bankAbt.set(st.bankAbt);
    this.bankUnd.set(st.bankUnd);
    this.spsrIrq = st.spsrIrq;
    this.spsrSvc = st.spsrSvc;
    this.spsrFiq = st.spsrFiq;
    this.spsrAbt = st.spsrAbt;
    this.spsrUnd = st.spsrUnd;
    this.halted = !!st.halted;
    this.vcount = st.vcount | 0;
    if (st.biosLastFetch !== undefined) this.biosLastFetch = st.biosLastFetch >>> 0;
    if (st.inIntrWaitMask !== undefined) this.inIntrWaitMask = st.inIntrWaitMask | 0;
    if (st.saveType) this.saveType = st.saveType;
    if (st.flashBank !== undefined) this.flashBank = st.flashBank | 0;
    if (st.flashStage !== undefined) this.flashStage = st.flashStage | 0;
    if (st.flashCmd !== undefined) this.flashCmd = st.flashCmd | 0;
    if (st.flashIdMode !== undefined) this.flashIdMode = !!st.flashIdMode;
    if (st.flashEraseMode !== undefined) this.flashEraseMode = !!st.flashEraseMode;
    if (st.eepromAddrBits !== undefined) this.eepromAddrBits = st.eepromAddrBits | 0;
    this.bgRefX.set(st.bgRefX);
    this.bgRefY.set(st.bgRefY);
    this.timerVal.set(st.timerVal);
    this.timerReload.set(st.timerReload);
    this.timerCnt.set(st.timerCnt);
    this.dmaSrc.set(st.dmaSrc);
    this.dmaDst.set(st.dmaDst);
    this.dmaCount.set(st.dmaCount);
    this.dmaCnt.set(st.dmaCnt);
    this.ewram.set(base64ToUint8(st.ewram));
    this.iwram.set(base64ToUint8(st.iwram));
    this.io.set(base64ToUint8(st.io));
    this.pal.set(base64ToUint8(st.pal));
    this.vram.set(base64ToUint8(st.vram));
    this.oam.set(base64ToUint8(st.oam));
    this.sram.set(base64ToUint8(st.sram));
    if (st.flash) this.flash.set(base64ToUint8(st.flash));
    if (st.eeprom) this.eeprom.set(base64ToUint8(st.eeprom));
    this.updateWaitstates(this.io16[0x204 >> 1] & 0x7FFF);
  }

  disassembleAt(addr, isThumb) {
    addr >>>= 0;
    const savedMem = this.memCycles;
    const hex = (n, w) => (n >>> 0).toString(16).toUpperCase().padStart(w, '0');
    let res = '';
    if (isThumb) {
