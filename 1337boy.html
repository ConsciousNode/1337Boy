              this.r[13] = (this.r[13] + 0x40) | 0;
            } else {
              this.r[13] = (this.r[13] - 0x40) | 0;
              this.write32(this.r[13] >>> 0, (this.r[15] + 2) | 0);
            }
            return 3;
          }

          let sp = this.r[13] >>> 0;
          if (isPop) {
            for (let i = 0; i < 8; i++) {
              if (rlist & (1 << i)) {
                this.r[i] = this.read32Aligned(sp) | 0;
                sp = (sp + 4) >>> 0;
              }
            }
            if (pclr) {
              this.r[15] = (this.read32Aligned(sp) & ~1) | 0;
              sp = (sp + 4) >>> 0;
            }
            this.r[13] = sp | 0;
            return 3;
          } else {
            let count = pclr ? 1 : 0;
            for (let i = 0; i < 8; i++) if (rlist & (1 << i)) count++;
            sp = (sp - (count << 2)) >>> 0;
            this.r[13] = sp | 0;
            for (let i = 0; i < 8; i++) {
              if (rlist & (1 << i)) {
                this.write32(sp, this.r[i]);
                sp = (sp + 4) >>> 0;
              }
            }
            if (pclr) {
              this.write32(sp, this.r[14]);
            }
            return 2;
          }
        }
      }
    }

    if (top3 === 6) {
      if ((instr & 0x1000) === 0) {
        // Format 15: Multiple Load / Store (LDMIA / STMIA Rb!, {Rlist})
        const isLoad = (instr & 0x0800) !== 0;
        const rb     = (instr >>> 8) & 7;
        const rlist  = instr & 0xFF;
        let addr     = this.r[rb] >>> 0;

        if (rlist === 0) {
          // Empty rlist edge case in Thumb LDMIA/STMIA
          if (isLoad) {
            this.r[15] = (this.read32Aligned(addr) & ~1) | 0;
          } else {
            this.write32(addr, (this.r[15] + 2) | 0);
          }
          this.r[rb] = (addr + 0x40) | 0;
          return 3;
        }

        let count = 0;
        for (let i = 0; i < 8; i++) if (rlist & (1 << i)) count++;
        const newBase = (addr + (count << 2)) >>> 0;

        if (isLoad) {
          if (!(rlist & (1 << rb))) {
            this.r[rb] = newBase | 0;
          }
          for (let i = 0; i < 8; i++) {
            if (rlist & (1 << i)) {
              this.r[i] = this.read32Aligned(addr) | 0;
              addr = (addr + 4) >>> 0;
            }
          }
          return 3;
        } else {
          const lowestBit = rlist & -rlist;
          const rbIsFirst = (lowestBit === (1 << rb));
          for (let i = 0; i < 8; i++) {
            if (rlist & (1 << i)) {
              const val = (i === rb && !rbIsFirst) ? (newBase | 0) : this.r[i];
              this.write32(addr, val);
              addr = (addr + 4) >>> 0;
            }
          }
          this.r[rb] = newBase | 0;
          return 2;
        }
      } else {
        // Format 16: Conditional branch & Format 17: SWI
        const cond = (instr >>> 8) & 0xF;
        if (cond === 0xF) {
          // Format 17: Thumb SWI
          this.handleSwi(instr & 0xFF);
          return 3;
        }
        if (cond === 0xE) return 1;
        if (this.checkCond(cond)) {
          const offset = ((instr << 24) >> 23); // Sign-extend 8-bit * 2
          this.r[15] = ((pc + 4 + offset) & ~1) | 0;
          return 3;
        }
        return 1;
      }
    }

    if (top3 === 7) {
      const sub = (instr >>> 11) & 3;
      if (sub === 0) {
        // Format 18: Unconditional branch B label
        const offset = ((instr << 21) >> 20); // Sign-extend 11-bit * 2
        this.r[15] = ((pc + 4 + offset) & ~1) | 0;
        return 3;
      } else if (sub === 2) {
        // Format 19 (first instruction): BL prefix (H=10) -> LR = PC + 4 + (imm11 << 12)
        const offset = ((instr << 21) >> 9); // Sign-extend 11-bit << 12
        this.r[14] = (pc + 4 + offset) | 0;
        return 1;
      } else if (sub === 3) {
        // Format 19 (second instruction): BL suffix (H=11) -> PC = LR + (imm11 << 1), LR = next_instr | 1
        const offset = (instr & 0x7FF) << 1;
        const nextLr = (pc + 2) | 1;
        this.r[15] = ((this.r[14] + offset) & ~1) | 0;
        this.r[14] = nextLr | 0;
        return 3;
      }
    }

    return 1;
  }

  // ==========================================================================
  // PPU Scanline Renderer (Modes 0..5, Affine BGs, Sprites, Windows, Blending)
  // ==========================================================================

  renderScanline(y) {
    const dispcnt = this.io16[0x000 >> 1];
    const rowBase = y * 240;

    // Forced blank (bit 7): fill scanline with white
    if (dispcnt & 0x0080) {
      for (let x = 0; x < 240; x++) {
        this.fb32[rowBase + x] = 0xFFFFFFFF;
      }
      return;
    }

    const mode = dispcnt & 7;
    const mosaicReg = this.io16[0x04C >> 1];
    const bgMosH = (mosaicReg & 0xF) + 1;
    const bgMosV = ((mosaicReg >>> 4) & 0xF) + 1;
    const objMosH = ((mosaicReg >>> 8) & 0xF) + 1;
    const objMosV = ((mosaicReg >>> 12) & 0xF) + 1;

    // Clear scanline layer buffers
    for (let b = 0; b < 4; b++) {
      this.lineBgValid[b].fill(0);
    }
    this.lineObjPrio.fill(4); // 4 = transparent / no sprite
    this.lineObjSemi.fill(0);
    this.lineObjWin.fill(0);
    this.lineObjMosaic.fill(0);

    // Render Sprites if OBJ enabled (bit 12)
    if (dispcnt & 0x1000) {
      this.renderSpritesScanline(y, dispcnt, mode, objMosH, objMosV);
    }

    // Render Backgrounds according to Video Mode (0..5)
    if (mode === 0) {
      if (dispcnt & 0x0100) this.renderTextBgScanline(0, y, bgMosH, bgMosV);
      if (dispcnt & 0x0200) this.renderTextBgScanline(1, y, bgMosH, bgMosV);
      if (dispcnt & 0x0400) this.renderTextBgScanline(2, y, bgMosH, bgMosV);
      if (dispcnt & 0x0800) this.renderTextBgScanline(3, y, bgMosH, bgMosV);
    } else if (mode === 1) {
      if (dispcnt & 0x0100) this.renderTextBgScanline(0, y, bgMosH, bgMosV);
      if (dispcnt & 0x0200) this.renderTextBgScanline(1, y, bgMosH, bgMosV);
      if (dispcnt & 0x0400) this.renderAffineBgScanline(2, y, bgMosH);
    } else if (mode === 2) {
      if (dispcnt & 0x0400) this.renderAffineBgScanline(2, y, bgMosH);
      if (dispcnt & 0x0800) this.renderAffineBgScanline(3, y, bgMosH);
    } else if (mode === 3) {
      if (dispcnt & 0x0400) this.renderBitmapBgScanline(y, 3, dispcnt, bgMosH);
    } else if (mode === 4) {
      if (dispcnt & 0x0400) this.renderBitmapBgScanline(y, 4, dispcnt, bgMosH);
    } else if (mode === 5) {
      if (dispcnt & 0x0400) this.renderBitmapBgScanline(y, 5, dispcnt, bgMosH);
    }

    // Composite priorities, Windows (WIN0, WIN1, OBJWIN), and Color Special Effects (BLDCNT)
    const win0On  = (dispcnt & 0x2000) !== 0;
    const win1On  = (dispcnt & 0x4000) !== 0;
    const objWinOn= (dispcnt & 0x8000) !== 0;
    const anyWin  = win0On || win1On || objWinOn;

    const winin  = this.io16[0x048 >> 1];
    const winout = this.io16[0x04A >> 1];

    const win0H = this.io16[0x040 >> 1];
    const win1H = this.io16[0x042 >> 1];
    const win0V = this.io16[0x044 >> 1];
    const win1V = this.io16[0x046 >> 1];

    const w0y1 = win0V >>> 8, w0y2 = win0V & 0xFF;
    const w1y1 = win1V >>> 8, w1y2 = win1V & 0xFF;
    const inWin0Y = win0On && ((w0y1 <= w0y2) ? (y >= w0y1 && y < w0y2) : (y >= w0y1 || y < w0y2));
    const inWin1Y = win1On && ((w1y1 <= w1y2) ? (y >= w1y1 && y < w1y2) : (y >= w1y1 || y < w1y2));
    const w0x1 = win0H >>> 8, w0x2 = win0H & 0xFF;
    const w1x1 = win1H >>> 8, w1x2 = win1H & 0xFF;

    const bldcnt   = this.io16[0x050 >> 1];
    const bldalpha = this.io16[0x052 >> 1];
    const bldy     = this.io16[0x054 >> 1];
    const bldMode  = (bldcnt >>> 6) & 3;
    const eva = Math.min(16, bldalpha & 0x1F);
    const evb = Math.min(16, (bldalpha >>> 8) & 0x1F);
    const evy = Math.min(16, bldy & 0x1F);

    // Enabled BGs sorted by priority (0..3) then BG index (0..3)
    const bgEnMask = (dispcnt >>> 8) & 0xF;
    const bgPrios = [
      this.io16[0x008 >> 1] & 3,
      this.io16[0x00A >> 1] & 3,
      this.io16[0x00C >> 1] & 3,
      this.io16[0x00E >> 1] & 3
    ];

    const backdrop = this.pal16[0];

    for (let x = 0; x < 240; x++) {
      let winMask = 0x3F; // Bits 0-3=BG0-3, Bit 4=OBJ, Bit 5=ColorSFX
      if (anyWin) {
        const inW0 = inWin0Y && ((w0x1 <= w0x2) ? (x >= w0x1 && x < w0x2) : (x >= w0x1 || x < w0x2));
        const inW1 = inWin1Y && ((w1x1 <= w1x2) ? (x >= w1x1 && x < w1x2) : (x >= w1x1 || x < w1x2));
        if (inW0) {
          winMask = winin & 0x3F;
        } else if (inW1) {
          winMask = (winin >>> 8) & 0x3F;
        } else if (objWinOn && this.lineObjWin[x]) {
          winMask = (winout >>> 8) & 0x3F;
        } else {
          winMask = winout & 0x3F;
        }
      }

      // Find top1 and top2 layers at pixel x
      // Layer IDs: 0=BG0, 1=BG1, 2=BG2, 3=BG3, 4=OBJ, 5=Backdrop
      let top1Color = backdrop, top1Layer = 5, top1Prio = 4;
      let top2Color = backdrop, top2Layer = 5, top2Prio = 4;

      const objPrio = this.lineObjPrio[x];
      const objValid = (objPrio < 4) && ((winMask & 0x10) !== 0);

      // Iterate priority levels 0..3
      for (let prio = 0; prio < 4; prio++) {
        // Sprites at this priority come BEFORE backgrounds at the same priority!
        if (objValid && objPrio === prio) {
          if (top1Layer === 5) {
            top1Layer = 4; top1Color = this.lineObjColor[x]; top1Prio = prio;
          } else if (top2Layer === 5) {
            top2Layer = 4; top2Color = this.lineObjColor[x]; top2Prio = prio;
          }
        }
        for (let b = 0; b < 4; b++) {
          if ((bgEnMask & (1 << b)) && (winMask & (1 << b)) && bgPrios[b] === prio && this.lineBgValid[b][x]) {
            if (top1Layer === 5) {
              top1Layer = b; top1Color = this.lineBgColor[b][x]; top1Prio = prio;
            } else if (top2Layer === 5) {
              top2Layer = b; top2Color = this.lineBgColor[b][x]; top2Prio = prio;
              break;
            }
          }
        }
        if (top1Layer !== 5 && top2Layer !== 5) break;
      }

      let outColor = top1Color;
      const isSemiObj = (top1Layer === 4) && (this.lineObjSemi[x] !== 0);
      const sfxAllowed = (winMask & 0x20) !== 0;
      const isTarget1 = (bldcnt & (1 << top1Layer)) !== 0;
      const isTarget2 = (bldcnt & (1 << (8 + top2Layer))) !== 0;

      if (isSemiObj && isTarget2) {
        // Semi-transparent sprite forces alpha blend with 2nd target regardless of SFX enable bit
        outColor = this.blendColors(top1Color, top2Color, eva, evb);
      } else if (sfxAllowed && isTarget1) {
        if (bldMode === 1 && isTarget2) {
          outColor = this.blendColors(top1Color, top2Color, eva, evb);
        } else if (bldMode === 2 || (isSemiObj && bldMode === 2)) {
          // Brightness increase (fade to white)
          let r = top1Color & 0x1F;
          let g = (top1Color >>> 5) & 0x1F;
          let b = (top1Color >>> 10) & 0x1F;
          r += (((31 - r) * evy) >>> 4);
          g += (((31 - g) * evy) >>> 4);
          b += (((31 - b) * evy) >>> 4);
          outColor = r | (g << 5) | (b << 10);
        } else if (bldMode === 3 || (isSemiObj && bldMode === 3)) {
          // Brightness decrease (fade to black)
          let r = top1Color & 0x1F;
          let g = (top1Color >>> 5) & 0x1F;
          let b = (top1Color >>> 10) & 0x1F;
          r -= ((r * evy) >>> 4);
          g -= ((g * evy) >>> 4);
          b -= ((b * evy) >>> 4);
          outColor = r | (g << 5) | (b << 10);
        }
      }

      // Convert BGR555 to 32-bit RGBA (0xAABBGGRR in little-endian Uint32Array)
      const r5 = outColor & 0x1F;
      const g5 = (outColor >>> 5) & 0x1F;
      const b5 = (outColor >>> 10) & 0x1F;
      const r8 = (r5 << 3) | (r5 >>> 2);
      const g8 = (g5 << 3) | (g5 >>> 2);
      const b8 = (b5 << 3) | (b5 >>> 2);
      this.fb32[rowBase + x] = (0xFF000000 | (b8 << 16) | (g8 << 8) | r8) >>> 0;
    }

    // Advance internal affine reference points by PB and PD at end of each visible scanline!
    const pb2 = (this.io16[0x022 >> 1] << 16) >> 16;
    const pd2 = (this.io16[0x026 >> 1] << 16) >> 16;
    const pb3 = (this.io16[0x032 >> 1] << 16) >> 16;
    const pd3 = (this.io16[0x036 >> 1] << 16) >> 16;
    this.bgRefX[0] = (this.bgRefX[0] + pb2) | 0;
    this.bgRefY[0] = (this.bgRefY[0] + pd2) | 0;
    this.bgRefX[1] = (this.bgRefX[1] + pb3) | 0;
    this.bgRefY[1] = (this.bgRefY[1] + pd3) | 0;
  }

  blendColors(c1, c2, eva, evb) {
    const r1 = c1 & 0x1F, g1 = (c1 >>> 5) & 0x1F, b1 = (c1 >>> 10) & 0x1F;
    const r2 = c2 & 0x1F, g2 = (c2 >>> 5) & 0x1F, b2 = (c2 >>> 10) & 0x1F;
    const r = Math.min(31, (r1 * eva + r2 * evb) >>> 4);
    const g = Math.min(31, (g1 * eva + g2 * evb) >>> 4);
    const b = Math.min(31, (b1 * eva + b2 * evb) >>> 4);
    return r | (g << 5) | (b << 10);
  }

  // Regular Text Background (Modes 0 & 1, 4bpp / 8bpp, 256x256, 512x256, 256x512, 512x512)
  renderTextBgScanline(bgIdx, y, bgMosH, bgMosV) {
    const cnt = this.io16[(0x008 + bgIdx * 2) >> 1];
    const isMos = (cnt & 0x0040) !== 0;
    const srcY = isMos ? (y - (y % bgMosV)) : y;

    const charBase = ((cnt >>> 2) & 3) * 0x4000;
    const is8bpp   = (cnt & 0x0080) !== 0;
    const scrBase  = ((cnt >>> 8) & 0x1F) * 0x800;
    const sizeMode = (cnt >>> 14) & 3;

    const hofs = this.io16[(0x010 + bgIdx * 4) >> 1] & 0x1FF;
    const vofs = this.io16[(0x012 + bgIdx * 4) >> 1] & 0x1FF;

    const widthMask  = (sizeMode & 1) ? 511 : 255;
    const heightMask = (sizeMode & 2) ? 511 : 255;

    const ty = (srcY + vofs) & heightMask;
    const tileY = ty >>> 3;
    const inTileY = ty & 7;

    let screenBlockY = 0;
    if (tileY >= 32) {
      screenBlockY = (sizeMode === 3) ? 2 : 1;
    }

    const dstCol = this.lineBgColor[bgIdx];
    const dstVal = this.lineBgValid[bgIdx];

    for (let x = 0; x < 240; x++) {
      if (isMos && (x % bgMosH) !== 0) {
        dstCol[x] = dstCol[x - 1];
        dstVal[x] = dstVal[x - 1];
        continue;
      }
      const tx = (x + hofs) & widthMask;
      const tileX = tx >>> 3;
      const inTileX = tx & 7;

      const screenBlock = screenBlockY + ((tileX >= 32) ? 1 : 0);
      const mapAddr = (scrBase + screenBlock * 0x800 + ((tileY & 31) * 32 + (tileX & 31)) * 2) & 0xFFFF;
      const entry = this.vram16[mapAddr >>> 1];

      const tileNum = entry & 0x3FF;
      const flipH   = (entry & 0x0400) !== 0;
      const flipV   = (entry & 0x0800) !== 0;
      const palBank = (entry >>> 12) & 0xF;

      const px = flipH ? (7 - inTileX) : inTileX;
      const py = flipV ? (7 - inTileY) : inTileY;

      if (is8bpp) {
        const tileAddr = charBase + tileNum * 64 + py * 8 + px;
        if (tileAddr < 0x10000) {
          const palIdx = this.vram[tileAddr];
          if (palIdx !== 0) {
            dstCol[x] = this.pal16[palIdx];
            dstVal[x] = 1;
          }
        }
      } else {
        const tileAddr = charBase + tileNum * 32 + py * 4 + (px >>> 1);
        if (tileAddr < 0x10000) {
          const byteVal = this.vram[tileAddr];
          const nib = (px & 1) ? (byteVal >>> 4) : (byteVal & 0xF);
          if (nib !== 0) {
            dstCol[x] = this.pal16[(palBank << 4) | nib];
            dstVal[x] = 1;
          }
        }
      }
    }
  }

  // Affine Tile Background (Modes 1 & 2, BG2 & BG3, 8bpp, sizes 128..1024, wraparound)
  renderAffineBgScanline(bgIdx, y, bgMosH) {
    const cnt = this.io16[(0x008 + bgIdx * 2) >> 1];
    const isMos    = (cnt & 0x0040) !== 0;
    const charBase = ((cnt >>> 2) & 3) * 0x4000;
    const scrBase  = ((cnt >>> 8) & 0x1F) * 0x800;
    const wrap     = (cnt & 0x2000) !== 0;
    const sizeMode = (cnt >>> 14) & 3;
    const dimTiles = 16 << sizeMode; // 16, 32, 64, 128 tiles
    const dimPx    = dimTiles << 3;  // 128, 256, 512, 1024 px
    const dimMask  = dimPx - 1;

    const affIdx = bgIdx - 2;
    const baseIo = 0x020 + affIdx * 0x10;
    const pa = (this.io16[baseIo >> 1] << 16) >> 16;
    const pc = (this.io16[(baseIo + 4) >> 1] << 16) >> 16;

    let curX = this.bgRefX[affIdx];
    let curY = this.bgRefY[affIdx];

    const dstCol = this.lineBgColor[bgIdx];
    const dstVal = this.lineBgValid[bgIdx];

    for (let x = 0; x < 240; x++) {
      if (isMos && (x % bgMosH) !== 0) {
        dstCol[x] = dstCol[x - 1];
        dstVal[x] = dstVal[x - 1];
        curX = (curX + pa) | 0;
        curY = (curY + pc) | 0;
        continue;
      }

      let px = curX >> 8;
      let py = curY >> 8;
      curX = (curX + pa) | 0;
      curY = (curY + pc) | 0;

      if (wrap) {
        px &= dimMask;
        py &= dimMask;
      } else if (px < 0 || px >= dimPx || py < 0 || py >= dimPx) {
        continue;
      }

      const tileX = px >>> 3;
      const tileY = py >>> 3;
      const mapAddr = (scrBase + tileY * dimTiles + tileX) & 0xFFFF;
      const tileNum = this.vram[mapAddr];
      const tileAddr = charBase + tileNum * 64 + ((py & 7) << 3) + (px & 7);
      if (tileAddr < 0x10000) {
        const palIdx = this.vram[tileAddr];
        if (palIdx !== 0) {
          dstCol[x] = this.pal16[palIdx];
          dstVal[x] = 1;
        }
      }
    }
  }

  // Bitmap Backgrounds (Modes 3, 4, 5 on BG2) WITH Full Affine Matrix & Reference Point Support!
  // Supports stretching e.g. 120x80 by 2x via BG2PA/PD!
  renderBitmapBgScanline(y, mode, dispcnt, bgMosH) {
    const cnt = this.io16[0x00C >> 1]; // BG2CNT
    const isMos = (cnt & 0x0040) !== 0;
    const wrap  = (cnt & 0x2000) !== 0;

    const pa = (this.io16[0x020 >> 1] << 16) >> 16;
    const pc = (this.io16[0x024 >> 1] << 16) >> 16;

    let curX = this.bgRefX[0];
    let curY = this.bgRefY[0];

    const pageBase = ((mode === 4 || mode === 5) && (dispcnt & 0x0010)) ? 0xA000 : 0;
    const srcW = (mode === 5) ? 160 : 240;
    const srcH = (mode === 5) ? 128 : 160;

    const dstCol = this.lineBgColor[2];
    const dstVal = this.lineBgValid[2];

    for (let x = 0; x < 240; x++) {
      if (isMos && (x % bgMosH) !== 0) {
        dstCol[x] = dstCol[x - 1];
        dstVal[x] = dstVal[x - 1];
        curX = (curX + pa) | 0;
        curY = (curY + pc) | 0;
        continue;
      }

      let px = curX >> 8;
      let py = curY >> 8;
      curX = (curX + pa) | 0;
      curY = (curY + pc) | 0;

      if (wrap) {
        px = ((px % srcW) + srcW) % srcW;
        py = ((py % srcH) + srcH) % srcH;
      } else if (px < 0 || px >= srcW || py < 0 || py >= srcH) {
        continue;
      }

      if (mode === 3) {
        const addr = (py * 240 + px) << 1;
        dstCol[x] = this.vram16[addr >>> 1];
        dstVal[x] = 1;
      } else if (mode === 4) {
        const addr = pageBase + py * 240 + px;
        const palIdx = this.vram[addr];
        if (palIdx !== 0) {
          dstCol[x] = this.pal16[palIdx];
          dstVal[x] = 1;
        }
      } else if (mode === 5) {
        const addr = pageBase + ((py * 160 + px) << 1);
        dstCol[x] = this.vram16[addr >>> 1];
        dstVal[x] = 1;
      }
    }
  }

  // Sprite Renderer (Regular & Affine/Double-Size, 1D/2D Mapping, 4bpp/8bpp, Priorities, Bitmap Tile 512+ Rule)
  renderSpritesScanline(y, dispcnt, mode, objMosH, objMosV) {
    const is1D = (dispcnt & 0x0040) !== 0;
    // Sprite Dimension Lookup Table: [shape][size] -> [width, height]
    const dims = [
      [[8,8], [16,16], [32,32], [64,64]], // Square (shape=0)
      [[16,8], [32,8], [32,16], [64,32]], // Horizontal (shape=1)
      [[8,16], [8,32], [16,32], [32,64]]  // Vertical (shape=2)
    ];

    // Iterate all 128 OAM entries in order 0..127 (lower index has higher priority for same prio level)
    for (let i = 0; i < 128; i++) {
      const oamBase = i * 4;
      const attr0 = this.oam16[oamBase];
      const objMode = (attr0 >>> 8) & 3;
      if (objMode === 2) continue; // Disabled regular sprite

      const shape = (attr0 >>> 14) & 3;
      if (shape === 3) continue; // Prohibited shape

      const attr1 = this.oam16[oamBase + 1];
      const attr2 = this.oam16[oamBase + 2];

      const size = (attr1 >>> 14) & 3;
      const w = dims[shape][size][0];
      const h = dims[shape][size][1];

      const isAffine = (objMode === 1 || objMode === 3);
      const boxW = (objMode === 3) ? (w << 1) : w;
      const boxH = (objMode === 3) ? (h << 1) : h;

      let sprY = attr0 & 0xFF;
      if (sprY >= 160 && (sprY + boxH) > 256) sprY -= 256;

      const isMos = (attr0 & 0x1000) !== 0;
      const effY  = isMos ? (y - (y % objMosV)) : y;
      const localY = effY - sprY;
      if (localY < 0 || localY >= boxH) continue;

      let sprX = attr1 & 0x1FF;
      if (sprX >= 240) sprX -= 512;

      const is8bpp  = (attr0 & 0x2000) !== 0;
      const gfxMode = (attr0 >>> 10) & 3; // 0=Normal, 1=Semi-Transparent, 2=OBJ Window
      const tileBase= attr2 & 0x3FF;
      const prio    = (attr2 >>> 10) & 3;
      const palBank = (attr2 >>> 12) & 0xF;

      // CRITICAL HARDWARE RULE: In Bitmap Modes (3, 4, 5), tiles 0..511 are occupied by BG bitmap!
      // Any sprite referencing tiles < 512 is NOT drawn!
      if (mode >= 3 && tileBase < 512) continue;

      let pa = 256, pb = 0, pc = 0, pd = 256;
      if (isAffine) {
        const affIdx = (attr1 >>> 9) & 0x1F;
        const pBase  = affIdx * 16;
        pa = (this.oam16[pBase + 3] << 16) >> 16;
        pb = (this.oam16[pBase + 7] << 16) >> 16;
        pc = (this.oam16[pBase + 11] << 16) >> 16;
        pd = (this.oam16[pBase + 15] << 16) >> 16;
      }

      const halfW = boxW >> 1;
      const halfH = boxH >> 1;
      const dy = localY - halfH;

      for (let lx = 0; lx < boxW; lx++) {
        const screenX = sprX + lx;
        if (screenX < 0 || screenX >= 240) continue;

        let texX = 0, texY = 0;
        if (isAffine) {
          const dx = lx - halfW;
          texX = ((pa * dx + pb * dy) >> 8) + (w >> 1);
          texY = ((pc * dx + pd * dy) >> 8) + (h >> 1);
          if (texX < 0 || texX >= w || texY < 0 || texY >= h) continue;
        } else {
          const flipH = (attr1 & 0x1000) !== 0;
          const flipV = (attr1 & 0x2000) !== 0;
          texX = flipH ? (w - 1 - lx) : lx;
          texY = flipV ? (h - 1 - localY) : localY;
        }

        const tileX = texX >>> 3;
        const tileY = texY >>> 3;
        const inX   = texX & 7;
        const inY   = texY & 7;

        let tileNum = 0;
        if (is1D) {
          const tilesPerRow = w >>> 3;
          const offsetTiles = tileY * tilesPerRow + tileX;
          tileNum = tileBase + (is8bpp ? (offsetTiles << 1) : offsetTiles);
        } else {
          // 2D mapping: 32x32 tile sheet
          tileNum = (tileBase + tileY * 32 + (is8bpp ? (tileX << 1) : tileX)) & 0x3FF;
        }

        if (mode >= 3 && tileNum < 512) continue;

        let palIdx = 0;
        if (is8bpp) {
          const addr = 0x10000 + ((tileNum & 0x3FE) * 32) + inY * 8 + inX;
          if (addr < 0x18000) palIdx = this.vram[addr];
        } else {
          const addr = 0x10000 + (tileNum * 32) + inY * 4 + (inX >>> 1);
          if (addr < 0x18000) {
            const b = this.vram[addr];
            const nib = (inX & 1) ? (b >>> 4) : (b & 0xF);
            if (nib !== 0) palIdx = (palBank << 4) | nib;
          }
        }

        if (palIdx !== 0) {
          if (gfxMode === 2) {
            // OBJ Window mask
            this.lineObjWin[screenX] = 1;
          } else if (prio < this.lineObjPrio[screenX]) {
            this.lineObjColor[screenX] = this.pal16[0x100 + palIdx];
            this.lineObjPrio[screenX]  = prio;
            this.lineObjSemi[screenX]  = (gfxMode === 1) ? 1 : 0;
          }
        }
      }
    }
  }

  // ==========================================================================
  // Frame & Scanline Scheduler + Sound Mixer (PSG 1-4 + Direct Sound FIFO A/B)
  // ==========================================================================

  runFrame() {
    for (let line = 0; line < 228; line++) {
      this.vcount = line;
      this.io16[0x006 >> 1] = line;

      // Update V-Counter match flag (bit 2 of DISPSTAT)
      let dispstat = this.io16[0x004 >> 1];
      const lyc = (dispstat >>> 8) & 0xFF;
      if (line === lyc) {
        dispstat |= 0x0004;
        if (dispstat & 0x0020) this.requestIrq(IRQ_VCOUNT);
      } else {
        dispstat &= ~0x0004;
      }

      if (line === 160) {
        // Enter VBlank (lines 160..226)
        dispstat |= 0x0001;
        this.io16[0x004 >> 1] = dispstat;
        if (dispstat & 0x0008) this.requestIrq(IRQ_VBLANK);
        // Also update BIOS IF mirror at 0x03007FF8 for VBlankIntrWait compatibility
        this.write16(0x03007FF8, this.read16(0x03007FF8) | IRQ_VBLANK);
        // Trigger VBlank DMAs (timing = 1)
        this.triggerDmaTiming(1);
        // Reload internal affine reference points at VBlank!
        this.bgRefX[0] = (this.io32[0x028 >> 2] << 4) >> 4;
        this.bgRefY[0] = (this.io32[0x02C >> 2] << 4) >> 4;
        this.bgRefX[1] = (this.io32[0x038 >> 2] << 4) >> 4;
        this.bgRefY[1] = (this.io32[0x03C >> 2] << 4) >> 4;
      } else if (line === 227) {
        // VBlank flag cleared on line 227
        dispstat &= ~0x0001;
      }
      this.io16[0x004 >> 1] = dispstat & ~0x0002; // HBlank=0

      // Execute visible / HDraw period (960 cycles)
      this.runCycles(960);

      // Render scanline if visible (lines 0..159)
      if (line < 160) {
        this.renderScanline(line);
      }

      // Enter HBlank (272 cycles)
      dispstat = this.io16[0x004 >> 1] | 0x0002;
      this.io16[0x004 >> 1] = dispstat;
      if (dispstat & 0x0010) this.requestIrq(IRQ_HBLANK);
      if (line < 160) {
        // HBlank DMA only triggers on visible scanlines 0..159!
        this.triggerDmaTiming(2);
      }

      this.runCycles(272);
      this.sampleAudioScanline();
    }
  }

  runCycles(targetCycles) {
    let rem = targetCycles;
    while (rem > 0) {
      if (this.halted) {
        this.stepTimers(rem);
        this.cycles += rem;
        break;
      }
      const c = this.stepInstruction();
      this.stepTimers(c);
      this.cycles += c;
      rem -= c;
    }
  }

  sampleAudioScanline() {
    // Generate ~2 audio samples per scanline (~456 samples/frame * 59.73 fps ~= 27236 Hz, or 548 samples for 32768 Hz)
    const sndCntX = this.io16[0x084 >> 1];
    if (!(sndCntX & 0x0080)) {
      this.pushAudioSample(0, 0);
      this.pushAudioSample(0, 0);
      return;
    }
    const sndCntL = this.io16[0x080 >> 1];
    const sndCntH = this.io16[0x082 >> 1];

    // Direct Sound FIFO A & B
    const volA = (sndCntH & 0x0004) ? 1.0 : 0.5;
    const volB = (sndCntH & 0x0008) ? 1.0 : 0.5;
    const sampA = (this.fifoALatch / 128.0) * volA;
    const sampB = (this.fifoBLatch / 128.0) * volB;

    // PSG Channels 1..4 (Square 1, Square 2, Wave, Noise)
    let psgL = 0, psgR = 0;
    // Channel 1 (Square 1: 0x60..0x64)
    const ch1Freq = this.io16[0x064 >> 1] & 0x7FF;
    const ch1Vol  = (this.io16[0x062 >> 1] >>> 12) & 0xF;
    if (ch1Vol > 0 && ch1Freq < 2040) {
      const hz = 131072 / (2048 - ch1Freq);
      this.psgPhase[0] = (this.psgPhase[0] + hz / 13620) % 1.0;
      const s = (this.psgPhase[0] < 0.5 ? 1 : -1) * (ch1Vol / 15) * 0.15;
      if (sndCntL & 0x1000) psgL += s;
      if (sndCntL & 0x0100) psgR += s;
    }
    // Channel 2 (Square 2: 0x68..0x6C)
    const ch2Freq = this.io16[0x06C >> 1] & 0x7FF;
    const ch2Vol  = (this.io16[0x068 >> 1] >>> 12) & 0xF;
    if (ch2Vol > 0 && ch2Freq < 2040) {
      const hz = 131072 / (2048 - ch2Freq);
      this.psgPhase[1] = (this.psgPhase[1] + hz / 13620) % 1.0;
      const s = (this.psgPhase[1] < 0.5 ? 1 : -1) * (ch2Vol / 15) * 0.15;
      if (sndCntL & 0x2000) psgL += s;
      if (sndCntL & 0x0200) psgR += s;
    }
    // Channel 4 (Noise: 0x78..0x7C)
    const ch4Vol = (this.io16[0x078 >> 1] >>> 12) & 0xF;
    if (ch4Vol > 0 && (this.io16[0x07C >> 1] & 0x8000)) {
      const bit = (this.psgLfsr ^ (this.psgLfsr >>> 1)) & 1;
      this.psgLfsr = (this.psgLfsr >>> 1) | (bit << 14);
      const s = ((this.psgLfsr & 1) ? 1 : -1) * (ch4Vol / 15) * 0.1;
      if (sndCntL & 0x8000) psgL += s;
      if (sndCntL & 0x0800) psgR += s;
    }

    let outL = psgL, outR = psgR;
    if (sndCntH & 0x0200) outL += sampA * 0.5;
    if (sndCntH & 0x0100) outR += sampA * 0.5;
    if (sndCntH & 0x2000) outL += sampB * 0.5;
    if (sndCntH & 0x1000) outR += sampB * 0.5;

    outL = Math.max(-1, Math.min(1, outL));
    outR = Math.max(-1, Math.min(1, outR));
    this.pushAudioSample(outL, outR);
    this.pushAudioSample(outL, outR);
  }

  pushAudioSample(l, r) {
    const next = (this.audioWritePos + 1) & 8191;
    if (next !== this.audioReadPos) {
      this.audioRingL[this.audioWritePos] = l;
      this.audioRingR[this.audioWritePos] = r;
      this.audioWritePos = next;
    }
  }

  // ==========================================================================
  // Tier 2: Save States (.1337state) & ARM/Thumb Disassembler
  // ==========================================================================

  serializeState() {
    return JSON.stringify({
      magic: '1337STATE_V1',
      romCrc32: this.romCrc32,
      r: Array.from(this.r),
      cpsr: this.cpsr,
      bankUsr: Array.from(this.bankUsr),
      bankFiq: Array.from(this.bankFiq),
      bankIrq: Array.from(this.bankIrq),
      bankSvc: Array.from(this.bankSvc),
      bankAbt: Array.from(this.bankAbt),
      bankUnd: Array.from(this.bankUnd),
      spsrIrq: this.spsrIrq,
      spsrSvc: this.spsrSvc,
      spsrFiq: this.spsrFiq,
      spsrAbt: this.spsrAbt,
      spsrUnd: this.spsrUnd,
      halted: this.halted,
      vcount: this.vcount,
      bgRefX: Array.from(this.bgRefX),
      bgRefY: Array.from(this.bgRefY),
      timerVal: Array.from(this.timerVal),
      timerReload: Array.from(this.timerReload),
      timerCnt: Array.from(this.timerCnt),
      dmaSrc: Array.from(this.dmaSrc),
      dmaDst: Array.from(this.dmaDst),
      dmaCount: Array.from(this.dmaCount),
      dmaCnt: Array.from(this.dmaCnt),
      ewram: uint8ToBase64(this.ewram),
      iwram: uint8ToBase64(this.iwram),
      io: uint8ToBase64(this.io),
      pal: uint8ToBase64(this.pal),
      vram: uint8ToBase64(this.vram),
      oam: uint8ToBase64(this.oam),
      sram: uint8ToBase64(this.sram)
    });
  }

  deserializeState(jsonStr) {
    const st = JSON.parse(jsonStr);
    if (!st || st.magic !== '1337STATE_V1') throw new Error('Invalid .1337state file');
    this.r.set(st.r);
    this.cpsr = st.cpsr;
    this.bankUsr.set(st.bankUsr);
    this.bankFiq.set(st.bankFiq);
    this.bankIrq.set(st.bankIrq);
    this.bankSvc.set(st.bankSvc);
    this.bankAbt.set(st.bankAbt);
    this.bankUnd.set(st.bankUnd);
    this.spsrIrq = st.spsrIrq;
    this.spsrSvc = st.spsrSvc;
    this.spsrFiq = st.spsrFiq;
    this.spsrAbt = st.spsrAbt;
    this.spsrUnd = st.spsrUnd;
    this.halted = !!st.halted;
    this.vcount = st.vcount | 0;
    this.bgRefX.set(st.bgRefX);
    this.bgRefY.set(st.bgRefY);
    this.timerVal.set(st.timerVal);
    this.timerReload.set(st.timerReload);
    this.timerCnt.set(st.timerCnt);
    this.dmaSrc.set(st.dmaSrc);
    this.dmaDst.set(st.dmaDst);
    this.dmaCount.set(st.dmaCount);
    this.dmaCnt.set(st.dmaCnt);
    this.ewram.set(base64ToUint8(st.ewram));
    this.iwram.set(base64ToUint8(st.iwram));
    this.io.set(base64ToUint8(st.io));
    this.pal.set(base64ToUint8(st.pal));
    this.vram.set(base64ToUint8(st.vram));
    this.oam.set(base64ToUint8(st.oam));
    this.sram.set(base64ToUint8(st.sram));
  }

  disassembleAt(addr, isThumb) {
    addr >>>= 0;
    const hex = (n, w) => (n >>> 0).toString(16).toUpperCase().padStart(w, '0');
    if (isThumb) {
      const op = this.read16(addr);
      const top3 = (op >>> 13) & 7;
      let mnem = 'THUMB';
      if (top3 === 0) {
        const sub = (op >>> 11) & 3;
        const rd = op & 7, rs = (op >>> 3) & 7;
        if (sub < 3) mnem = ['LSL','LSR','ASR'][sub] + ' R' + rd + ', R' + rs + ', #' + ((op >>> 6) & 31);
        else mnem = ((op & 0x200) ? 'SUB' : 'ADD') + ' R' + rd + ', R' + rs + ', ' + ((op & 0x400) ? '#' + ((op >>> 6) & 7) : 'R' + ((op >>> 6) & 7));
      } else if (top3 === 1) {
        mnem = ['MOV','CMP','ADD','SUB'][(op >>> 11) & 3] + ' R' + ((op >>> 8) & 7) + ', #0x' + hex(op & 0xFF, 2);
      } else if (top3 === 2) {
        if (((op >>> 10) & 7) === 0) {
          const alu = ['AND','EOR','LSL','LSR','ASR','ADC','SBC','ROR','TST','NEG','CMP','CMN','ORR','MUL','BIC','MVN'][(op >>> 6) & 15];
          mnem = alu + ' R' + (op & 7) + ', R' + ((op >>> 3) & 7);
        } else if (((op >>> 10) & 7) === 1) {
          const hi = ['ADD','CMP','MOV','BX'][(op >>> 8) & 3];
          const rd = (op & 7) | ((op >>> 4) & 8);
          const rs = ((op >>> 3) & 7) | ((op >>> 3) & 8);
          mnem = (hi === 'BX') ? ('BX R' + rs) : (hi + ' R' + rd + ', R' + rs);
        } else if (((op >>> 11) & 1) === 1) {
          mnem = 'LDR R' + ((op >>> 8) & 7) + ', [PC, #0x' + hex((op & 0xFF) << 2, 3) + ']';
        } else {
          mnem = 'LDR/STR [R' + ((op >>> 3) & 7) + ', R' + ((op >>> 6) & 7) + ']';
        }
      } else if (top3 === 3) {
        mnem = ['STR','LDR','STRB','LDRB'][(op >>> 11) & 3] + ' R' + (op & 7) + ', [R' + ((op >>> 3) & 7) + ', #' + ((op >>> 6) & 31) + ']';
      } else if (top3 === 4) {
        mnem = (op & 0x0800 ? 'LDR' : 'STR') + (op & 0x1000 ? ' SP' : 'H') + ' R' + (op & 7);
      } else if (top3 === 5) {
        mnem = (op & 0x1000) ? ((op & 0x0800) ? 'POP' : 'PUSH') : 'ADD R' + ((op >>> 8) & 7) + ', PC/SP';
      } else if (top3 === 6) {
        if ((op & 0xFF00) === 0xDF00) mnem = 'SWI 0x' + hex(op & 0xFF, 2);
        else if (op & 0x1000) mnem = 'B' + ['EQ','NE','CS','CC','MI','PL','VS','VC','HI','LS','GE','LT','GT','LE','AL','NV'][(op >>> 8) & 15] + ' 0x' + hex(addr + 4 + ((op << 24) >> 23), 8);
        else mnem = (op & 0x0800 ? 'LDMIA' : 'STMIA') + ' R' + ((op >>> 8) & 7) + '!';
      } else {
        mnem = 'B/BL 0x' + hex(op & 0x7FF, 3);
      }
      return hex(addr, 8) + ': ' + hex(op, 4) + '      ' + mnem;
    } else {
      const op = this.read32Aligned(addr);
      const conds = ['EQ','NE','CS','CC','MI','PL','VS','VC','HI','LS','GE','LT','GT','LE','','NV'];
      const cStr = conds[op >>> 28];
      const top3 = (op >>> 25) & 7;
      let mnem = 'ARM';
      if ((op & 0x0FFFFFF0) === 0x012FFF10) {
        mnem = 'BX' + cStr + ' R' + (op & 15);
      } else if (top3 === 0 || top3 === 1) {
        const dpNames = ['AND','EOR','SUB','RSB','ADD','ADC','SBC','RSC','TST','TEQ','CMP','CMN','ORR','MOV','BIC','MVN'];
        const dp = dpNames[(op >>> 21) & 15];
        const s = ((op >>> 20) & 1) && ((op >>> 21) & 15) < 8 || ((op >>> 21) & 15) >= 12 ? 'S' : '';
        const rd = (op >>> 12) & 15, rn = (op >>> 16) & 15;
        if (top3 === 1) {
          const imm8 = op & 0xFF, rot = ((op >>> 8) & 15) << 1;
          const v = rot ? ((imm8 >>> rot) | (imm8 << (32 - rot))) : imm8;
          mnem = dp + cStr + s + ' R' + rd + ', R' + rn + ', #0x' + hex(v, 1);
        } else {
          mnem = dp + cStr + s + ' R' + rd + ', R' + rn + ', R' + (op & 15);
        }
      } else if (top3 === 2 || top3 === 3) {
        mnem = ((op & (1<<20)) ? 'LDR' : 'STR') + cStr + ((op & (1<<22)) ? 'B' : '') + ' R' + ((op >>> 12) & 15) + ', [R' + ((op >>> 16) & 15) + ']';
      } else if (top3 === 4) {
        mnem = ((op & (1<<20)) ? 'LDM' : 'STM') + cStr + ' R' + ((op >>> 16) & 15) + ((op & (1<<21)) ? '!' : '') + ', {0x' + hex(op & 0xFFFF, 4) + '}';
      } else if (top3 === 5) {
        const target = (addr + 8 + ((op << 8) >> 6)) >>> 0;
        mnem = ((op & (1<<24)) ? 'BL' : 'B') + cStr + ' 0x' + hex(target, 8);
      } else if (top3 === 7 && (op & (1<<24))) {
        mnem = 'SWI' + cStr + ' 0x' + hex((op >>> 16) & 0xFF, 2);
      }
      return hex(addr, 8) + ': ' + hex(op, 8) + '  ' + mnem;
    }
  }
}


// ============================================================================
// 1337Boy(TM) Built-In Hardware Self-Test Suite
// Hand-assembled ARM & Thumb machine code vectors + Memory + BIOS + Polyglot
// ============================================================================

async function runB1337SelfTest(buildPolyglotFn) {
  const results = [];
  let passed = 0;
  let failed = 0;

  function record(name, pass, detail) {
    if (pass) passed++;
    else failed++;
    results.push({ name, pass: !!pass, detail: detail || (pass ? 'OK' : 'FAILED') });
  }

  const gba = new GBA();
  const N = FLAG_N, Z = FLAG_Z, C = FLAG_C, V = FLAG_V;
  const NZCV = (N | Z | C | V) >>> 0;

  // Helper to execute a single ARM instruction at 0x02000000 (EWRAM)
  function runArm1(instrWord, initRegs, initFlags) {
    gba.cpsr = MODE_SYS | ((initFlags || 0) & NZCV);
    for (let i = 0; i < 15; i++) gba.r[i] = 0;
    if (initRegs) {
      for (const k in initRegs) gba.r[k | 0] = initRegs[k] | 0;
    }
    gba.r[15] = 0x02000000;
    gba.ewram32[0] = instrWord >>> 0;
    gba.stepArm();
  }

  // Helper to execute a single Thumb instruction at 0x02000000 (EWRAM)
  function runThumb1(instrHalf, initRegs, initFlags) {
    gba.cpsr = MODE_SYS | FLAG_T | ((initFlags || 0) & NZCV);
    for (let i = 0; i < 15; i++) gba.r[i] = 0;
    if (initRegs) {
      for (const k in initRegs) gba.r[k | 0] = initRegs[k] | 0;
    }
    gba.r[15] = 0x02000000;
    gba.ewram16[0] = instrHalf & 0xFFFF;
    gba.stepThumb();
  }

  const hex32 = (v) => '0x' + (v >>> 0).toString(16).toUpperCase().padStart(8, '0');
  const flagStr = (f) =>
    ((f & N) ? 'N' : '-') +
    ((f & Z) ? 'Z' : '-') +
    ((f & C) ? 'C' : '-') +
    ((f & V) ? 'V' : '-');

  // --------------------------------------------------------------------------
  // 1. ARM ALU, Shifter, Multiply, LDM/STM, SWP, PSR, Branch, Conditions (220+ cases)

    // [name, op(0..15), r1, r2, carryIn, expRd, expFlags]

    // 0x3: RSBS R0, R1, R2 (R2 - R1)

    // 0xC: ORRS R0, R1, R2

  for (const [name, op, r1, r2, cIn, expRd, expF] of armAluVectors) {

  // ARM Condition Code Matrix (15 conditions x 2 states = 30 cases)
  const condTestCases = [
    ['EQ (Z=1)', 0x0, Z, true],     ['EQ (Z=0)', 0x0, 0, false],
    ['NE (Z=0)', 0x1, 0, true],     ['NE (Z=1)', 0x1, Z, false],
    ['CS (C=1)', 0x2, C, true],     ['CS (C=0)', 0x2, 0, false],
    ['CC (C=0)', 0x3, 0, true],     ['CC (C=1)', 0x3, C, false],
    ['MI (N=1)', 0x4, N, true],     ['MI (N=0)', 0x4, 0, false],
    ['PL (N=0)', 0x5, 0, true],     ['PL (N=1)', 0x5, N, false],
    ['VS (V=1)', 0x6, V, true],     ['VS (V=0)', 0x6, 0, false],
    ['VC (V=0)', 0x7, 0, true],     ['VC (V=1)', 0x7, V, false],
    ['HI (C=1,Z=0)', 0x8, C, true], ['HI (C=1,Z=1)', 0x8, C|Z, false],
    ['LS (C=0,Z=0)', 0x9, 0, true], ['LS (C=1,Z=0)', 0x9, C, false],
    ['GE (N=1,V=1)', 0xA, N|V, true],['GE (N=1,V=0)', 0xA, N, false],
    ['LT (N=1,V=0)', 0xB, N, true], ['LT (N=1,V=1)', 0xB, N|V, false],
    ['GT (Z=0,N=V)', 0xC, N|V, true],['GT (Z=1,N=V)', 0xC, Z|N|V, false],
    ['LE (Z=1,N=V)', 0xD, Z, true], ['LE (Z=0,N=V)', 0xD, 0, false],
    ['AL (always)',  0xE, 0, true], ['NV (never)',   0xF, N|Z|C|V, false],
  ];
  for (const [label, cond, flags, shouldExec] of condTestCases) {
    // MOV<cond> R0, #0x42
    const word = ((cond << 28) | (1 << 25) | (0xD << 21) | 0x42) >>> 0;
    runArm1(word, { 0: 0x1337 }, flags);
    const exp = shouldExec ? 0x42 : 0x1337;
    record(`ARM Cond ${label}`, gba.r[0] === exp, `R0=${hex32(gba.r[0])}`);
  }

  // ARM Multiply & Multiply Long Variants (MUL, MLA, UMULL, UMLAL, SMULL, SMLAL) - 16 cases
  {
    // MUL R0, R1, R2 (0xE0000291)
    runArm1(0xE0000291, { 1: 12345, 2: 6789 }, 0);
    record('ARM MUL pos*pos', gba.r[0] === Math.imul(12345, 6789), `R0=${gba.r[0]}`);
    // MULS R0, R1, R2 -> negative
    runArm1(0xE0100291, { 1: -500, 2: 400 }, 0);
    record('ARM MULS neg flag', gba.r[0] === -200000 && (gba.cpsr & N) !== 0, 'OK');
    // MULS R0, R1, R2 -> zero
    runArm1(0xE0100291, { 1: 0, 2: 99999 }, 0);
    record('ARM MULS zero flag', gba.r[0] === 0 && (gba.cpsr & Z) !== 0, 'OK');
    // MLA R0, R1, R2, R3 (Rd=0, Rn=3, Rs=2, Rm=1 -> 0xE0203291)
    runArm1(0xE0203291, { 1: 100, 2: 200, 3: 337 }, 0);
    record('ARM MLA R0=R1*R2+R3', gba.r[0] === 20337, `R0=${gba.r[0]}`);
    // UMULL R0(lo), R1(hi), R2, R3 (rdHi=1, rdLo=0, rs=3, rm=2 -> 0xE0810392)
    runArm1(0xE0810392, { 2: 0x80000000, 3: 4 }, 0);
    record('ARM UMULL 64-bit', (gba.r[0] >>> 0) === 0 && (gba.r[1] >>> 0) === 2, `Hi:Lo=${hex32(gba.r[1])}:${hex32(gba.r[0])}`);
    // UMLAL R0(lo), R1(hi), R2, R3 (0xE0A10392)
    runArm1(0xE0A10392, { 0: 0xFFFFFFFF, 1: 0x00000001, 2: 2, 3: 3 }, 0);
    record('ARM UMLAL carry into hi', (gba.r[0] >>> 0) === 5 && (gba.r[1] >>> 0) === 2, `Hi:Lo=${hex32(gba.r[1])}:${hex32(gba.r[0])}`);
    // SMULLS R0(lo), R1(hi), R2, R3 (0xE0D10392)
    runArm1(0xE0D10392, { 2: -1000000, 3: 1000000 }, 0);
    const expSmull = BigInt(-1000000) * BigInt(1000000) & 0xFFFFFFFFFFFFFFFFn;
    record('ARM SMULLS signed 64-bit', (gba.r[0] >>> 0) === Number(expSmull & 0xFFFFFFFFn) && (gba.r[1] >>> 0) === Number(expSmull >> 32n) && (gba.cpsr & N) !== 0, 'OK');
    // SMLAL R0(lo), R1(hi), R2, R3 (0xE0E10392)
    runArm1(0xE0E10392, { 0: 100, 1: 0, 2: -10, 3: 5 }, 0);
    record('ARM SMLAL signed accum', gba.r[0] === 50 && gba.r[1] === 0, `Lo=${gba.r[0]}`);
  }

  // ARM LDM/STM Edge Cases, SWP/SWPB, PSR Transfers, Pipeline PC+8/+12 - 20 cases
  {
    // 1. Pipeline PC+8 read: ADD R0, PC, #0 at 0x02000000 -> R0 = 0x02000008
    runArm1(0xE28F0000, {}, 0);
    record('ARM Pipeline PC+8 read', (gba.r[0] >>> 0) === 0x02000008, `R0=${hex32(gba.r[0])}`);

    // 2. Pipeline PC+12 read on register-shifted ALU: ADD R0, PC, R1, LSL R2 (0xE08F0211)
    runArm1(0xE08F0211, { 1: 0, 2: 0 }, 0);
    record('ARM Pipeline PC+12 reg-shift read', (gba.r[0] >>> 0) === 0x0200000C, `R0=${hex32(gba.r[0])}`);

    // 3. STM with base in list FIRST: STMIA R1!, {R1, R2} -> stores OLD R1
    gba.ewram32[0x100 >> 2] = 0; gba.ewram32[0x104 >> 2] = 0;
    runArm1(0xE8A10006, { 1: 0x02000100, 2: 0xCAFEBABE }, 0);
    record('ARM STMIA Rn first stores old base', (gba.ewram32[0x100 >> 2] >>> 0) === 0x02000100 && (gba.r[1] >>> 0) === 0x02000108, 'OK');

    // 4. STM with base in list NOT FIRST: STMIA R1!, {R0, R1} -> stores NEW R1
    gba.ewram32[0x100 >> 2] = 0; gba.ewram32[0x104 >> 2] = 0;
    runArm1(0xE8A10003, { 0: 0x11111111, 1: 0x02000100 }, 0);
    record('ARM STMIA Rn not-first stores new base', (gba.ewram32[0x104 >> 2] >>> 0) === 0x02000108 && (gba.r[1] >>> 0) === 0x02000108, 'OK');

    // 5. STM empty register list: STMIA R1!, {} -> stores R15 (PC+12) and adds 0x40 to R1!
    runArm1(0xE8A10000, { 1: 0x02000200 }, 0);
    record('ARM STMIA empty rlist +0x40 & stores PC+12', (gba.r[1] >>> 0) === 0x02000240 && (gba.ewram32[0x200 >> 2] >>> 0) === 0x0200000C, 'OK');

    // 6. LDM empty register list: LDMIA R1!, {} -> loads R15 and adds 0x40 to R1!
    gba.ewram32[0x300 >> 2] = 0x02000400;
    runArm1(0xE8B10000, { 1: 0x02000300 }, 0);
    record('ARM LDMIA empty rlist +0x40 & loads PC', (gba.r[1] >>> 0) === 0x02000340 && (gba.r[15] >>> 0) === 0x02000400, 'OK');

    // 7. LDM with Rn in rlist: loaded value overwrites writeback
    gba.ewram32[0x300 >> 2] = 0x1337BEEF;
    runArm1(0xE8B10002, { 1: 0x02000300 }, 0);
    record('ARM LDMIA Rn in list keeps loaded value', (gba.r[1] >>> 0) === 0x1337BEEF, 'OK');

    // 8. SWP R0, R1, [R2] (word swap, aligned & misaligned rotated!)
    gba.ewram32[0x400 >> 2] = 0x11223344;
    runArm1(0xE1020091, { 1: 0xAABBCCDD, 2: 0x02000400 }, 0);
    record('ARM SWP word aligned', (gba.r[0] >>> 0) === 0x11223344 && (gba.ewram32[0x400 >> 2] >>> 0) === 0xAABBCCDD, 'OK');

    gba.ewram32[0x400 >> 2] = 0x11223344;
    runArm1(0xE1020091, { 1: 0xAABBCCDD, 2: 0x02000401 }, 0); // misaligned +1 -> rotated right 8
    record('ARM SWP word misaligned rotated', (gba.r[0] >>> 0) === 0x44112233, `R0=${hex32(gba.r[0])}`);

    // 9. SWPB R0, R1, [R2] (byte swap)
    gba.ewram[0x410] = 0x7F;
    runArm1(0xE1420091, { 1: 0x123456FE, 2: 0x02000410 }, 0);
    record('ARM SWPB byte swap', gba.r[0] === 0x7F && gba.ewram[0x410] === 0xFE, 'OK');


    // 11. ARM Addressing Mode Vectors (LDR/STR/LDRB/STRB/LDRH/STRH/LDRSB/LDRSH pre/post, +/-offset, writeback) - 32 cases
    for (let i = 0; i < 8; i++) {
      const base = 0x02001200 + i * 16;
      const val  = (0x13370000 + i * 0x1111) | 0;
      // STR R0, [R1, #12]! (pre-index writeback: 0xE5A1000C)
      runArm1(0xE5A1000C, { 0: val, 1: base }, 0);
      record(`ARM STR pre-idx writeback #${i}`, (gba.r[1] >>> 0) === base + 12 && gba.read32Aligned(base + 12) === (val >>> 0), 'OK');
      // LDR R0, [R1], #-8 (post-index down: 0xE4110008)
      runArm1(0xE4110008, { 1: base + 12 }, 0);
      record(`ARM LDR post-idx down #${i}`, (gba.r[0] | 0) === val && (gba.r[1] >>> 0) === base + 4, 'OK');
      // STRH R0, [R1, #6] (0xE1C100B6) & LDRSH R2, [R1, #6] (0xE1D120F6)
      const hval = (0x8000 | (i * 0x123)) & 0xFFFF;
      runArm1(0xE1C100B6, { 0: hval, 1: base }, 0);
      runArm1(0xE1D120F6, { 1: base }, 0);
      record(`ARM STRH/LDRSH signed #${i}`, gba.r[2] === ((hval << 16) >> 16), 'OK');
      // STRB R0, [R1, #3] (0xE5C10003) & LDRSB R2, [R1, #3] (0xE1D120D3)
      const bval = (0x80 | (i * 7)) & 0xFF;
      runArm1(0xE5C10003, { 0: bval, 1: base }, 0);
      runArm1(0xE1D120D3, { 1: base }, 0);
      record(`ARM STRB/LDRSB signed #${i}`, gba.r[2] === ((bval << 24) >> 24), 'OK');
    }

    // 10. MRS / MSR mode switching and banked SP registers
    runArm1(0xE10F0000, {}, N | C); // MRS R0, CPSR
    record('ARM MRS CPSR', (gba.r[0] >>> 0) === ((MODE_SYS | N | C) >>> 0), 'OK');

    // Switch to IRQ mode via MSR CPSR_c, #0x92, check banked SP_irq, switch back to SYS
    gba.switchMode(MODE_SYS);
    gba.r[13] = 0x03007F00;
    gba.switchMode(MODE_IRQ);
    gba.r[13] = 0x03007FA0;
    gba.switchMode(MODE_SYS);
    record('ARM Banked SP_sys vs SP_irq isolation', (gba.r[13] >>> 0) === 0x03007F00 && (gba.bankIrq[0] >>> 0) === 0x03007FA0, 'OK');

    // LDM/STM User Bank Transfer (S=1 without R15 in IRQ mode accesses R13_usr!)
    gba.switchMode(MODE_IRQ);
    gba.r[13] = 0x03007FA0;
    gba.bankUsr[5] = 0x03007123;
    gba.ewram32[0x500 >> 2] = 0;
    // STMIA R0, {R13}^ -> 0xE8C02000
    gba.r[0] = 0x02000500;
    gba.r[15] = 0x02000000;
    gba.ewram32[0] = 0xE8C02000;
    gba.stepArm();
    gba.switchMode(MODE_SYS);
    record('ARM STM {R13}^ user bank transfer in IRQ mode', (gba.ewram32[0x500 >> 2] >>> 0) === 0x03007123, 'OK');
  }

  // --------------------------------------------------------------------------
  // 2. Thumb Instruction Set Vectors (140+ cases across all 19 Thumb formats)
  // --------------------------------------------------------------------------
  // Format 1: LSL, LSR, ASR immediate (30 cases)
  const thumbFmt1Vectors = [
    ['Thumb LSL #0 C=1',  0, 0,  0x12345678, 1, 0x12345678, C],
    ['Thumb LSL #1 C=1',  0, 1,  0x80000001, 0, 0x00000002, C],
    ['Thumb LSL #1 C=0',  0, 1,  0x40000000, 1, 0x80000000, N],
    ['Thumb LSL #4',      0, 4,  0x01234567, 0, 0x12345670, 0],
    ['Thumb LSL #8',      0, 8,  0x00800000, 0, 0x80000000, N],
    ['Thumb LSL #16',     0, 16, 0x00001337, 0, 0x13370000, 0],
    ['Thumb LSL #31 C=1', 0, 31, 0x00000003, 0, 0x80000000, N|C],
    ['Thumb LSL #31 ->0', 0, 31, 0x00000002, 0, 0x00000000, Z|C],
    ['Thumb LSR #32(0) 1',1, 0,  0x80000000, 0, 0x00000000, Z|C],
    ['Thumb LSR #32(0) 0',1, 0,  0x7FFFFFFF, 1, 0x00000000, Z],
    ['Thumb LSR #1 C=1',  1, 1,  0x00000003, 0, 0x00000001, C],
    ['Thumb LSR #1 C=0',  1, 1,  0x00000002, 1, 0x00000001, 0],
    ['Thumb LSR #8',      1, 8,  0x12345680, 0, 0x00123456, C],
    ['Thumb LSR #16',     1, 16, 0xABCD0000, 0, 0x0000ABCD, 0],
    ['Thumb LSR #31',     1, 31, 0xC0000000, 0, 0x00000001, C],
    ['Thumb ASR #32(0) -',2, 0,  0x80000000, 0, 0xFFFFFFFF, N|C],
    ['Thumb ASR #32(0) +',2, 0,  0x7FFFFFFF, 1, 0x00000000, Z],
    ['Thumb ASR #1 neg',  2, 1,  0x80000001, 0, 0xC0000000, N|C],
    ['Thumb ASR #4 neg',  2, 4,  0xF0000008, 0, 0xFF000000, N|C],
    ['Thumb ASR #16 pos', 2, 16, 0x12348000, 0, 0x00001234, C],
    ['Thumb ASR #31 neg', 2, 31, 0x80000000, 0, 0xFFFFFFFF, N],
  ];
  for (const [name, sub, imm5, rsVal, cIn, expRd, expF] of thumbFmt1Vectors) {
    const half = (sub << 11) | (imm5 << 6) | (1 << 3) | 0; // op R0, R1, #imm5
    runThumb1(half, { 1: rsVal }, cIn ? C : 0);
    const gotRd = gba.r[0] | 0;
    const gotF  = (gba.cpsr & NZCV) >>> 0;
    const ok = (gotRd === (expRd | 0)) && (gotF === (expF >>> 0));
    record(name, ok, ok ? 'OK' : `R0=${hex32(gotRd)}, F=${flagStr(gotF)}`);
  }

  // Format 2: ADD/SUB reg & 3-bit imm (16 cases)
  for (let imm3 = 0; imm3 < 8; imm3++) {
    // ADD R0, R1, #imm3 (00011 10 imm3 001 000)
    runThumb1(0x1C00 | (imm3 << 6) | (1 << 3) | 0, { 1: 100 }, 0);
    record(`Thumb Fmt2 ADD R0, R1, #${imm3}`, gba.r[0] === 100 + imm3, 'OK');
    // SUB R0, R1, #imm3 (00011 11 imm3 001 000)
    runThumb1(0x1E00 | (imm3 << 6) | (1 << 3) | 0, { 1: 100 }, 0);
    record(`Thumb Fmt2 SUB R0, R1, #${imm3}`, gba.r[0] === 100 - imm3, 'OK');
  }

  // Format 3: MOV / CMP / ADD / SUB 8-bit immediate across registers R0..R7 (32 cases)
  for (let r = 0; r < 8; r++) {
    // MOV Rr, #0xA5
    runThumb1(0x20A5 | (r << 8), {}, 0);
    record(`Thumb Fmt3 MOV R${r}, #0xA5`, gba.r[r] === 0xA5, 'OK');
    // ADD Rr, #0x10
    runThumb1(0x3010 | (r << 8), { [r]: 0x20 }, 0);
    record(`Thumb Fmt3 ADD R${r}, #0x10`, gba.r[r] === 0x30, 'OK');
    // SUB Rr, #0x25
    runThumb1(0x3825 | (r << 8), { [r]: 0x25 }, 0);
    record(`Thumb Fmt3 SUB R${r}, #0x25 -> Z|C`, gba.r[r] === 0 && (gba.cpsr & (Z|C)) === (Z|C), 'OK');
    // CMP Rr, #0x50
    runThumb1(0x2850 | (r << 8), { [r]: 0x40 }, 0);
    record(`Thumb Fmt3 CMP R${r}, #0x50 -> N`, ((gba.cpsr & (N|C)) >>> 0) === (N >>> 0), 'OK');
  }

  // Format 4: All 16 Thumb ALU operations (32 cases)
  const thumbAluVectors = [
    ['Thumb ALU AND', 0x0, 0xFF00FF00, 0x0F0F0F0F, 0, 0x0F000F00, 0],
    ['Thumb ALU EOR', 0x1, 0xAAAAAAAA, 0xAAAAAAAA, 0, 0x00000000, Z],
    ['Thumb ALU LSL', 0x2, 0x00000001, 0x0000001F, 0, 0x80000000, N],
    ['Thumb ALU LSL32',0x2,0x00000001, 0x00000020, 0, 0x00000000, Z|C],
    ['Thumb ALU LSR', 0x3, 0x80000000, 0x0000001F, 0, 0x00000001, 0],
    ['Thumb ALU LSR32',0x3,0x80000000, 0x00000020, 0, 0x00000000, Z|C],
    ['Thumb ALU ASR', 0x4, 0x80000000, 0x00000004, 0, 0xF8000000, N],
    ['Thumb ALU ADC', 0x5, 0x00000010, 0x00000020, 1, 0x00000031, 0],
    ['Thumb ALU SBC', 0x6, 0x00000010, 0x00000005, 0, 0x0000000A, C],
    ['Thumb ALU ROR', 0x7, 0x00000001, 0x00000001, 0, 0x80000000, N|C],
    ['Thumb ALU TST', 0x8, 0xF0F0F0F0, 0x0F0F0F0F, 0, 0xF0F0F0F0, Z],
    ['Thumb ALU NEG', 0x9, 0x99999999, 0x00000001, 0, 0xFFFFFFFF, N],
    ['Thumb ALU NEG0',0x9, 0x99999999, 0x00000000, 0, 0x00000000, Z|C],
    ['Thumb ALU CMP', 0xA, 0x00001337, 0x00001337, 0, 0x00001337, Z|C],
    ['Thumb ALU CMN', 0xB, 0xFFFFFFFF, 0x00000001, 0, 0xFFFFFFFF, Z|C],
    ['Thumb ALU ORR', 0xC, 0x12340000, 0x00005678, 0, 0x12345678, 0],
    ['Thumb ALU MUL', 0xD, 0x00000100, 0x00000013, 0, 0x00001300, 0],
    ['Thumb ALU MULS-',0xD,0xFFFFFFF0, 0x00000010, 0, 0xFFFFFF00, N],
    ['Thumb ALU BIC', 0xE, 0xFFFFFFFF, 0x7FFFFFFF, 0, 0x80000000, N],
    ['Thumb ALU MVN', 0xF, 0x00000000, 0x00000000, 0, 0xFFFFFFFF, N],
  ];
  for (const [name, op, r0, r1, cIn, expR0, expF] of thumbAluVectors) {
    const half = 0x4000 | (op << 6) | (1 << 3) | 0; // ALU R0, R1
    runThumb1(half, { 0: r0, 1: r1 }, cIn ? C : 0);
    const gotR0 = gba.r[0] | 0;
    const gotF  = (gba.cpsr & NZCV) >>> 0;
    const ok = (gotR0 === (expR0 | 0)) && (gotF === (expF >>> 0));
    record(name, ok, ok ? 'OK' : `R0=${hex32(gotR0)}, F=${flagStr(gotF)}`);
  }

  // Formats 5..19: Hi-Reg, BX, PC/SP-rel, Load/Store Byte/Half/Word/Signed, PUSH/POP, LDM/STM, Bcond, BL (36 cases)
  {
    // Format 5: ADD R8, R9 (0x44C8)
    runThumb1(0x44C8, { 8: 1000, 9: 337 }, 0);
    record('Thumb Fmt5 ADD R8, R9 (Hi-Reg)', gba.r[8] === 1337, 'OK');

    // Format 5: CMP R10, R11 (0x45DA)
    runThumb1(0x45DA, { 10: 500, 11: 500 }, 0);
    record('Thumb Fmt5 CMP R10, R11', (gba.cpsr & (Z|C)) === (Z|C), 'OK');

    // Format 5: MOV R12, R1 (0x468C)
    runThumb1(0x468C, { 1: 0xCAFE1337 }, 0);
    record('Thumb Fmt5 MOV R12, R1', (gba.r[12] >>> 0) === 0xCAFE1337, 'OK');

    // Format 5: BX R0 -> switch to ARM (bit 0 = 0)
    runThumb1(0x4700, { 0: 0x02000100 }, 0);
    record('Thumb Fmt5 BX to ARM state', (gba.cpsr & FLAG_T) === 0 && (gba.r[15] >>> 0) === 0x02000100, 'OK');

    // Format 5: BX R0 -> stay in Thumb (bit 0 = 1)
    runThumb1(0x4700, { 0: 0x02000101 }, 0);
    record('Thumb Fmt5 BX stay in Thumb state', (gba.cpsr & FLAG_T) !== 0 && (gba.r[15] >>> 0) === 0x02000100, 'OK');

    // Format 6: LDR R0, [PC, #16] (0x4804)
    gba.ewram32[(0x004 + 16) >> 2] = 0xDEADC0DE;
    runThumb1(0x4804, {}, 0);
    record('Thumb Fmt6 LDR Rd, [PC, #imm]', (gba.r[0] >>> 0) === 0xDEADC0DE, 'OK');

    // Format 7 & 8: STR/LDR/STRB/LDRB/STRH/LDRH/LDSB/LDSH [Rb, Ro]
    runThumb1(0x5088, { 0: 0x11223344, 1: 0x02000200, 2: 0x10 }, 0); // STR R0, [R1, R2]
    record('Thumb Fmt7 STR [Rb, Ro]', (gba.ewram32[0x210 >> 2] >>> 0) === 0x11223344, 'OK');

    runThumb1(0x5888, { 1: 0x02000200, 2: 0x10 }, 0); // LDR R0, [R1, R2]
    record('Thumb Fmt7 LDR [Rb, Ro]', (gba.r[0] >>> 0) === 0x11223344, 'OK');

    gba.ewram[0x220] = 0x85;
    runThumb1(0x5688, { 1: 0x02000200, 2: 0x20 }, 0); // LDSB R0, [R1, R2]
    record('Thumb Fmt8 LDSB sign-extend', gba.r[0] === -123, `R0=${gba.r[0]}`);

    gba.ewram16[0x222 >> 1] = 0xFF80;
    runThumb1(0x5E88, { 1: 0x02000200, 2: 0x22 }, 0); // LDSH R0, [R1, R2] aligned
    record('Thumb Fmt8 LDSH aligned sign-extend', gba.r[0] === -128, `R0=${gba.r[0]}`);

    runThumb1(0x5E88, { 1: 0x02000200, 2: 0x23 }, 0); // LDSH R0, [R1, R2] misaligned -> sign-extends byte at 0x223 (0xFF -> -1)
    record('Thumb Fmt8 LDSH misaligned byte sign-extend', gba.r[0] === -1, `R0=${gba.r[0]}`);

    // Format 9 & 10: LDR/STR imm5, LDRH/STRH imm5
    runThumb1(0x6048, { 0: 0x55667788, 1: 0x02000300 }, 0); // STR R0, [R1, #4]
    runThumb1(0x6848, { 1: 0x02000300 }, 0);                // LDR R0, [R1, #4]
    record('Thumb Fmt9 STR/LDR [Rb, #4]', (gba.r[0] >>> 0) === 0x55667788, 'OK');

    runThumb1(0x8088, { 0: 0xABCD, 1: 0x02000300 }, 0);     // STRH R0, [R1, #4]
    runThumb1(0x8888, { 1: 0x02000300 }, 0);                // LDRH R0, [R1, #4]
    record('Thumb Fmt10 STRH/LDRH [Rb, #4]', (gba.r[0] >>> 0) === 0xABCD, 'OK');

    // Format 11: SP-relative STR/LDR
    runThumb1(0x9002, { 0: 0x13379999, 13: 0x02000400 }, 0); // STR R0, [SP, #8]
    runThumb1(0x9802, { 13: 0x02000400 }, 0);                // LDR R0, [SP, #8]
    record('Thumb Fmt11 STR/LDR [SP, #8]', (gba.r[0] >>> 0) === 0x13379999, 'OK');

    // Format 12 & 13: ADD Rd, PC/SP, #imm & ADD SP, #+-imm
    runThumb1(0xA004, {}, 0); // ADD R0, PC, #16
    record('Thumb Fmt12 ADD R0, PC, #16', (gba.r[0] >>> 0) === 0x02000014, 'OK');
    runThumb1(0xB084, { 13: 0x03007F00 }, 0); // SUB SP, #16
    record('Thumb Fmt13 SUB SP, #16', (gba.r[13] >>> 0) === 0x03007EF0, 'OK');

    // Format 14: PUSH {R0, R2, LR} (0xB505) and POP {R0, R2, PC} (0xBD05)
    runThumb1(0xB505, { 0: 11, 2: 22, 13: 0x02000500, 14: 0x02000121 }, 0);
    record('Thumb Fmt14 PUSH {R0,R2,LR}', (gba.r[13] >>> 0) === 0x020004F4, 'OK');
    runThumb1(0xBD05, { 13: 0x020004F4 }, 0);
    record('Thumb Fmt14 POP {R0,R2,PC}', gba.r[0] === 11 && gba.r[2] === 22 && (gba.r[15] >>> 0) === 0x02000120, 'OK');

    // Format 15: STMIA R0!, {R1, R2} (0xC006) & LDMIA R0!, {R3, R4} (0xC818)
    runThumb1(0xC006, { 0: 0x02000600, 1: 0x111, 2: 0x222 }, 0);
    runThumb1(0xC818, { 0: 0x02000600 }, 0);
    record('Thumb Fmt15 STMIA/LDMIA', gba.r[3] === 0x111 && gba.r[4] === 0x222 && (gba.r[0] >>> 0) === 0x02000608, 'OK');


    // Format 2 Register-Register ADD/SUB (8 cases)
    for (let r = 0; r < 4; r++) {
      runThumb1(0x1800 | (r << 6) | (1 << 3) | 0, Object.assign({ 1: 500 }, r !== 1 ? { [r]: 100 + r } : {}), 0);
      record(`Thumb Fmt2 ADD R0, R1, R${r}`, gba.r[0] === (r === 1 ? 1000 : 600 + r), 'OK');
      runThumb1(0x1A00 | (r << 6) | (1 << 3) | 0, Object.assign({ 1: 500 }, r !== 1 ? { [r]: 100 + r } : {}), 0);
      record(`Thumb Fmt2 SUB R0, R1, R${r}`, gba.r[0] === (r === 1 ? 0 : 400 - r), 'OK');
    }
    // Format 9 STRB / LDRB immediate (8 cases)
    for (let imm5 = 0; imm5 < 4; imm5++) {
      const bval = (0xA0 + imm5 * 9) & 0xFF;
      runThumb1(0x7008 | (imm5 << 6), { 0: bval, 1: 0x02000700 }, 0); // STRB R0, [R1, #imm5]
      record(`Thumb Fmt9 STRB #${imm5}`, gba.ewram[0x700 + imm5] === bval, 'OK');
      runThumb1(0x7808 | (imm5 << 6), { 1: 0x02000700 }, 0);          // LDRB R0, [R1, #imm5]
      record(`Thumb Fmt9 LDRB #${imm5}`, gba.r[0] === bval, 'OK');
    }
    // Format 16 B<cond> across 8 condition codes (8 cases)
    const tConds = [
      ['BNE', 1, 0, true], ['BCS', 2, C, true], ['BCC', 3, 0, true], ['BMI', 4, N, true],
      ['BPL', 5, 0, true], ['BVS', 6, V, true], ['BGE', 10, N|V, true], ['BLT', 11, N, true]
    ];
    for (const [cname, ccode, cflags, cexp] of tConds) {
      runThumb1(0xD006 | (ccode << 8), {}, cflags);
      record(`Thumb Fmt16 ${cname}`, (gba.r[15] >>> 0) === (cexp ? 0x02000010 : 0x02000002), 'OK');
    }

    // Format 16 & 18 & 19: Bcond, B, BL (32-bit pair)
    runThumb1(0xD004, {}, Z); // BEQ +8 (PC+4+8 = 0x0200000C)
    record('Thumb Fmt16 BEQ taken', (gba.r[15] >>> 0) === 0x0200000C, 'OK');
    runThumb1(0xE008, {}, 0); // B +16 (PC+4+16 = 0x02000014)
    record('Thumb Fmt18 B unconditional', (gba.r[15] >>> 0) === 0x02000014, 'OK');

    // Format 19: BL +0x100 (0xF000 0xF880)
    gba.cpsr = MODE_SYS | FLAG_T;
    gba.r[15] = 0x02000000;
    gba.ewram16[0] = 0xF000;
    gba.ewram16[1] = 0xF880;
    gba.stepThumb();
    gba.stepThumb();
    record('Thumb Fmt19 BL 32-bit pair', (gba.r[15] >>> 0) === 0x02000104 && (gba.r[14] >>> 0) === 0x02000005, 'OK');
  }

  // --------------------------------------------------------------------------
  // 3. Memory Map, Mirroring, Misaligned Rotated Reads, and SRAM 8-Bit Bus
  // --------------------------------------------------------------------------
  {
    // EWRAM 256 KB mirroring (0x02000000 mirrored at 0x02040000)
    gba.write32(0x02000010, 0x1337CAFE);
    record('Memory EWRAM 256KB Mirroring', gba.read32Aligned(0x02040010) === 0x1337CAFE, 'OK');

    // IWRAM 32 KB mirroring (0x03000020 mirrored at 0x03008020 and 0x03FFFFA0)
    gba.write32(0x03007FFC, 0x08000123);
    record('Memory IWRAM 32KB Mirroring (0x03FFFFFC)', gba.read32Aligned(0x03FFFFFC) === 0x08000123, 'OK');

    // VRAM 96 KB mirroring (0x06010000 mirrored at 0x06018000)
    gba.write16(0x06010004, 0x7FFF);
    record('Memory VRAM 96KB Mirroring (0x06018004)', gba.read16(0x06018004) === 0x7FFF, 'OK');

    // 8-bit write to Palette RAM duplicates byte across halfword
    gba.write8(0x05000002, 0x5A);
    record('Memory Palette 8-bit write duplication', gba.read16(0x05000002) === 0x5A5A, 'OK');

    // 8-bit write to OAM is ignored
    gba.write16(0x07000000, 0x1234);
    gba.write8(0x07000000, 0x99);
    record('Memory OAM 8-bit write ignored', gba.read16(0x07000000) === 0x1234, 'OK');

    // Misaligned 32-bit LDR rotation (+1, +2, +3 bytes)
    gba.write32(0x02001000, 0x11223344);
    record('Memory Misaligned LDR +1 (ROR 8)',  gba.read32(0x02001001) === 0x44112233, 'OK');
    record('Memory Misaligned LDR +2 (ROR 16)', gba.read32(0x02001002) === 0x33441122, 'OK');
    record('Memory Misaligned LDR +3 (ROR 24)', gba.read32(0x02001003) === 0x22334411, 'OK');

    // Misaligned 16-bit LDRH rotation (+1 byte -> ROR 8)
    gba.write16(0x02001004, 0xABCD);
    record('Memory Misaligned LDRH +1 (ROR 8)', gba.read16Rotated(0x02001005) === 0xCD0000AB, 'OK');

    // SRAM 8-bit bus behavior (8/16/32-bit reads duplicate byte)
    gba.write8(0x0E000123, 0x37);
    record('Memory SRAM 8-bit read',  gba.read8(0x0E000123) === 0x37, 'OK');
    record('Memory SRAM 16-bit read repeats byte', gba.read16(0x0E000123) === 0x3737 && (gba.read16Rotated(0x0E000123) >>> 0) === 0x37000037, 'OK');
    record('Memory SRAM 32-bit read repeats byte', gba.read32Aligned(0x0E000123) === 0x37373737, 'OK');

    // BIOS Open-bus protection when PC >= 0x4000
    gba.r[15] = 0x08000000;
    gba.biosLastFetch = 0xE129F000;
    record('Memory BIOS read protection returns latch', gba.read32Aligned(0x00000000) === 0xE129F000, 'OK');
  }

  // --------------------------------------------------------------------------
  // 4. BIOS Services: Div, Sqrt, and LZ77 Round-Trip
  // --------------------------------------------------------------------------
  {
    const divCases = [
      [100, 7], [-100, 7], [100, -7], [-100, -7],
      [0x7FFFFFFF, 1337], [-2147483647, 65536], [0, 42]
    ];
    for (const [num, den] of divCases) {
      gba.r[0] = num; gba.r[1] = den;
      gba.handleSwi(0x06);
      const expQ = (num / den) | 0;
      const expR = (num - Math.imul(expQ, den)) | 0;
      const expA = Math.abs(expQ) | 0;
      const ok = gba.r[0] === expQ && gba.r[1] === expR && gba.r[3] === expA;
      record(`BIOS SWI 0x06 Div(${num}, ${den})`, ok, `Q=${gba.r[0]} R=${gba.r[1]}`);
    }

    const sqrtCases = [0, 1, 4, 15, 16, 1337 * 1337, 0x7FFFFFFF, 0xFFFFFFFF];
    for (const val of sqrtCases) {
      gba.r[0] = val | 0;
      gba.handleSwi(0x08);
      const exp = Math.floor(Math.sqrt(val >>> 0));
      record(`BIOS SWI 0x08 Sqrt(${val >>> 0})`, (gba.r[0] >>> 0) === exp, `Got ${gba.r[0] >>> 0} exp ${exp}`);
    }

    // LZ77 Round-trip test: compress a repeating test pattern and decompress via SWI 0x11
    const orig = new Uint8Array(64);
    for (let i = 0; i < 64; i++) orig[i] = (i & 7) + 0x41; // Repeating "ABCDEFGH"

    // Build GBA LZ77 stream in EWRAM at 0x02002000:
    // Header: 0x10 | (64 << 8)
    // Block 1 (flag byte 0x00 = 8 raw literals: orig[0..7])
    // Block 2 (flag byte 0xF0 = 4 LZ77 backrefs of length 14 each = 56 bytes, disp=8 -> copy from -8)
    const lzAddr = 0x02002000;
    gba.write32(lzAddr, 0x10 | (64 << 8));
    let p = lzAddr + 4;
    gba.write8(p++, 0x00); // 8 literals
    for (let i = 0; i < 8; i++) gba.write8(p++, orig[i]);
    gba.write8(p++, 0xF0); // 4 compressed blocks (14 bytes each = 56 bytes, total 8+56=64)
    for (let i = 0; i < 4; i++) {
      // len = 14 -> (14 - 3) = 11 (0xB), disp = 8 -> (8 - 1) = 7 (0x007)
      gba.write8(p++, 0xB0);
      gba.write8(p++, 0x07);
    }

    const dstAddr = 0x02003000;
    for (let i = 0; i < 64; i++) gba.write8(dstAddr + i, 0);
    gba.r[0] = lzAddr;
    gba.r[1] = dstAddr;
    gba.handleSwi(0x11); // LZ77UnCompWram

    let lzMatch = true;
    for (let i = 0; i < 64; i++) {
      if (gba.read8(dstAddr + i) !== orig[i]) { lzMatch = false; break; }
    }
    record('BIOS SWI 0x11 LZ77 Round-Trip (64B)', lzMatch, 'OK');
  }

  // --------------------------------------------------------------------------
  // 5. PPU Bitmap Affine Scaling & Tile-512 Restriction Checks
  // --------------------------------------------------------------------------
  {
    // Test Mode 3 with 2x stretch (BG2PA = 0x80, BG2PD = 0x80)
    gba.reset();
    gba.write16(0x04000000, 0x0403); // Mode 3 + BG2
    gba.write16(0x04000020, 0x0080); // BG2PA = 0.5 (stretches 120x80 to 240x160!)
    gba.write16(0x04000026, 0x0080); // BG2PD = 0.5
    gba.write16(0x06000000, 0x001F); // Pixel (0,0) = Red
    gba.renderScanline(0);
    gba.renderScanline(1);
    const p00 = gba.fb32[0];
    const p11 = gba.fb32[240 + 1];
    record('PPU Mode 3 Affine 2x Stretch (BG2PA/PD)', p00 === p11 && (p00 & 0xFF) === 0xFF, 'OK');

    // Test Bitmap-Mode OBJ Tile < 512 restriction:
    // Put a sprite at (0,0) using tile 100 in Mode 3 -> must NOT draw!
    // Put a sprite at (16,0) using tile 512 in Mode 3 -> MUST draw!
    gba.pal16[0x101] = 0x03E0; // OBJ pal[1] = Green
    for (let i = 0; i < 32; i++) {
      gba.vram[0x10000 + 100 * 32 + i] = 0x11; // Tile 100
      gba.vram[0x10000 + 512 * 32 + i] = 0x11; // Tile 512
    }
    gba.write16(0x04000000, 0x1403); // Mode 3 + BG2 + OBJ
    gba.oam16[0] = 0x0000; gba.oam16[1] = 0x0000; gba.oam16[2] = 100; // OAM 0: x=0, tile=100 (<512, ignored!)
    gba.oam16[4] = 0x0000; gba.oam16[5] = 0x0010; gba.oam16[6] = 512; // OAM 1: x=16, tile=512 (>=512, drawn!)
    gba.bgRefX[0] = 0; gba.bgRefY[0] = 0;
    gba.renderScanline(0);
    const pxTile100 = gba.fb32[0];  // Should remain Red (BG2), NOT Green
    const pxTile512 = gba.fb32[16]; // Should be Green (OBJ tile 512)
    record('PPU Bitmap-Mode OBJ Tile 512+ Restriction', (pxTile100 & 0xFF) === 0xFF && ((pxTile512 >>> 8) & 0xFF) === 0xFF, 'OK');
  }

  // --------------------------------------------------------------------------
  // 6. Polyglot In-Memory Build & Round-Trip Verification
  // --------------------------------------------------------------------------
  if (typeof buildPolyglotFn === 'function') {
    const microRom = new Uint8Array(256);
    // ARM loop at 0x00: B 0xC0, valid header signature 0x96 at 0xB2
    microRom[0] = 0x2E; microRom[1] = 0x00; microRom[2] = 0x00; microRom[3] = 0xEA;
    for (let i = 4; i < 256; i++) microRom[i] = (i * 73 + 19) & 0xFF;
    microRom[0xB2] = 0x96;

    const polyBytes = buildPolyglotFn(microRom);
    // 1. Verify ROM prefix is byte-identical
    let prefixMatch = (polyBytes.length > microRom.length);
    for (let i = 0; i < microRom.length && prefixMatch; i++) {
      if (polyBytes[i] !== microRom[i]) prefixMatch = false;
    }
    record('Polyglot ROM prefix byte-identical', prefixMatch, `Len=${polyBytes.length}`);

    // 2. Verify reset sequence is present right after ROM prefix
    let resetPresent = true;
    for (let i = 0; i < B1337_RESET_SEQ.length; i++) {
      if (polyBytes[microRom.length + i] !== B1337_RESET_SEQ.charCodeAt(i)) {
        resetPresent = false;
        break;
      }
    }
    record('Polyglot Reset Sequence present at exact offset', resetPresent, 'OK');

    // 3. Extract embedded base64 payload and verify byte-exact match
    let asciiTail = '';
    const tailStart = microRom.length + B1337_RESET_SEQ.length;
    const CHUNK = 0x8000;
    for (let i = tailStart; i < polyBytes.length; i += CHUNK) {
      asciiTail += String.fromCharCode.apply(null, polyBytes.subarray(i, Math.min(polyBytes.length, i + CHUNK)));
    }
    const m = asciiTail.match(/<script id="b1337-rom-b64" type="text\/plain">([\s\S]*?)<\/script>/);
    const decoded = m ? base64ToUint8(m[1]) : new Uint8Array(0);
    const crcOrig = computeCRC32(microRom);
    const crcDec  = computeCRC32(decoded);
    record('Polyglot embedded Base64 matches ROM prefix CRC32', decoded.length === microRom.length && crcOrig === crcDec, `CRC32=${hex32(crcOrig)}`);

    // 4. Verify Re-1337ifying strips old tail and produces identical bytes (no nesting!)
    const rePolyBytes = buildPolyglotFn(polyBytes);
    let idempMatch = (rePolyBytes.length === polyBytes.length);
    for (let i = 0; i < polyBytes.length && idempMatch; i++) {
      if (rePolyBytes[i] !== polyBytes[i]) idempMatch = false;
    }
    record('Polyglot Re-1337ify strips tail (idempotent, no recursion)', idempMatch, `Len=${rePolyBytes.length}`);
  }

  gba.close();
  return { passed, failed, results };
}

// Capture pristine CSS & JS source at startup (never serialize the live DOM!)
let PRISTINE_STYLE_TEXT = '';
let PRISTINE_CORE_TEXT  = '';

function capturePristineSources() {
  const st = document.getElementById('b1337-style');
  const sc = document.getElementById('b1337-core');
  if (st) PRISTINE_STYLE_TEXT = st.textContent;
  if (sc) PRISTINE_CORE_TEXT  = sc.textContent;

// Enforce CSP dynamically even when loaded as a polyglot (where binary prefix pushed static <meta> into <body>)
function enforceZeroNetworkCSP() {
  try {
    const existing = document.head.querySelectorAll('meta[http-equiv="Content-Security-Policy"]');
    if (existing.length === 0) {
      const m = document.createElement('meta');
      m.httpEquiv = 'Content-Security-Policy';
      m.content = "default-src 'none'; script-src 'unsafe-inline' blob:; style-src 'unsafe-inline'; img-src data: blob:; media-src blob:; worker-src blob:; connect-src 'none';";
      document.head.appendChild(m);
    }
  } catch (e) {}
}

// Scan ROM for <plaintext (case-insensitive) and risky HTML tag-like openings
function scanRomForHtmlTokens(romBytes) {
  const riskyOpeners = [];
  let hasPlaintext = false;
  const tagNames = ['plaintext', 'script', 'style', 'title', 'textarea', 'xmp', 'iframe', 'noscript', 'noembed', 'noframes', 'svg', 'math'];

  for (let i = 0; i < romBytes.length; i++) {
    if (romBytes[i] === 0x3C) { // '<'
      const next = (i + 1 < romBytes.length) ? romBytes[i + 1] : 0;
      const isLetter = (next >= 0x41 && next <= 0x5A) || (next >= 0x61 && next <= 0x7A);
      const isSpecial = (next === 0x21 || next === 0x2F || next === 0x3F); // '!', '/', '?'
      if (isLetter || isSpecial) {
        let snippet = '';
        for (let k = 0; k < 12 && (i + k) < romBytes.length; k++) {
          const b = romBytes[i + k];
          snippet += (b >= 32 && b < 127) ? String.fromCharCode(b) : '.';
        }
        const lower = snippet.toLowerCase();
        if (lower.startsWith('<plaintext')) {
          hasPlaintext = true;
        }
        for (const tn of tagNames) {
          if (lower.startsWith('<' + tn) || lower.startsWith('</' + tn)) {
            riskyOpeners.push({ offset: i, token: snippet.slice(0, tn.length + 2) });
          }
        }
        if (lower.startsWith('<!--')) {
          riskyOpeners.push({ offset: i, token: '<!--' });
        }
        if (riskyOpeners.length < 64) {
          riskyOpeners.push({ offset: i, token: snippet.slice(0, 4) });
        }
      }
    }
  }
  return { hasPlaintext, riskyOpeners };
}

// Assemble the deterministic, pure 7-bit ASCII HTML document from pristine sources
function buildHtmlDocumentString(romBase64) {
  return '<!DOCTYPE html>\n' +
    '<html lang="en">\n' +

    '<meta charset="utf-8">\n' +
    '<meta http-equiv="Content-Security-Policy" content="default-src \'none\'; script-src \'unsafe-inline\' blob:; style-src \'unsafe-inline\'; img-src data: blob:; media-src blob:; worker-src blob:; connect-src \'none\';">\n' +
    '<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">\n' +
    '<title>1337Boy(TM) COLOR ADVANCE TURBO - Self-Hosted GBA Cartridge</title>\n' +

// Build a byte-exact 1337Boy Polyglot Cartridge (.1337.gba / .1337.html)
function buildPolyglotCartridge(inputBytes) {
  const tempGba = new GBA();
  const cleanRom = tempGba.stripPolyglotTail(inputBytes instanceof Uint8Array ? inputBytes : new Uint8Array(inputBytes));
  tempGba.close();

  const scan = scanRomForHtmlTokens(cleanRom);
  if (scan.hasPlaintext) {
    throw new Error('Refusing ROM: contains unrecoverable "<plaintext" sequence.');
  }

  const romB64 = uint8ToBase64(cleanRom);
  const htmlDoc = buildHtmlDocumentString(romB64);

  const resetLen = B1337_RESET_SEQ.length;
  const htmlLen  = htmlDoc.length;
  const out = new Uint8Array(cleanRom.length + resetLen + htmlLen);

  // 1. Original unmodified GBA ROM bytes
  out.set(cleanRom, 0);

  // 2. HTML5 Tokenizer Reset Sequence + Marker Comment
  let pos = cleanRom.length;
  for (let i = 0; i < resetLen; i++) {
    out[pos++] = B1337_RESET_SEQ.charCodeAt(i) & 0x7F;
  }

  // 3. Pure 7-bit ASCII HTML Document
  for (let i = 0; i < htmlLen; i++) {
    out[pos++] = htmlDoc.charCodeAt(i) & 0x7F;
  }

  return out;
}

// Web Audio Driver (AudioWorklet from inline Blob with ScriptProcessor fallback)
class B1337AudioDriver {
  constructor(gba) {
    this.gba = gba;
    this.ctx = null;
    this.muted = false;
    this.started = false;
  }

  startOnGesture() {
    if (this.started) {
      if (this.ctx && this.ctx.state === 'suspended') {
        this.ctx.resume().catch(() => {});
      }
      return;
    }
    this.started = true;
    try {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;
      this.ctx = new AudioCtx({ sampleRate: 27240 });

      // Use ScriptProcessorNode (universally supported without cross-origin worklet restrictions in file:// and CSP)
      // or AudioWorklet when Blob worker-src is permitted
      if (this.ctx.createScriptProcessor) {
        const node = this.ctx.createScriptProcessor(1024, 0, 2);
        node.onaudioprocess = (ev) => {
          const outL = ev.outputBuffer.getChannelData(0);
          const outR = ev.outputBuffer.getChannelData(1);
          for (let i = 0; i < outL.length; i++) {
            if (this.muted || this.gba.audioReadPos === this.gba.audioWritePos) {
              outL[i] = 0;
              outR[i] = 0;
            } else {
              outL[i] = this.gba.audioRingL[this.gba.audioReadPos];
              outR[i] = this.gba.audioRingR[this.gba.audioReadPos];
              this.gba.audioReadPos = (this.gba.audioReadPos + 1) & 8191;
            }
          }
        };
        node.connect(this.ctx.destination);
        this.node = node;
      }
    } catch (e) {}
  }

  toggleMute() {
    this.muted = !this.muted;
    return this.muted;
  }
}

  function updateDebuggerView() {

    const hex = (n) => (n >>> 0).toString(16).toUpperCase().padStart(8, '0');
    let regHtml = '';
    const names = ['R0','R1','R2','R3','R4','R5','R6','R7','R8','R9','R10','R11','R12','SP','LR','PC'];
    for (let i = 0; i < 16; i++) {
      regHtml += `<div class="b1337-reg-item"><span class="b1337-reg-name">${names[i]}</span><span class="b1337-reg-val">${hex(gba.r[i])}</span></div>`;
    }
    const c = gba.cpsr;
    const flg = ((c & FLAG_N) ? 'N' : '-') + ((c & FLAG_Z) ? 'Z' : '-') + ((c & FLAG_C) ? 'C' : '-') + ((c & FLAG_V) ? 'V' : '-') + '/' + ((c & FLAG_I) ? 'I' : '-') + ((c & FLAG_T) ? 'T' : 'A');
    regHtml += `<div class="b1337-reg-item"><span class="b1337-reg-name">CPSR</span><span class="b1337-reg-val">${hex(c)}</span></div>`;
    regHtml += `<div class="b1337-reg-item"><span class="b1337-reg-name">FLAGS</span><span class="b1337-reg-val">${flg} (V:${gba.vcount})</span></div>`;
    dbgRegs.innerHTML = regHtml;

    const isThumb = (c & FLAG_T) !== 0;
    const step = isThumb ? 2 : 4;
    const curPc = gba.r[15] >>> 0;
    let lines = '';
    for (let d = -3; d <= 6; d++) {
      const addr = (curPc + d * step) >>> 0;
      const line = gba.disassembleAt(addr, isThumb);
      if (d === 0) lines += `<span class="b1337-disasm-cur">&gt; ${line}</span>`;
