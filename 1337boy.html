// Precomputed CRC32 Table (IEEE 802.3 polynomial 0xEDB88320)
const CRC32_TABLE = new Uint32Array(256);
(function initCrcTable() {
  for (let i = 0; i < 256; i++) {
    let c = i;
    for (let k = 0; k < 8; k++) {
      c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    }
    CRC32_TABLE[i] = c >>> 0;
  }
})();

function computeCRC32(bytes) {
  let crc = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) {
    crc = CRC32_TABLE[(crc ^ bytes[i]) & 0xFF] ^ (crc >>> 8);
  }
  return (crc ^ 0xFFFFFFFF) >>> 0;
}

function uint8ToBase64(u8) {
  const CHUNK = 0x8000;
  const parts = [];
  for (let i = 0; i < u8.length; i += CHUNK) {
    parts.push(String.fromCharCode.apply(null, u8.subarray(i, i + CHUNK)));
  }
  return btoa(parts.join(''));
}

function base64ToUint8(b64) {
  const clean = b64.replace(/[\r\n\s]/g, '');
  if (!clean) return new Uint8Array(0);
  const bin = atob(clean);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) {
    out[i] = bin.charCodeAt(i) & 0xFF;

  return out;

    this.spsr    = 0;

    // Shifter carry out temporary
    this.shifterCarry = 0;

    // Open-bus & BIOS read latch
    this.biosLastFetch = 0xE129F000; // Post-startup/IRQ default BIOS latch
    this.lastFetchedOpcode = 0xE129F000;

    // Halt / Scheduler State
    this.halted = false;
    this.cycles = 0;
    this.scanlineCycles = 0;
    this.vcount = 0;
    this.keyMask = 0x03FF; // Active low: 1=released, 0=pressed

    // Internal Affine Reference Point Latches (28-bit signed 19.8 fixed point)
    this.bgRefX = new Int32Array(2); // BG2X, BG3X internal
    this.bgRefY = new Int32Array(2); // BG2Y, BG3Y internal

    // Timers (0..3)
    this.timerVal     = new Uint16Array(4);
    this.timerReload  = new Uint16Array(4);
    this.timerCnt     = new Uint16Array(4);
    this.timerSub     = new Int32Array(4);

    // DMA (0..3)
    this.dmaSrc    = new Uint32Array(4);
    this.dmaDst    = new Uint32Array(4);
    this.dmaCount  = new Uint32Array(4);
    this.dmaCnt    = new Uint16Array(4);
    this.dmaActive = new Uint8Array(4);

    // Direct Sound FIFOs A & B (32 bytes each)
    this.fifoA = new Int8Array(32);
    this.fifoB = new Int8Array(32);
    this.fifoAHead = 0; this.fifoATail = 0; this.fifoACount = 0; this.fifoALatch = 0;
    this.fifoBHead = 0; this.fifoBTail = 0; this.fifoBCount = 0; this.fifoBLatch = 0;

    // PSG Audio state
    this.psgPhase = new Float32Array(4);
    this.psgLfsr  = 0x7FFF;
    this.audioRingL = new Float32Array(8192);
    this.audioRingR = new Float32Array(8192);
    this.audioWritePos = 0;
    this.audioReadPos  = 0;
    this.audioSampleTimer = 0;

    // Tier 3: GPIO / Seiko S-3511A Real-Time Clock (RTC) state
    this.gpioData = 0;
    this.gpioDir  = 0;
    this.gpioCnt  = 0;
    this.rtcState = 0; // 0=IDLE, 1=CMD, 2=DATA
    this.rtcCmd   = 0;
    this.rtcBitIdx= 0;
    this.rtcByteIdx=0;
    this.rtcShift = 0;
    this.rtcStatus= 0x40; // 24-hour mode
    this.rtcReadBuf = new Uint8Array(8);

    // Tier 3: BroadcastChannel Link Cable (SIO)
    this.linkChannel = null;
    this.linkPeerConnected = false;
    this.linkId = (Math.random() * 0xFFFF) | 0;
    this.initLinkCable();

    this.sramDirty = false;
    this.romCrc32  = 0;
    this.romTitle  = 'NO CARTRIDGE';
    this.romCode   = '----';
    this.romMaker  = '--';
    this.headerValid = false;
    this.headerChecksum = 0;

    this.initBios();
    this.reset();
  }

  initLinkCable() {
    try {
      if (typeof BroadcastChannel !== 'undefined') {
        this.linkChannel = new BroadcastChannel('1337boy_link_cable');
        this.linkChannel.onmessage = (ev) => {
          const msg = ev.data;
          if (!msg || msg.sender === this.linkId) return;
          this.linkPeerConnected = true;
          if (msg.type === 'SIO_XFER') {
            // Store incoming 16-bit word in SIOMULTI1 (0x122) & SIODATA8 (0x12A)
            this.io16[0x122 >> 1] = msg.data & 0xFFFF;
            this.io16[0x12A >> 1] = msg.data & 0xFFFF;
            // Clear start bit (bit 7 of SIOCNT 0x128) and trigger SIO IRQ if bit 14 set
            const siocnt = this.io16[0x128 >> 1];
            this.io16[0x128 >> 1] = siocnt & ~0x0080;
            if (siocnt & 0x4000) {
              this.requestIrq(IRQ_SIO);
            }
          }
        };
      }
    } catch (e) {
      this.linkChannel = null;
    }
  }

  initBios() {
    this.bios.fill(0);
    // Write custom 1337Boy ARM BIOS vectors and IRQ dispatcher
    const w32 = (addr, val) => { this.bios32[addr >> 2] = val >>> 0; };

    // 0x0000: Reset vector -> B 0x0060
    w32(0x0000, 0xEA000016);
    // 0x0004: Undefined instruction -> B 0x0060
    w32(0x0004, 0xEA000015);
    // 0x0008: SWI vector -> B 0x0040 (HLE SWI trap + BX LR)
    w32(0x0008, 0xEA00000C);
    // 0x0018: IRQ vector -> B 0x0128 (Hardware-accurate IRQ stub)
    w32(0x0018, 0xEA000042);

    // 0x0040: SWI handler stub (CPU intercepts SWI in HLE, or if jumped here returns cleanly)
    w32(0x0040, 0xE1B0F00E); // MOVS PC, LR

    // 0x0060: Reset stub -> jump to 0x08000000
    w32(0x0060, 0xE3A00302); // MOV R0, #0x08000000
    w32(0x0064, 0xE12FFF10); // BX R0

    // 0x0128: Official-compatible IRQ dispatcher at 0x0128..0x0140:
    // Saves R0-R3, R12, LR_irq onto SP_irq, calls [0x03007FFC], restores and returns:
    w32(0x0128, 0xE92D500F); // STMDB SP!, {R0-R3, R12, LR}
    w32(0x012C, 0xE3A00301); // MOV R0, #0x04000000
    w32(0x0130, 0xE28FE000); // ADR LR, 0x0138
    w32(0x0134, 0xE510F004); // LDR PC, [R0, #-4]  (reads 0x03FFFFFC -> mirrors 0x03007FFC!)
    w32(0x0138, 0xE8BD500F); // LDMIA SP!, {R0-R3, R12, LR}
    w32(0x013C, 0xE25EF004); // SUBS PC, LR, #4

    // 0x0188: IntrWait / VBlankIntrWait return latch signature
    w32(0x0188, 0xE129F000);
  }

  close() { if (this.linkChannel) { try { this.linkChannel.close(); } catch(e){} } }

  reset() {
    this.ewram.fill(0);
    this.iwram.fill(0);
    this.io.fill(0);
    this.pal.fill(0);
    this.vram.fill(0);
    this.oam.fill(0);
    this.fb.fill(0);
    for (let i = 0; i < 240 * 160; i++) {
      this.fb32[i] = 0xFF000000;
    }

    this.r.fill(0);
    this.bankUsr.fill(0);
    this.bankFiq.fill(0);
    this.bankIrq.fill(0);
    this.bankSvc.fill(0);
    this.bankAbt.fill(0);
    this.bankUnd.fill(0);

    // Post-BIOS register state (GBATEK documented values)
    this.r[13] = 0x03007F00;      // SP_usr / SP_sys
    this.bankUsr[5] = 0x03007F00; // R13_usr
    this.bankIrq[0] = 0x03007FA0; // SP_irq
    this.bankSvc[0] = 0x03007FE0; // SP_svc
    this.r[14] = 0x08000000;      // LR
    this.r[15] = 0x08000000;      // PC -> Cartridge entry point
    this.cpsr  = MODE_SYS;        // System mode, ARM state, IRQ/FIQ enabled

    this.spsr = 0;
    this.spsrIrq = 0;
    this.spsrSvc = 0;
    this.spsrFiq = 0;
    this.spsrAbt = 0;
    this.spsrUnd = 0;

    // Documented Post-BIOS I/O Defaults
    this.io16[0x000 >> 1] = 0x0080; // DISPCNT (Forced blank initially or 0x0080)
    this.io16[0x020 >> 1] = 0x0100; // BG2PA = 1.0
    this.io16[0x026 >> 1] = 0x0100; // BG2PD = 1.0
    this.io16[0x030 >> 1] = 0x0100; // BG3PA = 1.0
    this.io16[0x036 >> 1] = 0x0100; // BG3PD = 1.0
    this.io16[0x088 >> 1] = 0x0200; // SOUNDBIAS = 0x0200
    this.io16[0x130 >> 1] = 0x03FF; // KEYINPUT (all released)
    this.io[0x300] = 0x01;          // POSTFLG = 1

    this.bgRefX[0] = 0; this.bgRefY[0] = 0;
    this.bgRefX[1] = 0; this.bgRefY[1] = 0;

    this.timerVal.fill(0);
    this.timerReload.fill(0);
    this.timerCnt.fill(0);
    this.timerSub.fill(0);

    this.dmaSrc.fill(0);
    this.dmaDst.fill(0);
    this.dmaCount.fill(0);
    this.dmaCnt.fill(0);
    this.dmaActive.fill(0);

    this.fifoAHead = 0; this.fifoATail = 0; this.fifoACount = 0; this.fifoALatch = 0;
    this.fifoBHead = 0; this.fifoBTail = 0; this.fifoBCount = 0; this.fifoBLatch = 0;

    this.halted = false;
    this.cycles = 0;
    this.scanlineCycles = 0;
    this.vcount = 0;
    this.biosLastFetch = 0xE129F000;
    this.lastFetchedOpcode = 0xE129F000;
  }

  loadRom(u8) {
    const raw = (u8 instanceof Uint8Array) ? u8 : new Uint8Array(u8);
    // Strip any polyglot HTML tail if someone loads a .1337.gba / .1337.html
    const stripped = this.stripPolyglotTail(raw);

    // Pad ROM to a multiple of 4 bytes so Uint16Array/Uint32Array views are aligned
    const paddedLen = (stripped.length + 3) & ~3;
    this.rom = new Uint8Array(Math.max(paddedLen, 4));
    this.rom.set(stripped);
    this.rawRomBytes = stripped; // Exact original bytes for CRC32 and 1337ify
    this.rom16 = new Uint16Array(this.rom.buffer);
    this.rom32 = new Uint32Array(this.rom.buffer);

    this.romCrc32 = computeCRC32(stripped);
    this.parseHeader(stripped);
    this.reset();
    this.loadAutosave();
  }

  stripPolyglotTail(u8) {
    // Search for the reset sequence + marker comment '<!--1337BOY-POLYGLOT-START-->'
    const seqBytes = new Uint8Array(B1337_RESET_SEQ.length);
    for (let i = 0; i < B1337_RESET_SEQ.length; i++) {
      seqBytes[i] = B1337_RESET_SEQ.charCodeAt(i);
    }
    if (u8.length >= seqBytes.length) {
      outer: for (let i = 0; i <= u8.length - seqBytes.length; i++) {
        if (u8[i] === seqBytes[0] && u8[i + 15] === seqBytes[15]) {
          for (let j = 0; j < seqBytes.length; j++) {
            if (u8[i + j] !== seqBytes[j]) continue outer;
          }
          return u8.subarray(0, i);
        }
      }
    }
    return u8;
  }

  parseHeader(u8) {
    if (u8.length < 0xC0) {
      this.romTitle = 'MICRO-ROM';
      this.romCode  = 'TEST';
      this.romMaker = '13';
      this.headerChecksum = 0;
      this.headerValid = false;
      return;
    }
    let title = '';
    for (let i = 0xA0; i < 0xAC; i++) {
      const c = u8[i];
      if (c === 0) break;
      title += (c >= 32 && c < 127) ? String.fromCharCode(c) : '?';
    }
    this.romTitle = title.trim() || 'UNTITLED';

    let code = '';
    for (let i = 0xAC; i < 0xB0; i++) {
      const c = u8[i];
      code += (c >= 32 && c < 127) ? String.fromCharCode(c) : '-';
    }
    this.romCode = code;

    let maker = '';
    for (let i = 0xB0; i < 0xB2; i++) {
      const c = u8[i];
      maker += (c >= 32 && c < 127) ? String.fromCharCode(c) : '-';
    }
    this.romMaker = maker;

    let chk = 0;
    for (let i = 0xA0; i <= 0xBC; i++) {
      chk = (chk - u8[i]) & 0xFF;
    }
    chk = (chk - 0x19) & 0xFF;
    this.headerChecksum = u8[0xBD];
    this.headerValid = (chk === u8[0xBD]) && (u8[0xB2] === 0x96);
  }

  loadAutosave() {
    try {
      const key = '1337boy_sram_' + this.romCrc32.toString(16);
      const saved = localStorage.getItem(key);
      if (saved) {
        const bytes = base64ToUint8(saved);
        this.sram.set(bytes.subarray(0, 0x8000));
      }
    } catch (e) {}
  }

  saveAutosave() {
    if (!this.sramDirty) return;
    this.sramDirty = false;
    try {
      const key = '1337boy_sram_' + this.romCrc32.toString(16);
      localStorage.setItem(key, uint8ToBase64(this.sram));
    } catch (e) {}
  }

  // ==========================================================================
  // Memory Map Bus Access (8 / 16 / 32-bit, Mirroring, Open-Bus, Misaligned)
  // ==========================================================================

  vramMirrorOffset(addr) {
    // 128 KB window (0x1FFFF), upper 64 KB mirrors 0x10000..0x17FFF at 0x18000..0x1FFFF
    let off = addr & 0x1FFFF;
    if (off >= 0x18000) off -= 0x8000;
    return off;
  }

  readOpenBus32(addr) {
    return this.lastFetchedOpcode >>> 0;
  }

  readBios32(addr) {
    // BIOS is only readable when PC is inside BIOS (< 0x4000)
    if ((this.r[15] >>> 0) < 0x4000) {
      const val = this.bios32[(addr & 0x3FFC) >>> 2];
      this.biosLastFetch = val;
      return val;
    }
    return this.biosLastFetch >>> 0;
  }

  read8(addr) {
    addr >>>= 0;
    const region = addr >>> 24;
    switch (region) {
      case 0x00: {
        if (addr >= 0x4000) return (this.readOpenBus32(addr) >>> ((addr & 3) << 3)) & 0xFF;
        const w = this.readBios32(addr);
        return (w >>> ((addr & 3) << 3)) & 0xFF;
      }
      case 0x02:
        return this.ewram[addr & 0x3FFFF];
      case 0x03:
        return this.iwram[addr & 0x7FFF];
      case 0x04:
        return this.readIo8(addr & 0xFFFFFF);
      case 0x05:
        return this.pal[addr & 0x3FF];
      case 0x06:
        return this.vram[this.vramMirrorOffset(addr)];
      case 0x07:
        return this.oam[addr & 0x3FF];
      case 0x08: case 0x09:
      case 0x0A: case 0x0B:
      case 0x0C: case 0x0D: {
        const off = addr & 0x1FFFFFF;
        if (off < this.rom.length) return this.rom[off];
        // Out-of-bounds ROM open-bus returns (addr/2) & 0xFFFF
        const ob = ((addr >>> 1) & 0xFFFF);
        return (addr & 1) ? (ob >>> 8) : (ob & 0xFF);
      }
      case 0x0E: case 0x0F:
        return this.sram[addr & 0x7FFF];
      default:
        return (this.readOpenBus32(addr) >>> ((addr & 3) << 3)) & 0xFF;
    }
  }

  read16(addr) {
    addr >>>= 0;
    const region = addr >>> 24;
    if (region === 0x0E || region === 0x0F) {
      const b = this.sram[addr & 0x7FFF];
      return b | (b << 8);
    }
    addr = (addr & ~1) >>> 0;
    switch (region) {
      case 0x00: {
        if (addr >= 0x4000) return (this.readOpenBus32(addr) >>> ((addr & 2) << 3)) & 0xFFFF;
        const w = this.readBios32(addr);
        return (w >>> ((addr & 2) << 3)) & 0xFFFF;
      }
      case 0x02:
        return this.ewram16[(addr & 0x3FFFE) >>> 1];
      case 0x03:
        return this.iwram16[(addr & 0x7FFE) >>> 1];
      case 0x04:
        return this.readIo16(addr & 0xFFFFFE);
      case 0x05:
        return this.pal16[(addr & 0x3FE) >>> 1];
      case 0x06:
        return this.vram16[this.vramMirrorOffset(addr) >>> 1];
      case 0x07:
        return this.oam16[(addr & 0x3FE) >>> 1];
      case 0x08: case 0x09:
      case 0x0A: case 0x0B:
      case 0x0C: case 0x0D: {
        const off = addr & 0x1FFFFFE;
        // Tier 3: GPIO / RTC port check (0x080000C4, 0x080000C6, 0x080000C8)
        if (off >= 0xC4 && off <= 0xC8 && (this.gpioCnt & 1)) {
          if (off === 0xC4) return this.gpioData;
          if (off === 0xC6) return this.gpioDir;
          if (off === 0xC8) return this.gpioCnt;
        }
        if (off < this.rom.length) return this.rom16[off >>> 1];
        return (addr >>> 1) & 0xFFFF;
      }
      case 0x0E: case 0x0F: {
        // 8-bit bus repeats byte across both lanes
        const b = this.sram[addr & 0x7FFF];
        return b | (b << 8);
      }
      default:
        return (this.readOpenBus32(addr) >>> ((addr & 2) << 3)) & 0xFFFF;
    }
  }

  read32Aligned(addr) {
    addr >>>= 0;
    const region = addr >>> 24;
    if (region === 0x0E || region === 0x0F) {
      const b = this.sram[addr & 0x7FFF];
      return (b * 0x01010101) >>> 0;
    }
    addr = (addr & ~3) >>> 0;
    switch (region) {
      case 0x00:
        if (addr >= 0x4000) return this.readOpenBus32(addr);
        return this.readBios32(addr);
      case 0x02:
        return this.ewram32[(addr & 0x3FFFC) >>> 2];
      case 0x03:
        return this.iwram32[(addr & 0x7FFC) >>> 2];
      case 0x04:
        return (this.readIo16(addr & 0xFFFFFC) | (this.readIo16((addr & 0xFFFFFC) + 2) << 16)) >>> 0;
      case 0x05:
        return this.pal32[(addr & 0x3FC) >>> 2];
      case 0x06:
        return this.vram32[this.vramMirrorOffset(addr) >>> 2];
      case 0x07:
        return this.oam32[(addr & 0x3FC) >>> 2];
      case 0x08: case 0x09:
      case 0x0A: case 0x0B:
      case 0x0C: case 0x0D: {
        const off = addr & 0x1FFFFFC;
        if (off < this.rom.length) return this.rom32[off >>> 2];
        const lo = (addr >>> 1) & 0xFFFF;
        const hi = ((addr + 2) >>> 1) & 0xFFFF;
        return (lo | (hi << 16)) >>> 0;
      }
      case 0x0E: case 0x0F: {
        // 8-bit SRAM bus repeats byte across all 4 bytes
        const b = this.sram[addr & 0x7FFF];
        return (b * 0x01010101) >>> 0;
      }
      default:
        return this.readOpenBus32(addr);
    }
  }

  // LDR misaligned word read: rotated right by (addr & 3) * 8
  read32(addr) {
    const w = this.read32Aligned(addr);
    const shift = (addr & 3) << 3;
    return shift ? ((w >>> shift) | (w << (32 - shift))) >>> 0 : w;
  }

  // LDRH misaligned read: on ARM7TDMI, rotated right by 8 if (addr & 1)
  read16Rotated(addr) {
    const h = this.read16(addr);
    if (addr & 1) {
      return (((h >>> 8) | (h << 24))) >>> 0;
    }
    return h;
  }

  // LDRSH signed halfword read: on ARM7TDMI, if (addr & 1) it sign-extends only the high byte!
  readSigned16(addr) {
    const h = this.read16(addr);
    if (addr & 1) {
      return (h << 16) >> 24;
    }
    return (h << 16) >> 16;
  }

  write8(addr, val) {
    addr >>>= 0;
    val &= 0xFF;
    const region = addr >>> 24;
    switch (region) {
      case 0x02:
        this.ewram[addr & 0x3FFFF] = val;
        break;
      case 0x03:
        this.iwram[addr & 0x7FFF] = val;
        break;
      case 0x04:
        this.writeIo8(addr & 0xFFFFFF, val);
        break;
      case 0x05:
        // 8-bit write to Palette RAM duplicates byte to halfword!
        this.pal16[(addr & 0x3FE) >>> 1] = val | (val << 8);
        break;
      case 0x06: {
        // 8-bit write to BG VRAM duplicates byte to halfword; ignored in OBJ VRAM
        const off = this.vramMirrorOffset(addr) & ~1;
        const mode = this.io16[0] & 7;
        const objBoundary = (mode >= 3) ? 0x14000 : 0x10000;
        if (off < objBoundary) {
          this.vram16[off >>> 1] = val | (val << 8);
        }
        break;
      }
      case 0x07:
        // 8-bit writes to OAM are ignored by GBA hardware!
        break;
      case 0x0E: case 0x0F:
        this.sram[addr & 0x7FFF] = val;
        this.sramDirty = true;
        break;
    }
  }

  write16(addr, val) {
    addr >>>= 0;
    val &= 0xFFFF;
    const region = addr >>> 24;
    if (region === 0x0E || region === 0x0F) {
      const b = (val >>> ((addr & 1) << 3)) & 0xFF;
      this.sram[addr & 0x7FFF] = b;
      this.sramDirty = true;
      return;
    }
    addr = (addr & ~1) >>> 0;
    switch (region) {
      case 0x02:
        this.ewram16[(addr & 0x3FFFE) >>> 1] = val;
        break;
      case 0x03:
        this.iwram16[(addr & 0x7FFE) >>> 1] = val;
        break;
      case 0x04:
        this.writeIo16(addr & 0xFFFFFE, val);
        break;
      case 0x05:
        this.pal16[(addr & 0x3FE) >>> 1] = val;
        break;
      case 0x06:
        this.vram16[this.vramMirrorOffset(addr) >>> 1] = val;
        break;
      case 0x07:
        this.oam16[(addr & 0x3FE) >>> 1] = val;
        break;
      case 0x08: {
        // Tier 3: GPIO / RTC registers at 0x080000C4..0x080000C8
        const off = addr & 0x1FFFFFE;
        if (off >= 0xC4 && off <= 0xC8) {
          this.writeGpio(off, val);
        }
        break;
      }
      case 0x0E: case 0x0F:
        // 16-bit write to SRAM writes the byte sitting on the selected byte lane
        this.sram[addr & 0x7FFF] = val & 0xFF;
        this.sramDirty = true;
        break;
    }
  }

  write32(addr, val) {
    addr >>>= 0;
    val >>>= 0;
    const region = addr >>> 24;
    if (region === 0x0E || region === 0x0F) {
      const b = (val >>> ((addr & 3) << 3)) & 0xFF;
      this.sram[addr & 0x7FFF] = b;
      this.sramDirty = true;
      return;
    }
    addr = (addr & ~3) >>> 0;
    switch (region) {
      case 0x02:
        this.ewram32[(addr & 0x3FFFC) >>> 2] = val;
        break;
      case 0x03:
        this.iwram32[(addr & 0x7FFC) >>> 2] = val;
        break;
      case 0x04:
        this.writeIo32(addr & 0xFFFFFC, val);
        break;
      case 0x05:
        this.pal32[(addr & 0x3FC) >>> 2] = val;
        break;
      case 0x06:
        this.vram32[this.vramMirrorOffset(addr) >>> 2] = val;
        break;
      case 0x07:
        this.oam32[(addr & 0x3FC) >>> 2] = val;
        break;
      case 0x0E: case 0x0F:
        this.sram[addr & 0x7FFF] = val & 0xFF;
        this.sramDirty = true;
        break;
    }
  }

  // Tier 3: GPIO & S-3511A RTC emulation
  writeGpio(off, val) {
    if (off === 0xC6) {
      this.gpioDir = val & 0xF;
    } else if (off === 0xC8) {
      this.gpioCnt = val & 1;
    } else if (off === 0xC4) {
      // Pin 0 = SCK, Pin 1 = SIO, Pin 2 = CS
      const prevSck = this.gpioData & 1;
      const prevCs  = (this.gpioData >> 2) & 1;
      this.gpioData = (this.gpioData & ~this.gpioDir) | (val & this.gpioDir);
      const cs  = (this.gpioData >> 2) & 1;
      const sck = this.gpioData & 1;
      const sio = (this.gpioData >> 1) & 1;

      if (!cs) {
        this.rtcState = 0;
        this.rtcBitIdx = 0;
        return;
      }
      if (!prevCs && cs) {
        this.rtcState = 1; // Command byte
        this.rtcBitIdx = 0;
        this.rtcShift = 0;
      }
      // Rising edge of SCK
      if (!prevSck && sck) {
        if (this.rtcState === 1) {
          this.rtcShift |= (sio << this.rtcBitIdx);
          this.rtcBitIdx++;
          if (this.rtcBitIdx === 8) {
            let cmd = this.rtcShift;
            // If magic nibble 0110 is in low bits (MSB-first), reverse bits
            if ((cmd & 0x0F) === 0x06) {
              let rev = 0;
              for (let i = 0; i < 8; i++) if (cmd & (1 << i)) rev |= (1 << (7 - i));
              cmd = rev;
            }
            this.rtcCmd = (cmd >> 1) & 7;
            const isRead = cmd & 1;
            this.rtcState = isRead ? 3 : 2;
            this.rtcBitIdx = 0;
            this.rtcByteIdx = 0;
            this.prepareRtcData();
          }
        } else if (this.rtcState === 3) {
          // Output bit on SIO
          const b = this.rtcReadBuf[this.rtcByteIdx] || 0;
          const bit = (b >> this.rtcBitIdx) & 1;
          this.gpioData = (this.gpioData & ~2) | (bit << 1);
          this.rtcBitIdx++;
          if (this.rtcBitIdx === 8) {
            this.rtcBitIdx = 0;
            this.rtcByteIdx++;
          }
        }
      }
    }
  }

  prepareRtcData() {
    const toBcd = (n) => (((Math.floor(n / 10) % 10) << 4) | (n % 10)) & 0xFF;
    const now = new Date();
    this.rtcReadBuf.fill(0);
    if (this.rtcCmd === 1) {
      // Status register
      this.rtcReadBuf[0] = this.rtcStatus;
    } else if (this.rtcCmd === 2) {
      // Date & Time (7 bytes: YY, MM, DD, DayOfWeek, HH, MM, SS)
      this.rtcReadBuf[0] = toBcd(now.getFullYear() - 2000);
      this.rtcReadBuf[1] = toBcd(now.getMonth() + 1);
      this.rtcReadBuf[2] = toBcd(now.getDate());
      this.rtcReadBuf[3] = toBcd(now.getDay());
      this.rtcReadBuf[4] = toBcd(now.getHours());
      this.rtcReadBuf[5] = toBcd(now.getMinutes());
      this.rtcReadBuf[6] = toBcd(now.getSeconds());
    } else if (this.rtcCmd === 3) {
      // Time only (3 bytes: HH, MM, SS)
      this.rtcReadBuf[0] = toBcd(now.getHours());
      this.rtcReadBuf[1] = toBcd(now.getMinutes());
      this.rtcReadBuf[2] = toBcd(now.getSeconds());
    }
  }

  // ==========================================================================
  // I/O Registers Read / Write
  // ==========================================================================

  readIo8(off) {
    if (off >= 0x400) {
      if ((off & 0xFFFF) === 0x800) return this.io[0x208];
      return (this.readOpenBus32(off) >>> ((off & 3) << 3)) & 0xFF;
    }
    const h = this.readIo16(off & ~1);
    return (off & 1) ? (h >>> 8) : (h & 0xFF);
  }

  readIo16(off) {
    if (off >= 0x400) {
      return 0;
    }
    switch (off) {
      case 0x006: // VCOUNT
        return this.vcount;
      case 0x100: return this.timerVal[0];
      case 0x102: return this.timerCnt[0];
      case 0x104: return this.timerVal[1];
      case 0x106: return this.timerCnt[1];
      case 0x108: return this.timerVal[2];
      case 0x10A: return this.timerCnt[2];
      case 0x10C: return this.timerVal[3];
      case 0x10E: return this.timerCnt[3];
      case 0x130: // KEYINPUT
        return this.keyMask & 0x03FF;
      case 0x200: // IE
        return this.io16[0x200 >> 1];
      case 0x202: // IF
        return this.io16[0x202 >> 1];
      case 0x208: // IME
        return this.io16[0x208 >> 1] & 1;
      default:
        return this.io16[off >>> 1];
    }
  }

  writeIo8(off, val) {
    if (off === 0x301) {
      // HALTCNT: bit 7 = 0 -> HALT, bit 7 = 1 -> STOP
      this.halted = true;
      return;
    }
    if (off >= 0x400) return;
    if (off === 0x202 || off === 0x203) {
      // Writing 1s to IF acknowledges (clears) those bits!
      const shift = (off & 1) << 3;
      this.io16[0x202 >> 1] &= ~(val << shift);
      return;
    }
    const cur = this.io16[off >>> 1];
    const next = (off & 1) ? ((cur & 0x00FF) | (val << 8)) : ((cur & 0xFF00) | val);
    this.writeIo16(off & ~1, next);
  }

  writeIo32(off, val) {
    if (off === 0x0A0) {
      // FIFO_A 32-bit write pushes 4 signed 8-bit samples
      this.pushFifoA(val & 0xFF);
      this.pushFifoA((val >>> 8) & 0xFF);
      this.pushFifoA((val >>> 16) & 0xFF);
      this.pushFifoA((val >>> 24) & 0xFF);
      return;
    }
    if (off === 0x0A4) {
      // FIFO_B 32-bit write pushes 4 signed 8-bit samples
      this.pushFifoB(val & 0xFF);
      this.pushFifoB((val >>> 8) & 0xFF);
      this.pushFifoB((val >>> 16) & 0xFF);
      this.pushFifoB((val >>> 24) & 0xFF);
      return;
    }
    this.writeIo16(off, val & 0xFFFF);
    this.writeIo16(off + 2, (val >>> 16) & 0xFFFF);
  }

  writeIo16(off, val) {
    if (off >= 0x400) return;
    switch (off) {
      case 0x004: // DISPSTAT (bits 0..2 are read-only status flags!)
        this.io16[0x004 >> 1] = (this.io16[0x004 >> 1] & 0x0007) | (val & 0xFFF8);
        return;
      case 0x006: // VCOUNT is read-only
        return;

      // BG2 / BG3 Reference Point Latches (0x28, 0x2A, 0x2C, 0x2E, 0x38, 0x3A, 0x3C, 0x3E)
      case 0x028: case 0x02A: {
        this.io16[off >>> 1] = val;
        const raw = this.io32[0x028 >> 2];
        this.bgRefX[0] = (raw << 4) >> 4; // Sign-extend 28-bit
        return;
      }
      case 0x02C: case 0x02E: {
        this.io16[off >>> 1] = val;
        const raw = this.io32[0x02C >> 2];
        this.bgRefY[0] = (raw << 4) >> 4;
        return;
      }
      case 0x038: case 0x03A: {
        this.io16[off >>> 1] = val;
        const raw = this.io32[0x038 >> 2];
        this.bgRefX[1] = (raw << 4) >> 4;
        return;
      }
      case 0x03C: case 0x03E: {
        this.io16[off >>> 1] = val;
        const raw = this.io32[0x03C >> 2];
        this.bgRefY[1] = (raw << 4) >> 4;
        return;
      }

      // Direct Sound FIFOs (16-bit write)
      case 0x0A0: case 0x0A2:
        this.pushFifoA(val & 0xFF);
        this.pushFifoA((val >>> 8) & 0xFF);
        return;
      case 0x0A4: case 0x0A6:
        this.pushFifoB(val & 0xFF);
        this.pushFifoB((val >>> 8) & 0xFF);
        return;

      case 0x082: // SOUNDCNT_H (FIFO reset bits 11 and 15)
        if (val & 0x0800) {
          this.fifoAHead = 0; this.fifoATail = 0; this.fifoACount = 0; this.fifoALatch = 0;
        }
        if (val & 0x8000) {
          this.fifoBHead = 0; this.fifoBTail = 0; this.fifoBCount = 0; this.fifoBLatch = 0;
        }
        this.io16[0x082 >> 1] = val & ~0x8800;
        return;

      // DMA0..3 Registers (0x0B0 .. 0x0DE)
      case 0x0B0: case 0x0B2: case 0x0B4: case 0x0B6: case 0x0B8:
      case 0x0BC: case 0x0BE: case 0x0C0: case 0x0C2: case 0x0C4:
      case 0x0C8: case 0x0CA: case 0x0CC: case 0x0CE: case 0x0D0:
      case 0x0D4: case 0x0D6: case 0x0D8: case 0x0DA: case 0x0DC:
        this.io16[off >>> 1] = val;
        return;

      case 0x0BA: this.writeDmaCnt(0, val); return;
      case 0x0C6: this.writeDmaCnt(1, val); return;
      case 0x0D2: this.writeDmaCnt(2, val); return;
      case 0x0DE: this.writeDmaCnt(3, val); return;

      // Timers 0..3
      case 0x100: this.timerReload[0] = val; return;
      case 0x102: this.writeTimerCnt(0, val); return;
      case 0x104: this.timerReload[1] = val; return;
      case 0x106: this.writeTimerCnt(1, val); return;
      case 0x108: this.timerReload[2] = val; return;
      case 0x10A: this.writeTimerCnt(2, val); return;
      case 0x10C: this.timerReload[3] = val; return;
      case 0x10E: this.writeTimerCnt(3, val); return;

      // Link Cable SIO (0x128 SIOCNT)
      case 0x128: {
        this.io16[0x128 >> 1] = val;
        if (val & 0x0080) {
          // Transfer start! Broadcast over BroadcastChannel if available
          const outData = this.io16[0x12A >> 1]; // SIOMLT_SEND / SIODATA8
          this.io16[0x120 >> 1] = outData; // SIOMULTI0
          if (this.linkChannel) {
            try {
              this.linkChannel.postMessage({ type: 'SIO_XFER', sender: this.linkId, data: outData });
            } catch (e) {}
          }
          // If no peer responds immediately, complete transfer cleanly
          this.io16[0x128 >> 1] = val & ~0x0080;
          if (val & 0x4000) this.requestIrq(IRQ_SIO);
        }
        return;
      }

      case 0x130: // KEYINPUT is read-only
        return;
      case 0x132: // KEYCNT
        this.io16[0x132 >> 1] = val;
        this.checkKeypadIrq();
        return;

      case 0x200: // IE
        this.io16[0x200 >> 1] = val;
        this.checkIrq();
        return;
      case 0x202: // IF (write 1 to clear!)
        this.io16[0x202 >> 1] &= ~val;
        return;
      case 0x208: // IME
        this.io16[0x208 >> 1] = val & 1;
        this.checkIrq();
        return;
      case 0x300: // POSTFLG / HALTCNT
        this.io[0x300] = val & 0xFF;
        if (val & 0xFF00) this.halted = true;
        return;
      default:
        this.io16[off >>> 1] = val;
    }
  }

  // ==========================================================================
  // Timers, DMA, Interrupts, Keypad, and Direct Sound FIFO
  // ==========================================================================

  pushFifoA(byteVal) {
    if (this.fifoACount < 32) {
      this.fifoA[this.fifoATail] = (byteVal << 24) >> 24;
      this.fifoATail = (this.fifoATail + 1) & 31;
      this.fifoACount++;
    }
  }

  pushFifoB(byteVal) {
    if (this.fifoBCount < 32) {
      this.fifoB[this.fifoBTail] = (byteVal << 24) >> 24;
      this.fifoBTail = (this.fifoBTail + 1) & 31;
      this.fifoBCount++;
    }
  }

  popFifoA() {
    if (this.fifoACount > 0) {
      this.fifoALatch = this.fifoA[this.fifoAHead];
      this.fifoAHead = (this.fifoAHead + 1) & 31;
      this.fifoACount--;
    }
    if (this.fifoACount <= 16) {
      this.triggerSoundDma(0x040000A0);
    }
  }

  popFifoB() {
    if (this.fifoBCount > 0) {
      this.fifoBLatch = this.fifoB[this.fifoBHead];
      this.fifoBHead = (this.fifoBHead + 1) & 31;
      this.fifoBCount--;
    }
    if (this.fifoBCount <= 16) {
      this.triggerSoundDma(0x040000A4);
    }
  }

  triggerSoundDma(fifoAddr) {
    for (let ch = 1; ch <= 2; ch++) {
      const cnt = this.dmaCnt[ch];
      if ((cnt & 0x8000) && ((cnt >>> 12) & 3) === 3) {
        if ((this.dmaDst[ch] >>> 0) === (fifoAddr >>> 0)) {
          this.executeDma(ch, true);
        }
      }
    }
  }

  writeTimerCnt(ch, val) {
    const prev = this.timerCnt[ch];
    this.timerCnt[ch] = val;
    this.io16[(0x102 + ch * 4) >> 1] = val;
    // Rising edge of Enable bit (bit 7): reload counter from reload latch
    if (!(prev & 0x0080) && (val & 0x0080)) {
      this.timerVal[ch] = this.timerReload[ch];
      this.timerSub[ch] = 0;
    }
  }

  stepTimers(cycles) {
    const shifts = [0, 6, 8, 10]; // Prescaler shifts: 1, 64, 256, 1024
    for (let ch = 0; ch < 4; ch++) {
      const cnt = this.timerCnt[ch];
      if (!(cnt & 0x0080)) continue;
      // Count-up (cascade) timers are stepped by the preceding timer's overflow
      if (ch > 0 && (cnt & 0x0004)) continue;

      this.timerSub[ch] += cycles;
      const shift = shifts[cnt & 3];
      const ticks = this.timerSub[ch] >>> shift;
      if (ticks > 0) {
        this.timerSub[ch] &= ((1 << shift) - 1);
        this.advanceTimer(ch, ticks);
      }
    }
  }

  advanceTimer(ch, ticks) {
    let val = this.timerVal[ch] + ticks;
    let overflows = 0;
    while (val >= 0x10000) {
      const rem = val - 0x10000;
      const span = 0x10000 - this.timerReload[ch];
      overflows++;
      if (rem >= span && span > 0) {
        overflows += (rem / span) | 0;
        val = this.timerReload[ch] + (rem % span);
      } else {
        val = this.timerReload[ch] + rem;
      }
    }
    this.timerVal[ch] = val & 0xFFFF;

    if (overflows > 0) {
      const cnt = this.timerCnt[ch];
      if (cnt & 0x0040) {
        this.requestIrq(IRQ_TIMER0 << ch);
      }
      // Check Direct Sound FIFO timer triggers (Timer 0 or Timer 1)
      if (ch === 0 || ch === 1) {
        const sndCntH = this.io16[0x082 >> 1];
        const timerA = (sndCntH >>> 10) & 1;
        const timerB = (sndCntH >>> 14) & 1;
        if (timerA === ch) this.popFifoA();
        if (timerB === ch) this.popFifoB();
      }
      // Cascade into next timer if Count-Up (bit 2) and Enable (bit 7) are set
      if (ch < 3) {
        const nextCnt = this.timerCnt[ch + 1];
        if ((nextCnt & 0x0084) === 0x0084) {
          this.advanceTimer(ch + 1, overflows);
        }
      }
    }
  }

  writeDmaCnt(ch, val) {
    const prev = this.dmaCnt[ch];
    this.dmaCnt[ch] = val;
    const base = 0x0B0 + ch * 12;
    this.io16[(base + 10) >> 1] = val;

    if (!(prev & 0x8000) && (val & 0x8000)) {
      const srcMasks = [0x07FFFFFF, 0x0FFFFFFF, 0x0FFFFFFF, 0x0FFFFFFF];
      const dstMasks = [0x07FFFFFF, 0x07FFFFFF, 0x07FFFFFF, 0x0FFFFFFF];
      const cntMasks = [0x3FFF, 0x3FFF, 0x3FFF, 0xFFFF];
      this.dmaSrc[ch] = this.io32[base >> 2] & srcMasks[ch];
      this.dmaDst[ch] = this.io32[(base + 4) >> 2] & dstMasks[ch];
      let c = this.io16[(base + 8) >> 1] & cntMasks[ch];
      if (c === 0) c = cntMasks[ch] + 1;
      this.dmaCount[ch] = c;

      const timing = (val >>> 12) & 3;
      if (timing === 0) {
        // Immediate DMA
        this.executeDma(ch, false);
      }
    }
  }

  triggerDmaTiming(timingType) {
    for (let ch = 0; ch < 4; ch++) {
      const cnt = this.dmaCnt[ch];
      if ((cnt & 0x8000) && ((cnt >>> 12) & 3) === timingType) {
        this.executeDma(ch, false);
      }
    }
  }

  executeDma(ch, isSoundFifo) {
    const cnt = this.dmaCnt[ch];
    const is32 = isSoundFifo ? true : ((cnt & 0x0400) !== 0);
    const step = is32 ? 4 : 2;
    const dstCtrl = isSoundFifo ? 2 : ((cnt >>> 5) & 3);
    const srcCtrl = (cnt >>> 7) & 3;

    const srcDelta = (srcCtrl === 0 || srcCtrl === 3) ? step : (srcCtrl === 1 ? -step : 0);
    const dstDelta = (dstCtrl === 0 || dstCtrl === 3) ? step : (dstCtrl === 1 ? -step : 0);

    let count = isSoundFifo ? 4 : this.dmaCount[ch];
    let src = this.dmaSrc[ch] >>> 0;
    let dst = this.dmaDst[ch] >>> 0;

    if (is32) {
      src &= ~3;
      dst &= ~3;
      for (let i = 0; i < count; i++) {
        const w = this.read32Aligned(src);
        this.write32(dst, w);
        src = (src + srcDelta) >>> 0;
        dst = (dst + dstDelta) >>> 0;
      }
    } else {
      src &= ~1;
      dst &= ~1;
      for (let i = 0; i < count; i++) {
        const h = this.read16(src);
        this.write16(dst, h);
        src = (src + srcDelta) >>> 0;
        dst = (dst + dstDelta) >>> 0;
      }
    }

    this.dmaSrc[ch] = src;
    this.dmaDst[ch] = dst;

    if (cnt & 0x4000) {
      this.requestIrq(IRQ_DMA0 << ch);
    }

    const repeat = (cnt & 0x0200) !== 0;
    const timing = (cnt >>> 12) & 3;
    if (repeat && timing !== 0) {
      const cntMasks = [0x3FFF, 0x3FFF, 0x3FFF, 0xFFFF];
      const base = 0x0B0 + ch * 12;
      let c = this.io16[(base + 8) >> 1] & cntMasks[ch];
      if (c === 0) c = cntMasks[ch] + 1;
      this.dmaCount[ch] = c;
      if (dstCtrl === 3 && !isSoundFifo) {
        const dstMasks = [0x07FFFFFF, 0x07FFFFFF, 0x07FFFFFF, 0x0FFFFFFF];
        this.dmaDst[ch] = this.io32[(base + 4) >> 2] & dstMasks[ch];
      }
    } else {
      this.dmaCnt[ch] &= ~0x8000;
      this.io16[(0x0B0 + ch * 12 + 10) >> 1] = this.dmaCnt[ch];
    }
  }

  setKeys(pressedMask) {
    // pressedMask has 1 for pressed buttons (bit 0=A, 1=B, 2=Select, 3=Start, 4=Right, 5=Left, 6=Up, 7=Down, 8=R, 9=L)
    this.keyMask = (~pressedMask) & 0x03FF;
    this.io16[0x130 >> 1] = this.keyMask;
    this.checkKeypadIrq();
  }

  checkKeypadIrq() {
    const keycnt = this.io16[0x132 >> 1];
    if (!(keycnt & 0x4000)) return;
    const targetKeys = keycnt & 0x03FF;
    const pressed = (~this.keyMask) & 0x03FF;
    if (keycnt & 0x8000) {
      // AND mode: all selected keys pressed
      if ((pressed & targetKeys) === targetKeys && targetKeys !== 0) {
        this.requestIrq(IRQ_KEYPAD);
      }
    } else {
      // OR mode: any selected key pressed
      if ((pressed & targetKeys) !== 0) {
        this.requestIrq(IRQ_KEYPAD);
      }
    }
  }

  requestIrq(mask) {
    this.io16[0x202 >> 1] |= mask;
    this.checkIrq();
  }

  checkIrq() {
    const ie  = this.io16[0x200 >> 1];
    const irf = this.io16[0x202 >> 1];
    if (ie & irf) {
      this.halted = false;
    }
  }

  // ==========================================================================
  // CPU Mode Switching & Banked Registers
  // ==========================================================================

  getSpsr() {
    const m = this.cpsr & 0x1F;
    switch (m) {
      case MODE_FIQ: return this.spsrFiq;
      case MODE_IRQ: return this.spsrIrq;
      case MODE_SVC: return this.spsrSvc;
      case MODE_ABT: return this.spsrAbt;
      case MODE_UND: return this.spsrUnd;
      default:       return this.cpsr;
    }
  }

  setSpsr(val) {
    const m = this.cpsr & 0x1F;
    switch (m) {
      case MODE_FIQ: this.spsrFiq = val; break;
      case MODE_IRQ: this.spsrIrq = val; break;
      case MODE_SVC: this.spsrSvc = val; break;
      case MODE_ABT: this.spsrAbt = val; break;
      case MODE_UND: this.spsrUnd = val; break;
    }
  }

  switchMode(newMode) {
    const oldMode = this.cpsr & 0x1F;
    if (oldMode === newMode) return;

    // Save current banked registers
    if (oldMode === MODE_FIQ) {
      for (let i = 0; i < 7; i++) this.bankFiq[i] = this.r[8 + i];
    } else {
      for (let i = 0; i < 5; i++) this.bankUsr[i] = this.r[8 + i];
      if (oldMode === MODE_IRQ) {
        this.bankIrq[0] = this.r[13]; this.bankIrq[1] = this.r[14];
      } else if (oldMode === MODE_SVC) {
        this.bankSvc[0] = this.r[13]; this.bankSvc[1] = this.r[14];
      } else if (oldMode === MODE_ABT) {
        this.bankAbt[0] = this.r[13]; this.bankAbt[1] = this.r[14];
      } else if (oldMode === MODE_UND) {
        this.bankUnd[0] = this.r[13]; this.bankUnd[1] = this.r[14];
      } else {
        this.bankUsr[5] = this.r[13]; this.bankUsr[6] = this.r[14];
      }
    }

    // Restore new mode's banked registers
    if (newMode === MODE_FIQ) {
      for (let i = 0; i < 7; i++) this.r[8 + i] = this.bankFiq[i];
    } else {
      for (let i = 0; i < 5; i++) this.r[8 + i] = this.bankUsr[i];
      if (newMode === MODE_IRQ) {
        this.r[13] = this.bankIrq[0]; this.r[14] = this.bankIrq[1];
      } else if (newMode === MODE_SVC) {
        this.r[13] = this.bankSvc[0]; this.r[14] = this.bankSvc[1];
      } else if (newMode === MODE_ABT) {
        this.r[13] = this.bankAbt[0]; this.r[14] = this.bankAbt[1];
      } else if (newMode === MODE_UND) {
        this.r[13] = this.bankUnd[0]; this.r[14] = this.bankUnd[1];
      } else {
        this.r[13] = this.bankUsr[5]; this.r[14] = this.bankUsr[6];
      }
    }

    this.cpsr = (this.cpsr & ~0x1F) | (newMode & 0x1F);
  }

  readUsrReg(reg) {
    if (reg < 8 || reg === 15) return this.r[reg];
    const mode = this.cpsr & 0x1F;
    if (mode === MODE_USR || mode === MODE_SYS) return this.r[reg];
    if (reg < 13) {
      return (mode === MODE_FIQ) ? this.bankUsr[reg - 8] : this.r[reg];
    }
    return this.bankUsr[reg - 8];
  }

  writeUsrReg(reg, val) {
    if (reg < 8 || reg === 15) {
      this.r[reg] = val;
      return;
    }
    const mode = this.cpsr & 0x1F;
    if (mode === MODE_USR || mode === MODE_SYS) {
      this.r[reg] = val;
      return;
    }
    if (reg < 13 && mode !== MODE_FIQ) {
      this.r[reg] = val;
      return;
    }
    this.bankUsr[reg - 8] = val;
  }

  triggerIrqException() {
    const savedCpsr = this.cpsr;
    const isThumb = (savedCpsr & FLAG_T) !== 0;
    // LR_irq = address of next instruction to execute + 4
    const nextPc = this.r[15] + 4;
    this.switchMode(MODE_IRQ);
    this.spsrIrq = savedCpsr;

        return (val << imm5) | 0;
      case 1: // LSR
        if (imm5 === 0) {
          // LSR #32
          this.shifterCarry = (val >>> 31) & 1;
          return 0;
        }
        this.shifterCarry = (val >>> (imm5 - 1)) & 1;
        return (val >>> imm5) | 0;
      case 2: // ASR
        if (imm5 === 0) {
          // ASR #32
          this.shifterCarry = (val >>> 31) & 1;
          return (val >> 31) | 0;
        }
        this.shifterCarry = (val >>> (imm5 - 1)) & 1;
        return (val >> imm5) | 0;
      case 3: // ROR / RRX
        if (imm5 === 0) {
          // RRX #1
          this.shifterCarry = val & 1;
          return ((carryIn << 31) | (val >>> 1)) | 0;
        }
        this.shifterCarry = (val >>> (imm5 - 1)) & 1;
        return ((val >>> imm5) | (val << (32 - imm5))) | 0;
    }
    return val;
  }

  // Barrel Shifter (Register shift amount in bottom byte of Rs)
  shiftReg(val, type, amount, carryIn) {
    val |= 0;
    amount &= 0xFF;
    if (amount === 0) {
      this.shifterCarry = carryIn;
      return val;
    }
    switch (type) {
      case 0: // LSL
        if (amount < 32) {
          this.shifterCarry = (val >>> (32 - amount)) & 1;
          return (val << amount) | 0;
        } else if (amount === 32) {
          this.shifterCarry = val & 1;
          return 0;
        } else {
          this.shifterCarry = 0;
          return 0;
        }
      case 1: // LSR
        if (amount < 32) {
          this.shifterCarry = (val >>> (amount - 1)) & 1;
          return (val >>> amount) | 0;
        } else if (amount === 32) {
          this.shifterCarry = (val >>> 31) & 1;
          return 0;
        } else {
          this.shifterCarry = 0;
          return 0;
        }
      case 2: // ASR
        if (amount < 32) {
          this.shifterCarry = (val >>> (amount - 1)) & 1;
          return (val >> amount) | 0;
        } else {
          this.shifterCarry = (val >>> 31) & 1;
          return (val >> 31) | 0;
        }
      case 3: { // ROR
        const rot = amount & 31;
        if (rot === 0) {
          this.shifterCarry = (val >>> 31) & 1;
          return val;
        }
        this.shifterCarry = (val >>> (rot - 1)) & 1;
        return ((val >>> rot) | (val << (32 - rot))) | 0;
      }
    }
    return val;
  }

  stepInstruction() {
    // Check pending interrupts if IME=1 and CPSR I=0
    if ((this.io16[0x208 >> 1] & 1) && !(this.cpsr & FLAG_I)) {
      if (this.io16[0x200 >> 1] & this.io16[0x202 >> 1]) {
        this.halted = false;
        this.triggerIrqException();
      }
    }

    if (this.halted) {
      return 4;
    }

    if (this.cpsr & FLAG_T) {
      return this.stepThumb();
    } else {
      return this.stepArm();
    }
  }

  stepArm() {
    const pc = this.r[15] >>> 0;
    const instr = this.read32Aligned(pc);
    this.lastFetchedOpcode = instr;
    this.r[15] = (pc + 4) | 0; // Advance PC by +4 before decode; reading R15 adds +4 (total pc+8)

    const cond = instr >>> 28;
    if (cond !== 0xE && !this.checkCond(cond)) {
      return 1;
    }

    const top3 = (instr >>> 25) & 7;

    if (top3 === 0) {
      // Data Processing (Reg), Multiply, SWP, Halfword/Signed Transfer, BX, MRS/MSR
      const bit4 = (instr >>> 4) & 1;
      const bit7 = (instr >>> 7) & 1;

      // Check BX / Misc in 0x012FFF10 space (opcode 8..B with S=0)
      if ((instr & 0x0FFFFFF0) === 0x012FFF10) {
        // BX Rm
        const rmVal = this.getReg(instr & 0xF, 4);
        if (rmVal & 1) {
          this.cpsr |= FLAG_T;
          this.r[15] = (rmVal & ~1) | 0;
        } else {
          this.cpsr &= ~FLAG_T;
          this.r[15] = (rmVal & ~3) | 0;
        }
        return 3;
      }

      // Check Multiply / SWP / Halfword Transfer (bit4=1 and bit7=1)
      if (bit4 === 1 && bit7 === 1) {
        const sh = (instr >>> 5) & 3;
        if (sh === 0) {
          // Multiply, Multiply Long, or Single Data Swap (SWP/SWPB)
          if (((instr >>> 24) & 1) === 1) {
            // SWP / SWPB: bits 27..23 = 00010, bit22=B
            const isByte = (instr & (1 << 22)) !== 0;
            const rn = (instr >>> 16) & 0xF;
            const rd = (instr >>> 12) & 0xF;
            const rm = instr & 0xF;
            const addr = this.getReg(rn, 4) >>> 0;
            const rmVal = this.getReg(rm, 4);
            if (isByte) {
              const tmp = this.read8(addr);
              this.write8(addr, rmVal & 0xFF);
              this.r[rd] = tmp;
            } else {
              const tmp = this.read32(addr); // Misaligned SWP rotates read like LDR
              this.write32(addr, rmVal);
              this.r[rd] = tmp | 0;
            }
            return 4;
          } else if (((instr >>> 23) & 1) === 1) {
            // Multiply Long: UMULL, UMLAL, SMULL, SMLAL
            const isSigned = (instr & (1 << 22)) !== 0;
            const accum    = (instr & (1 << 21)) !== 0;
            const setFlags = (instr & (1 << 20)) !== 0;
            const rdHi = (instr >>> 16) & 0xF;
            const rdLo = (instr >>> 12) & 0xF;
            const rs   = (instr >>> 8) & 0xF;
            const rm   = instr & 0xF;

            const vm = this.getReg(rm, 4);
            const vs = this.getReg(rs, 4);
            let resBig = isSigned
              ? (BigInt(vm | 0) * BigInt(vs | 0))
              : (BigInt(vm >>> 0) * BigInt(vs >>> 0));

            if (accum) {
              const curHi = BigInt(this.r[rdHi] >>> 0);
              const curLo = BigInt(this.r[rdLo] >>> 0);
              const cur64 = (curHi << 32n) | curLo;
              resBig = (resBig + cur64) & 0xFFFFFFFFFFFFFFFFn;
            } else {
              resBig &= 0xFFFFFFFFFFFFFFFFn;
            }

            const lo = Number(resBig & 0xFFFFFFFFn) | 0;
            const hi = Number((resBig >> 32n) & 0xFFFFFFFFn) | 0;
            this.r[rdLo] = lo;
            this.r[rdHi] = hi;

            if (setFlags) {
              let c = this.cpsr & ~(FLAG_N | FLAG_Z);
              if (hi < 0) c |= FLAG_N;
              else if (hi === 0 && lo === 0) c |= FLAG_Z;
              this.cpsr = c;
            }
            return 4;
          } else {
            // MUL / MLA
            const accum    = (instr & (1 << 21)) !== 0;
            const setFlags = (instr & (1 << 20)) !== 0;
            const rd = (instr >>> 16) & 0xF;
            const rn = (instr >>> 12) & 0xF;
            const rs = (instr >>> 8) & 0xF;
            const rm = instr & 0xF;
            let res = Math.imul(this.getReg(rm, 4), this.getReg(rs, 4));
            if (accum) res = (res + this.getReg(rn, 4)) | 0;
            this.r[rd] = res;
            if (setFlags) this.setNZ(res);
            return 3;
          }
        } else {
          // Halfword and Signed Data Transfer (STRH, LDRH, LDRSB, LDRSH)
          const p = (instr >>> 24) & 1;
          const u = (instr >>> 23) & 1;
          const i = (instr >>> 22) & 1;
          const w = (instr >>> 21) & 1;
          const l = (instr >>> 20) & 1;
          const rn = (instr >>> 16) & 0xF;
          const rd = (instr >>> 12) & 0xF;

          const base = this.getReg(rn, 4) >>> 0;
          const off = i ? (((instr >>> 4) & 0xF0) | (instr & 0xF)) : (this.getReg(instr & 0xF, 4) >>> 0);
          const modAddr = u ? ((base + off) >>> 0) : ((base - off) >>> 0);
          const addr = p ? modAddr : base;

          if (l) {
            let val = 0;
            if (sh === 1) {
              // LDRH (rotated if misaligned!)
              val = this.read16Rotated(addr);
            } else if (sh === 2) {
              // LDRSB (sign-extended byte)
              val = (this.read8(addr) << 24) >> 24;
            } else {
              // LDRSH (sign-extended halfword; if misaligned, sign-extends byte at addr!)
              val = this.readSigned16(addr);
            }
            if (!p || w) {
              if (rn !== rd) this.r[rn] = modAddr | 0;
            }
            this.r[rd] = val | 0;
            if (rd === 15) this.r[15] &= ~3;
            return 3;
          } else {
            // STRH (sh === 1)
            const storeVal = this.getReg(rd, 8) & 0xFFFF; // STR R15 stores PC+12 (which is this.r[15]+8)
            this.write16(addr, storeVal);
            if (!p || w) {
              this.r[rn] = modAddr | 0;
            }
            return 2;
          }
        }
      }

      // Check MRS / MSR (opcode 8..B with S=0)
      if ((instr & 0x01900000) === 0x01000000) {
        const isMsr = (instr & (1 << 21)) !== 0;
        const useSpsr = (instr & (1 << 22)) !== 0;
        if (!isMsr) {
          // MRS Rd, CPSR/SPSR
          const rd = (instr >>> 12) & 0xF;
          this.r[rd] = useSpsr ? this.getSpsr() : this.cpsr;
        } else {
          // MSR CPSR/SPSR_<fields>, Rm
          const rmVal = this.getReg(instr & 0xF, 4);
          this.execMsr(instr, rmVal, useSpsr);
        }
        return 1;
      }

      // Otherwise, Data Processing (Register shift)
      return this.execDataProc(instr, false);
    }

    if (top3 === 1) {
      // Data Processing (Immediate) or MSR Immediate
      if ((instr & 0x01900000) === 0x01000000) {
        // MSR Immediate
        const useSpsr = (instr & (1 << 22)) !== 0;
        const imm8 = instr & 0xFF;
        const rot = ((instr >>> 8) & 0xF) << 1;
        const val = rot ? ((imm8 >>> rot) | (imm8 << (32 - rot))) : imm8;
        this.execMsr(instr, val, useSpsr);
        return 1;
      }
      return this.execDataProc(instr, true);
    }

    if (top3 === 2 || top3 === 3) {
      // Single Data Transfer (LDR / STR / LDRB / STRB)
      const isRegOff = (top3 === 3);
      if (isRegOff && (instr & 0x10)) {
        // Undefined instruction space
        return 1;
      }
      const p = (instr >>> 24) & 1;
      const u = (instr >>> 23) & 1;
      const b = (instr >>> 22) & 1;
      const w = (instr >>> 21) & 1;
      const l = (instr >>> 20) & 1;
      const rn = (instr >>> 16) & 0xF;
      const rd = (instr >>> 12) & 0xF;

      const base = this.getReg(rn, 4) >>> 0;
      let off = 0;
      if (!isRegOff) {
        off = instr & 0xFFF;
      } else {
        const rm = instr & 0xF;
        const shiftType = (instr >>> 5) & 3;
        const shiftImm5 = (instr >>> 7) & 0x1F;
        const carryIn = (this.cpsr & FLAG_C) ? 1 : 0;
        off = this.shiftImm(this.getReg(rm, 4), shiftType, shiftImm5, carryIn) >>> 0;
      }

      const modAddr = u ? ((base + off) >>> 0) : ((base - off) >>> 0);
      const addr = p ? modAddr : base;

      if (l) {
        const val = b ? this.read8(addr) : this.read32(addr);
        if (!p || w) {
          if (rn !== rd) this.r[rn] = modAddr | 0;
        }
        this.r[rd] = val | 0;
        if (rd === 15) {
          this.r[15] &= ~3;
        }
        return 3;
      } else {
        const storeVal = this.getReg(rd, 8); // PC+12 when storing R15
        if (b) {
          this.write8(addr, storeVal & 0xFF);
        } else {
          this.write32(addr, storeVal);
        }
        if (!p || w) {
          this.r[rn] = modAddr | 0;
        }
        return 2;
      }
    }

    if (top3 === 4) {
      // Block Data Transfer (LDM / STM)
      return this.execBlockTransfer(instr);
    }

    if (top3 === 5) {
      // Branch / Branch with Link (B / BL)
      const link = (instr >>> 24) & 1;
      const offset = ((instr << 8) >> 6); // Sign-extended 24-bit * 4
      if (link) {
        this.r[14] = this.r[15] | 0; // Next instruction address (pc+4)
      }
      this.r[15] = ((pc + 8 + offset) & ~3) | 0;
      return 3;
    }

    if (top3 === 7 && (instr & (1 << 24))) {
      // Software Interrupt (SWI)
      const comment = (instr >>> 16) & 0xFF;
      this.handleSwi(comment);
      return 3;
    }

    return 1;
  }

  execMsr(instr, val, useSpsr) {
    let mask = 0;
    if (instr & (1 << 19)) mask |= 0xFF000000; // Flags (f)
    if (instr & (1 << 18)) mask |= 0x00FF0000; // Status (s)
    if (instr & (1 << 17)) mask |= 0x0000FF00; // Extension (x)
    if (instr & (1 << 16)) {
      // Control (c) - only modifiable in privileged modes for CPSR
      if (useSpsr || (this.cpsr & 0x1F) !== MODE_USR) {
        mask |= 0x000000FF;
      }
    }
    if (useSpsr) {
      this.setSpsr((this.getSpsr() & ~mask) | (val & mask));
    } else {
      const nextCpsr = (this.cpsr & ~mask) | (val & mask);
      if ((mask & 0x1F) && ((nextCpsr & 0x1F) !== (this.cpsr & 0x1F))) {
        this.switchMode(nextCpsr & 0x1F);
      }
      this.cpsr = nextCpsr;
      this.checkIrq();
    }
  }

  execDataProc(instr, isImm) {
    const op = (instr >>> 21) & 0xF;
    const s  = (instr >>> 20) & 1;
    const rn = (instr >>> 16) & 0xF;
    const rd = (instr >>> 12) & 0xF;
    const carryIn = (this.cpsr & FLAG_C) ? 1 : 0;

    let pcOffset = 4; // Since this.r[15] is already pc+4, +4 gives pc+8
    let op2 = 0;

    if (isImm) {
      const imm8 = instr & 0xFF;
      const rot  = ((instr >>> 8) & 0xF) << 1;
      if (rot === 0) {
        op2 = imm8;
        this.shifterCarry = carryIn;
      } else {
        op2 = ((imm8 >>> rot) | (imm8 << (32 - rot))) | 0;
        this.shifterCarry = (op2 >>> 31) & 1;
      }
    } else {
      const rm = instr & 0xF;
      const shiftType = (instr >>> 5) & 3;
      const isRegShift = (instr & 0x10) !== 0;
      if (isRegShift) {
        // Register-specified shift takes an extra cycle, so R15 reads as PC+12!
        pcOffset = 8;
        const rs = (instr >>> 8) & 0xF;
        const shiftAmt = this.getReg(rs, 4) & 0xFF;
        const rmVal = this.getReg(rm, 8);
        op2 = this.shiftReg(rmVal, shiftType, shiftAmt, carryIn);
      } else {
        const imm5 = (instr >>> 7) & 0x1F;
        const rmVal = this.getReg(rm, 4);
        op2 = this.shiftImm(rmVal, shiftType, imm5, carryIn);
      }
    }

    const op1 = this.getReg(rn, pcOffset);
    let res = 0;
    let writeRd = true;

    switch (op) {
      case 0x0: // AND
        res = op1 & op2;
        if (s && rd !== 15) this.setNZC(res, this.shifterCarry);
        break;
      case 0x1: // EOR
        res = op1 ^ op2;
        if (s && rd !== 15) this.setNZC(res, this.shifterCarry);
        break;
      case 0x2: // SUB
        res = (op1 - op2) | 0;
        if (s && rd !== 15) this.subFlags(op1, op2, res);
        break;
      case 0x3: // RSB
        res = (op2 - op1) | 0;
        if (s && rd !== 15) this.subFlags(op2, op1, res);
        break;
      case 0x4: // ADD
        res = (op1 + op2) | 0;
        if (s && rd !== 15) this.addFlags(op1, op2, res);
        break;
      case 0x5: // ADC
        res = (op1 + op2 + carryIn) | 0;
        if (s && rd !== 15) this.adcFlags(op1, op2, carryIn, res);
        break;
      case 0x6: // SBC
        res = (op1 - op2 - (1 - carryIn)) | 0;
        if (s && rd !== 15) this.sbcFlags(op1, op2, carryIn, res);
        break;
      case 0x7: // RSC
        res = (op2 - op1 - (1 - carryIn)) | 0;
        if (s && rd !== 15) this.sbcFlags(op2, op1, carryIn, res);
        break;
      case 0x8: // TST
        res = op1 & op2;
        writeRd = false;
        this.setNZC(res, this.shifterCarry);
        break;
      case 0x9: // TEQ
        res = op1 ^ op2;
        writeRd = false;
        this.setNZC(res, this.shifterCarry);
        break;
      case 0xA: // CMP
        res = (op1 - op2) | 0;
        writeRd = false;
        this.subFlags(op1, op2, res);
        break;
      case 0xB: // CMN
        res = (op1 + op2) | 0;
        writeRd = false;
        this.addFlags(op1, op2, res);
        break;
      case 0xC: // ORR
        res = op1 | op2;
        if (s && rd !== 15) this.setNZC(res, this.shifterCarry);
        break;
      case 0xD: // MOV
        res = op2;
        if (s && rd !== 15) this.setNZC(res, this.shifterCarry);
        break;
      case 0xE: // BIC
        res = op1 & ~op2;
        if (s && rd !== 15) this.setNZC(res, this.shifterCarry);
        break;
      case 0xF: // MVN
        res = ~op2;
        if (s && rd !== 15) this.setNZC(res, this.shifterCarry);
        break;
    }

    if (s && rd === 15) {
      // S=1 with Rd=15 (or CMP/TST with Rd=15): restore CPSR from SPSR!
      const spsr = this.getSpsr();
      this.switchMode(spsr & 0x1F);
      this.cpsr = spsr;
      this.checkIrq();
    }

    if (writeRd) {
      this.r[rd] = res | 0;
      if (rd === 15) {
        if (this.cpsr & FLAG_T) {
          this.r[15] &= ~1;
        } else {
          this.r[15] &= ~3;
        }
      }
    }
    return 1;
  }

  // ARM Block Data Transfer (LDM / STM) with all ARM7TDMI edge cases!
  execBlockTransfer(instr) {
    const p = (instr >>> 24) & 1;
    const u = (instr >>> 23) & 1;
    const s = (instr >>> 22) & 1;
    const w = (instr >>> 21) & 1;
    const l = (instr >>> 20) & 1;
    const rn = (instr >>> 16) & 0xF;
    let rlist = instr & 0xFFFF;

    const origBase = this.getReg(rn, 4) >>> 0;

    // Edge case 1: Empty register list (rlist == 0) on ARM7TDMI!
    // Hardware transfers R15 and modifies base by +/- 0x40 (64 bytes)!
    if (rlist === 0) {
      let addr = origBase;
      if (u) {
        if (p) addr = (addr + 4) >>> 0;
      } else {
        addr = (addr - 0x40) >>> 0;
        if (!p) addr = (addr + 4) >>> 0;
      }
      if (w) {
        this.r[rn] = (u ? (origBase + 0x40) : (origBase - 0x40)) | 0;
      }
      if (l) {
        this.r[15] = (this.read32Aligned(addr) & ~3) | 0;
      } else {
        this.write32(addr, (this.r[15] + 8) | 0); // PC+12
      }
      return 3;
    }

    // Count bits in rlist
    let count = 0;
    for (let i = 0; i < 16; i++) {
      if (rlist & (1 << i)) count++;
    }

    const totalBytes = count << 2;
    const newBase = u ? ((origBase + totalBytes) >>> 0) : ((origBase - totalBytes) >>> 0);
    let addr = u
      ? (p ? ((origBase + 4) >>> 0) : origBase)
      : (p ? newBase : ((newBase + 4) >>> 0));

    const r15InList = (rlist & 0x8000) !== 0;
    const userBankTransfer = s && (!l || !r15InList);

    if (l) {
      // LDM
      // If Rn is in rlist, writeback is overwritten by the loaded value!
      if (w && !(rlist & (1 << rn))) {
        this.r[rn] = newBase | 0;
      }
      for (let i = 0; i < 16; i++) {
        if (rlist & (1 << i)) {
          const val = this.read32Aligned(addr);
          addr = (addr + 4) >>> 0;
          if (userBankTransfer) {
            this.writeUsrReg(i, val | 0);
          } else {
            this.r[i] = val | 0;
          }
        }
      }
      if (r15InList) {
        if (s) {
          const spsr = this.getSpsr();
          this.switchMode(spsr & 0x1F);
          this.cpsr = spsr;
          this.checkIrq();
        }
        if (this.cpsr & FLAG_T) {
          this.r[15] &= ~1;
        } else {
          this.r[15] &= ~3;
        }
      }
      return 2 + count;
    } else {
      // STM
      // Edge case 2: Base register Rn in rlist with W=1 on ARM7TDMI:
      // If Rn is the FIRST (lowest-numbered) register in rlist, store OLD base.
      // Otherwise, store NEW (written-back) base!
      const lowestBit = rlist & -rlist;
      const rnIsFirst = (lowestBit === (1 << rn));

      for (let i = 0; i < 16; i++) {
        if (rlist & (1 << i)) {
          let val = 0;
          if (i === 15) {
            val = (this.r[15] + 8) | 0; // PC+12
          } else if (i === rn && w && !rnIsFirst) {
            val = newBase | 0;
          } else if (userBankTransfer) {
            val = this.readUsrReg(i);
          } else {
            val = this.r[i];
          }
          this.write32(addr, val);
          addr = (addr + 4) >>> 0;
        }
      }
      if (w) {
        this.r[rn] = newBase | 0;
      }
      return 1 + count;
    }
  }

  // ==========================================================================
  // ARM7TDMI Thumb Instruction Set (All 19 Thumb Formats)
  // ==========================================================================

  stepThumb() {
    const pc = this.r[15] >>> 0;
    const instr = this.read16(pc);
    this.lastFetchedOpcode = (instr | (instr << 16)) >>> 0;
    this.r[15] = (pc + 2) | 0; // Advance PC by +2 before decode; reading R15 adds +2 (total pc+4)

    const top3 = (instr >>> 13) & 7;

    if (top3 === 0) {
      const sub = (instr >>> 11) & 3;
      if (sub !== 3) {
        // Format 1: Move shifted register (LSL, LSR, ASR)
        const imm5 = (instr >>> 6) & 0x1F;
        const rs   = (instr >>> 3) & 7;
        const rd   = instr & 7;
        const carryIn = (this.cpsr & FLAG_C) ? 1 : 0;
        const res = this.shiftImm(this.r[rs], sub, imm5, carryIn);
        this.r[rd] = res;
        this.setNZC(res, this.shifterCarry);
        return 1;
      } else {
        // Format 2: Add / Subtract (register or 3-bit immediate)
        const isImm = (instr & 0x0400) !== 0;
        const isSub = (instr & 0x0200) !== 0;
        const rnImm = (instr >>> 6) & 7;
        const rs    = (instr >>> 3) & 7;
        const rd    = instr & 7;
        const op1   = this.r[rs];
        const op2   = isImm ? rnImm : this.r[rnImm];
        if (isSub) {
          const res = (op1 - op2) | 0;
          this.r[rd] = res;
          this.subFlags(op1, op2, res);
        } else {
          const res = (op1 + op2) | 0;
          this.r[rd] = res;
          this.addFlags(op1, op2, res);
        }
        return 1;
      }
    }

    if (top3 === 1) {
      // Format 3: Move / Compare / Add / Subtract 8-bit Immediate
      const op   = (instr >>> 11) & 3;
      const rd   = (instr >>> 8) & 7;
      const imm8 = instr & 0xFF;
      const cur  = this.r[rd];
      if (op === 0) { // MOV Rd, #imm8
        this.r[rd] = imm8;
        this.setNZ(imm8);
      } else if (op === 1) { // CMP Rd, #imm8
        const res = (cur - imm8) | 0;
        this.subFlags(cur, imm8, res);
      } else if (op === 2) { // ADD Rd, #imm8
        const res = (cur + imm8) | 0;
        this.r[rd] = res;
        this.addFlags(cur, imm8, res);
      } else { // SUB Rd, #imm8
        const res = (cur - imm8) | 0;
        this.r[rd] = res;
        this.subFlags(cur, imm8, res);
      }
      return 1;
    }

    if (top3 === 2) {
      const subTop = (instr >>> 10) & 7;
      if (subTop === 0) {
        // Format 4: ALU Operations (16 ops)
        const op = (instr >>> 6) & 0xF;
        const rs = (instr >>> 3) & 7;
        const rd = instr & 7;
        const a  = this.r[rd];
        const b  = this.r[rs];
        const carryIn = (this.cpsr & FLAG_C) ? 1 : 0;
        let res = 0;
        switch (op) {
          case 0x0: res = a & b; this.r[rd] = res; this.setNZ(res); break; // AND
          case 0x1: res = a ^ b; this.r[rd] = res; this.setNZ(res); break; // EOR
          case 0x2: res = this.shiftReg(a, 0, b & 0xFF, carryIn); this.r[rd] = res; this.setNZC(res, this.shifterCarry); break; // LSL
          case 0x3: res = this.shiftReg(a, 1, b & 0xFF, carryIn); this.r[rd] = res; this.setNZC(res, this.shifterCarry); break; // LSR
          case 0x4: res = this.shiftReg(a, 2, b & 0xFF, carryIn); this.r[rd] = res; this.setNZC(res, this.shifterCarry); break; // ASR
          case 0x5: res = (a + b + carryIn) | 0; this.r[rd] = res; this.adcFlags(a, b, carryIn, res); break; // ADC
          case 0x6: res = (a - b - (1 - carryIn)) | 0; this.r[rd] = res; this.sbcFlags(a, b, carryIn, res); break; // SBC
          case 0x7: res = this.shiftReg(a, 3, b & 0xFF, carryIn); this.r[rd] = res; this.setNZC(res, this.shifterCarry); break; // ROR
          case 0x8: res = a & b; this.setNZ(res); break; // TST
          case 0x9: res = (0 - b) | 0; this.r[rd] = res; this.subFlags(0, b, res); break; // NEG
          case 0xA: res = (a - b) | 0; this.subFlags(a, b, res); break; // CMP
          case 0xB: res = (a + b) | 0; this.addFlags(a, b, res); break; // CMN
          case 0xC: res = a | b; this.r[rd] = res; this.setNZ(res); break; // ORR
          case 0xD: res = Math.imul(a, b); this.r[rd] = res; this.setNZ(res); break; // MUL
          case 0xE: res = a & ~b; this.r[rd] = res; this.setNZ(res); break; // BIC
          case 0xF: res = ~b; this.r[rd] = res; this.setNZ(res); break; // MVN
        }

      if (subTop === 1) {
        // Format 5: Hi register operations / Branch exchange (ADD, CMP, MOV, BX)
        const op = (instr >>> 8) & 3;
        const h1 = (instr >>> 7) & 1;
        const h2 = (instr >>> 6) & 1;
        const rs = ((instr >>> 3) & 7) | (h2 << 3);
        const rd = (instr & 7) | (h1 << 3);
        const vs = (rs === 15) ? ((this.r[15] + 2) | 0) : this.r[rs];
        const vd = (rd === 15) ? ((this.r[15] + 2) | 0) : this.r[rd];

        if (op === 0) { // ADD Rd, Rs (does not affect flags)
          this.r[rd] = (vd + vs) | 0;
          if (rd === 15) this.r[15] &= ~1;
        } else if (op === 1) { // CMP Rd, Rs (sets flags!)
          const res = (vd - vs) | 0;
          this.subFlags(vd, vs, res);
        } else if (op === 2) { // MOV Rd, Rs (does not affect flags)
          this.r[rd] = vs;
          if (rd === 15) this.r[15] &= ~1;
        } else { // BX Rs
          if (vs & 1) {
            this.cpsr |= FLAG_T;
            this.r[15] = (vs & ~1) | 0;
          } else {
            this.cpsr &= ~FLAG_T;
            this.r[15] = (vs & ~3) | 0;
          }
          return 3;
        }
        return 1;
      }

      if (subTop === 2 || subTop === 3) {
        // Format 6: PC-relative load: LDR Rd, [PC, #imm8*4]
        const rd   = (instr >>> 8) & 7;
        const imm8 = (instr & 0xFF) << 2;
        const addr = (((pc + 4) & ~3) + imm8) >>> 0;
        this.r[rd] = this.read32(addr) | 0;
        return 3;
      }

      // Format 7 & 8: Load / Store with register offset
      const ro = (instr >>> 6) & 7;
      const rb = (instr >>> 3) & 7;
      const rd = instr & 7;
      const addr = (this.r[rb] + this.r[ro]) >>> 0;

      if ((instr & 0x0200) === 0) {
        // Format 7: STR, STRB, LDR, LDRB [Rb, Ro]
        const op = (instr >>> 10) & 3;
        if (op === 0) { // STR
          this.write32(addr, this.r[rd]);
          return 2;
        } else if (op === 1) { // STRB
          this.write8(addr, this.r[rd] & 0xFF);
          return 2;
        } else if (op === 2) { // LDR
          this.r[rd] = this.read32(addr) | 0;
          return 3;
        } else { // LDRB
          this.r[rd] = this.read8(addr);
          return 3;
        }
      } else {
        // Format 8: STRH, LDSB, LDRH, LDSH [Rb, Ro]
        const op = (instr >>> 10) & 3;
        if (op === 0) { // STRH
          this.write16(addr, this.r[rd] & 0xFFFF);
          return 2;
        } else if (op === 1) { // LDSB
          this.r[rd] = (this.read8(addr) << 24) >> 24;
          return 3;
        } else if (op === 2) { // LDRH (rotated if misaligned!)
          this.r[rd] = this.read16Rotated(addr) | 0;
          return 3;
        } else { // LDSH
          this.r[rd] = this.readSigned16(addr);
          return 3;
        }
      }
    }

    if (top3 === 3) {
      // Format 9: Load / Store with immediate offset (word / byte)
      const op   = (instr >>> 11) & 3;
      const imm5 = (instr >>> 6) & 0x1F;
      const rb   = (instr >>> 3) & 7;
      const rd   = instr & 7;
      if (op === 0) { // STR Rd, [Rb, #imm5*4]
        this.write32((this.r[rb] + (imm5 << 2)) >>> 0, this.r[rd]);
        return 2;
      } else if (op === 1) { // LDR Rd, [Rb, #imm5*4]
        this.r[rd] = this.read32((this.r[rb] + (imm5 << 2)) >>> 0) | 0;
        return 3;
      } else if (op === 2) { // STRB Rd, [Rb, #imm5]
        this.write8((this.r[rb] + imm5) >>> 0, this.r[rd] & 0xFF);
        return 2;
      } else { // LDRB Rd, [Rb, #imm5]
        this.r[rd] = this.read8((this.r[rb] + imm5) >>> 0);
        return 3;
      }
    }

    if (top3 === 4) {
      if ((instr & 0x1000) === 0) {
        // Format 10: Load / Store halfword [Rb, #imm5*2]
        const isLoad = (instr & 0x0800) !== 0;
        const off    = ((instr >>> 6) & 0x1F) << 1;
        const rb     = (instr >>> 3) & 7;
        const rd     = instr & 7;
        const addr   = (this.r[rb] + off) >>> 0;
        if (isLoad) {
          this.r[rd] = this.read16Rotated(addr) | 0;
          return 3;
        } else {
          this.write16(addr, this.r[rd] & 0xFFFF);
          return 2;
        }
      } else {
        // Format 11: SP-relative Load / Store [SP, #imm8*4]
        const isLoad = (instr & 0x0800) !== 0;
        const rd     = (instr >>> 8) & 7;
        const off    = (instr & 0xFF) << 2;
        const addr   = (this.r[13] + off) >>> 0;
        if (isLoad) {
          this.r[rd] = this.read32(addr) | 0;
          return 3;
        } else {
          this.write32(addr, this.r[rd]);
          return 2;
        }
      }
    }

    if (top3 === 5) {
      if ((instr & 0x1000) === 0) {
        // Format 12: Load address (ADD Rd, PC/SP, #imm8*4)
        const useSp = (instr & 0x0800) !== 0;
        const rd    = (instr >>> 8) & 7;
        const off   = (instr & 0xFF) << 2;
        const base  = useSp ? (this.r[13] >>> 0) : (((pc + 4) & ~3) >>> 0);
        this.r[rd]  = (base + off) | 0;
        return 1;
      } else {
        const sub = (instr >>> 8) & 0xF;
        if (sub === 0) {
          // Format 13: Add offset to Stack Pointer (ADD SP, #+-imm7*4)
          const isNeg = (instr & 0x80) !== 0;
          const off   = (instr & 0x7F) << 2;
          this.r[13]  = (isNeg ? (this.r[13] - off) : (this.r[13] + off)) | 0;
          return 1;
        } else {
          // Format 14: Push / Pop registers
          const isPop = (instr & 0x0800) !== 0;
          const pclr  = (instr & 0x0100) !== 0;
          const rlist = instr & 0xFF;

          // Edge case: empty rlist and pclr=0 in Thumb PUSH/POP
          if (rlist === 0 && !pclr) {
            if (isPop) {
