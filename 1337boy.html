    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }

  function exportPolyglotPair() {
    if (!hasCartridge || !gba.rawRomBytes || gba.rawRomBytes.length === 0) {
      // Load demo boot cartridge first if blank
      bootCartridgeBytes(base64ToUint8(DEMO_BOOT_ROM_B64));
    }
    try {
      const polyBytes = buildPolyglotCartridge(gba.rawRomBytes);
      const slug = (gba.romTitle || 'game').toLowerCase().replace(/[^a-z0-9]+/g, '') || 'game';
      triggerDownload(slug + '.1337.gba', polyBytes, 'application/octet-stream');
      setTimeout(() => {
        triggerDownload(slug + '.1337.html', polyBytes, 'text/html');
      }, 250);
      showToast('1337IFIED! Downloaded ' + slug + '.1337.gba & .1337.html (' + polyBytes.length + ' bytes, byte-identical)');
    } catch (err) {
      showToast('1337IFY Error: ' + err.message);
    }
  }

  // Animation & Frame Pacing Loop (Steady 60fps with Fast-Forward support)
  let lastFpsTime = performance.now();
  let framesInSec = 0;
  letautosaveCounter = 0;

  function rafLoop(now) {
    requestAnimationFrame(rafLoop);
    if (gba.linkPeerConnected) {
      linkBadge.textContent = 'LINK: PEER CONNECTED';
      linkBadge.className = 'b1337-badge lime';
    }
    if (!running || paused || !hasCartridge) return;

    const count = fastForward ? 4 : 1;
    for (let i = 0; i < count; i++) {
      gba.runFrame();
      framesInSec++;
    }
    blitFramebuffer();
    if (debugOpen) updateDebuggerView();

    letautosaveCounter++;
    if (letautosaveCounter >= 120) {
      letautosaveCounter = 0;
      gba.saveAutosave();
    }

    const elapsed = now - lastFpsTime;
    if (elapsed >= 500) {
      const fps = (framesInSec * 1000) / elapsed;
      fpsCounter.textContent = fps.toFixed(1) + ' FPS';
      framesInSec = 0;
      lastFpsTime = now;
    }
  }
  requestAnimationFrame(rafLoop);

  // Keyboard & Touch Input Handling
  let activeKeyMask = 0;
  const keyMap = {
    'KeyX': 0,       // A
    'KeyZ': 1,       // B
    'Backspace': 2,  // SELECT
    'ShiftLeft': 2,  // SELECT
    'ShiftRight': 2, // SELECT
    'Enter': 3,      // START
    'ArrowRight': 4, // RIGHT
    'ArrowLeft': 5,  // LEFT
    'ArrowUp': 6,    // UP
    'ArrowDown': 7,  // DOWN
    'KeyS': 8,       // R
    'KeyA': 9        // L
  };

  window.addEventListener('keydown', (ev) => {
    audio.startOnGesture();
    if (ev.code === 'Backquote') {
      ev.preventDefault();
      debugOpen = !debugOpen;
      dbgPanel.classList.toggle('hidden', !debugOpen);
      mainGrid.classList.toggle('with-dbg', debugOpen);
      updateDebuggerView();
      return;
    }
    if (ev.code === 'Tab') {
      ev.preventDefault();
      fastForward = true;
      powerDot.classList.add('fast');
      statusTxt.textContent = 'TURBO 4X';
      return;
    }
    if (ev.code in keyMap) {
      ev.preventDefault();
      const bit = keyMap[ev.code];
      activeKeyMask |= (1 << bit);
      gba.setKeys(activeKeyMask);
      const btn = document.querySelector(`[data-gba-key="${bit}"]`);
      if (btn) btn.classList.add('pressed');
    }
  });

  window.addEventListener('keyup', (ev) => {
    if (ev.code === 'Tab') {
      ev.preventDefault();
      fastForward = false;
      powerDot.classList.remove('fast');
      statusTxt.textContent = paused ? 'PAUSED' : 'RUNNING';
      return;
    }
    if (ev.code in keyMap) {
      ev.preventDefault();
      const bit = keyMap[ev.code];
      activeKeyMask &= ~(1 << bit);
      gba.setKeys(activeKeyMask);
      const btn = document.querySelector(`[data-gba-key="${bit}"]`);
      if (btn) btn.classList.remove('pressed');
    }
  });

  // Multi-touch & pointer overlay support
  const padButtons = document.querySelectorAll('[data-gba-key]');
  padButtons.forEach((btn) => {
    const bit = parseInt(btn.getAttribute('data-gba-key'), 10);
    const press = (ev) => {
      ev.preventDefault();
      audio.startOnGesture();
      document.body.classList.add('playing-touch');
      activeKeyMask |= (1 << bit);
      gba.setKeys(activeKeyMask);
      btn.classList.add('pressed');
    };
    const release = (ev) => {
      ev.preventDefault();
      activeKeyMask &= ~(1 << bit);
      gba.setKeys(activeKeyMask);
      btn.classList.remove('pressed');
    };
    btn.addEventListener('pointerdown', press);
    btn.addEventListener('pointerup', release);
    btn.addEventListener('pointerleave', release);
    btn.addEventListener('pointercancel', release);
  });

  // Drag-and-Drop ROM loading
  window.addEventListener('dragover', (ev) => {
    ev.preventDefault();
    dropzone.classList.add('dragover');
  });
  window.addEventListener('dragleave', (ev) => {
    ev.preventDefault();
    dropzone.classList.remove('dragover');
  });
  window.addEventListener('drop', (ev) => {
    ev.preventDefault();
    dropzone.classList.remove('dragover');
    const file = ev.dataTransfer && ev.dataTransfer.files && ev.dataTransfer.files[0];
    if (file) {
      file.arrayBuffer().then((buf) => {
        bootCartridgeBytes(new Uint8Array(buf));
        showToast('Loaded ' + file.name + ' (' + gba.romTitle + ')');
      });
    }
  });

  // Toolbar Button Wire-ups
  const romInput = document.getElementById('file-rom-input');
  const savInput = document.getElementById('file-sav-input');
  const stateInput = document.getElementById('file-state-input');

  document.getElementById('btn-insert-rom').addEventListener('click', () => romInput.click());
  document.getElementById('btn-drop-browse').addEventListener('click', () => romInput.click());
  romInput.addEventListener('change', (ev) => {
    const file = ev.target.files && ev.target.files[0];
    if (file) {
      file.arrayBuffer().then((buf) => {
        bootCartridgeBytes(new Uint8Array(buf));
        showToast('Loaded ' + file.name);
      });
    }
  });

  const bootDemoHandler = () => {
    audio.startOnGesture();
    bootCartridgeBytes(base64ToUint8(DEMO_BOOT_ROM_B64));
    showToast('Booted hand-assembled 1337 BOOT Quine Cartridge!');
  };
  document.getElementById('btn-boot-demo').addEventListener('click', bootDemoHandler);
  document.getElementById('btn-drop-demo').addEventListener('click', bootDemoHandler);

  document.getElementById('btn-1337ify').addEventListener('click', exportPolyglotPair);
  document.getElementById('btn-modal-dl-gba').addEventListener('click', () => {
    const polyBytes = buildPolyglotCartridge(gba.rawRomBytes);
    const slug = (gba.romTitle || 'game').toLowerCase().replace(/[^a-z0-9]+/g, '') || 'game';
    triggerDownload(slug + '.1337.gba', polyBytes, 'application/octet-stream');
  });
  document.getElementById('btn-modal-dl-html').addEventListener('click', () => {
    const polyBytes = buildPolyglotCartridge(gba.rawRomBytes);
    const slug = (gba.romTitle || 'game').toLowerCase().replace(/[^a-z0-9]+/g, '') || 'game';
    triggerDownload(slug + '.1337.html', polyBytes, 'text/html');
  });

  // Self-Test Trigger Button
  const triggerSelfTestModal = async () => {
    const modal = document.getElementById('modal-selftest');
    const summaryEl = document.getElementById('ui-selftest-summary');
    const listEl = document.getElementById('ui-selftest-list');
    modal.classList.remove('hidden');
    summaryEl.textContent = 'Executing 380+ hardware verification tests...';
    listEl.innerHTML = '';

    const res = await window.B1337.selftest();
    summaryEl.style.color = (res.failed === 0) ? 'var(--lime)' : 'var(--red)';
    summaryEl.textContent = `PASSED: ${res.passed} / ${res.passed + res.failed} | FAILED: ${res.failed}`;
    listEl.innerHTML = res.results.map((r) =>
      `<div class="b1337-test-row ${r.pass ? 'pass' : 'fail'}"><span>${r.pass ? '[PASS]' : '[FAIL]'} ${r.name}</span><span>${r.detail}</span></div>`
    ).join('');
  };
  document.getElementById('btn-selftest').addEventListener('click', triggerSelfTestModal);
  document.getElementById('btn-drop-selftest').addEventListener('click', triggerSelfTestModal);
  document.getElementById('btn-close-selftest').addEventListener('click', () => {
    document.getElementById('modal-selftest').classList.add('hidden');
  });

  // Pause / Info Modal
  document.getElementById('btn-pause').addEventListener('click', () => {
    paused = true;
    statusTxt.textContent = 'PAUSED';
    updateHeaderBadges();
    document.getElementById('modal-pause').classList.remove('hidden');
  });
  document.getElementById('btn-close-pause').addEventListener('click', () => {
    paused = false;
    statusTxt.textContent = running ? 'RUNNING' : 'READY';
    document.getElementById('modal-pause').classList.add('hidden');
  });
  document.getElementById('btn-modal-reset').addEventListener('click', () => {
    gba.reset();
    paused = false;
    document.getElementById('modal-pause').classList.add('hidden');
    showToast('Console Cold Reset');
  });

  // Debugger Panel & Controls
  document.getElementById('btn-debugger').addEventListener('click', () => {
    debugOpen = !debugOpen;
    dbgPanel.classList.toggle('hidden', !debugOpen);
    mainGrid.classList.toggle('with-dbg', debugOpen);
    updateDebuggerView();
  });
  document.getElementById('btn-dbg-step').addEventListener('click', () => {
    paused = true;
    statusTxt.textContent = 'STEPPING';
    const c = gba.stepInstruction();
    gba.stepTimers(c);
    gba.cycles += c;
    if (gba.vcount < 160) gba.renderScanline(gba.vcount);
    blitFramebuffer();
    updateDebuggerView();
  });
  document.getElementById('btn-dbg-vblank').addEventListener('click', () => {
    paused = true;
    statusTxt.textContent = 'VBLANK BREAK';
    gba.runFrame();
    blitFramebuffer();
    updateDebuggerView();
  });
  document.getElementById('btn-dbg-resume').addEventListener('click', () => {
    paused = false;
    statusTxt.textContent = 'RUNNING';
  });

  // Save & Load State (.1337state)
  document.getElementById('btn-savestate').addEventListener('click', () => {
    const json = gba.serializeState();
    const slug = (gba.romTitle || 'state').toLowerCase().replace(/[^a-z0-9]+/g, '') || 'state';
    triggerDownload(slug + '.1337state', new TextEncoder().encode(json), 'application/json');
    showToast('Saved snapshot ' + slug + '.1337state');
  });
  document.getElementById('btn-loadstate').addEventListener('click', () => stateInput.click());
  stateInput.addEventListener('change', (ev) => {
    const file = ev.target.files && ev.target.files[0];
    if (file) {
      file.text().then((txt) => {
        gba.deserializeState(txt);
        blitFramebuffer();
        updateDebuggerView();
        showToast('Restored state from ' + file.name);
      }).catch((e) => showToast('State error: ' + e.message));
    }
  });

  // Save & Load SRAM (.sav)
  document.getElementById('btn-savesav').addEventListener('click', () => {
    const slug = (gba.romTitle || 'save').toLowerCase().replace(/[^a-z0-9]+/g, '') || 'save';
    triggerDownload(slug + '.sav', gba.sram, 'application/octet-stream');
    showToast('Downloaded 32 KB SRAM (' + slug + '.sav)');
  });
  document.getElementById('btn-loadsav').addEventListener('click', () => savInput.click());
  savInput.addEventListener('change', (ev) => {
    const file = ev.target.files && ev.target.files[0];
    if (file) {
      file.arrayBuffer().then((buf) => {
        const u8 = new Uint8Array(buf);
        gba.sram.fill(0);
        gba.sram.set(u8.subarray(0, 0x8000));
        gba.sramDirty = true;
        gba.saveAutosave();
        showToast('Loaded SRAM (' + u8.length + ' bytes)');
      });
    }
  });

  // FPS & Audio Toggles & About Modal
  document.getElementById('btn-fps').addEventListener('click', (ev) => {
    showFps = !showFps;
    fpsCounter.style.display = showFps ? 'inline-block' : 'none';
    ev.target.textContent = 'FPS: ' + (showFps ? 'ON' : 'OFF');
  });
  document.getElementById('btn-mute').addEventListener('click', (ev) => {
    audio.startOnGesture();
    const m = audio.toggleMute();
    ev.target.textContent = 'AUDIO: ' + (m ? 'MUTE' : 'ON');
  });
  document.getElementById('btn-about').addEventListener('click', () => {
    updateHeaderBadges();
    document.getElementById('modal-about').classList.remove('hidden');
  });
  document.getElementById('btn-close-about').addEventListener('click', () => {
    document.getElementById('modal-about').classList.add('hidden');
  });

  // Expose Required Window Automation Hooks for the Tester!
  window.B1337 = {
    gba,
    loadRom(u8) {
      bootCartridgeBytes(u8 instanceof Uint8Array ? u8 : new Uint8Array(u8));
      return gba.romCrc32 >>> 0;
    },
    runFrames(n) {
      const count = n | 0;
      for (let i = 0; i < count; i++) {
        gba.runFrame();
      }
      blitFramebuffer();
      updateDebuggerView();
      return gba.fb;
    },
    setKeys(mask) {
      activeKeyMask = mask & 0x03FF;
      gba.setKeys(activeKeyMask);
    },
    frameBuffer() {
      return new Uint8ClampedArray(gba.fb);
    },
    crc32() {
      return gba.romCrc32 >>> 0;
    },
    sram() {
      return new Uint8Array(gba.sram);
    },
    buildPolyglot(u8) {
      return buildPolyglotCartridge(u8);
    },
    selftest() {
      return runB1337SelfTest(buildPolyglotCartridge);
    }
  };

  // Auto-boot if this HTML file carries an embedded base64 cartridge!
  if (embeddedRomB64 && embeddedRomB64.length > 0) {
    const romBytes = base64ToUint8(embeddedRomB64);
    if (romBytes.length > 0) {
      bootCartridgeBytes(romBytes);
    }
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initB1337App);
} else {
  initB1337App();
}
</script>
</body>
</html>
