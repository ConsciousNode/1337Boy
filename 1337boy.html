    const rf = Math.pow(r5 / 31.0, 1.35);
    const gf = Math.pow(g5 / 31.0, 1.35);
    const bf = Math.pow(b5 / 31.0, 1.35);
    const mr = Math.min(1.0, Math.max(0.0, 0.86 * rf + 0.10 * gf + 0.04 * bf));
    const mg = Math.min(1.0, Math.max(0.0, 0.06 * rf + 0.78 * gf + 0.16 * bf));
    const mb = Math.min(1.0, Math.max(0.0, 0.05 * rf + 0.13 * gf + 0.82 * bf));
    const cr = Math.round(Math.pow(mr, 1.0 / 2.2) * 255) & 0xFF;
    const cg = Math.round(Math.pow(mg, 1.0 / 2.2) * 255) & 0xFF;
    const cb = Math.round(Math.pow(mb, 1.0 / 2.2) * 255) & 0xFF;
    BGR555_CC_LUT[c] = (0xFF000000 | (cb << 16) | (cg << 8) | cr) >>> 0;
  }
})();

function computeCRC32(bytes) {
  let crc = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) {
    crc = CRC32_TABLE[(crc ^ bytes[i]) & 0xFF] ^ (crc >>> 8);
  }
  return (crc ^ 0xFFFFFFFF) >>> 0;
}

function uint8ToBase64(u8) {
  const CHUNK = 0x8000;
  const parts = [];
  for (let i = 0; i < u8.length; i += CHUNK) {
    parts.push(String.fromCharCode.apply(null, u8.subarray(i, i + CHUNK)));
  }
  return btoa(parts.join(''));
}

function base64ToUint8(b64) {
  const clean = b64.replace(/[\r\n\s]/g, '');
  if (!clean) return new Uint8Array(0);
  const bin = atob(clean);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) {
    out[i] = bin.charCodeAt(i) & 0xFF;
  }
  return out;
}

// CPU Modes
const MODE_USR = 0x10;
const MODE_FIQ = 0x11;
const MODE_IRQ = 0x12;
const MODE_SVC = 0x13;
const MODE_ABT = 0x17;
const MODE_UND = 0x1B;
const MODE_SYS = 0x1F;

// CPSR Bit Masks
const FLAG_N = 0x80000000;
const FLAG_Z = 0x40000000;
const FLAG_C = 0x20000000;
const FLAG_V = 0x10000000;
const FLAG_I = 0x00000080;
const FLAG_F = 0x00000040;
const FLAG_T = 0x00000020;

// Interrupt Bit Masks
const IRQ_VBLANK  = 0x0001;
const IRQ_HBLANK  = 0x0002;
const IRQ_VCOUNT  = 0x0004;
const IRQ_TIMER0  = 0x0008;
const IRQ_TIMER1  = 0x0010;
const IRQ_TIMER2  = 0x0020;
const IRQ_TIMER3  = 0x0040;
const IRQ_SIO     = 0x0080;
const IRQ_DMA0    = 0x0100;
const IRQ_DMA1    = 0x0200;
const IRQ_DMA2    = 0x0400;
const IRQ_DMA3    = 0x0800;
const IRQ_KEYPAD  = 0x1000;
const IRQ_GAMEPAK = 0x2000;

class GBA {
  constructor() {
    // Memory Regions
    this.bios  = new Uint8Array(0x4000);     // 16 KB BIOS
    this.ewram = new Uint8Array(0x40000);    // 256 KB On-board WRAM
    this.iwram = new Uint8Array(0x8000);     // 32 KB On-chip WRAM
    this.io    = new Uint8Array(0x400);      // 1 KB I/O Registers
    this.pal   = new Uint8Array(0x400);      // 1 KB Palette RAM
    this.vram  = new Uint8Array(0x18000);    // 96 KB VRAM
    this.oam   = new Uint8Array(0x400);      // 1 KB OAM
    this.sram  = new Uint8Array(0x8000);     // 32 KB Save RAM (8-bit bus, initialized to 0xFF)
    this.flash = new Uint8Array(0x20000);    // 64 KB / 128 KB Flash ROM (2 x 64 KB banks, initialized to 0xFF)
    this.eeprom= new Uint8Array(0x2000);     // 512 B / 8 KB Serial EEPROM (initialized to 0xFF)
    this.sram.fill(0xFF);
    this.flash.fill(0xFF);
    this.eeprom.fill(0xFF);
    this.rom   = new Uint8Array(0);          // Up to 32 MB Game Pak ROM

    // Save Memory Controller State
    // saveType: 'AUTO' | 'SRAM' | 'FLASH64' | 'FLASH128' | 'EEPROM' | 'NONE'
    this.saveType = 'AUTO';
    this.detectedSaveType = 'AUTO';
    this.manualSaveType = null; // null = use auto-detected
    // Flash state machine
    this.flashStage = 0;        // 0=Idle, 1=Saw 0xAA@5555, 2=Saw 0x55@2AAA
    this.flashCmd = 0;          // 0=None, 0xA0=ByteWrite, 0xB0=BankSwitch
    this.flashIdMode = false;   // true after 0x90 command
    this.flashEraseMode = false;// true after 0x80 command
    this.flashBank = 0;         // 0 or 1 (for 128 KB Flash)
    // Chip IDs:
    // Flash 64 KB (512Kb): Macronix MX29L512 (0x1CC2: manuf=0xC2, dev=0x1C)
    // Flash 128 KB (1Mb):  Sanyo LE26FV10N1TS (0x1362: manuf=0x62, dev=0x13)
    this.flashManuf64 = 0xC2;
    this.flashDev64   = 0x1C;
    this.flashManuf128= 0x62;
    this.flashDev128  = 0x13;
    // EEPROM state
    this.eepromAddrBits = 0;    // 0=auto, 6=512B (64x8B), 14=8KB (1024x8B)
    this.eepromReadAddr = 0;
    this.eepromUsed = false;

    // Typed Views for Fast 16/32-bit Little-Endian Access
    this.bios16  = new Uint16Array(this.bios.buffer);
    this.bios32  = new Uint32Array(this.bios.buffer);
    this.ewram16 = new Uint16Array(this.ewram.buffer);
    this.ewram32 = new Uint32Array(this.ewram.buffer);
    this.iwram16 = new Uint16Array(this.iwram.buffer);
    this.iwram32 = new Uint32Array(this.iwram.buffer);
    this.io16    = new Uint16Array(this.io.buffer);
    this.io32    = new Uint32Array(this.io.buffer);
    this.pal16   = new Uint16Array(this.pal.buffer);
    this.pal32   = new Uint32Array(this.pal.buffer);
    this.vram16  = new Uint16Array(this.vram.buffer);
    this.vram32  = new Uint32Array(this.vram.buffer);
    this.oam16   = new Uint16Array(this.oam.buffer);
    this.oam32   = new Uint32Array(this.oam.buffer);
    this.rom16   = new Uint16Array(0);
    this.rom32   = new Uint32Array(0);

    // Framebuffer (240x160 RGBA)
    this.fb = new Uint8ClampedArray(240 * 160 * 4);
    this.fb32 = new Uint32Array(this.fb.buffer);
    this.colorCorrection = false;

    // Scanline compositing buffers (allocated once, zero allocation in hot loop)
    this.lineBgColor  = [new Uint16Array(240), new Uint16Array(240), new Uint16Array(240), new Uint16Array(240)];
    this.lineBgValid  = [new Uint8Array(240),  new Uint8Array(240),  new Uint8Array(240),  new Uint8Array(240)];
    this.lineObjColor = new Uint16Array(240);
    this.lineObjPrio  = new Uint8Array(240);
    this.lineObjSemi  = new Uint8Array(240);
    this.lineObjWin   = new Uint8Array(240);
    this.lineObjMosaic= new Uint8Array(240);

    this.pipe1  = 0;
    this.pipePc = -1; // Address corresponding to pipe0, or -1 when flushed

    // Waitstate Timing Lookup Tables (WAITCNT 0x04000204)
    this.ws16N = new Uint8Array(16);
    this.ws16S = new Uint8Array(16);
    this.ws32N = new Uint8Array(16);
    this.ws32S = new Uint8Array(16);

    this.lastPrefetchedPc = 0;
    this.dataRegion = 0;

    this.bankFiq = new Int32Array(7); // R8..R14 fiq
    this.bankIrq = new Int32Array(2); // R13, R14 irq
    this.bankSvc = new Int32Array(2); // R13, R14 svc
    this.bankAbt = new Int32Array(2); // R13, R14 abt
    this.bankUnd = new Int32Array(2); // R13, R14 und

    this.spsrFiq = 0;
    this.spsrIrq = 0;
    this.spsrSvc = 0;
    this.spsrAbt = 0;
    this.spsrUnd = 0;
    this.spsr    = 0;

    // Shifter carry out temporary
    this.shifterCarry = 0;

    // Open-bus & BIOS read latch
    this.biosLastFetch = 0xE129F000; // Post-startup/SoftReset default BIOS latch
    this.lastFetchedOpcode = 0xE129F000;
    this.inIntrWaitMask = 0;

    // Halt / Scheduler State
    this.halted = false;
    this.cycles = 0;
    this.scanlineCycles = 0;
    this.vcount = 0;
    this.keyMask = 0x03FF; // Active low: 1=released, 0=pressed

    // Internal Affine Reference Point Latches (28-bit signed 19.8 fixed point)
    this.bgRefX = new Int32Array(2); // BG2X, BG3X internal
    this.bgRefY = new Int32Array(2); // BG2Y, BG3Y internal

    // Timers (0..3)
    this.timerVal     = new Uint16Array(4);
    this.timerReload  = new Uint16Array(4);
    this.timerCnt     = new Uint16Array(4);
    this.timerSub     = new Int32Array(4);

    // DMA (0..3)
    this.dmaSrc    = new Uint32Array(4);
    this.dmaDst    = new Uint32Array(4);
    this.dmaCount  = new Uint32Array(4);
    this.dmaCnt    = new Uint16Array(4);
    this.dmaActive = new Uint8Array(4);

    // Direct Sound FIFOs A & B (32 bytes each)
    this.fifoA = new Int8Array(32);
    this.fifoB = new Int8Array(32);
    this.fifoAHead = 0; this.fifoATail = 0; this.fifoACount = 0; this.fifoALatch = 0;
    this.fifoBHead = 0; this.fifoBTail = 0; this.fifoBCount = 0; this.fifoBLatch = 0;

    // PSG Audio state (Channels 1..4 + Wave RAM 2x16 bytes)
    this.waveRam  = new Uint8Array(32); // Two 16-byte banks (64 4-bit samples)
    this.psgPhase = new Float32Array(4);
    this.psgVol   = new Uint8Array(4);
    this.psgEnvTimer = new Int32Array(4);
    this.psgLen   = new Int32Array(4);
    this.psgEnabled = new Uint8Array(4);
    this.psgFreq  = new Int32Array(4);
    this.psgSweepTimer = 0;
    this.psgFrameSeqStep = 0;
    this.psgFrameSeqSub  = 0;
    this.psgLfsr  = 0x7FFF;
    this.audioRingL = new Float32Array(8192);
    this.audioRingR = new Float32Array(8192);
    this.audioWritePos = 0;
    this.audioReadPos  = 0;
    this.audioSampleTimer = 0;

    // Cheats Engine
    this.cheats = []; // Array of { code, desc, enabled, addr, val, width, type }

    // Tier 3: GPIO / Seiko S-3511A Real-Time Clock (RTC) state
    this.gpioData = 0;
    this.gpioDir  = 0;
    this.gpioCnt  = 0;
    this.rtcState = 0; // 0=IDLE, 1=CMD, 2=DATA
    this.rtcCmd   = 0;
    this.rtcBitIdx= 0;
    this.rtcByteIdx=0;
    this.rtcShift = 0;
    this.rtcStatus= 0x40; // 24-hour mode
    this.rtcReadBuf = new Uint8Array(8);

    // Tier 3: BroadcastChannel Link Cable (SIO)
    this.linkChannel = null;
    this.linkPeerConnected = false;
    this.linkId = (Math.random() * 0xFFFF) | 0;
    this.initLinkCable();

    this.sramDirty = false;
    this.romCrc32  = 0;
    this.romTitle  = 'NO CARTRIDGE';
    this.romCode   = '----';
    this.romMaker  = '--';
    this.headerValid = false;
    this.headerChecksum = 0;

    this.initBios();
    this.reset();
  }

  initLinkCable() {
    try {
      if (typeof BroadcastChannel !== 'undefined') {
        this.linkChannel = new BroadcastChannel('1337boy_link_cable');
        this.linkChannel.onmessage = (ev) => {
          const msg = ev.data;
          if (!msg || msg.sender === this.linkId) return;
          this.linkPeerConnected = true;
          if (msg.type === 'SIO_XFER') {
            this.io16[0x122 >> 1] = msg.data & 0xFFFF;
            this.io16[0x12A >> 1] = msg.data & 0xFFFF;
            const siocnt = this.io16[0x128 >> 1];
            this.io16[0x128 >> 1] = siocnt & ~0x0080;
            if (siocnt & 0x4000) {
              this.requestIrq(IRQ_SIO);
            }
          }
        };
      }
    } catch (e) {
      this.linkChannel = null;
    }
  }

  initBios() {
    this.bios.fill(0);
    const w32 = (addr, val) => { this.bios32[addr >> 2] = val >>> 0; };

    // 0x0000: Reset vector -> B 0x0060
    w32(0x0000, 0xEA000016);
    // 0x0004: Undefined instruction -> B 0x0060
    w32(0x0004, 0xEA000015);
    // 0x0008: SWI vector -> B 0x0040
    w32(0x0008, 0xEA00000C);
    // 0x0018: IRQ vector -> B 0x0128 (Hardware-accurate IRQ stub)
    w32(0x0018, 0xEA000042);

    // 0x0040: SWI handler stub
    w32(0x0040, 0xE1B0F00E); // MOVS PC, LR
    w32(0x0044, 0xE3A02004); // MOV R2, #4 (SWI exit prefetch signature)
    w32(0x0048, 0xE3A02004);

    // 0x0060: Reset stub -> jump to 0x08000000
    w32(0x0060, 0xE3A00302); // MOV R0, #0x08000000
    w32(0x0064, 0xE12FFF10); // BX R0

    // 0x0128: Official-compatible IRQ dispatcher at 0x0128..0x0144:
    // Saves R0-R3, R12, LR_irq onto SP_irq, calls [0x03007FFC], restores and returns.
    // Note how our 2-stage pipeline naturally fetches:
    // - 0x0134 + 8 = 0x013C (0xE25EF004) when LDR PC, [R0, #-4] jumps to user ISR (during IRQ)
    // - 0x013C + 8 = 0x0144 (0xE55EC002) when SUBS PC, LR, #4 returns from IRQ (after IRQ)
    w32(0x0128, 0xE92D500F); // STMDB SP!, {R0-R3, R12, LR}
    w32(0x012C, 0xE3A00301); // MOV R0, #0x04000000
    w32(0x0130, 0xE28FE000); // ADR LR, 0x0138
    w32(0x0134, 0xE510F004); // LDR PC, [R0, #-4]  (reads 0x03FFFFFC -> mirrors 0x03007FFC!)
    w32(0x0138, 0xE8BD500F); // LDMIA SP!, {R0-R3, R12, LR}
    w32(0x013C, 0xE25EF004); // SUBS PC, LR, #4
    w32(0x0140, 0xE55EC002); // Post-IRQ BIOS opcode at 0x0140
    w32(0x0144, 0xE55EC002); // Post-IRQ BIOS opcode at 0x0144 (fetched when 0x013C executes)

    // 0x0188: IntrWait / VBlankIntrWait / MidBoot return latch signature
    w32(0x0188, 0xE129F000);
  }

  updateWaitstates(waitcnt) {
    const sramWait = [4, 3, 2, 8][waitcnt & 3];
    const ws0N     = [4, 3, 2, 8][(waitcnt >>> 2) & 3];
    const ws0S     = (waitcnt & 0x0010) ? 1 : 2;
    const ws1N     = [4, 3, 2, 8][(waitcnt >>> 5) & 3];
    const ws1S     = (waitcnt & 0x0080) ? 1 : 4;
    const ws2N     = [4, 3, 2, 8][(waitcnt >>> 8) & 3];
    const ws2S     = (waitcnt & 0x0400) ? 1 : 8;
    this.prefetchEnabled = (waitcnt & 0x4000) !== 0;
    if (!this.prefetchEnabled) {
      this.prefetchCount = 0;
      this.prefetchDuty  = 0;
    }

    // Populate 16-region tables (0x0..0xF)
    for (let i = 0; i < 16; i++) {
      this.ws16N[i] = 1;
      this.ws16S[i] = 1;
      this.ws32N[i] = 1;
      this.ws32S[i] = 1;
    }
    // 0x02: EWRAM (16-bit bus, 2 waitstates -> 3 cycles per 16-bit, 6 cycles per 32-bit)
    this.ws16N[0x2] = 3; this.ws16S[0x2] = 3;
    this.ws32N[0x2] = 6; this.ws32S[0x2] = 6;
    // 0x05, 0x06: Palette RAM & VRAM (16-bit bus -> 1 cycle per 16-bit, 2 cycles per 32-bit)
    this.ws16N[0x5] = 1; this.ws16S[0x5] = 1;
    this.ws32N[0x5] = 2; this.ws32S[0x5] = 2;
    this.ws16N[0x6] = 1; this.ws16S[0x6] = 1;
    this.ws32N[0x6] = 2; this.ws32S[0x6] = 2;
    // 0x08, 0x09: ROM Wait State 0 (16-bit bus)
    this.ws16N[0x8] = this.ws16N[0x9] = 1 + ws0N;
    this.ws16S[0x8] = this.ws16S[0x9] = 1 + ws0S;
    this.ws32N[0x8] = this.ws32N[0x9] = (1 + ws0N) + (1 + ws0S);
    this.ws32S[0x8] = this.ws32S[0x9] = (1 + ws0S) * 2;
    // 0x0A, 0x0B: ROM Wait State 1 (16-bit bus)
    this.ws16N[0xA] = this.ws16N[0xB] = 1 + ws1N;
    this.ws16S[0xA] = this.ws16S[0xB] = 1 + ws1S;
    this.ws32N[0xA] = this.ws32N[0xB] = (1 + ws1N) + (1 + ws1S);
    this.ws32S[0xA] = this.ws32S[0xB] = (1 + ws1S) * 2;
    // 0x0C, 0x0D: ROM Wait State 2 (16-bit bus)
    this.ws16N[0xC] = this.ws16N[0xD] = 1 + ws2N;
    this.ws16S[0xC] = this.ws16S[0xD] = 1 + ws2S;
    this.ws32N[0xC] = this.ws32N[0xD] = (1 + ws2N) + (1 + ws2S);
    this.ws32S[0xC] = this.ws32S[0xD] = (1 + ws2S) * 2;
    // 0x0E, 0x0F: Cart SRAM / Flash (8-bit bus)
    this.ws16N[0xE] = this.ws16N[0xF] = 1 + sramWait;
    this.ws16S[0xE] = this.ws16S[0xF] = 1 + sramWait;
    this.ws32N[0xE] = this.ws32N[0xF] = 1 + sramWait;
    this.ws32S[0xE] = this.ws32S[0xF] = 1 + sramWait;
  }

  close() { if (this.linkChannel) { try { this.linkChannel.close(); } catch(e){} } }

  reset() {
    this.ewram.fill(0);
    this.iwram.fill(0);
    this.io.fill(0);
    this.pal.fill(0);
    this.vram.fill(0);
    this.oam.fill(0);
    this.fb.fill(0);
    for (let i = 0; i < 240 * 160; i++) {
      this.fb32[i] = 0xFF000000;
    }

    this.r.fill(0);
    this.bankUsr.fill(0);
    this.bankFiq.fill(0);
    this.bankIrq.fill(0);
    this.bankSvc.fill(0);
    this.bankAbt.fill(0);
    this.bankUnd.fill(0);

    // Post-BIOS register state (GBATEK documented values)
    this.r[13] = 0x03007F00;      // SP_usr / SP_sys
    this.bankUsr[5] = 0x03007F00; // R13_usr
    this.bankIrq[0] = 0x03007FA0; // SP_irq
    this.bankSvc[0] = 0x03007FE0; // SP_svc
    this.r[14] = 0x08000000;      // LR
    this.r[15] = 0x08000000;      // PC -> Cartridge entry point
    this.cpsr  = MODE_SYS;        // System mode, ARM state, IRQ/FIQ enabled

    this.pipe0  = 0;
    this.pipe1  = 0;
    this.pipePc = -1;

    this.spsr = 0;
    this.spsrIrq = 0;
    this.spsrSvc = 0;
    this.spsrFiq = 0;
    this.spsrAbt = 0;
    this.spsrUnd = 0;

    // Documented Post-BIOS I/O Defaults
    this.io16[0x000 >> 1] = 0x0080; // DISPCNT
    this.io16[0x020 >> 1] = 0x0100; // BG2PA = 1.0
    this.io16[0x026 >> 1] = 0x0100; // BG2PD = 1.0
    this.io16[0x030 >> 1] = 0x0100; // BG3PA = 1.0
    this.io16[0x036 >> 1] = 0x0100; // BG3PD = 1.0
    this.io16[0x088 >> 1] = 0x0200; // SOUNDBIAS = 0x0200
    this.io16[0x130 >> 1] = 0x03FF; // KEYINPUT (all released)
    this.io16[0x204 >> 1] = 0x0000; // WAITCNT = 0x0000
    this.io[0x300] = 0x01;          // POSTFLG = 1

    this.updateWaitstates(0);
    this.prefetchCount = 0;
    this.prefetchDuty  = 0;
    this.memCycles = 0;
    this.dmaCyclesStall = 0;

    // Reset volatile Flash command state while preserving battery-backed save data
    this.flashStage = 0;
    this.flashCmd   = 0;
    this.flashIdMode = false;
    this.flashEraseMode = false;
    this.flashBank  = 0;
    this.eepromReadAddr = 0;

    this.bgRefX[0] = 0; this.bgRefY[0] = 0;
    this.bgRefX[1] = 0; this.bgRefY[1] = 0;

    this.timerVal.fill(0);
    this.timerReload.fill(0);
    this.timerCnt.fill(0);
    this.timerSub.fill(0);

    this.dmaSrc.fill(0);
    this.dmaDst.fill(0);
    this.dmaCount.fill(0);
    this.dmaCnt.fill(0);
    this.dmaActive.fill(0);

    this.fifoAHead = 0; this.fifoATail = 0; this.fifoACount = 0; this.fifoALatch = 0;
    this.fifoBHead = 0; this.fifoBTail = 0; this.fifoBCount = 0; this.fifoBLatch = 0;
    this.psgVol.fill(0);
    this.psgEnvTimer.fill(0);
    this.psgLen.fill(0);
    this.psgEnabled.fill(0);
    this.psgFreq.fill(0);
    this.psgSweepTimer = 0;
    this.psgFrameSeqStep = 0;
    this.psgFrameSeqSub  = 0;

    this.halted = false;
    this.cycles = 0;
    this.scanlineCycles = 0;
    this.vcount = 0;
    this.biosLastFetch = 0xE129F000;
    this.lastFetchedOpcode = 0xE129F000;
    this.inIntrWaitMask = 0;
  }

  loadRom(u8) {
    const raw = (u8 instanceof Uint8Array) ? u8 : new Uint8Array(u8);
    // Strip any polyglot HTML tail if someone loads a .1337.gba / .1337.html
    const stripped = this.stripPolyglotTail(raw);

    // Pad ROM to a multiple of 4 bytes so Uint16Array/Uint32Array views are aligned
    const paddedLen = (stripped.length + 3) & ~3;
    this.rom = new Uint8Array(Math.max(paddedLen, 4));
    this.rom.set(stripped);
    this.rawRomBytes = stripped; // Exact original bytes for CRC32 and 1337ify
    this.rom16 = new Uint16Array(this.rom.buffer);
    this.rom32 = new Uint32Array(this.rom.buffer);

    // Fresh erased battery save state (all 0xFF!)
    this.sram.fill(0xFF);
    this.flash.fill(0xFF);
    this.eeprom.fill(0xFF);
    this.eepromAddrBits = 0;
    this.eepromUsed = false;

    this.romCrc32 = computeCRC32(stripped);
    this.parseHeader(stripped);
    this.detectSaveType(stripped);
    this.reset();
    this.loadAutosave();
  }

  detectSaveType(u8) {
    // Scan ROM for standard Nintendo SDK save ID strings:
    // "EEPROM_V", "SRAM_V", "SRAM_F_V", "FLASH_V", "FLASH512_V", "FLASH1M_V"
    let ascii = '';
    const CHUNK = 0x8000;
    for (let i = 0; i < u8.length; i += CHUNK) {
      ascii += String.fromCharCode.apply(null, u8.subarray(i, Math.min(u8.length, i + CHUNK)));
    }
    if (ascii.indexOf('FLASH1M_V') !== -1) {
      this.detectedSaveType = 'FLASH128';
    } else if (ascii.indexOf('FLASH512_V') !== -1 || ascii.indexOf('FLASH_V') !== -1) {
      this.detectedSaveType = 'FLASH64';
    } else if (ascii.indexOf('EEPROM_V') !== -1) {
      this.detectedSaveType = 'EEPROM';
    } else if (ascii.indexOf('SRAM_V') !== -1 || ascii.indexOf('SRAM_F_V') !== -1) {
      this.detectedSaveType = 'SRAM';
    } else {
      this.detectedSaveType = 'AUTO';
    }
    this.saveType = this.manualSaveType || this.detectedSaveType;
  }

  setSaveType(type) {
    const valid = ['AUTO', 'SRAM', 'FLASH64', 'FLASH128', 'EEPROM', 'EEPROM512', 'EEPROM8K', 'NONE'];
    const up = String(type || 'AUTO').toUpperCase();
    if (valid.indexOf(up) === -1) return this.saveType;
    if (up === 'EEPROM512') {
      this.manualSaveType = 'EEPROM';
      this.saveType = 'EEPROM';
      this.eepromAddrBits = 6;
    } else if (up === 'EEPROM8K') {
      this.manualSaveType = 'EEPROM';
      this.saveType = 'EEPROM';
      this.eepromAddrBits = 14;
    } else if (up === 'AUTO') {
      this.manualSaveType = null;
      this.saveType = this.detectedSaveType;
    } else {
      this.manualSaveType = up;
      this.saveType = up;
    }
    return this.saveType;
  }

  exportSaveBytes() {
    const st = this.saveType === 'AUTO' ? (this.eepromUsed ? 'EEPROM' : 'SRAM') : this.saveType;
    if (st === 'FLASH128') return new Uint8Array(this.flash.subarray(0, 0x20000));
    if (st === 'FLASH64')  return new Uint8Array(this.flash.subarray(0, 0x10000));
    if (st === 'EEPROM') {
      const len = (this.eepromAddrBits === 14) ? 0x2000 : 0x200;
      return new Uint8Array(this.eeprom.subarray(0, len));
    }
    if (st === 'NONE') return new Uint8Array(0);
    return new Uint8Array(this.sram.subarray(0, 0x8000));
  }

  importSaveBytes(u8) {
    const bytes = (u8 instanceof Uint8Array) ? u8 : new Uint8Array(u8);
    if (bytes.length === 0x20000) {
      this.flash.set(bytes.subarray(0, 0x20000));
      if (this.saveType === 'AUTO') this.saveType = 'FLASH128';
    } else if (bytes.length === 0x10000) {
      this.flash.fill(0xFF);
      this.flash.set(bytes.subarray(0, 0x10000));
      if (this.saveType === 'AUTO') this.saveType = 'FLASH64';
    } else if (bytes.length === 0x200 || bytes.length === 0x2000) {
      this.eeprom.fill(0xFF);
      this.eeprom.set(bytes.subarray(0, bytes.length));
      this.eepromAddrBits = (bytes.length === 0x2000) ? 14 : 6;
      this.eepromUsed = true;
      if (this.saveType === 'AUTO') this.saveType = 'EEPROM';
    } else {
      this.sram.fill(0xFF);
      this.sram.set(bytes.subarray(0, Math.min(bytes.length, 0x8000)));
      this.flash.set(bytes.subarray(0, Math.min(bytes.length, 0x20000)));
    }
    this.sramDirty = true;
    this.saveAutosave();
  }

  stripPolyglotTail(u8) {
    const seqBytes = new Uint8Array(B1337_RESET_SEQ.length);
    for (let i = 0; i < B1337_RESET_SEQ.length; i++) {
      seqBytes[i] = B1337_RESET_SEQ.charCodeAt(i);
    }
    if (u8.length >= seqBytes.length) {
      outer: for (let i = 0; i <= u8.length - seqBytes.length; i++) {
        if (u8[i] === seqBytes[0] && u8[i + 15] === seqBytes[15]) {
          for (let j = 0; j < seqBytes.length; j++) {
            if (u8[i + j] !== seqBytes[j]) continue outer;
          }
          return u8.subarray(0, i);
        }
      }
    }
    return u8;
  }

  parseHeader(u8) {
    if (u8.length < 0xC0) {
      this.romTitle = 'MICRO-ROM';
      this.romCode  = 'TEST';
      this.romMaker = '13';
      this.headerChecksum = 0;
      this.headerValid = false;
      return;
    }
    let title = '';
    for (let i = 0xA0; i < 0xAC; i++) {
      const c = u8[i];
      if (c === 0) break;
      title += (c >= 32 && c < 127) ? String.fromCharCode(c) : '?';
    }
    this.romTitle = title.trim() || 'UNTITLED';

    let code = '';
    for (let i = 0xAC; i < 0xB0; i++) {
      const c = u8[i];
      code += (c >= 32 && c < 127) ? String.fromCharCode(c) : '-';
    }
    this.romCode = code;

    let maker = '';
    for (let i = 0xB0; i < 0xB2; i++) {
      const c = u8[i];
      maker += (c >= 32 && c < 127) ? String.fromCharCode(c) : '-';
    }
    this.romMaker = maker;

    let chk = 0;
    for (let i = 0xA0; i <= 0xBC; i++) {
      chk = (chk - u8[i]) & 0xFF;
    }
    chk = (chk - 0x19) & 0xFF;
    this.headerChecksum = u8[0xBD];
    this.headerValid = (chk === u8[0xBD]) && (u8[0xB2] === 0x96);
  }

  loadAutosave() {
    try {
      const key = '1337boy_sram_' + this.romCrc32.toString(16);
      const saved = localStorage.getItem(key);
      if (saved) {
        this.importSaveBytes(base64ToUint8(saved));
        this.sramDirty = false;
      }
    } catch (e) {}
  }

  saveAutosave() {
    if (!this.sramDirty) return;
    this.sramDirty = false;
    try {
      const key = '1337boy_sram_' + this.romCrc32.toString(16);
      localStorage.setItem(key, uint8ToBase64(this.exportSaveBytes()));
    } catch (e) {}
  }

  // ==========================================================================
  // Save Memory Subsystem: SRAM (32KB), Flash (64KB/128KB), EEPROM (512B/8KB)
  // ==========================================================================

  readSave8(addr) {
    const st = this.saveType;
    if (st === 'NONE') {
      return 0xFF;
    }
    if (st === 'FLASH64' || st === 'FLASH128') {
      const off = addr & 0xFFFF;
      if (this.flashIdMode) {
        if (off === 0x0000) return (st === 'FLASH128') ? this.flashManuf128 : this.flashManuf64;
        if (off === 0x0001) return (st === 'FLASH128') ? this.flashDev128   : this.flashDev64;
      }
      const bank = (st === 'FLASH128') ? (this.flashBank & 1) : 0;
      return this.flash[(bank << 16) | off];
    }
    // SRAM (32 KB mirrored across 0x0E000000..0x0FFFFFFF) or AUTO
    return this.sram[addr & 0x7FFF];
  }

  writeSave8(addr, val) {
    val &= 0xFF;
    const off = addr & 0xFFFF;

    // Heuristic auto-upgrade if saveType is 'AUTO'
    if (this.saveType === 'AUTO') {
      if (this.flashStage === 0 && off === 0x5555 && val === 0xAA) {
        this.flashStage = 1;
        this.sram[addr & 0x7FFF] = val;
        this.sramDirty = true;
        return;
      } else if (this.flashStage === 1 && off === 0x2AAA && val === 0x55) {
        this.flashStage = 2;
        this.sram[addr & 0x7FFF] = val;
        this.sramDirty = true;
        return;
      } else if (this.flashStage === 2 && off === 0x5555 && (val === 0x90 || val === 0x80 || val === 0xA0 || val === 0xB0 || val === 0xF0)) {
        // Confirmed Flash protocol on a ROM without ID string!
        this.saveType = 'FLASH128';
        this.sram[0x5555] = 0xFF;
        this.sram[0x2AAA] = 0xFF;
        // Fall through to execute the Flash command in stage 2
      } else {
        this.flashStage = 0;
        this.saveType = 'SRAM';
        this.sram[addr & 0x7FFF] = val;
        this.sramDirty = true;
        return;
      }
    }

    if (this.saveType === 'NONE') {
      return;
    }

    if (this.saveType === 'SRAM') {
      this.sram[addr & 0x7FFF] = val;
      this.sramDirty = true;
      return;
    }

    if (this.saveType === 'FLASH64' || this.saveType === 'FLASH128') {
      const is128 = (this.saveType === 'FLASH128');
      const bank  = is128 ? (this.flashBank & 1) : 0;

      // Active sub-command data phase (0xA0 Byte Write or 0xB0 Bank Switch)
      if (this.flashCmd === 0xA0) {
        this.flash[(bank << 16) | off] &= val;
        this.flashCmd = 0;
        this.flashStage = 0;
        this.sramDirty = true;
        return;
      }
      if (this.flashCmd === 0xB0) {
        if (is128 && off === 0x0000) {
          this.flashBank = val & 1;
        }
        this.flashCmd = 0;
        this.flashStage = 0;
        return;
      }

      // 3-step command state machine (0xAA @ 0x5555 -> 0x55 @ 0x2AAA -> CMD @ 0x5555 or Sector @ 0xX000)
      if (this.flashStage === 0) {
        if (off === 0x5555 && val === 0xAA) {
          this.flashStage = 1;
        } else if (val === 0xF0) {
          this.flashIdMode = false;
          this.flashEraseMode = false;
          this.flashCmd = 0;
        }
      } else if (this.flashStage === 1) {
        if (off === 0x2AAA && val === 0x55) {
          this.flashStage = 2;
        } else if (off === 0x5555 && val === 0xAA) {
          this.flashStage = 1;
        } else {
          this.flashStage = 0;
        }
      } else if (this.flashStage === 2) {
        this.flashStage = 0;
        if (this.flashEraseMode && val === 0x30) {
          // 4 KB Sector Erase (0x1000 bytes at (bank << 16) | (off & 0xF000))
          const sectorStart = (bank << 16) | (off & 0xF000);
          this.flash.fill(0xFF, sectorStart, sectorStart + 0x1000);
          this.flashEraseMode = false;
          this.sramDirty = true;
          return;
        }
        if (off === 0x5555) {
          switch (val) {
            case 0x90: // Enter Chip ID Mode
              this.flashIdMode = true;
              this.flashEraseMode = false;
              break;
            case 0xF0: // Exit Chip ID Mode / Reset
              this.flashIdMode = false;
              this.flashEraseMode = false;
              this.flashCmd = 0;
              break;
            case 0x80: // Erase Setup
              this.flashEraseMode = true;
              break;
            case 0x10: // Erase Entire Chip (64 KB or 128 KB)
              if (this.flashEraseMode) {
                this.flash.fill(0xFF, 0, is128 ? 0x20000 : 0x10000);
                this.flashEraseMode = false;
                this.sramDirty = true;
              }
              break;
            case 0xA0: // Prepare Single-Byte Write
              this.flashCmd = 0xA0;
              this.flashEraseMode = false;
              break;
            case 0xB0: // Prepare Bank Switch (128 KB only)
              if (is128) {
                this.flashCmd = 0xB0;
              }
              this.flashEraseMode = false;
              break;
          }
        }
      }
    }
  }

  // EEPROM DMA3 Serial Bitstream Handler (0x0D000000..0x0DFFFFFF)
  handleEepromDmaWrite(src, srcDelta, count) {
    this.eepromUsed = true;
    if (this.saveType === 'AUTO') this.saveType = 'EEPROM';

    // Read bitstream from src (1 bit per halfword in bit 0)
    const bits = new Uint8Array(count);
    let ptr = src;
    for (let i = 0; i < count; i++) {
      bits[i] = this.read16(ptr) & 1;
      ptr = (ptr + srcDelta) >>> 0;
    }
    if (count < 2 || bits[0] !== 1) return;

    const isReadReq = (bits[1] === 1);
    if (isReadReq) {
      // Read request: [1, 1, addr(6 or 14 bits), 0] -> count is 9 (or 8) for 6-bit, 17 (or 16) for 14-bit
      let addrBits = this.eepromAddrBits;
      if (count === 9 || count === 8) addrBits = 6;
      else if (count === 17 || count === 16) addrBits = 14;
      else if (!addrBits) addrBits = (count <= 9) ? 6 : 14;
      this.eepromAddrBits = addrBits;

      let blockAddr = 0;
      for (let i = 0; i < addrBits && (2 + i) < count; i++) {
        blockAddr = (blockAddr << 1) | bits[2 + i];
      }
      const maxMask = (addrBits === 6) ? 0x3F : 0x3FF;
      this.eepromReadAddr = blockAddr & maxMask;
    } else {
      // Write request: [1, 0, addr(6 or 14 bits), data(64 bits), 0] -> count is 73 (or 72) for 6-bit, 81 (or 80) for 14-bit
      let addrBits = this.eepromAddrBits;
      if (count === 73 || count === 72) addrBits = 6;
      else if (count === 81 || count === 80) addrBits = 14;
      else if (!addrBits) addrBits = (count <= 73) ? 6 : 14;
      this.eepromAddrBits = addrBits;

      let blockAddr = 0;
      for (let i = 0; i < addrBits && (2 + i) < count; i++) {
        blockAddr = (blockAddr << 1) | bits[2 + i];
      }
      const maxMask = (addrBits === 6) ? 0x3F : 0x3FF;
      const baseOff = (blockAddr & maxMask) * 8;
      const dataStart = 2 + addrBits;
      for (let b = 0; b < 8; b++) {
        let byteVal = 0;
        for (let bit = 0; bit < 8; bit++) {
          const idx = dataStart + b * 8 + bit;
          const v = (idx < count) ? bits[idx] : 0;
          byteVal = (byteVal << 1) | v;
        }
        this.eeprom[baseOff + b] = byteVal & 0xFF;
      }
      this.sramDirty = true;
    }
  }

  handleEepromDmaRead(dst, dstDelta, count) {
    this.eepromUsed = true;
    if (this.saveType === 'AUTO') this.saveType = 'EEPROM';
    const baseOff = this.eepromReadAddr * 8;
    let ptr = dst;
    for (let i = 0; i < count; i++) {
      let bit = 1; // First 4 bits (0..3) are dummy bits
      if (i >= 4 && i < 68) {
        const dIdx = i - 4;
        const byteVal = this.eeprom[baseOff + (dIdx >>> 3)];
        bit = (byteVal >>> (7 - (dIdx & 7))) & 1;
      }
      this.write16(ptr, bit);
      ptr = (ptr + dstDelta) >>> 0;
    }
  }

  // ==========================================================================
  // Memory Map Bus Access (8 / 16 / 32-bit, Mirroring, Open-Bus, Misaligned)
  // ==========================================================================

  vramMirrorOffset(addr) {
    let off = addr & 0x1FFFF;
    if (off >= 0x18000) off -= 0x8000;
    return off;
  }

  readOpenBus32(addr) {
    return this.lastFetchedOpcode >>> 0;
  }

  readBios32(addr) {
    if ((this.r[15] >>> 0) < 0x4000) {
      const val = this.bios32[(addr & 0x3FFC) >>> 2];
      this.biosLastFetch = val;
      return val;
    }
    return this.biosLastFetch >>> 0;
  }

  // Fast Instruction Fetch Helpers (update BIOS latch on BIOS fetches; do not add data waitstates)
  fetchArmOpcode(addr) {
    addr = (addr & ~3) >>> 0;
    const region = addr >>> 24;
    switch (region) {
      case 0x08: case 0x09: case 0x0A: case 0x0B: case 0x0C: case 0x0D: {
        const off = addr & 0x1FFFFFC;
        if (off < this.rom.length) return this.rom32[off >>> 2];
        const lo = (addr >>> 1) & 0xFFFF;
        const hi = ((addr + 2) >>> 1) & 0xFFFF;
        return (lo | (hi << 16)) >>> 0;
      }
      case 0x03:
        return this.iwram32[(addr & 0x7FFC) >>> 2];
      case 0x02:
        return this.ewram32[(addr & 0x3FFFC) >>> 2];
      case 0x00:
        if (addr < 0x4000) {
          const val = this.bios32[addr >>> 2];
          this.biosLastFetch = val;
          return val;
        }
        return this.lastFetchedOpcode >>> 0;
      default:
        return this.read32Aligned(addr);
    }
  }

  fetchThumbOpcode(addr) {
    addr = (addr & ~1) >>> 0;
    const region = addr >>> 24;
    switch (region) {
      case 0x08: case 0x09: case 0x0A: case 0x0B: case 0x0C: case 0x0D: {
        const off = addr & 0x1FFFFFE;
        if (off < this.rom.length) return this.rom16[off >>> 1];
        return (addr >>> 1) & 0xFFFF;
      }
      case 0x03:
        return this.iwram16[(addr & 0x7FFE) >>> 1];
      case 0x02:
        return this.ewram16[(addr & 0x3FFFE) >>> 1];
      case 0x00:
        if (addr < 0x4000) {
          const w = this.bios32[(addr & 0x3FFC) >>> 2];
          this.biosLastFetch = w;
          return (w >>> ((addr & 2) << 3)) & 0xFFFF;
        }
        return this.lastFetchedOpcode & 0xFFFF;
      default:
        return this.read16(addr);
    }
  }

  read8(addr) {
    addr >>>= 0;
    const region = addr >>> 24;
    if (region < 16) this.dataRegion = region, this.memCycles += this.ws16N[region];
    switch (region) {
      case 0x00: {
        if (addr >= 0x4000) return (this.readOpenBus32(addr) >>> ((addr & 3) << 3)) & 0xFF;
        const w = this.readBios32(addr);
        return (w >>> ((addr & 3) << 3)) & 0xFF;
      }
      case 0x02:
        return this.ewram[addr & 0x3FFFF];
      case 0x03:
        return this.iwram[addr & 0x7FFF];
      case 0x04:
        return this.readIo8(addr & 0xFFFFFF);
      case 0x05:
        return this.pal[addr & 0x3FF];
      case 0x06:
        return this.vram[this.vramMirrorOffset(addr)];
      case 0x07:
        return this.oam[addr & 0x3FF];
      case 0x08: case 0x09:
      case 0x0A: case 0x0B:
      case 0x0C: case 0x0D: {
        this.prefetchCount = 0;
        const off = addr & 0x1FFFFFF;
        if (off < this.rom.length) return this.rom[off];
        const ob = ((addr >>> 1) & 0xFFFF);
        return (addr & 1) ? (ob >>> 8) : (ob & 0xFF);
      }
      case 0x0E: case 0x0F:
        return this.readSave8(addr);
      default:
        return (this.readOpenBus32(addr) >>> ((addr & 3) << 3)) & 0xFF;
    }
  }

  read16(addr) {
    addr >>>= 0;
    const region = addr >>> 24;
    if (region < 16) this.dataRegion = region, this.memCycles += this.ws16N[region];
    if (region === 0x0E || region === 0x0F) {
      const b = this.readSave8(addr);
      return b | (b << 8);
    }
    addr = (addr & ~1) >>> 0;
    switch (region) {
      case 0x00: {
        if (addr >= 0x4000) return (this.readOpenBus32(addr) >>> ((addr & 2) << 3)) & 0xFFFF;
        const w = this.readBios32(addr);
        return (w >>> ((addr & 2) << 3)) & 0xFFFF;
      }
      case 0x02:
        return this.ewram16[(addr & 0x3FFFE) >>> 1];
      case 0x03:
        return this.iwram16[(addr & 0x7FFE) >>> 1];
      case 0x04:
        return this.readIo16(addr & 0xFFFFFE);
      case 0x05:
        return this.pal16[(addr & 0x3FE) >>> 1];
      case 0x06:
        return this.vram16[this.vramMirrorOffset(addr) >>> 1];
      case 0x07:
        return this.oam16[(addr & 0x3FE) >>> 1];
      case 0x0D: {
        this.prefetchCount = 0;
        const off = addr & 0x1FFFFFE;
        if ((this.saveType === 'EEPROM' || this.eepromUsed) && (off >= this.rom.length || addr >= 0x0DFFFF00)) {
          return 1; // EEPROM Ready bit = 1
        }
        if (off < this.rom.length) return this.rom16[off >>> 1];
        return (addr >>> 1) & 0xFFFF;
      }
      case 0x08: case 0x09:
      case 0x0A: case 0x0B:
      case 0x0C: {
        this.prefetchCount = 0;
        const off = addr & 0x1FFFFFE;
        if (off >= 0xC4 && off <= 0xC8 && (this.gpioCnt & 1)) {
          if (off === 0xC4) return this.gpioData;
          if (off === 0xC6) return this.gpioDir;
          if (off === 0xC8) return this.gpioCnt;
        }
        if (off < this.rom.length) return this.rom16[off >>> 1];
        return (addr >>> 1) & 0xFFFF;
      }
      default:
        return (this.readOpenBus32(addr) >>> ((addr & 2) << 3)) & 0xFFFF;
    }
  }

  read32Aligned(addr) {
    addr >>>= 0;
    const region = addr >>> 24;
    if (region < 16) this.dataRegion = region, this.memCycles += this.ws32N[region];
    if (region === 0x0E || region === 0x0F) {
      const b = this.readSave8(addr);
      return (b * 0x01010101) >>> 0;
    }
    addr = (addr & ~3) >>> 0;
    switch (region) {
      case 0x00:
        if (addr >= 0x4000) return this.readOpenBus32(addr);
        return this.readBios32(addr);
      case 0x02:
        return this.ewram32[(addr & 0x3FFFC) >>> 2];
      case 0x03:
        return this.iwram32[(addr & 0x7FFC) >>> 2];
      case 0x04:
        return (this.readIo16(addr & 0xFFFFFC) | (this.readIo16((addr & 0xFFFFFC) + 2) << 16)) >>> 0;
      case 0x05:
        return this.pal32[(addr & 0x3FC) >>> 2];
      case 0x06:
        return this.vram32[this.vramMirrorOffset(addr) >>> 2];
      case 0x07:
        return this.oam32[(addr & 0x3FC) >>> 2];
      case 0x08: case 0x09:
      case 0x0A: case 0x0B:
      case 0x0C: case 0x0D: {
        this.prefetchCount = 0;
        const off = addr & 0x1FFFFFC;
        if (off < this.rom.length) return this.rom32[off >>> 2];
        const lo = (addr >>> 1) & 0xFFFF;
        const hi = ((addr + 2) >>> 1) & 0xFFFF;
        return (lo | (hi << 16)) >>> 0;
      }
      default:
        return this.readOpenBus32(addr);
    }
  }

  // LDR misaligned word read: rotated right by (addr & 3) * 8
  read32(addr) {
    const w = this.read32Aligned(addr);
    const shift = (addr & 3) << 3;
    return shift ? ((w >>> shift) | (w << (32 - shift))) >>> 0 : w;
  }

  // LDRH misaligned read: on ARM7TDMI, rotated right by 8 if (addr & 1)
  read16Rotated(addr) {
    const h = this.read16(addr);
    if (addr & 1) {
      return (((h >>> 8) | (h << 24))) >>> 0;
    }
    return h;
  }

  // LDRSH signed halfword read: on ARM7TDMI, if (addr & 1) it sign-extends only the high byte!
  readSigned16(addr) {
    const h = this.read16(addr);
    if (addr & 1) {
      return (h << 16) >> 24;
    }
    return (h << 16) >> 16;
  }

  write8(addr, val) {
    addr >>>= 0;
    val &= 0xFF;
    const region = addr >>> 24;
    if (region < 16) this.dataRegion = region, this.memCycles += this.ws16N[region];
    switch (region) {
      case 0x02:
        this.ewram[addr & 0x3FFFF] = val;
        break;
      case 0x03:
        this.iwram[addr & 0x7FFF] = val;
        break;
      case 0x04:
        this.writeIo8(addr & 0xFFFFFF, val);
        break;
      case 0x05:
        this.pal16[(addr & 0x3FE) >>> 1] = val | (val << 8);
        break;
      case 0x06: {
        const off = this.vramMirrorOffset(addr) & ~1;
        const mode = this.io16[0] & 7;
        const objBoundary = (mode >= 3) ? 0x14000 : 0x10000;
        if (off < objBoundary) {
          this.vram16[off >>> 1] = val | (val << 8);
        }
        break;
      }
      case 0x07:
        break;
      case 0x0E: case 0x0F:
        this.writeSave8(addr, val);
        break;
    }
  }

  write16(addr, val) {
    addr >>>= 0;
    val &= 0xFFFF;
    const region = addr >>> 24;
    if (region < 16) this.dataRegion = region, this.memCycles += this.ws16N[region];
    if (region === 0x0E || region === 0x0F) {
      const b = (val >>> ((addr & 1) << 3)) & 0xFF;
      this.writeSave8(addr, b);
      return;
    }
    addr = (addr & ~1) >>> 0;
    switch (region) {
      case 0x02:
        this.ewram16[(addr & 0x3FFFE) >>> 1] = val;
        break;
      case 0x03:
        this.iwram16[(addr & 0x7FFE) >>> 1] = val;
        break;
      case 0x04:
        this.writeIo16(addr & 0xFFFFFE, val);
        break;
      case 0x05:
        this.pal16[(addr & 0x3FE) >>> 1] = val;
        break;
      case 0x06:
        this.vram16[this.vramMirrorOffset(addr) >>> 1] = val;
        break;
      case 0x07:
        this.oam16[(addr & 0x3FE) >>> 1] = val;
        break;
      case 0x08: {
        const off = addr & 0x1FFFFFE;
        if (off >= 0xC4 && off <= 0xC8) {
          this.writeGpio(off, val);
        }
        break;
      }
    }
  }

  write32(addr, val) {
    addr >>>= 0;
    val >>>= 0;
    const region = addr >>> 24;
    if (region < 16) this.dataRegion = region, this.memCycles += this.ws32N[region];
    if (region === 0x0E || region === 0x0F) {
      const b = (val >>> ((addr & 3) << 3)) & 0xFF;
      this.writeSave8(addr, b);
      return;
    }
    addr = (addr & ~3) >>> 0;
    switch (region) {
      case 0x02:
        this.ewram32[(addr & 0x3FFFC) >>> 2] = val;
        break;
      case 0x03:
        this.iwram32[(addr & 0x7FFC) >>> 2] = val;
        break;
      case 0x04:
        this.writeIo32(addr & 0xFFFFFC, val);
        break;
      case 0x05:
        this.pal32[(addr & 0x3FC) >>> 2] = val;
        break;
      case 0x06:
        this.vram32[this.vramMirrorOffset(addr) >>> 2] = val;
        break;
      case 0x07:
        this.oam32[(addr & 0x3FC) >>> 2] = val;
        break;
    }
  }

  // Tier 3: GPIO & S-3511A RTC emulation
  writeGpio(off, val) {
    if (off === 0xC6) {
      this.gpioDir = val & 0xF;
    } else if (off === 0xC8) {
      this.gpioCnt = val & 1;
    } else if (off === 0xC4) {
      const prevSck = this.gpioData & 1;
      const prevCs  = (this.gpioData >> 2) & 1;
      this.gpioData = (this.gpioData & ~this.gpioDir) | (val & this.gpioDir);
      const cs  = (this.gpioData >> 2) & 1;
      const sck = this.gpioData & 1;
      const sio = (this.gpioData >> 1) & 1;

      if (!cs) {
        this.rtcState = 0;
        this.rtcBitIdx = 0;
        return;
      }
      if (!prevCs && cs) {
        this.rtcState = 1;
        this.rtcBitIdx = 0;
        this.rtcShift = 0;
      }
      if (!prevSck && sck) {
        if (this.rtcState === 1) {
          this.rtcShift |= (sio << this.rtcBitIdx);
          this.rtcBitIdx++;
          if (this.rtcBitIdx === 8) {
            let cmd = this.rtcShift;
            if ((cmd & 0x0F) === 0x06) {
              let rev = 0;
              for (let i = 0; i < 8; i++) if (cmd & (1 << i)) rev |= (1 << (7 - i));
              cmd = rev;
            }
            this.rtcCmd = (cmd >> 1) & 7;
            const isRead = cmd & 1;
            this.rtcState = isRead ? 3 : 2;
            this.rtcBitIdx = 0;
            this.rtcByteIdx = 0;
            this.prepareRtcData();
          }
        } else if (this.rtcState === 3) {
          const b = this.rtcReadBuf[this.rtcByteIdx] || 0;
          const bit = (b >> this.rtcBitIdx) & 1;
          this.gpioData = (this.gpioData & ~2) | (bit << 1);
          this.rtcBitIdx++;
          if (this.rtcBitIdx === 8) {
            this.rtcBitIdx = 0;
            this.rtcByteIdx++;
          }
        }
      }
    }
  }

  prepareRtcData() {
    const toBcd = (n) => (((Math.floor(n / 10) % 10) << 4) | (n % 10)) & 0xFF;
    const now = new Date();
    this.rtcReadBuf.fill(0);
    if (this.rtcCmd === 1) {
      this.rtcReadBuf[0] = this.rtcStatus;
    } else if (this.rtcCmd === 2) {
      this.rtcReadBuf[0] = toBcd(now.getFullYear() - 2000);
      this.rtcReadBuf[1] = toBcd(now.getMonth() + 1);
      this.rtcReadBuf[2] = toBcd(now.getDate());
      this.rtcReadBuf[3] = toBcd(now.getDay());
      this.rtcReadBuf[4] = toBcd(now.getHours());
      this.rtcReadBuf[5] = toBcd(now.getMinutes());
      this.rtcReadBuf[6] = toBcd(now.getSeconds());
    } else if (this.rtcCmd === 3) {
      this.rtcReadBuf[0] = toBcd(now.getHours());
      this.rtcReadBuf[1] = toBcd(now.getMinutes());
      this.rtcReadBuf[2] = toBcd(now.getSeconds());
    }
  }

  // ==========================================================================
  // I/O Registers Read / Write
  // ==========================================================================

  readIo8(off) {
    if (off >= 0x400) {
      if ((off & 0xFFFF) === 0x800) return this.io[0x208];
      return (this.readOpenBus32(off) >>> ((off & 3) << 3)) & 0xFF;
    }
    if (off >= 0x090 && off <= 0x09F) {
      // Wave RAM CPU read accesses the non-playing bank ((bank ^ 1) * 16)
      const bank = ((this.io16[0x070 >> 1] >>> 6) & 1) ^ 1;
      return this.waveRam[(bank << 4) | (off & 0xF)];
    }
    const h = this.readIo16(off & ~1);
    return (off & 1) ? (h >>> 8) : (h & 0xFF);
  }

  readIo16(off) {
    if (off >= 0x400) {
      return 0;
    }
    if (off >= 0x090 && off <= 0x09E) {
      const bank = ((this.io16[0x070 >> 1] >>> 6) & 1) ^ 1;
      const base = (bank << 4) | (off & 0xE);
      return this.waveRam[base] | (this.waveRam[base + 1] << 8);
    }
    switch (off) {
      case 0x006: // VCOUNT
        return this.vcount;
      case 0x084: { // SOUNDCNT_X (bits 0..3 = active PSG channels, bit 7 = master enable)
        let status = this.io16[0x084 >> 1] & 0x0080;
        if (status) {
          for (let c = 0; c < 4; c++) if (this.psgEnabled[c]) status |= (1 << c);
        }
        return status;
      }
      case 0x100: return this.timerVal[0];
      case 0x102: return this.timerCnt[0];
      case 0x104: return this.timerVal[1];
      case 0x106: return this.timerCnt[1];
      case 0x108: return this.timerVal[2];
      case 0x10A: return this.timerCnt[2];
      case 0x10C: return this.timerVal[3];
      case 0x10E: return this.timerCnt[3];
      case 0x130: // KEYINPUT
        return this.keyMask & 0x03FF;
      case 0x200: // IE
        return this.io16[0x200 >> 1];
      case 0x202: // IF
        return this.io16[0x202 >> 1];
      case 0x204: // WAITCNT (bit 15 Game Pak type is always 0)
        return this.io16[0x204 >> 1] & 0x7FFF;
      case 0x208: // IME
        return this.io16[0x208 >> 1] & 1;
      default:
        return this.io16[off >>> 1];
    }
  }

  writeIo8(off, val) {
    if (off === 0x301) {
      this.halted = true;
      return;
    }
    if (off >= 0x400) return;
    if (off >= 0x090 && off <= 0x09F) {
      const bank = ((this.io16[0x070 >> 1] >>> 6) & 1) ^ 1;
      this.waveRam[(bank << 4) | (off & 0xF)] = val & 0xFF;
      this.io[off] = val & 0xFF;
      return;
    }
    if (off === 0x202 || off === 0x203) {
      const shift = (off & 1) << 3;
      this.io16[0x202 >> 1] &= ~(val << shift);
      return;
    }
    const cur = this.io16[off >>> 1];
    const next = (off & 1) ? ((cur & 0x00FF) | (val << 8)) : ((cur & 0xFF00) | val);
    this.writeIo16(off & ~1, next);
  }

  writeIo32(off, val) {
    if (off === 0x0A0) {
      this.pushFifoA(val & 0xFF);
      this.pushFifoA((val >>> 8) & 0xFF);
      this.pushFifoA((val >>> 16) & 0xFF);
      this.pushFifoA((val >>> 24) & 0xFF);
      return;
    }
    if (off === 0x0A4) {
      this.pushFifoB(val & 0xFF);
      this.pushFifoB((val >>> 8) & 0xFF);
      this.pushFifoB((val >>> 16) & 0xFF);
      this.pushFifoB((val >>> 24) & 0xFF);
      return;
    }
    this.writeIo16(off, val & 0xFFFF);
    this.writeIo16(off + 2, (val >>> 16) & 0xFFFF);
  }

  writeIo16(off, val) {
    if (off >= 0x400) return;
    if (off >= 0x090 && off <= 0x09E) {
      const bank = ((this.io16[0x070 >> 1] >>> 6) & 1) ^ 1;
      const base = (bank << 4) | (off & 0xE);
      this.waveRam[base]     = val & 0xFF;
      this.waveRam[base + 1] = (val >>> 8) & 0xFF;
      this.io16[off >>> 1]   = val;
      return;
    }
    switch (off) {
      case 0x004: // DISPSTAT (bits 0..2 are read-only status flags!)
        this.io16[0x004 >> 1] = (this.io16[0x004 >> 1] & 0x0007) | (val & 0xFFF8);
        return;
      case 0x006: // VCOUNT is read-only
        return;

      // BG2 / BG3 Reference Point Latches
      case 0x028: case 0x02A: {
        this.io16[off >>> 1] = val;
        const raw = this.io32[0x028 >> 2];
        this.bgRefX[0] = (raw << 4) >> 4;
        return;
      }
      case 0x02C: case 0x02E: {
        this.io16[off >>> 1] = val;
        const raw = this.io32[0x02C >> 2];
        this.bgRefY[0] = (raw << 4) >> 4;
        return;
      }
      case 0x038: case 0x03A: {
        this.io16[off >>> 1] = val;
        const raw = this.io32[0x038 >> 2];
        this.bgRefX[1] = (raw << 4) >> 4;
        return;
      }
      case 0x03C: case 0x03E: {
        this.io16[off >>> 1] = val;
        const raw = this.io32[0x03C >> 2];
        this.bgRefY[1] = (raw << 4) >> 4;
        return;
      }

      // PSG Channel 1..4 Control & Trigger Registers
      case 0x062: // SOUND1CNT_H
        this.io16[0x062 >> 1] = val;
        this.psgLen[0] = 64 - (val & 0x3F);
        this.psgVol[0] = (val >>> 12) & 0xF;
        return;
      case 0x064: // SOUND1CNT_X
        this.io16[0x064 >> 1] = val;
        this.psgFreq[0] = val & 0x7FF;
        if (val & 0x8000) {
          this.psgEnabled[0] = 1;
          const cntH = this.io16[0x062 >> 1];
          if (this.psgLen[0] === 0) this.psgLen[0] = 64 - (cntH & 0x3F);
          this.psgVol[0] = (cntH >>> 12) & 0xF;
          this.psgEnvTimer[0] = (cntH >>> 8) & 7;
          this.psgSweepTimer = (this.io16[0x060 >> 1] >>> 4) & 7;
        }
        return;
      case 0x068: // SOUND2CNT_L
        this.io16[0x068 >> 1] = val;
        this.psgLen[1] = 64 - (val & 0x3F);
        this.psgVol[1] = (val >>> 12) & 0xF;
        return;
      case 0x06C: // SOUND2CNT_H
        this.io16[0x06C >> 1] = val;
        this.psgFreq[1] = val & 0x7FF;
        if (val & 0x8000) {
          this.psgEnabled[1] = 1;
          const cntL = this.io16[0x068 >> 1];
          if (this.psgLen[1] === 0) this.psgLen[1] = 64 - (cntL & 0x3F);
          this.psgVol[1] = (cntL >>> 12) & 0xF;
          this.psgEnvTimer[1] = (cntL >>> 8) & 7;
        }
        return;
      case 0x070: // SOUND3CNT_L
        this.io16[0x070 >> 1] = val;
        if (!(val & 0x0080)) this.psgEnabled[2] = 0;
        return;
      case 0x072: // SOUND3CNT_H
        this.io16[0x072 >> 1] = val;
        this.psgLen[2] = 256 - (val & 0xFF);
        return;
      case 0x074: // SOUND3CNT_X
        this.io16[0x074 >> 1] = val;
        this.psgFreq[2] = val & 0x7FF;
        if (val & 0x8000) {
          this.psgEnabled[2] = (this.io16[0x070 >> 1] & 0x0080) ? 1 : 0;
          if (this.psgLen[2] === 0) this.psgLen[2] = 256 - (this.io16[0x072 >> 1] & 0xFF);
          this.psgPhase[2] = 0;
        }
        return;
      case 0x078: // SOUND4CNT_L
        this.io16[0x078 >> 1] = val;
        this.psgLen[3] = 64 - (val & 0x3F);
        this.psgVol[3] = (val >>> 12) & 0xF;
        return;
      case 0x07C: // SOUND4CNT_H
        this.io16[0x07C >> 1] = val;
        if (val & 0x8000) {
          this.psgEnabled[3] = 1;
          const cntL = this.io16[0x078 >> 1];
          if (this.psgLen[3] === 0) this.psgLen[3] = 64 - (cntL & 0x3F);
          this.psgVol[3] = (cntL >>> 12) & 0xF;
          this.psgEnvTimer[3] = (cntL >>> 8) & 7;
          this.psgLfsr = (val & 0x0008) ? 0x007F : 0x7FFF;
        }
        return;
      case 0x084: // SOUNDCNT_X
        this.io16[0x084 >> 1] = val & 0x0080;
        if (!(val & 0x0080)) {
          this.psgEnabled.fill(0);
        }
        return;

      // Direct Sound FIFOs (16-bit write)
      case 0x0A0: case 0x0A2:
        this.pushFifoA(val & 0xFF);
        this.pushFifoA((val >>> 8) & 0xFF);
        return;
      case 0x0A4: case 0x0A6:
        this.pushFifoB(val & 0xFF);
        this.pushFifoB((val >>> 8) & 0xFF);
        return;

      case 0x082: // SOUNDCNT_H (FIFO reset bits 11 and 15)
        if (val & 0x0800) {
          this.fifoAHead = 0; this.fifoATail = 0; this.fifoACount = 0; this.fifoALatch = 0;
        }
        if (val & 0x8000) {
          this.fifoBHead = 0; this.fifoBTail = 0; this.fifoBCount = 0; this.fifoBLatch = 0;
        }
        this.io16[0x082 >> 1] = val & ~0x8800;
        return;

      // DMA0..3 Registers (0x0B0 .. 0x0DE)
      case 0x0B0: case 0x0B2: case 0x0B4: case 0x0B6: case 0x0B8:
      case 0x0BC: case 0x0BE: case 0x0C0: case 0x0C2: case 0x0C4:
      case 0x0C8: case 0x0CA: case 0x0CC: case 0x0CE: case 0x0D0:
      case 0x0D4: case 0x0D6: case 0x0D8: case 0x0DA: case 0x0DC:
        this.io16[off >>> 1] = val;
        return;

      case 0x0BA: this.writeDmaCnt(0, val); return;
      case 0x0C6: this.writeDmaCnt(1, val); return;
      case 0x0D2: this.writeDmaCnt(2, val); return;
      case 0x0DE: this.writeDmaCnt(3, val); return;

      // Timers 0..3
      case 0x100: this.timerReload[0] = val; return;
      case 0x102: this.writeTimerCnt(0, val); return;
      case 0x104: this.timerReload[1] = val; return;
      case 0x106: this.writeTimerCnt(1, val); return;
      case 0x108: this.timerReload[2] = val; return;
      case 0x10A: this.writeTimerCnt(2, val); return;
      case 0x10C: this.timerReload[3] = val; return;
      case 0x10E: this.writeTimerCnt(3, val); return;

      // Link Cable SIO (0x128 SIOCNT)
      case 0x128: {
        this.io16[0x128 >> 1] = val;
        if (val & 0x0080) {
          const outData = this.io16[0x12A >> 1];
          this.io16[0x120 >> 1] = outData;
          if (this.linkChannel) {
            try {
              this.linkChannel.postMessage({ type: 'SIO_XFER', sender: this.linkId, data: outData });
            } catch (e) {}
          }
          this.io16[0x128 >> 1] = val & ~0x0080;
          if (val & 0x4000) this.requestIrq(IRQ_SIO);
        }
        return;
      }

      case 0x130: // KEYINPUT is read-only
        return;
      case 0x132: // KEYCNT
        this.io16[0x132 >> 1] = val;
        this.checkKeypadIrq();
        return;

      case 0x200: // IE
        this.io16[0x200 >> 1] = val;
        this.checkIrq();
        return;
      case 0x202: // IF (write 1 to clear!)
        this.io16[0x202 >> 1] &= ~val;
        return;
      case 0x204: // WAITCNT
        this.io16[0x204 >> 1] = val & 0x7FFF;
        this.updateWaitstates(val & 0x7FFF);
        return;
      case 0x208: // IME
        this.io16[0x208 >> 1] = val & 1;
        this.checkIrq();
        return;
      case 0x300: // POSTFLG / HALTCNT
        this.io[0x300] = val & 0xFF;
        if (val & 0xFF00) this.halted = true;
        return;
      default:
        this.io16[off >>> 1] = val;
    }
  }

  // ==========================================================================
  // Timers, DMA, Interrupts, Keypad, and Direct Sound FIFO
  // ==========================================================================

  pushFifoA(byteVal) {
    if (this.fifoACount < 32) {
      this.fifoA[this.fifoATail] = (byteVal << 24) >> 24;
      this.fifoATail = (this.fifoATail + 1) & 31;
      this.fifoACount++;
    }
  }

  pushFifoB(byteVal) {
    if (this.fifoBCount < 32) {
      this.fifoB[this.fifoBTail] = (byteVal << 24) >> 24;
      this.fifoBTail = (this.fifoBTail + 1) & 31;
      this.fifoBCount++;
    }
  }

  popFifoA() {
    if (this.fifoACount > 0) {
      this.fifoALatch = this.fifoA[this.fifoAHead];
      this.fifoAHead = (this.fifoAHead + 1) & 31;
      this.fifoACount--;
    }
    if (this.fifoACount <= 16) {
      this.triggerSoundDma(0x040000A0);
    }
  }

  popFifoB() {
    if (this.fifoBCount > 0) {
      this.fifoBLatch = this.fifoB[this.fifoBHead];
      this.fifoBHead = (this.fifoBHead + 1) & 31;
      this.fifoBCount--;
    }
    if (this.fifoBCount <= 16) {
      this.triggerSoundDma(0x040000A4);
    }
  }

  triggerSoundDma(fifoAddr) {
    for (let ch = 1; ch <= 2; ch++) {
      const cnt = this.dmaCnt[ch];
      if ((cnt & 0x8000) && ((cnt >>> 12) & 3) === 3) {
        if ((this.dmaDst[ch] >>> 0) === (fifoAddr >>> 0)) {
          this.executeDma(ch, true);
        }
      }
    }
  }

  writeTimerCnt(ch, val) {
    const prev = this.timerCnt[ch];
    this.timerCnt[ch] = val;
    this.io16[(0x102 + ch * 4) >> 1] = val;
    if (!(prev & 0x0080) && (val & 0x0080)) {
      this.timerVal[ch] = this.timerReload[ch];
      this.timerSub[ch] = 0;
    }
  }

  stepTimers(cycles) {
    const shifts = [0, 6, 8, 10];
    for (let ch = 0; ch < 4; ch++) {
      const cnt = this.timerCnt[ch];
      if (!(cnt & 0x0080)) continue;
      if (ch > 0 && (cnt & 0x0004)) continue;

      this.timerSub[ch] += cycles;
      const shift = shifts[cnt & 3];
      const ticks = this.timerSub[ch] >>> shift;
      if (ticks > 0) {
        this.timerSub[ch] &= ((1 << shift) - 1);
        this.advanceTimer(ch, ticks);
      }
    }
  }

  advanceTimer(ch, ticks) {
    let val = this.timerVal[ch] + ticks;
    let overflows = 0;
    while (val >= 0x10000) {
      const rem = val - 0x10000;
      const span = 0x10000 - this.timerReload[ch];
      overflows++;
      if (rem >= span && span > 0) {
        overflows += (rem / span) | 0;
        val = this.timerReload[ch] + (rem % span);
      } else {
        val = this.timerReload[ch] + rem;
      }
    }
    this.timerVal[ch] = val & 0xFFFF;

    if (overflows > 0) {
      const cnt = this.timerCnt[ch];
      if (cnt & 0x0040) {
        this.requestIrq(IRQ_TIMER0 << ch);
      }
      if (ch === 0 || ch === 1) {
        const sndCntH = this.io16[0x082 >> 1];
        const timerA = (sndCntH >>> 10) & 1;
        const timerB = (sndCntH >>> 14) & 1;
        if (timerA === ch) this.popFifoA();
        if (timerB === ch) this.popFifoB();
      }
      if (ch < 3) {
        const nextCnt = this.timerCnt[ch + 1];
        if ((nextCnt & 0x0084) === 0x0084) {
          this.advanceTimer(ch + 1, overflows);
        }
      }
    }
  }

  writeDmaCnt(ch, val) {
    const prev = this.dmaCnt[ch];
    this.dmaCnt[ch] = val;
    const base = 0x0B0 + ch * 12;
    this.io16[(base + 10) >> 1] = val;

    if (!(prev & 0x8000) && (val & 0x8000)) {
      const srcMasks = [0x07FFFFFF, 0x0FFFFFFF, 0x0FFFFFFF, 0x0FFFFFFF];
      const dstMasks = [0x07FFFFFF, 0x07FFFFFF, 0x07FFFFFF, 0x0FFFFFFF];
      const cntMasks = [0x3FFF, 0x3FFF, 0x3FFF, 0xFFFF];
      this.dmaSrc[ch] = this.io32[base >> 2] & srcMasks[ch];
      this.dmaDst[ch] = this.io32[(base + 4) >> 2] & dstMasks[ch];
      let c = this.io16[(base + 8) >> 1] & cntMasks[ch];
      if (c === 0) c = cntMasks[ch] + 1;
      this.dmaCount[ch] = c;

      const timing = (val >>> 12) & 3;
      if (timing === 0) {
        this.executeDma(ch, false);
      }
    }
  }

  triggerDmaTiming(timingType) {
    for (let ch = 0; ch < 4; ch++) {
      const cnt = this.dmaCnt[ch];
      if ((cnt & 0x8000) && ((cnt >>> 12) & 3) === timingType) {
        this.executeDma(ch, false);
      }
    }
  }

  executeDma(ch, isSoundFifo) {
    const cnt = this.dmaCnt[ch];
    const is32 = isSoundFifo ? true : ((cnt & 0x0400) !== 0);
    const step = is32 ? 4 : 2;
    const dstCtrl = isSoundFifo ? 2 : ((cnt >>> 5) & 3);
    const srcCtrl = (cnt >>> 7) & 3;

    const srcDelta = (srcCtrl === 0 || srcCtrl === 3) ? step : (srcCtrl === 1 ? -step : 0);
    const dstDelta = (dstCtrl === 0 || dstCtrl === 3) ? step : (dstCtrl === 1 ? -step : 0);

    let count = isSoundFifo ? 4 : this.dmaCount[ch];
    let src = this.dmaSrc[ch] >>> 0;
    let dst = this.dmaDst[ch] >>> 0;

    const savedMemCycles = this.memCycles;
    const srcReg = (src >>> 24) & 0xF;
    const dstReg = (dst >>> 24) & 0xF;

    // Check DMA3 EEPROM serial transfer at 0x0D000000..0x0DFFFFFF
    if (ch === 3 && !isSoundFifo && !is32) {
      if (dstReg === 0x0D && (this.saveType === 'EEPROM' || this.saveType === 'AUTO')) {
        this.handleEepromDmaWrite(src & ~1, srcDelta, count);
        src = (src + srcDelta * count) >>> 0;
        dst = (dst + dstDelta * count) >>> 0;
        this.dmaSrc[ch] = src;
        this.dmaDst[ch] = dst;
        const unitS = this.ws16S[srcReg] + this.ws16S[dstReg];
        this.dmaCyclesStall += 2 + count * unitS;
        if (cnt & 0x4000) this.requestIrq(IRQ_DMA0 << ch);
        this.dmaCnt[ch] &= ~0x8000;
        this.io16[(0x0B0 + ch * 12 + 10) >> 1] = this.dmaCnt[ch];
        this.memCycles = savedMemCycles;
        return;
      }
      if (srcReg === 0x0D && (this.saveType === 'EEPROM' || this.eepromUsed || ((src & 0x1FFFFFE) >= this.rom.length && count === 68))) {
        this.handleEepromDmaRead(dst & ~1, dstDelta, count);
        src = (src + srcDelta * count) >>> 0;
        dst = (dst + dstDelta * count) >>> 0;
        this.dmaSrc[ch] = src;
        this.dmaDst[ch] = dst;
        const unitS = this.ws16S[srcReg] + this.ws16S[dstReg];
        this.dmaCyclesStall += 2 + count * unitS;
        if (cnt & 0x4000) this.requestIrq(IRQ_DMA0 << ch);
        this.dmaCnt[ch] &= ~0x8000;
        this.io16[(0x0B0 + ch * 12 + 10) >> 1] = this.dmaCnt[ch];
        this.memCycles = savedMemCycles;
        return;
      }
    }

    if (is32) {
      src &= ~3;
      dst &= ~3;
      for (let i = 0; i < count; i++) {
        const w = this.read32Aligned(src);
        this.write32(dst, w);
        src = (src + srcDelta) >>> 0;
        dst = (dst + dstDelta) >>> 0;
      }
      const firstCost = this.ws32N[srcReg] + this.ws32N[dstReg];
      const seqCost   = this.ws32S[srcReg] + this.ws32S[dstReg];
      this.dmaCyclesStall += 2 + firstCost + (count > 1 ? (count - 1) * seqCost : 0);
    } else {
      src &= ~1;
      dst &= ~1;
      for (let i = 0; i < count; i++) {
        const h = this.read16(src);
        this.write16(dst, h);
        src = (src + srcDelta) >>> 0;
        dst = (dst + dstDelta) >>> 0;
      }
      const firstCost = this.ws16N[srcReg] + this.ws16N[dstReg];
      const seqCost   = this.ws16S[srcReg] + this.ws16S[dstReg];
      this.dmaCyclesStall += 2 + firstCost + (count > 1 ? (count - 1) * seqCost : 0);
    }
    this.memCycles = savedMemCycles;

    this.dmaSrc[ch] = src;
    this.dmaDst[ch] = dst;

    if (cnt & 0x4000) {
      this.requestIrq(IRQ_DMA0 << ch);
    }

    const repeat = (cnt & 0x0200) !== 0;
    const timing = (cnt >>> 12) & 3;
    if (repeat && timing !== 0) {
      const cntMasks = [0x3FFF, 0x3FFF, 0x3FFF, 0xFFFF];
      const base = 0x0B0 + ch * 12;
      let c = this.io16[(base + 8) >> 1] & cntMasks[ch];
      if (c === 0) c = cntMasks[ch] + 1;
      this.dmaCount[ch] = c;
      if (dstCtrl === 3 && !isSoundFifo) {
        const dstMasks = [0x07FFFFFF, 0x07FFFFFF, 0x07FFFFFF, 0x0FFFFFFF];
        this.dmaDst[ch] = this.io32[(base + 4) >> 2] & dstMasks[ch];
      }
    } else {
      this.dmaCnt[ch] &= ~0x8000;
      this.io16[(0x0B0 + ch * 12 + 10) >> 1] = this.dmaCnt[ch];
    }
  }

  setKeys(pressedMask) {
    this.keyMask = (~pressedMask) & 0x03FF;
    this.io16[0x130 >> 1] = this.keyMask;
    this.checkKeypadIrq();
  }

  checkKeypadIrq() {
    const keycnt = this.io16[0x132 >> 1];
    if (!(keycnt & 0x4000)) return;
    const targetKeys = keycnt & 0x03FF;
    const pressed = (~this.keyMask) & 0x03FF;
    if (keycnt & 0x8000) {
      if ((pressed & targetKeys) === targetKeys && targetKeys !== 0) {
        this.requestIrq(IRQ_KEYPAD);
      }
    } else {
      if ((pressed & targetKeys) !== 0) {
        this.requestIrq(IRQ_KEYPAD);
      }
    }
  }

  requestIrq(mask) {
    this.io16[0x202 >> 1] |= mask;
    this.checkIrq();
  }

  checkIrq() {
    const ie  = this.io16[0x200 >> 1];
    const irf = this.io16[0x202 >> 1];
    if (ie & irf) {
      this.halted = false;
    }
  }

  // ==========================================================================
  // CPU Mode Switching & Banked Registers
  // ==========================================================================

  getSpsr() {
    const m = this.cpsr & 0x1F;
    switch (m) {
      case MODE_FIQ: return this.spsrFiq;
      case MODE_IRQ: return this.spsrIrq;
      case MODE_SVC: return this.spsrSvc;
      case MODE_ABT: return this.spsrAbt;
      case MODE_UND: return this.spsrUnd;
      default:       return this.cpsr;
    }
  }

  setSpsr(val) {
    const m = this.cpsr & 0x1F;
    switch (m) {
      case MODE_FIQ: this.spsrFiq = val; break;
      case MODE_IRQ: this.spsrIrq = val; break;
      case MODE_SVC: this.spsrSvc = val; break;
      case MODE_ABT: this.spsrAbt = val; break;
      case MODE_UND: this.spsrUnd = val; break;
    }
  }

  switchMode(newMode) {
    const oldMode = this.cpsr & 0x1F;
    if (oldMode === newMode) return;

    if (oldMode === MODE_FIQ) {
      for (let i = 0; i < 7; i++) this.bankFiq[i] = this.r[8 + i];
    } else {
      for (let i = 0; i < 5; i++) this.bankUsr[i] = this.r[8 + i];
      if (oldMode === MODE_IRQ) {
        this.bankIrq[0] = this.r[13]; this.bankIrq[1] = this.r[14];
      } else if (oldMode === MODE_SVC) {
        this.bankSvc[0] = this.r[13]; this.bankSvc[1] = this.r[14];
      } else if (oldMode === MODE_ABT) {
        this.bankAbt[0] = this.r[13]; this.bankAbt[1] = this.r[14];
      } else if (oldMode === MODE_UND) {
        this.bankUnd[0] = this.r[13]; this.bankUnd[1] = this.r[14];
      } else {
        this.bankUsr[5] = this.r[13]; this.bankUsr[6] = this.r[14];
      }
    }

    if (newMode === MODE_FIQ) {
      for (let i = 0; i < 7; i++) this.r[8 + i] = this.bankFiq[i];
    } else {
      for (let i = 0; i < 5; i++) this.r[8 + i] = this.bankUsr[i];
      if (newMode === MODE_IRQ) {
        this.r[13] = this.bankIrq[0]; this.r[14] = this.bankIrq[1];
      } else if (newMode === MODE_SVC) {
        this.r[13] = this.bankSvc[0]; this.r[14] = this.bankSvc[1];
      } else if (newMode === MODE_ABT) {
        this.r[13] = this.bankAbt[0]; this.r[14] = this.bankAbt[1];
      } else if (newMode === MODE_UND) {
        this.r[13] = this.bankUnd[0]; this.r[14] = this.bankUnd[1];
      } else {
        this.r[13] = this.bankUsr[5]; this.r[14] = this.bankUsr[6];
      }
    }

    this.cpsr = (this.cpsr & ~0x1F) | (newMode & 0x1F);
  }

  readUsrReg(reg) {
    if (reg < 8 || reg === 15) return this.r[reg];
    const mode = this.cpsr & 0x1F;
    if (mode === MODE_USR || mode === MODE_SYS) return this.r[reg];
    if (reg < 13) {
      return (mode === MODE_FIQ) ? this.bankUsr[reg - 8] : this.r[reg];
    }
    return this.bankUsr[reg - 8];
  }

  writeUsrReg(reg, val) {
    if (reg < 8 || reg === 15) {
      this.r[reg] = val;
      return;
    }
    const mode = this.cpsr & 0x1F;
    if (mode === MODE_USR || mode === MODE_SYS) {
      this.r[reg] = val;
      return;
    }
    if (reg < 13 && mode !== MODE_FIQ) {
      this.r[reg] = val;
      return;
    }
    this.bankUsr[reg - 8] = val;
  }

  triggerIrqException() {
    const savedCpsr = this.cpsr;
    this.lastPrefetchedPc = 0;
    const nextPc = this.r[15] + 4;
    this.switchMode(MODE_IRQ);
    this.spsrIrq = savedCpsr;
    this.r[14] = nextPc;
    this.cpsr = (this.cpsr & ~FLAG_T) | FLAG_I;
    this.r[15] = 0x00000018;
    this.pipePc = -1;
    this.prefetchCount = 0;
    this.prefetchDuty  = 0;
    this.biosLastFetch = 0xE25EF004;
  }

  // ==========================================================================
  // Custom 1337Boy BIOS & SWI Services (All 21+ Documented Services)
  // ==========================================================================

  handleSwi(comment) {
    this.biosLastFetch = 0xE3A02004;
    switch (comment & 0xFF) {
      case 0x00: { // SoftReset
        const flag = this.iwram[0x7FFA];
        for (let i = 0x7E00; i < 0x8000; i++) this.iwram[i] = 0;
        this.r.fill(0);
        this.r[13] = 0x03007F00;
        this.bankUsr[5] = 0x03007F00;
        this.bankIrq[0] = 0x03007FA0;
        this.bankSvc[0] = 0x03007FE0;
        this.cpsr = MODE_SYS;
        this.r[14] = flag ? 0x02000000 : 0x08000000;
        this.r[15] = this.r[14];
        this.pipePc = -1;
        this.biosLastFetch = 0xE129F000;
        break;
      }
      case 0x01: { // RegisterRamReset(flags in R0)
        const flags = this.r[0] & 0xFF;
        if (flags & 0x01) this.ewram.fill(0);
        if (flags & 0x02) this.iwram.fill(0, 0, 0x7E00);
        if (flags & 0x04) this.pal.fill(0);
        if (flags & 0x08) this.vram.fill(0);
        if (flags & 0x10) this.oam.fill(0);
        if (flags & 0x80) {
          this.io16[0x000 >> 1] = 0x0080;
          this.io16[0x020 >> 1] = 0x0100;
          this.io16[0x026 >> 1] = 0x0100;
          this.io16[0x030 >> 1] = 0x0100;
          this.io16[0x036 >> 1] = 0x0100;
        }
        break;
      }
      case 0x02: // Halt
      case 0x03: // Stop
        this.halted = true;
        break;

      case 0x04: { // IntrWait(R0=clearOld, R1=irqMask)
        const clearOld = this.r[0] & 1;
        const mask = this.r[1] & 0xFFFF;
        let biosFlags = this.iwram16[0x7FF8 >> 1];
        if (clearOld) {
          biosFlags &= ~mask;
          this.iwram16[0x7FF8 >> 1] = biosFlags;
        }
        this.io16[0x208 >> 1] = 1;
        if (!(biosFlags & mask)) {
          this.halted = true;
          this.inIntrWaitMask = mask;
        } else {
          this.iwram16[0x7FF8 >> 1] = biosFlags & ~mask;
          this.inIntrWaitMask = 0;
        }
        this.biosLastFetch = 0xE129F000;
        break;
      }

      case 0x05: { // VBlankIntrWait()
        let biosFlags = this.iwram16[0x7FF8 >> 1];
        biosFlags &= ~IRQ_VBLANK;
        this.iwram16[0x7FF8 >> 1] = biosFlags;
        this.io16[0x208 >> 1] = 1;
        this.halted = true;
        this.inIntrWaitMask = IRQ_VBLANK;
        this.biosLastFetch = 0xE129F000;
        break;
      }

      case 0x06: { // Div(R0=num, R1=den)
        const num = this.r[0] | 0;
        const den = this.r[1] | 0;
        if (den === 0) {
          this.r[0] = (num < 0) ? -1 : 1;
          this.r[1] = num;
          this.r[3] = 1;
        } else if (num === -2147483648 && den === -1) {
          this.r[0] = -2147483648;
          this.r[1] = 0;
          this.r[3] = -2147483648;
        } else {
          const q = (num / den) | 0;
          const rem = (num - Math.imul(q, den)) | 0;
          this.r[0] = q;
          this.r[1] = rem;
          this.r[3] = (q < 0) ? (-q | 0) : q;
        }
        break;
      }

      case 0x07: { // DivArm(R0=den, R1=num)
        const den = this.r[0] | 0;
        const num = this.r[1] | 0;
        if (den === 0) {
          this.r[0] = (num < 0) ? -1 : 1;
          this.r[1] = num;
          this.r[3] = 1;
        } else if (num === -2147483648 && den === -1) {
          this.r[0] = -2147483648;
          this.r[1] = 0;
          this.r[3] = -2147483648;
        } else {
          const q = (num / den) | 0;
          const rem = (num - Math.imul(q, den)) | 0;
          this.r[0] = q;
          this.r[1] = rem;
          this.r[3] = (q < 0) ? (-q | 0) : q;
        }
        break;
      }

      case 0x08: { // Sqrt(R0=uint32)
        let n = this.r[0] >>> 0;
        let res = 0;
        let bit = 0x40000000;
        while (bit > n) bit >>>= 2;
        while (bit !== 0) {
          if (n >= (res + bit) >>> 0) {
            n = (n - (res + bit)) >>> 0;
            res = ((res >>> 1) + bit) >>> 0;
          } else {
            res >>>= 1;
          }
          bit >>>= 2;
        }
        this.r[0] = res | 0;
        break;
      }

      case 0x09: { // ArcTan(R0=tan in 1.14 fixed-point)
        const t = (this.r[0] << 16) >> 16;
        let a = -((Math.imul(t, t) >> 14));
        let r = ((0xA9 * a) >> 14) + 0x390;
        r = ((r * a) >> 14) + 0x91C;
        r = ((r * a) >> 14) + 0xFB6;
        r = ((r * a) >> 14) + 0x16AA;
        r = ((r * a) >> 14) + 0x2081;
        r = ((r * a) >> 14) + 0x3651;
        r = ((r * a) >> 14) + 0xA2F9;
        this.r[0] = (Math.imul(t, r) >> 16) | 0;
        break;
      }

      case 0x0A: { // ArcTan2(R0=x, R1=y)
        const x = (this.r[0] << 16) >> 16;
        const y = (this.r[1] << 16) >> 16;
        if (y === 0) {
          this.r[0] = (x >= 0) ? 0 : 0x8000;
          break;
        }
        if (x === 0) {
          this.r[0] = (y >= 0) ? 0x4000 : 0xC000;
          break;
        }
        const ax = x < 0 ? -x : x;
        const ay = y < 0 ? -y : y;
        let angle = 0;
        if (ax >= ay) {
          const savedR0 = this.r[0];
          this.r[0] = ((ay << 14) / ax) | 0;
          this.handleSwi(0x09);
          angle = this.r[0];
          this.r[0] = savedR0;
        } else {
          const savedR0 = this.r[0];
          this.r[0] = ((ax << 14) / ay) | 0;
          this.handleSwi(0x09);
          angle = 0x4000 - this.r[0];
          this.r[0] = savedR0;
        }
        if (x < 0 && y >= 0) angle = 0x8000 - angle;
        else if (x < 0 && y < 0) angle = 0x8000 + angle;
        else if (x >= 0 && y < 0) angle = 0x10000 - angle;
        this.r[0] = angle & 0xFFFF;
        break;
      }

      case 0x0B: { // CpuSet(R0=src, R1=dst, R2=lenMode)
        let src = this.r[0] >>> 0;
        let dst = this.r[1] >>> 0;
        const ctrl = this.r[2] >>> 0;
        const count = ctrl & 0x1FFFFF;
        const fixed = (ctrl & 0x01000000) !== 0;
        const is32  = (ctrl & 0x04000000) !== 0;
        if (is32) {
          src &= ~3; dst &= ~3;
          const fixedVal = this.read32Aligned(src);
          for (let i = 0; i < count; i++) {
            const val = fixed ? fixedVal : this.read32Aligned(src);
            this.write32(dst, val);
            if (!fixed) src = (src + 4) >>> 0;
            dst = (dst + 4) >>> 0;
          }
        } else {
          src &= ~1; dst &= ~1;
          const fixedVal = this.read16(src);
          for (let i = 0; i < count; i++) {
            const val = fixed ? fixedVal : this.read16(src);
            this.write16(dst, val);
            if (!fixed) src = (src + 2) >>> 0;
            dst = (dst + 2) >>> 0;
          }
        }
        break;
      }

      case 0x0C: { // CpuFastSet(R0=src, R1=dst, R2=lenMode)
        let src = (this.r[0] & ~3) >>> 0;
        let dst = (this.r[1] & ~3) >>> 0;
        const ctrl = this.r[2] >>> 0;
        const count = ((ctrl & 0x1FFFFF) + 7) & ~7;
        const fixed = (ctrl & 0x01000000) !== 0;
        const fixedVal = this.read32Aligned(src);
        for (let i = 0; i < count; i++) {
          const val = fixed ? fixedVal : this.read32Aligned(src);
          this.write32(dst, val);
          if (!fixed) src = (src + 4) >>> 0;
          dst = (dst + 4) >>> 0;
        }
        break;
      }

      case 0x0D: { // GetBiosChecksum() -> R0 = 0xBAAE187F (official GBA BIOS checksum)
        this.r[0] = 0xBAAE187F | 0;
        break;
      }

      case 0x0E: { // BgAffineSet(R0=src, R1=dst, R2=count)
        let src = this.r[0] >>> 0;
        let dst = this.r[1] >>> 0;
        const count = this.r[2] >>> 0;
        for (let i = 0; i < count; i++) {
          const origX = this.read32Aligned(src) | 0;
          const origY = this.read32Aligned(src + 4) | 0;
          const dispX = (this.read16(src + 8) << 16) >> 16;
          const dispY = (this.read16(src + 10) << 16) >> 16;
          const sx    = (this.read16(src + 12) << 16) >> 16;
          const sy    = (this.read16(src + 14) << 16) >> 16;
          const alpha = (this.read16(src + 16) >>> 8) & 0xFF;

          const rad = (alpha * 6.283185307179586) / 256.0;
          const cosA = Math.round(Math.cos(rad) * 256) | 0;
          const sinA = Math.round(Math.sin(rad) * 256) | 0;

          const pa = (Math.imul(sx, cosA) >> 8) | 0;
          const pb = (-Math.imul(sx, sinA) >> 8) | 0;
          const pc = (Math.imul(sy, sinA) >> 8) | 0;
          const pd = (Math.imul(sy, cosA) >> 8) | 0;

          const startX = (origX - (Math.imul(pa, dispX) + Math.imul(pb, dispY))) | 0;
          const startY = (origY - (Math.imul(pc, dispX) + Math.imul(pd, dispY))) | 0;

          this.write16(dst, pa & 0xFFFF);
          this.write16(dst + 2, pb & 0xFFFF);
          this.write16(dst + 4, pc & 0xFFFF);
          this.write16(dst + 6, pd & 0xFFFF);
          this.write32(dst + 8, startX >>> 0);
          this.write32(dst + 12, startY >>> 0);

          src = (src + 20) >>> 0;
          dst = (dst + 16) >>> 0;
        }
        break;
      }

      case 0x0F: { // ObjAffineSet(R0=src, R1=dst, R2=count, R3=stride)
        let src = this.r[0] >>> 0;
        let dst = this.r[1] >>> 0;
        const count  = this.r[2] >>> 0;
        const stride = this.r[3] >>> 0;
        for (let i = 0; i < count; i++) {
          const sx    = (this.read16(src) << 16) >> 16;
          const sy    = (this.read16(src + 2) << 16) >> 16;
          const alpha = (this.read16(src + 4) >>> 8) & 0xFF;

          const rad = (alpha * 6.283185307179586) / 256.0;
          const cosA = Math.round(Math.cos(rad) * 256) | 0;
          const sinA = Math.round(Math.sin(rad) * 256) | 0;

          const pa = (Math.imul(sx, cosA) >> 8) | 0;
          const pb = (-Math.imul(sx, sinA) >> 8) | 0;
          const pc = (Math.imul(sy, sinA) >> 8) | 0;
          const pd = (Math.imul(sy, cosA) >> 8) | 0;

          this.write16(dst, pa & 0xFFFF);
          this.write16(dst + stride, pb & 0xFFFF);
          this.write16(dst + stride * 2, pc & 0xFFFF);
          this.write16(dst + stride * 3, pd & 0xFFFF);

          src = (src + 8) >>> 0;
          dst = (dst + stride * 4) >>> 0;
        }
        break;
      }

      case 0x10: { // BitUnPack(R0=src, R1=dst, R2=infoPtr)
        let src = this.r[0] >>> 0;
        let dst = (this.r[1] & ~3) >>> 0;
        const info = this.r[2] >>> 0;
        const srcLen = this.read16(info);
        const srcBpp = this.read8(info + 2) || 1;
        const dstBpp = this.read8(info + 3) || 1;
        const dataOffset = this.read32Aligned(info + 4);
        const zeroFlag = (dataOffset & 0x80000000) !== 0;
        const offsetVal = dataOffset & 0x7FFFFFFF;
        const srcMask = (1 << srcBpp) - 1;

        let outWord = 0;
        let outBit = 0;
        for (let i = 0; i < srcLen; i++) {
          const b = this.read8(src++);
          for (let s = 0; s < 8; s += srcBpp) {
            let unit = (b >>> s) & srcMask;
            if (unit !== 0 || zeroFlag) {
              unit = (unit + offsetVal) >>> 0;
            }
            outWord |= (unit << outBit);
            outBit += dstBpp;
            if (outBit >= 32) {
              this.write32(dst, outWord >>> 0);
              dst = (dst + 4) >>> 0;
              outWord = 0;
              outBit = 0;
            }
          }
        }
        break;
      }

      case 0x11: // LZ77UnCompWram
      case 0x12: { // LZ77UnCompVram
        const is16 = ((comment & 0xFF) === 0x12);
        let src = (this.r[0] & ~3) >>> 0;
        let dst = this.r[1] >>> 0;
        const header = this.read32Aligned(src);
        src = (src + 4) >>> 0;
        const decompLen = header >>> 8;
        const outBuf = new Uint8Array(decompLen);
        let outPos = 0;

        while (outPos < decompLen) {
          const flags = this.read8(src++);
          for (let bit = 7; bit >= 0 && outPos < decompLen; bit--) {
            if (flags & (1 << bit)) {
              const b1 = this.read8(src++);
              const b2 = this.read8(src++);
              const len = (b1 >>> 4) + 3;
              const disp = (((b1 & 0x0F) << 8) | b2) + 1;
              for (let k = 0; k < len && outPos < decompLen; k++) {
                outBuf[outPos] = outBuf[outPos - disp];
                outPos++;
              }
            } else {
              outBuf[outPos++] = this.read8(src++);
            }
          }
        }
        this.flushDecompBuffer(dst, outBuf, is16);
        break;
      }

      case 0x13: { // HuffUnComp
        let src = (this.r[0] & ~3) >>> 0;
        const dst = (this.r[1] & ~3) >>> 0;
        const header = this.read32Aligned(src);
        const bitSize = header & 0x0F;
        const decompLen = header >>> 8;
        const treeSize = (this.read8(src + 4) + 1) * 2;
        const treeBase = src + 5;
        let dataPtr = (src + 4 + treeSize) & ~3;
